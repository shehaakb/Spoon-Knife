/* ---- 00-tokens.css ---- */
/* Design tokens. Every colour lives here; component rules use var(--token) only.

:root {

  --ink: #131A26;
  --ink-2: #485163;

  --warn: #9A5D07;
  --warn-soft: #FAEFD9;
  --bad: #B4362E;

  --ok-line: #A8D4BB;
  --warn-line: #E6C78C;
  --bad-line: #EBB3AD;

  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);

  --f-ui: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

/* ---- 10-base.css ---- */
/* Base: element defaults, typography, utilities. */
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: var(--t-body);
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, p, dl, dd, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
svg { display: block; flex: none; }
table { border-collapse: separate; border-spacing: 0; }
::selection { background: var(--accent-soft); color: var(--ink); }
hr { border: 0; border-top: 1px solid var(--line); margin: var(--s4) 0; }

:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }

/* ---- type ---- */
.display { font-family: var(--f-display); font-optical-sizing: auto; font-weight: 400; letter-spacing: -0.005em; }
.t-12 { font-size: var(--t-12); }
.t-13 { font-size: var(--t-13); }
.t-15 { font-size: var(--t-15); }
.t-18 { font-size: var(--t-18); }
.t-24 { font-size: var(--t-24); line-height: 1.2; }
.t-34 { font-size: var(--t-34); line-height: 1.1; }
.h-view { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); font-weight: 500; line-height: 1.2; }
.micro {
  font-size: var(--t-micro); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
}
.mono { font-family: var(--f-mono); font-size: .93em; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.strong { font-weight: 600; }
.medium { font-weight: 500; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.tone-ok { color: var(--ok); }
.tone-warn { color: var(--warn); }
.tone-bad { color: var(--bad); }
.tone-accent { color: var(--accent); }

/* ---- layout utilities ---- */
.row { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.row-wrap { flex-wrap: wrap; }
.row-top { align-items: flex-start; }
.row-base { align-items: baseline; }
.gap-1 { gap: var(--s1); } .gap-3 { gap: var(--s3); } .gap-4 { gap: var(--s4); } .gap-5 { gap: var(--s5); }
.stack { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.stack-1 { gap: var(--s1); } .stack-3 { gap: var(--s3); } .stack-4 { gap: var(--s4); } .stack-5 { gap: var(--s5); } .stack-6 { gap: var(--s6); }
.spacer { flex: 1 1 auto; }
.grow { flex: 1 1 auto; min-width: 0; }
.mt-2 { margin-top: var(--s2); } .mt-4 { margin-top: var(--s4); } .mt-5 { margin-top: var(--s5); } .mt-6 { margin-top: var(--s6); }
.mb-2 { margin-bottom: var(--s2); } .mb-4 { margin-bottom: var(--s4); }
.vh {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
  clip-path: inset(50%); white-space: nowrap; margin: -1px; padding: 0; border: 0;
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); }
.rule { border-top: 1px solid var(--line); }

@media (max-width: 759.98px) { .hide-phone { display: none !important; } }
@media (min-width: 760px) { .show-phone { display: none !important; } }

@media (prefers-reduced-motion: reduce) {

/* ---- 20-components.css ---- */
/* Component library. See docs/CONTRACT.md §CSS for markup of each component. */

/* ================= Buttons ================= */
.btn {
  --btn-h: var(--ctl-h);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: var(--btn-h); min-width: var(--btn-h); padding: 0 12px;
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  background: var(--surface); color: var(--ink);
  font-size: var(--t-13); font-weight: 500; line-height: 1; white-space: nowrap;
  text-decoration: none; user-select: none; -webkit-user-select: none;
  transition: background-color 120ms, border-color 120ms, color 120ms;
}
.btn:hover { background: var(--hover); text-decoration: none; }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.btn[aria-busy="true"] { opacity: .7; pointer-events: none; }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn-soft:hover { background: var(--accent-soft); border-color: var(--accent-line); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--hover); color: var(--ink); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.btn-danger:hover { background: var(--bad); border-color: var(--bad); filter: brightness(.94); }
.btn-danger-soft { background: transparent; border-color: var(--bad-line); color: var(--bad); }
.btn-danger-soft:hover { background: var(--bad-soft); }
.btn-icon { padding: 0; width: var(--btn-h); }
.btn-sm { --btn-h: var(--ctl-h-sm); padding: 0 10px; font-size: var(--t-12); }
.btn-sm.btn-icon { padding: 0; }
.btn-lg { --btn-h: var(--ctl-h-lg); padding: 0 18px; font-size: var(--t-15); }
.btn-block { width: 100%; }
.btn .btn-sub { font-weight: 400; opacity: .75; }
/* split button: [Mark paid][▾] */
.btn-group { display: inline-flex; }
.btn-group > .btn:not(:last-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.btn-group > .btn:not(:first-child) { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; }
.btn-group > .btn-primary + .btn-primary { border-left-color: var(--accent-hover); }
.btn-group > .btn-caret { width: 28px; min-width: 28px; padding: 0; }
.btn-group > .btn:focus-visible { position: relative; z-index: 1; }
/* text-only link button */
.linkbtn {
  display: inline; padding: 0; border: 0; background: none; color: var(--accent);
  font: inherit; font-weight: 500; text-decoration: none; cursor: pointer;
}
.linkbtn:hover { text-decoration: underline; text-underline-offset: 2px; }
.linkbtn-muted { color: var(--ink-2); }

/* ================= Inputs ================= */
.input {
  display: block; width: 100%; height: var(--ctl-h); padding: 0 10px;
  background: var(--sunk); color: var(--ink);
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  font-size: var(--t-13); font-variant-numeric: tabular-nums;
  transition: border-color 120ms, background-color 120ms, box-shadow 120ms;
  -webkit-appearance: none; appearance: none;
}
.input::placeholder { color: var(--ink-3); opacity: 1; }
.input:hover { border-color: var(--ink-3); }
.input:focus, .input:focus-visible { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.input:disabled, .input[readonly] { opacity: .6; }
textarea.input, .textarea { height: auto; min-height: 84px; padding: 8px 10px; line-height: 1.45; resize: vertical; }
input[type="date"].input { min-width: 0; }
input[type="date"].input::-webkit-calendar-picker-indicator { opacity: .6; cursor: pointer; }
input[type="search"].input::-webkit-search-cancel-button { -webkit-appearance: none; }
input.input-num { text-align: right; }
@media (max-width: 759.98px) { .input { font-size: 16px; } }

/* select: <span class="select"><select class="input">…</select></span> */
.select { position: relative; display: block; min-width: 0; }
.select > select.input { padding-right: 30px; cursor: pointer; }
.select::after {
  content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
  border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(45deg); pointer-events: none;
}
.select-inline { display: inline-block; }

/* money: <span class="money-input"><span class="money-sym">$</span><input class="input" inputmode="decimal"></span> */
.money-input { position: relative; display: block; }
.money-input > .money-sym {
  position: absolute; left: 10px; top: 0; bottom: 0; display: flex; align-items: center;
  color: var(--ink-3); pointer-events: none; font-size: var(--t-13);
}
.money-input > .input { padding-left: 22px; text-align: right; font-variant-numeric: tabular-nums; }

/* checkbox / radio */
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 24px; }

/* search field with icon */
.search { position: relative; display: block; min-width: 0; }
.search > .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search > .input { padding-left: 32px; padding-right: 30px; }
.search > .search-kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.search > .input:focus ~ .search-kbd { display: none; }

/* ================= Fields & forms ================= */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: var(--t-12); font-weight: 500; color: var(--ink-2); }
.field-label .opt { font-weight: 400; color: var(--ink-3); }
.field-hint { font-size: var(--t-12); color: var(--ink-3); }
.field-error { font-size: var(--t-12); color: var(--bad); font-weight: 500; }
.field-error:empty { display: none; }
.field.is-invalid .input { border-color: var(--bad); }
.field.is-invalid .input:focus { box-shadow: 0 0 0 3px var(--bad-soft); }
.field-inline { flex-direction: row; align-items: center; gap: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid > .span-2, .form-grid > .span-all { grid-column: 1 / -1; }
.fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.fieldset + .fieldset { margin-top: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--line); }
.fieldset-title { display: block; margin-bottom: var(--s3); padding: 0; font-size: var(--t-micro); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.form-note { padding: 10px 12px; background: var(--sunk); border-radius: var(--r-ctl); font-size: var(--t-12); color: var(--ink-2); }
.form-sum { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--line); font-size: var(--t-13); }
.form-sum strong { font-weight: 600; }
@media (max-width: 759.98px) {
  .form-grid, .form-grid-3 { grid-template-columns: minmax(0, 1fr); }
}

/* ================= Segmented control ================= */
.seg { align-self: flex-start; display: inline-flex; padding: 2px; gap: 2px; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-ctl); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg > button {
  display: inline-flex; align-items: center; gap: 6px; height: calc(var(--ctl-h) - 6px); padding: 0 10px;
  border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--ink-2);
  font-size: var(--t-12); font-weight: 500; white-space: nowrap;
}
.seg > button:hover { color: var(--ink); }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"] { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.seg > button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent); }

/* ================= Filter chips ================= */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px;
  border: 1px solid var(--line-2); border-radius: 14px; background: var(--surface); color: var(--ink-2);
  font-size: var(--t-12); font-weight: 500; white-space: nowrap;
}
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.chip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.chip-count { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .chip-count { color: var(--accent); }
.chip-count.is-bad { color: var(--bad); font-weight: 600; }
@media (max-width: 759.98px) {
  .chips-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); }
  .chips-scroll::-webkit-scrollbar { display: none; }
  .chip { height: 34px; padding: 0 13px; border-radius: 17px; }
}

/* ================= Status pill ================= */
.pill {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px;
  border: 1px solid var(--line-2); border-radius: 11px; background: var(--surface); color: var(--ink-2);
  font-size: var(--t-12); font-weight: 500; line-height: 1; white-space: nowrap; vertical-align: middle;
}
.pill svg { width: 12px; height: 12px; }
.pill-paid { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.pill-paid_late { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.pill-paid_late .pill-tick { color: var(--warn); }
.pill-partial { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.pill-due { background: var(--surface); border-color: var(--line-2); color: var(--ink-2); }
.pill-late { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.pill-none { background: transparent; border-color: transparent; color: var(--ink-3); padding-left: 2px; }
.pill-sm { height: 20px; font-size: 11.5px; padding: 0 7px 0 5px; }
/* generic tag (tenant/ticket status, priority): same shape, tones */
.tag {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
  border: 1px solid var(--line-2); border-radius: 4px; color: var(--ink-2); background: var(--surface);
  font-size: 11.5px; font-weight: 500; white-space: nowrap; vertical-align: middle;
}
.tag svg { width: 12px; height: 12px; }
.tag-accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.tag-ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.tag-warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.tag-bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.tag-quiet { border-color: transparent; background: var(--sunk); }

/* ================= Door plate ================= */
.plate {
  display: inline-flex; align-items: center; justify-content: center; position: relative;
  min-width: 34px; height: 22px; padding: 0 6px;
  border: 1px solid var(--line-2); border-radius: var(--r-plate); background: var(--surface); color: var(--ink);
  font-family: var(--f-mono); font-size: 12px; font-weight: 500; line-height: 1; letter-spacing: .01em;
  white-space: nowrap; vertical-align: middle; font-variant-numeric: tabular-nums;
}
.plate-sm.plate-late, .plate-sm.plate-partial { border-color: currentColor; }
.plate-sm.plate-late { color: var(--bad); }
.plate-sm.plate-partial { color: var(--warn); }
.plate-sm.plate-none { color: var(--ink-3); border-style: dashed; }
.plate-lg {
  min-width: 52px; height: 44px; padding: 0 9px; font-size: 13px; border-width: 1px;
  flex-direction: column; gap: 1px;
}
.plate-lg .plate-unit { line-height: 1; }
.plate-lg .plate-glyph { position: absolute; top: 3px; right: 3px; width: 10px; height: 10px; }
.plate-lg .plate-glyph svg { width: 10px; height: 10px; }
.plate-lg.plate-paid { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.plate-lg.plate-paid_late { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.plate-lg.plate-paid_late .plate-glyph { color: var(--warn); }
.plate-lg.plate-partial { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.plate-lg.plate-due { background: var(--surface); border-color: var(--ink-3); color: var(--ink); }
.plate-lg.plate-late { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.plate-lg.plate-none { background: var(--sunk); border-color: var(--line); border-style: dashed; color: var(--ink-3); }
button.plate { cursor: pointer; }
button.plate:hover { filter: brightness(.97); border-color: var(--ink-3); }
button.plate:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.plates { display: flex; flex-wrap: wrap; gap: 6px; }
.plate-fixed { min-width: 52px; } /* equal-width plates in table columns */
.stack > .plate, .stack > .pill, .stack > .tag, .stack > .seg, .stack > .chip { align-self: flex-start; }

/* ================= Payment strip (12 months) ================= */
.pstrip { display: inline-flex; align-items: center; gap: 2px; height: 16px; vertical-align: middle; }
.pc { position: relative; display: block; width: 7px; height: 14px; border-radius: 1px; background: transparent; flex: none; }
.pc-paid { background: var(--ok); }
.pc-paid_late { background: var(--ok); }
.pc-paid_late::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--warn); border-radius: 1px 1px 0 0; }
.pc-partial { box-shadow: inset 0 0 0 1px var(--warn); }
.pc-partial::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: var(--warn); }
.pc-late { background: var(--bad); }
.pc-due { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.pc-none::after { content: ""; position: absolute; left: 2px; top: 5px; width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
.pstrip-lg .pc { width: 10px; height: 20px; }
.pstrip-lg { height: 22px; gap: 3px; }
.pstrip-lg .pc-partial::after { height: 10px; }
.pstrip-lg .pc-none::after { left: 3px; top: 8px; width: 4px; height: 4px; }

/* ================= Money ================= */
.money { white-space: nowrap; font-variant-numeric: tabular-nums; }
.money .cur { color: var(--ink-3); font-weight: 400; margin-right: .04em; }
.money-lg { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-34); font-weight: 400; line-height: 1.05; letter-spacing: -0.01em; }
.money-lg .cur { font-size: .62em; vertical-align: .42em; margin-right: .06em; }
.money-md { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); line-height: 1.1; }
.money-md .cur { font-size: .7em; vertical-align: .25em; }
.amt-owed { color: var(--bad); }
.amt-credit { color: var(--ink-3); }
.amt-credit .cr { font-size: .85em; margin-left: 2px; }
.amt-zero { color: var(--ink-3); }

/* ================= Data table ================= */
.tbl-wrap { position: relative; min-width: 0; }
.tbl { width: 100%; font-size: var(--t-13); }
.tbl th, .tbl td { padding: 0 12px; height: var(--row-h); border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl th:first-child, .tbl td:first-child { padding-left: 16px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 16px; }
.tbl thead th {
  position: sticky; top: var(--sticky-top); z-index: 2; height: 34px;
  background: var(--sunk); color: var(--ink-3); border-bottom: 1px solid var(--line-2);
  font-size: var(--t-12); font-weight: 500; white-space: nowrap;
}
.tbl thead th:first-child { border-top-left-radius: var(--r-ctl); }
.tbl thead th:last-child { border-top-right-radius: var(--r-ctl); }
.tbl .num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.shrink, .tbl th.shrink { width: 1%; white-space: nowrap; }
.tbl tbody tr { transition: background-color 80ms; }
.tbl tbody tr:hover td { background: var(--hover); }
.tbl tbody tr.is-link { cursor: pointer; }
.tbl tbody tr.is-selected td { background: var(--accent-soft); }
.tbl tbody tr.is-focused td { background: var(--hover); box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
.tbl tbody tr.is-focused td:first-child { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent), inset 1px 0 0 var(--accent); }
.tbl tbody tr.is-focused td:last-child { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent), inset -1px 0 0 var(--accent); }
.tbl tbody tr.is-muted td { color: var(--ink-3); }
.tbl tfoot td { height: 40px; border-bottom: 0; border-top: 1px solid var(--line-2); font-weight: 600; background: transparent; }
.tbl .cell-name { font-weight: 500; color: var(--ink); }
.tbl .cell-sub { display: block; font-size: var(--t-12); color: var(--ink-3); font-weight: 400; }
.tbl-check { width: 40px; }
.tbl-group td { height: 34px; background: var(--paper); font-size: var(--t-12); font-weight: 600; color: var(--ink-2); }
.tbl-compact th, .tbl-compact td { height: 34px; }
/* sortable header: <th aria-sort="ascending"><button class="th-sort">Rent<svg/></button></th> */
.th-sort {
  display: inline-flex; align-items: center; gap: 4px; margin: 0 -6px; padding: 4px 6px; border: 0; border-radius: 4px;
  background: none; color: inherit; font: inherit; white-space: nowrap;
}
.th-sort:hover { color: var(--ink); background: var(--line); }
.th-sort .sort-ind { opacity: 0; width: 12px; height: 12px; transition: transform 120ms; }
.th-sort:hover .sort-ind { opacity: .5; }
th[aria-sort="ascending"] .th-sort, th[aria-sort="descending"] .th-sort { color: var(--ink); }
th[aria-sort="ascending"] .sort-ind, th[aria-sort="descending"] .sort-ind { opacity: 1; }
th[aria-sort="descending"] .sort-ind { transform: rotate(180deg); }
th.num .th-sort { flex-direction: row-reverse; }

/* ================= Phone card list (table-row equivalent) ================= */
.clist { border-top: 1px solid var(--line); }
.crow {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; row-gap: 8px; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 60px;
}
.crow.is-link { cursor: pointer; }
.crow.is-selected { background: var(--accent-soft); margin: 0 calc(-1 * var(--gutter)); padding-left: var(--gutter); padding-right: var(--gutter); }
.crow-lead { grid-column: 1; align-self: start; padding-top: 1px; }
.crow-main { grid-column: 2; min-width: 0; }
.crow-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow-sub { font-size: var(--t-12); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.crow-aside { grid-column: 3; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.crow-actions { grid-column: 1 / -1; display: flex; gap: 8px; }
.crow-actions .btn { flex: 1 1 auto; }
.crow-actions .btn-group { flex: 1 1 auto; display: flex; }
.crow-actions .btn-group > .btn-caret { flex: none; width: 44px; }

/* ================= Ledger ================= */
.ledger { width: 100%; font-size: var(--t-13); }
.ledger th, .ledger td { padding: 0 10px; height: 38px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ledger th:first-child, .ledger td:first-child { padding-left: 0; }
.ledger th:last-child, .ledger td:last-child { padding-right: 0; }
.ledger thead th { height: 30px; color: var(--ink-3); font-size: var(--t-micro); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line-2); }
.ledger .l-date { width: 64px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.ledger .l-desc { min-width: 0; }
.ledger .l-sub { display: block; font-size: var(--t-12); color: var(--ink-3); line-height: 1.3; }
.ledger .l-amt, .ledger .l-bal { text-align: right; width: 1%; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ledger .l-bal { font-weight: 500; }
.ledger .l-pay { color: var(--ok); }
.ledger .l-act { width: 1%; padding-left: 4px; }
.ledger-month td {
  height: 30px; padding-top: 10px; vertical-align: bottom; color: var(--ink-3); background: transparent;
  font-variant-caps: all-small-caps; letter-spacing: .07em; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line-2);
}
.ledger tr.is-void td { color: var(--ink-3); }
.ledger tr.is-void .l-desc-text, .ledger tr.is-void .l-amt { text-decoration: line-through; text-decoration-color: var(--ink-3); }
.ledger tbody tr:not(.ledger-month):hover td { background: var(--hover); }
@media (max-width: 759.98px) {
  .ledger { font-size: 14px; }
  .ledger .l-date { width: 48px; font-size: 11.5px; }
  .ledger th, .ledger td { padding: 0 4px; }
  .ledger thead th { letter-spacing: .03em; font-size: 10px; }
  .ledger .l-act .btn { width: 32px; min-width: 32px; }
}

/* ================= Section header ================= */
.sec { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: var(--s6) 0 var(--s3); }
.sec:first-child { margin-top: 0; }
.sec-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; line-height: 1.25; color: var(--ink); }
.sec-meta { color: var(--ink-3); font-size: var(--t-13); }
.sec-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.sec-sm .sec-title { font-family: var(--f-ui); font-size: var(--t-micro); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* ================= Key / value rows ================= */
.kv { display: grid; grid-template-columns: minmax(110px, 34%) minmax(0, 1fr); }
.kv > dt, .kv > dd { padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv > dt { color: var(--ink-3); font-size: var(--t-12); padding-top: 11px; padding-right: 12px; }
.kv > dd { overflow-wrap: anywhere; }
.kv > dt:first-of-type, .kv > dt:first-of-type + dd { border-top: 1px solid var(--line); }
.kv-plain > dt, .kv-plain > dd { border: 0 !important; padding: 4px 0; }
.kv-plain > dt { padding-top: 6px; }

/* copyable value: <span class="copyline"><span class="copyline-text">…</span><button class="btn btn-ghost btn-icon btn-sm">copy</button></span> */
.copyline { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
.copyline-text { user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }

/* ================= Empty state & first run ================= */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 48px 24px; color: var(--ink-2); }
.empty-icon { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: var(--r-panel); color: var(--ink-3); margin-bottom: 4px; }
.empty-icon svg { width: 20px; height: 20px; }
.empty-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; color: var(--ink); }
.empty-body { max-width: 42ch; font-size: var(--t-13); }
.empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
.empty-quiet { padding: 20px 0; align-items: flex-start; text-align: left; color: var(--ink-3); }

.firstrun { max-width: 640px; margin: 24px auto 0; }
.firstrun-head { padding-bottom: var(--s5); }
.firstrun-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-34); font-weight: 400; line-height: 1.1; letter-spacing: -0.01em; }
.firstrun-lede { margin-top: 10px; color: var(--ink-2); font-size: var(--t-15); max-width: 52ch; }
.firstrun-opts { border-top: 1px solid var(--line-2); }
.firstrun-opt {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%;
  padding: 16px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; color: var(--ink);
}
.firstrun-opt:hover { background: var(--hover); }
.firstrun-opt:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.firstrun-ico { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: var(--r-plate); color: var(--accent); font-family: var(--f-mono); }
.firstrun-opt-title { font-weight: 600; font-size: var(--t-15); }
.firstrun-opt-sub { color: var(--ink-3); font-size: var(--t-13); margin-top: 2px; }
.firstrun-opt .chev { color: var(--ink-3); }

/* ================= Skeleton ================= */
.skel { display: block; background: var(--sunk); border-radius: 3px; animation: rb-pulse 1.4s ease-in-out infinite; }
.skel-line { height: 10px; margin: 10px 0; }
.skel-title { height: 22px; width: 40%; margin: 4px 0 18px; }
.skel-row { display: flex; align-items: center; gap: 12px; height: var(--row-h); border-bottom: 1px solid var(--line); }
.skel-row .skel { height: 10px; }
.skel-plate { width: 34px; height: 22px !important; }
.loading-note { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: var(--t-12); padding: 8px 0 16px; }
@keyframes rb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* ================= Progress / bullet bar ================= */
.bar { position: relative; display: flex; height: 8px; background: var(--sunk); border-radius: 2px; overflow: visible; }
.bar-seg { height: 100%; background: var(--accent); flex: none; }
.bar-seg:first-child { border-radius: 2px 0 0 2px; }
.bar-seg-ok { background: var(--ok); }
.bar-seg-warn { background: var(--warn); }
.bar-seg-bad { background: var(--bad); }
.bar-seg-soft { background: var(--line-2); }
.bar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.bar-lg { height: 14px; }
.bar-lg .bar-mark { top: -5px; bottom: -5px; }
.bar-thin { height: 4px; }
.bar-thin .bar-mark { top: -3px; bottom: -3px; width: 2px; }
.bar-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: var(--t-12); color: var(--ink-2); }
.bar-key { display: inline-flex; align-items: center; gap: 6px; }
.bar-key::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: var(--key, var(--accent)); }
.bar-key-ok { --key: var(--ok); } .bar-key-warn { --key: var(--warn); } .bar-key-bad { --key: var(--bad); } .bar-key-soft { --key: var(--line-2); }

/* ================= Kbd ================= */
.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--ink-2);
  font-family: var(--f-mono); font-size: 11px; font-weight: 500; line-height: 1; white-space: nowrap;
}

/* ================= Banner strip ================= */
.banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 40px;
  padding: 6px var(--gutter); background: var(--accent-soft); color: var(--ink); border-bottom: 1px solid var(--accent-line);
  font-size: var(--t-13);
}
.banner-text { flex: 1 1 auto; min-width: 0; }
.banner-text strong { font-weight: 600; }
.banner-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.banner .btn { height: 28px; }
.banner-warn { background: var(--warn-soft); border-bottom-color: var(--warn-line); }

/* ================= Floating layers: shared ================= */
.layer { position: relative; z-index: 100; }
.scrim { position: fixed; inset: 0; background: var(--scrim); animation: rb-fade var(--dur) var(--ease); }
@keyframes rb-fade { from { opacity: 0; } }

/* ---- Menu / popover ---- */
.menu {
  position: fixed; z-index: 120; min-width: 200px; max-width: min(320px, calc(100vw - 16px)); max-height: min(420px, calc(100vh - 16px)); overflow-y: auto;
  padding: 4px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow-float);
}
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 6px 10px;
  border: 0; border-radius: 5px; background: none; color: var(--ink); text-align: left; font-size: var(--t-13);
}
.menu-item svg { color: var(--ink-3); width: 16px; height: 16px; }
.menu-item:hover, .menu-item:focus-visible, .menu-item.is-active { background: var(--hover); outline: none; }
.menu-item:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
.menu-item.is-danger { color: var(--bad); }
.menu-item.is-danger svg { color: var(--bad); }
.menu-item:disabled { opacity: .45; }
.menu-item .menu-hint { margin-left: auto; padding-left: 12px; color: var(--ink-3); font-size: var(--t-12); }
.menu-sep { height: 1px; margin: 4px 6px; background: var(--line); }
.menu-label { padding: 8px 10px 4px; font-size: var(--t-micro); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
@media (max-width: 759.98px) { .menu-item { min-height: 44px; font-size: var(--t-15); } }

/* popover: free content in a floating panel, positioned like a menu */
.popover { position: fixed; z-index: 120; max-width: min(360px, calc(100vw - 16px)); padding: 12px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow-float); }

/* ---- Drawer: right side on desktop, full screen on phone ---- */
.drawer {
  position: fixed; z-index: 110; top: 0; right: 0; bottom: 0; width: min(520px, 100vw);
  display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--line-2); box-shadow: var(--shadow-modal);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
  animation: rb-drawer-in 180ms var(--ease);
}
.drawer-scrim { background: var(--scrim); }
.drawer.is-closing { animation: rb-drawer-out 140ms ease-in forwards; }
@keyframes rb-drawer-in { from { transform: translateX(24px); opacity: 0; } }
@keyframes rb-drawer-out { to { transform: translateX(24px); opacity: 0; } }
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 24px 16px; border-bottom: 1px solid var(--line); flex: none; }
.drawer-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); font-weight: 500; line-height: 1.2; min-width: 0; }
.drawer-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 4px 24px 32px; }
.drawer-foot { flex: none; display: flex; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--line); }
.drawer-close { margin-left: auto; flex: none; }
@media (max-width: 759.98px) {
  .drawer { width: 100vw; border-left: 0; padding-left: env(safe-area-inset-left, 0px); }
  .drawer-head { padding: 12px max(16px, env(safe-area-inset-left, 0px)) 12px; }
  .drawer-body { padding: 4px 16px 32px; }
  .drawer-foot { padding: 10px 16px; }
}

/* ---- Sheet: centred modal on desktop, bottom sheet on phone ---- */
.sheet-wrap { position: fixed; inset: 0; z-index: 115; display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; overflow-y: auto; }
.sheet {

      const f = pool[0];
      const take = Math.min(f.amount, ch.open);
      ch.open -= take; ch.paid += take; f.amount -= take;
      ch.paidOn = D.max(ch.paidOn, f.date);
      f.row.applied.push({ id: ch.id, amount: take });
      if (f.amount === 0) pool.shift();
    }
    if (ch.open === 0) { const i = queue.indexOf(ch); if (i >= 0) queue.splice(i, 1); }
  };
  for (const r of rows) {
    if (r.void) { r.balance = bal; continue; }
    if (r.type === 'charge') {
      bal += r.amount;
      r.paid = 0; r.open = r.amount; r.paidOn = r.amount === 0 ? r.date : null;
      if (r.amount > 0) { queue.push(r); applyPool(r); if (r.open > 0) r.paidOn = null; }
    } else {
      bal -= r.amount;
      r.applied = [];
      let left = r.amount;
      while (left > 0 && queue.length) {
        const ch = queue[0];
        const take = Math.min(left, ch.open);
        ch.open -= take; ch.paid += take; left -= take;
        r.applied.push({ id: ch.id, amount: take });
        if (ch.open === 0) { ch.paidOn = r.date; queue.shift(); }
      }
      r.unapplied = left;
      if (left > 0) pool.push({ amount: left, date: r.date, row: r });
    }
    r.balance = bal;
  }

  // ---- 6. month summaries
  const months = {};
  for (const r of rows) {
    if (r.void || r.type !== 'charge' || r.kind === 'opening') continue;
    const m = months[r.period] || (months[r.period] = {
      period: r.period, charged: 0, paid: 0, open: 0, rentCharged: 0, rentPaid: 0, rentOpen: 0, rent: 0,
      due: null, graceEnd: null, status: 'none', paidOn: null, daysLate: 0, scheduled: false, lateFee: false, prorate: null,
    });
    m.charged += r.amount; m.paid += r.paid; m.open += r.open;
    if (r.kind === 'rent' || r.kind === 'recurring') {
      m.scheduled = true;
      m.rentCharged += r.amount; m.rentPaid += r.paid; m.rentOpen += r.open;
      if (r.kind === 'rent') { m.rent = r.amount; m.prorate = r.prorate; }
      m.due = D.min(m.due, r.date);
      if (r.open === 0) m.paidOn = D.max(m.paidOn, r.paidOn);
    }
    if (r.category === 'late_fee') m.lateFee = true;
  }
  for (const k of Object.keys(months)) {
    const m = months[k];
    if (!m.scheduled) { m.status = 'none'; continue; }
    m.graceEnd = D.addDays(m.due, graceDays);
    if (m.rentOpen === 0) {
      if (!m.paidOn || m.paidOn <= m.graceEnd) { m.status = 'paid'; m.daysLate = 0; }
      else { m.status = 'paid_late'; m.daysLate = D.diffDays(m.due, m.paidOn); }
      m.paidOn = m.paidOn || m.due;
    } else {
      m.paidOn = null;
      if (today > m.graceEnd) { m.status = 'late'; m.daysLate = D.diffDays(m.due, today); }
      else { m.status = m.rentPaid > 0 ? 'partial' : 'due'; m.daysLate = 0; }
    }
  }

  // ---- 7. aging, delinquency, current, last payment, late-fee suggestion
  const aging = { d0_30: 0, d31_60: 0, d61_90: 0, d90: 0 };
  let oldestOpenDate = null;
  for (const r of rows) {
    if (r.void || r.type !== 'charge' || !r.open) continue;
    const age = D.diffDays(r.date, today);
    if (age <= 30) aging.d0_30 += r.open; else if (age <= 60) aging.d31_60 += r.open; else if (age <= 90) aging.d61_90 += r.open; else aging.d90 += r.open;
    oldestOpenDate = D.min(oldestOpenDate, r.date);
  }
  const delinquent = !!oldestOpenDate && D.diffDays(oldestOpenDate, today) > 30;

  const cm = months[todayKey];
  const current = cm && cm.scheduled
    ? { period: todayKey, status: cm.status, due: cm.due, graceEnd: cm.graceEnd, charged: cm.rentCharged, paid: cm.rentPaid, open: cm.rentOpen, daysLate: cm.daysLate, paidOn: cm.paidOn }
    : { period: todayKey, status: 'none', due: null, graceEnd: null, charged: 0, paid: 0, open: 0, daysLate: 0, paidOn: null };

  let lastPayment = null;
  for (const r of rows) if (!r.void && r.type === 'payment' && (!lastPayment || r.date >= lastPayment.date)) lastPayment = { date: r.date, amount: r.amount, method: r.method, id: r.id };

  let suggestedLateFee = null;
  if (settings.lateFee && settings.lateFee.type !== 'none' && +settings.lateFee.amount > 0) {
    const feePeriods = new Set(rows.filter(r => !r.void && r.type === 'charge' && r.category === 'late_fee' && r.entry && r.entry.period).map(r => r.entry.period));
    const lateKeys = Object.keys(months).filter(k => months[k].status === 'late' && !feePeriods.has(k)).sort();
    if (lateKeys.length) {
      const k = lateKeys[lateKeys.length - 1];
      suggestedLateFee = { period: k, amount: lateFeeAmount(tenant, settings, k) };
    }
  }

  const credit = bal < 0 ? -bal : 0;
  return {
    tenantId: tenant.id || null,
    rows, balance: bal, credit, months, current, aging, oldestOpenDate, delinquent, lastPayment, suggestedLateFee,
    dueDay, graceDays, trackFrom, rent: rentOn(tenant, today), today,
  };
}

/** Late fee (cents) for a period under settings.lateFee: flat = amount cents; percent = amount% of that month's rent. */
function lateFeeAmount(tenant, settings, period) {
  settings = settingsWithDefaults(settings);
  const lf = settings.lateFee || {};
  if (lf.type === 'flat') return Math.round(+lf.amount || 0);
  if (lf.type === 'percent') {
    const { dueDay } = termsOf(tenant, settings);
    return Math.round(rentOn(tenant, D.dayIn(period, dueDay)) * (+lf.amount || 0) / 100);
  }
  return 0;
}

/**
 * Last n months ending at endKey (oldest → newest), filling gaps with status 'none'.
 * Each cell: {period, status, charged, paid, open, paidOn, daysLate, due}
 */
function monthsBack(ledger, endKey, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = D.addMonthKey(endKey, -i);
    const m = ledger && ledger.months[k];
    out.push(m && m.scheduled
      ? { period: k, status: m.status, charged: m.charged, paid: m.paid, open: m.open, paidOn: m.paidOn, daysLate: m.daysLate, due: m.due }
      : { period: k, status: 'none', charged: m ? m.charged : 0, paid: m ? m.paid : 0, open: m ? m.open : 0, paidOn: null, daysLate: 0, due: null });
  }
  return out;
}

/** Status of one month ('none' when not tracked). */
function monthStatus(ledger, key) { const m = ledger && ledger.months[key]; return m && m.scheduled ? m.status : 'none'; }

/**
 * Lease position. kind: 'fixed' (has an end date in the future or today), 'mtm' (no end, or end passed while still
 * living there = holdover), 'ended' (status past, or moved out on/before today), 'upcoming' (moveIn after today).
 */
function leaseState(tenant, settings, today) {
  settings = settingsWithDefaults(settings);
  const l = tenant.lease || {};
  const out = {
    kind: 'fixed', start: l.start || null, end: l.end || null, moveIn: l.moveIn || null, moveOut: l.moveOut || null,
    noticeDate: l.noticeDate || null, noticeGiven: !!l.noticeDate, daysLeft: null, inNoticeWindow: false, progress: null,
    holdover: false, label: '', daysToMoveOut: null,
  };
  if (l.moveOut) out.daysToMoveOut = D.diffDays(today, l.moveOut);
  if (tenant.status === 'past' || (l.moveOut && l.moveOut < today)) { out.kind = 'ended'; out.label = 'ended'; return out; }
  if (l.moveIn && l.moveIn > today) { out.kind = 'upcoming'; out.label = 'moves in ' + D.rel(l.moveIn, today); }
  if (!l.end) {
    if (out.kind !== 'upcoming') { out.kind = 'mtm'; out.label = 'month-to-month'; }
  } else if (l.end < today) {
    out.kind = 'mtm'; out.holdover = true; out.label = 'month-to-month';
    out.daysLeft = D.diffDays(today, l.end);
  } else {
    out.daysLeft = D.diffDays(today, l.end);
    out.inNoticeWindow = out.daysLeft <= settings.leaseNoticeDays;
    if (out.kind !== 'upcoming') out.label = out.daysLeft === 0 ? 'ends today' : 'in ' + out.daysLeft + ' d';
    if (l.start && l.end > l.start) out.progress = Math.max(0, Math.min(1, D.diffDays(l.start, today) / D.diffDays(l.start, l.end)));
  }
  if (out.noticeGiven && l.moveOut) out.label = 'moving out ' + D.rel(l.moveOut, today);
  return out;
}

/** Deposit to return after move-out, or null. {amount, moveOut, dueDate, daysLeft, overdue} */
function depositDue(tenant, settings, today) {
  settings = settingsWithDefaults(settings);
  const l = tenant.lease || {}, dep = tenant.deposit;
  if (!l.moveOut || !dep || !(+dep.amount > 0) || dep.returned) return null;
  if (l.moveOut > today && tenant.status !== 'past') return null;
  const dueDate = D.addDays(l.moveOut, +settings.depositReturnDays || 0);
  const daysLeft = D.diffDays(today, dueDate);
  return { amount: +dep.amount, moveOut: l.moveOut, dueDate, daysLeft, overdue: daysLeft < 0 };
}

function tenantsArr(state) {
  const t = state.tenants || {};
  return Array.isArray(t) ? t.slice() : Object.keys(t).map(id => (t[id] ? Object.assign({ id }, t[id], { id: t[id].id || id }) : null)).filter(Boolean);
}
function ticketsArr(state) {
  const t = state.tickets || {};
  return Array.isArray(t) ? t.slice() : Object.keys(t).map(id => (t[id] ? Object.assign({ id }, t[id], { id: t[id].id || id }) : null)).filter(Boolean);
}
function ledgerGetter(state, today, getLedger) {
  if (getLedger) return getLedger;
  const cache = {};
  const settings = settingsWithDefaults(state.settings);
  return id => {
    if (cache[id]) return cache[id];
    const t = (state.tenants || {})[id] || tenantsArr(state).find(x => x.id === id);
    const lg = (state.ledgers || {})[id];
    return (cache[id] = buildLedger(Object.assign({ id }, t), lg ? lg.entries || lg : {}, settings, today));
  };
}
const unitLabel = t => [t.property, t.unit].filter(Boolean).join(' ');
const sortTenants = list => list.sort((a, b) => RB.natCmp(a.property, b.property) || RB.natCmp(a.unit, b.unit) || RB.natCmp(a.name, b.name));
const isCurrent = t => t.status !== 'past';

/**
 * Prioritised "needs attention" items for the Today view.
 * Item: {id, kind, severity:'high'|'medium'|'low', rank, tenantId?, ticketId?, logId?, title, detail, amount?, date?,
 *        action:{type, label, ...args}, secondary?:{type, label, ...args}}
 * kinds: delinquent, late, partial, ticket, lease, moveout, movein, deposit, followup, insurance
 * action.type: recordPayment {tenantId} | addLateFee {tenantId, period} | openTenant {tenantId} | openTicket {ticketId}
 *              | followupDone {tenantId, logId} | settleDeposit {tenantId} | renewLease {tenantId}
 */
function attention(state, today, getLedger) {
  const settings = settingsWithDefaults(state.settings);
  const L = ledgerGetter(state, today, getLedger);
  const items = [];
  const sevRank = { high: 0, medium: 1, low: 2 };
  for (const t of tenantsArr(state)) {
    const name = t.name || 'Unnamed tenant';
    const unit = unitLabel(t);
    const lg = L(t.id);
    const pay = { type: 'recordPayment', tenantId: t.id, label: 'Record payment' };
    if (lg.balance > 0 && (lg.delinquent || lg.current.status === 'late' || lg.current.status === 'partial' || Object.values(lg.months).some(m => m.status === 'late'))) {
      const lateFee = lg.suggestedLateFee ? { type: 'addLateFee', tenantId: t.id, period: lg.suggestedLateFee.period, amount: lg.suggestedLateFee.amount, label: 'Add late fee ' + M.fmt(lg.suggestedLateFee.amount) } : null;
      if (lg.delinquent) {
        const behind = Object.values(lg.months).filter(m => m.open > 0).length;
        items.push({ id: 'delinquent-' + t.id, kind: 'delinquent', severity: 'high', rank: -D.diffDays(lg.oldestOpenDate, today), tenantId: t.id, unit,
          title: name, detail: M.fmt(lg.balance) + ' owed · ' + RB.plural(behind, 'month') + ' behind · oldest ' + D.fmt(lg.oldestOpenDate, today),
          amount: lg.balance, date: lg.oldestOpenDate, action: pay, secondary: lateFee });
      } else if (lg.current.status === 'late' || Object.values(lg.months).some(m => m.status === 'late')) {
        const lateM = lg.current.status === 'late' ? lg.months[lg.current.period] : Object.values(lg.months).filter(m => m.status === 'late').pop();
        items.push({ id: 'late-' + t.id, kind: 'late', severity: 'high', rank: -lateM.daysLate, tenantId: t.id, unit,
          title: name, detail: D.monthName(lateM.period) + ' rent · ' + M.fmt(lateM.open) + (lateM.paid > 0 ? ' still open (' + M.fmt(lateM.paid) + ' paid)' : '') + ' · ' + lateM.daysLate + ' d late',
          amount: lg.balance, date: lateM.due, action: pay, secondary: lateFee });
      } else {
        items.push({ id: 'partial-' + t.id, kind: 'partial', severity: 'medium', rank: 0, tenantId: t.id, unit,
          title: name, detail: 'Paid ' + M.fmt(lg.current.paid) + ' of ' + M.fmt(lg.current.charged) + ' · grace ends ' + D.rel(lg.current.graceEnd, today),
          amount: lg.current.open, date: lg.current.graceEnd, action: pay });
      }
    }
    if (isCurrent(t)) {
      const ls = leaseState(t, settings, today);
      if (ls.kind === 'fixed' && ls.inNoticeWindow && !ls.noticeGiven && t.status === 'active') {
        items.push({ id: 'lease-' + t.id, kind: 'lease', severity: ls.daysLeft <= 30 ? 'medium' : 'low', rank: ls.daysLeft, tenantId: t.id, unit,
          title: name, detail: 'Lease ends ' + D.fmt(ls.end, today) + ' (' + ls.label + ') · no renewal decided', date: ls.end,
          action: { type: 'renewLease', tenantId: t.id, label: 'Decide' } });
      }
      const l = t.lease || {};
      if (l.moveOut && l.moveOut >= today && D.diffDays(today, l.moveOut) <= 30) {
        items.push({ id: 'moveout-' + t.id, kind: 'moveout', severity: 'medium', rank: D.diffDays(today, l.moveOut), tenantId: t.id, unit,
          title: name, detail: 'Moves out ' + D.fmt(l.moveOut, today) + ' (' + D.rel(l.moveOut, today) + ')', date: l.moveOut,
          action: { type: 'openTenant', tenantId: t.id, label: 'Plan move-out' } });
      }
      if (l.moveIn && l.moveIn > today && D.diffDays(today, l.moveIn) <= 30) {
        items.push({ id: 'movein-' + t.id, kind: 'movein', severity: 'low', rank: D.diffDays(today, l.moveIn), tenantId: t.id, unit,
          title: name, detail: 'Moves in ' + D.fmt(l.moveIn, today) + ' (' + D.rel(l.moveIn, today) + ')', date: l.moveIn,
          action: { type: 'openTenant', tenantId: t.id, label: 'Open' } });
      }
      const ins = t.insurance;
      if (ins && ins.expires && D.diffDays(today, ins.expires) <= 30) {
        const n = D.diffDays(today, ins.expires);
        items.push({ id: 'insurance-' + t.id, kind: 'insurance', severity: n < 0 ? 'medium' : 'low', rank: n, tenantId: t.id, unit,
          title: name, detail: 'Renter’s insurance ' + (n < 0 ? 'expired ' + D.fmt(ins.expires, today) : 'expires ' + D.fmt(ins.expires, today) + ' (' + D.rel(ins.expires, today) + ')'),
          date: ins.expires, action: { type: 'openTenant', tenantId: t.id, label: 'Open' } });
      }
    }
    const dd = depositDue(t, settings, today);
    if (dd) {
      items.push({ id: 'deposit-' + t.id, kind: 'deposit', severity: dd.daysLeft <= 7 ? 'high' : 'medium', rank: dd.daysLeft, tenantId: t.id, unit,
        title: name, detail: 'Deposit ' + M.fmt(dd.amount) + ' due back ' + D.fmt(dd.dueDate, today) + ' (' + (dd.overdue ? -dd.daysLeft + ' d overdue' : D.rel(dd.dueDate, today)) + ')',
        amount: dd.amount, date: dd.dueDate, action: { type: 'settleDeposit', tenantId: t.id, label: 'Settle deposit' } });
    }
    const log = t.log || {};
    for (const lid of Object.keys(log)) {
      const e = log[lid];
      if (!e || e.done || !e.followUp || e.followUp > today) continue;
      items.push({ id: 'followup-' + t.id + '-' + lid, kind: 'followup', severity: 'medium', rank: D.diffDays(today, e.followUp), tenantId: t.id, logId: lid, unit,
        title: name, detail: 'Follow up: ' + String(e.text || '').slice(0, 120) + (e.followUp < today ? ' (since ' + D.fmt(e.followUp, today) + ')' : ''),
        date: e.followUp, action: { type: 'followupDone', tenantId: t.id, logId: lid, label: 'Mark done' }, secondary: { type: 'openTenant', tenantId: t.id, label: 'Open' } });
    }
  }
  for (const k of ticketsArr(state)) {
    if (k.status === 'done') continue;
    const age = k.reported ? D.diffDays(k.reported, today) : 0;
    if (k.priority !== 'urgent' && !(k.status === 'open' && k.priority === 'normal')) continue;
    items.push({ id: 'ticket-' + k.id, kind: 'ticket', severity: k.priority === 'urgent' ? 'high' : 'low', rank: -age, ticketId: k.id, tenantId: k.tenantId || null,
      unit: unitLabel(k), title: k.title || 'Upkeep request',
      detail: unitLabel(k) + ' · ' + (k.status === 'scheduled' && k.scheduled ? 'scheduled ' + D.fmt(k.scheduled, today) : age + ' d open') + (k.priority === 'urgent' ? ' · urgent' : ''),
      date: k.reported, action: { type: 'openTicket', ticketId: k.id, label: 'Open' } });
  }
  items.sort((a, b) => sevRank[a.severity] - sevRank[b.severity] || a.rank - b.rank || RB.natCmp(a.title, b.title));
  return items;
}

/**
 * Month totals for the portfolio. period 'YYYY-MM' (default: today's month).
 * {period, charged, collected, outstanding, received, tenants, counts:{paid,paid_late,partial,due,late,none}, paidCount, dueDate, graceEnd}
 * charged/collected/outstanding count all charges for that period (rent, recurring, manual); received = payments dated in the period.
 */
function portfolio(state, today, period, getLedger) {
  period = period || D.monthKey(today);
  const settings = settingsWithDefaults(state.settings);
  const L = ledgerGetter(state, today, getLedger);
  const out = { period, charged: 0, collected: 0, outstanding: 0, received: 0, tenants: 0,
    counts: { paid: 0, paid_late: 0, partial: 0, due: 0, late: 0, none: 0 }, paidCount: 0,
    dueDate: D.dayIn(period, settings.dueDay), graceEnd: D.addDays(D.dayIn(period, settings.dueDay), settings.graceDays) };
  for (const t of tenantsArr(state)) {
    const lg = L(t.id);
    const m = lg.months[period];
    for (const r of lg.rows) if (!r.void && r.type === 'payment' && D.monthKey(r.date) === period) out.received += r.amount;
    if (!m || !m.scheduled) continue;
    out.tenants++;
    out.charged += m.charged; out.collected += m.paid; out.outstanding += m.open;
    out.counts[m.status]++;
  }
  out.paidCount = out.counts.paid + out.counts.paid_late;
  return out;
}

/** Rent roll. {rows:[{tenantId,property,unit,name,status,rent,leaseStart,leaseEnd,deposit,balance,monthStatus}], totals:{rent,deposit,balance}, occupancy:{occupied,units,rate}} */
function rentRoll(state, today, getLedger) {
  const L = ledgerGetter(state, today, getLedger);
  const list = sortTenants(tenantsArr(state));
  const rows = list.map(t => {
    const lg = L(t.id);
    return { tenantId: t.id, property: t.property || '', unit: t.unit || '', name: t.name || '', status: t.status || 'active',
      rent: rentOn(t, today), leaseStart: (t.lease || {}).start || null, leaseEnd: (t.lease || {}).end || null,
      moveOut: (t.lease || {}).moveOut || null, deposit: (t.deposit && +t.deposit.amount) || 0, balance: lg.balance, monthStatus: lg.current.status };
  });
  const cur = rows.filter(r => r.status !== 'past');
  const units = new Set(rows.map(r => r.property + '\u0000' + r.unit));
  const occ = new Set(cur.map(r => r.property + '\u0000' + r.unit));
  return {
    rows,
    totals: { rent: cur.reduce((s, r) => s + r.rent, 0), deposit: rows.reduce((s, r) => s + r.deposit, 0), balance: rows.reduce((s, r) => s + r.balance, 0) },
    occupancy: { occupied: occ.size, units: units.size, rate: units.size ? occ.size / units.size : 0 },
  };
}

/** Aging report: tenants with open charges. {rows:[{tenantId,name,property,unit,d0_30,d31_60,d61_90,d90,total}], totals} */
function aging(state, today, getLedger) {
  const L = ledgerGetter(state, today, getLedger);
  const rows = [];
  const totals = { d0_30: 0, d31_60: 0, d61_90: 0, d90: 0, total: 0 };
  for (const t of sortTenants(tenantsArr(state))) {
    const a = L(t.id).aging;
    const total = a.d0_30 + a.d31_60 + a.d61_90 + a.d90;
    if (!total) continue;
    rows.push({ tenantId: t.id, name: t.name || '', property: t.property || '', unit: t.unit || '', ...a, total });
    for (const k of Object.keys(totals)) totals[k] += k === 'total' ? total : a[k];
  }
  return { rows, totals };
}

/** Last n months (default 12), oldest → newest: [{period, charged, collected, outstanding, rate}] (rate 0..1 or null when nothing charged) */
function collectionByMonth(state, today, n, getLedger) {
  n = n || 12;
  const L = ledgerGetter(state, today, getLedger);
  const end = D.monthKey(today);
  const out = [];
  const list = tenantsArr(state);
  for (let i = n - 1; i >= 0; i--) {
    const k = D.addMonthKey(end, -i);
    let charged = 0, collected = 0, outstanding = 0;
    for (const t of list) { const m = L(t.id).months[k]; if (m) { charged += m.charged; collected += m.paid; outstanding += m.open; } }
    out.push({ period: k, charged, collected, outstanding, rate: charged ? collected / charged : null });
  }
  return out;
}

/** Cash received per tenant in a calendar year (payments dated in year). {year, rows:[{tenantId,name,property,unit,payments,credits,count,byMonth[12]}], totals:{payments,credits,byMonth}} */
function incomeByYear(state, year, getLedger, today) {
  year = String(year);
  const L = ledgerGetter(state, today || D.today(), getLedger);
  const rows = [];
  const totals = { payments: 0, credits: 0, byMonth: new Array(12).fill(0) };
  for (const t of sortTenants(tenantsArr(state))) {
    const r = { tenantId: t.id, name: t.name || '', property: t.property || '', unit: t.unit || '', payments: 0, credits: 0, count: 0, byMonth: new Array(12).fill(0) };
    for (const row of L(t.id).rows) {
      if (row.void || row.kind !== 'entry' || row.date.slice(0, 4) !== year) continue;
      if (row.type === 'payment') { r.payments += row.amount; r.count++; r.byMonth[+row.date.slice(5, 7) - 1] += row.amount; }
      if (row.type === 'credit') r.credits += row.amount;
    }
    if (!r.payments && !r.credits) continue;
    rows.push(r);

// ================================================================= toast
let toastBox = null;

 * Returns {close}.

  const o = opts || {};

// ================================================================= sheet / confirm
let sheetSeq = 0;

 *        cancel:'Cancel' | false, note (SafeHTML/str in the footer), initialFocus (selector), onClose(result)}

// ================================================================= menu
let openMenu = null;

 * Dropdown menu anchored to an element. items: [{label, icon, hint, danger, disabled, onSelect(), checked} | {sep:true} | {heading:'…'}]

    : h`<button type="button" role="menuitem" class="menu-item${it.danger ? ' is-danger' : ''}" data-i="${i}"${it.disabled ? raw(' disabled') : ''}${it.write ? raw(' data-write') : ''}>${it.icon ? ui.icon(it.icon) : it.checked !== undefined ? ui.icon(it.checked ? 'check' : 'dot', { cls: it.checked ? '' : 'vh' }) : ''}<span>${it.label}</span>${it.hint ? h`<span class="menu-hint">${it.hint}</span>` : ''}</button>`)}`);

// ================================================================= drawer
let drawerHandle = null;

ui.drawerClose = () => h`<button type="button" class="btn btn-ghost btn-icon drawer-close" data-drawer-close aria-label="Close">${ui.icon('x')}</button>`;

// ================================================================= palette (generic)
/** Highlight query tokens inside text (SafeHTML, escaped). */
ui.highlight = function highlight(text, query) {
  const s = String(text || '');
  const toks = String(query || '').toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return h`${s}`;
  const marks = new Array(s.length).fill(false);
  const low = s.toLowerCase();
  toks.forEach(t => { let i = low.indexOf(t); if (i >= 0) for (let j = i; j < i + t.length; j++) marks[j] = true; });
  let out = '', on = false;
  for (let i = 0; i < s.length; i++) {
    if (marks[i] !== on) { out += marks[i] ? '<mark>' : '</mark>'; on = marks[i]; }
    out += RB.esc(s[i]);
  }
  if (on) out += '</mark>';
  return raw(out);
};
/** Simple matcher: every token appears in haystack. Returns score (lower is better) or -1. */
ui.match = function match(hay, query) {
  const toks = String(query || '').toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return 0;
  const s = String(hay || '').toLowerCase();
  let score = 0;
  for (const t of toks) {
    const i = s.indexOf(t);
    if (i < 0) return -1;
    score += i === 0 || /[\s\-\/·]/.test(s[i - 1]) ? 0 : 10 + i;
  }
  return score;
};

/**
 * Palette (search + pick). opts: {placeholder, query, source(query) → [{group, items:[{id,label,sub,hint,icon,run()}]}], onClose(picked)}
 * Returns {close, setQuery}.

  const o = opts || {};

    <div class="palette" role="dialog" aria-modal="true" aria-label="${o.label || 'Search'}">

      <div class="palette-list" id="rb-palette-list" role="listbox"></div>
      <div class="palette-foot"><span>${ui.kbd('↑', '↓')} move</span><span>${ui.kbd('↵')} open</span><span>${ui.kbd('esc')} close</span></div>
    </div>`);

    list.innerHTML = groups.length ? String(h`${groups.map(g => h`${g.group ? h`<div class="palette-group">${g.group}</div>` : ''}${g.items.map(it => { const i = flat.push(it) - 1; return h`<button type="button" class="palette-item" role="option" id="rb-pal-${i}" data-i="${i}" aria-selected="${i === sel ? 'true' : 'false'}">${it.plate ? ui.plate(it.plate) : ui.icon(it.icon || 'arrow-right')}<span class="palette-item-main">${ui.highlight(it.label, input.value)}${it.sub ? h`<span class="palette-item-sub">${ui.highlight(it.sub, input.value)}</span>` : ''}</span>${it.hint ? h`<span class="palette-item-hint">${it.hint}</span>` : ''}</button>`; })}`)}`)
      : String(h`<div class="palette-empty">${o.emptyText || 'Nothing matches'} “${input.value}”</div>`);

};

/** Tenant picker built on the palette → Promise<tenantId|null>. opts: {title(placeholder), filter(tenant) → bool, includePast:false} */

      source: q => {

let gPending = 0;
function isTyping(t) { return t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]'); }
document.addEventListener('keydown', e => {
  if (e.defaultPrevented) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openPalette(); return; }
  if (ui.hasModal()) return;
  if (isTyping(e.target)) {
    if (e.key === 'Escape' && e.target.id === 'rb-search') { e.target.value = ''; e.target.blur(); }
    return;
  }
  if (mod || e.altKey) return;
  if (gPending && Date.now() - gPending < 1200) {
    gPending = 0;
    const n = NAV.find(x => x.key === e.key.toLowerCase());
    if (n) { e.preventDefault(); go(n.route); return; }
  }
  if (e.key === 'g') { gPending = Date.now(); return; }
  gPending = 0;
  if (e.key === '/') { e.preventDefault(); openPalette(); return; }
  if (e.key === '?') { e.preventDefault(); helpSheet(); return; }
  if (e.key === 'n' || e.key === '+') { e.preventDefault(); quickAdd($('rb-add')); return; }
  const def = mounted && views[mounted.name];
  if (def && def.onKey && mounted.root.dataset.state === 'ready') { try { if (def.onKey(e, ctxFor('key')) === true) e.preventDefault(); } catch (err) { console.error(err); } }
});

}

      <td class="l-amt">${r.type === 'charge' ? ui.money(r.amount) : ''}</td><td class="l-amt l-pay">${r.type !== 'charge' ? ui.money(r.amount) : ''}</td><td class="l-bal">${ui.money(r.balance)}</td></tr>`);
  }
  return h`<table class="ledger"><thead><tr><th>Date</th><th>Description</th><th class="l-amt">Charge</th><th class="l-amt">Payment</th><th class="l-bal">Balance</th></tr></thead><tbody>${out}</tbody></table>`;
}

function drawerFor(id, ctx) {
  const S = ctx.store;
  ui.drawer({
    label: 'Tenant details',
    onClose: () => { if (/^#t-/.test(location.hash)) location.hash = 'tenants'; },
    render(el) {
      const t = S.tenant(id);
      if (!t) { el.innerHTML = String(h`<div class="drawer-head"><div class="drawer-title">Not found</div>${ui.drawerClose()}</div>`); return; }
      const lg = S.ledger(id);
      el.innerHTML = String(h`<div class="drawer-head"><div class="stack stack-1 grow">${ui.plate(t.unit, { size: 'lg', status: lg.current.status })}<div class="drawer-title">${t.name}</div><div class="muted">${t.property} · ${ui.balance(lg.balance, { zero: 'Nothing owed' })}</div></div>${ui.drawerClose()}</div>
        <div class="drawer-body">
          <div class="sec"><h3 class="sec-title">Contact</h3></div>
          <dl class="kv"><dt>Phone</dt><dd>${ui.copyline(t.phone, 'phone number')}</dd><dt>Email</dt><dd>${ui.copyline(t.email, 'email address')}</dd></dl>
          <div class="sec"><h3 class="sec-title">Ledger</h3><div class="sec-actions"><button type="button" class="btn btn-sm btn-ghost" data-act="stmt">${ui.icon('copy')}Copy statement</button></div></div>
          ${ledgerTable(lg, ctx.today)}
        </div>
        <div class="drawer-foot"><button type="button" class="btn btn-primary" data-act="pay" data-write>${ui.icon('cash')}Record payment</button><button type="button" class="btn" data-act="note" data-write>${ui.icon('note')}Add note</button></div>`);
      ui.bind(el, { pay: () => RB.actions.recordPayment(id), note: () => RB.actions.addNote(id), stmt: () => RB.actions.copyStatement(id) });
    },
  });
}

RB.views.register('tenants', {
  title: 'Tenants',
  render(el, ctx) {
    const S = ctx.store;
    const list = S.tenantsList();
    const end = D.monthKey(ctx.today);
    el.innerHTML = String(h`
      <div class="tbl-wrap hide-phone"><table class="tbl">
        <thead><tr><th>Tenant</th><th>Property</th><th class="num">Rent</th><th>This month</th><th>12 months</th><th class="num">Balance</th><th>Lease</th></tr></thead>
        <tbody>${list.map(t => { const lg = S.ledger(t.id); const ls = RB.model.leaseState(t, ctx.state.settings, ctx.today); return h`<tr class="is-link${t.status === 'past' ? ' is-muted' : ''}${ctx.param === t.id ? ' is-selected' : ''}" data-act="open" data-id="${t.id}">
          <td><span class="row">${ui.plate(t.unit)}<span><span class="cell-name">${t.name}</span>${t.coTenants && t.coTenants.length ? h`<span class="cell-sub">${t.coTenants.map(c => c.name).join(', ')}</span>` : ''}</span></span></td>
          <td class="muted">${t.property}</td><td class="num">${ui.money(lg.rent)}</td><td>${ui.pill(lg.current.status, { daysLate: lg.current.daysLate })}</td>
          <td>${ui.strip(RB.model.monthsBack(lg, end, 12), { today: ctx.today })}</td><td class="num">${ui.balance(lg.balance, { zero: '' })}</td><td class="muted nowrap">${ls.label}</td></tr>`; })}</tbody>
      </table></div>
      <div class="clist show-phone">${list.map(t => { const lg = S.ledger(t.id); return h`<div class="crow is-link" data-act="open" data-id="${t.id}"><span class="crow-lead">${ui.plate(t.unit)}</span><div class="crow-main"><div class="crow-title">${t.name}</div><div class="crow-sub">${t.property}</div></div><div class="crow-aside">${ui.pill(lg.current.status, { daysLate: lg.current.daysLate, size: 'sm' })}${ui.balance(lg.balance, { zero: '' })}</div></div>`; })}</div>
    `);
    ui.bind(el, { open: b => RB.actions.openTenant(b.dataset.id) });
    const d = ui.currentDrawer();
    if (ctx.param) { if (!d || ctx.reason !== 'store') drawerFor(ctx.param, ctx); else d.rerender(); }
    else if (d) d.close({ silent: true });
  },
  onKey(e, ctx) {
    if (!ctx.param || !['j', 'k', 'ArrowDown', 'ArrowUp'].includes(e.key)) return false;
    const list = ctx.store.tenantsList();
    const i = list.findIndex(t => t.id === ctx.param);
    const n = list[i + (e.key === 'j' || e.key === 'ArrowDown' ? 1 : -1)];
    if (n) location.hash = 't-' + n.id;
    return true;
  },
  destroy() { const d = ui.currentDrawer(); if (d) d.close({ silent: true }); },
});
})();
