    for (const k of MATCH_ORDER) { if (used.has(k)) continue; const f = FIELDS.find(x => x.key === k); if (f.re.test(s)) { used.add(k); return k; } }

/** Parse the pasted text into {header, rows, hasHeader, width}. */
function parsed() {
  const all = RB.model.parseDelimited(imp.text).filter(r => r.some(c => String(c).trim())).slice(0, 1001);
  if (!all.length) return null;
  const width = Math.min(30, Math.max(...all.map(r => r.length)));
  const norm = all.map(r => Array.from({ length: width }, (_, i) => r[i] || ''));
  const auto = autoMap(norm[0]);
  const hasHeader = auto.some(Boolean);
  if (imp.mapFor !== imp.text.split(/\r?\n/, 1)[0] || !imp.map || imp.map.length !== width) {
    imp.map = hasHeader ? auto : norm[0].map(() => '');
    imp.mapFor = imp.text.split(/\r?\n/, 1)[0];
  }
  return { header: hasHeader ? norm[0] : norm[0].map((_, i) => 'Column ' + (i + 1)), rows: hasHeader ? norm.slice(1) : norm, hasHeader, width };
}
const FIX_DATE = ' Write it like 1/15/2026 or Jan 15 2026.';
/** Validate one row under the current mapping → {ok, problems (plain sentences), data}. */
function checkRow(row, existing, today) {
  const get = k => { const i = imp.map.indexOf(k); return i >= 0 ? String(row[i] || '').trim() : ''; };
  const problems = [];
  const name = get('name').slice(0, 120);
  if (!name) problems.push('There is no name.');
  const rentRaw = get('rent');
  const rent = rentRaw ? M.parse(rentRaw) : null;
  if (!rentRaw) problems.push('There is no rent.'); else if (rent === null || rent <= 0) problems.push('The rent “' + rentRaw.slice(0, 20) + '” is not an amount of money. Write it like 1450.');
  const date = (k, label) => { const v = get(k); if (!v) return null; const d = D.parseLoose(v, today); if (!d) problems.push(label + ' “' + v.slice(0, 20) + '” is not a date we understand.' + FIX_DATE); return d; };
  const start = date('start', 'The lease start'), end = date('end', 'The lease end');
  if (start && end && end <= start) problems.push('The lease ends before it starts.');
  const money = (k, label) => { const v = get(k); if (!v) return 0; const c = M.parse(v); if (c === null) { problems.push(label + ' “' + v.slice(0, 20) + '” is not an amount of money.'); return 0; } return c; };
  const deposit = money('deposit', 'The deposit'), balance = money('balance', 'What they already owe');
  if (deposit < 0) problems.push('The deposit can’t be less than zero.');
  const unit = get('unit').slice(0, 40), property = get('property').slice(0, 120);
  if (name && existing.has((name + '|' + unit).toLowerCase())) problems.push('They are already in your rent book.');
  return { ok: !problems.length, problems, data: { name, unit, property, phone: get('phone').slice(0, 60), email: get('email').slice(0, 160), rent, start, end, deposit, balance } };
}
function checkAll(p, today) {
  const existing = new Set(S().tenantsList().filter(t => !t.sample).map(t => (t.name + '|' + (t.unit || '')).toLowerCase()));
  const seen = new Map();
  return p.rows.map((r, i) => {
    const c = checkRow(r, existing, today);
    const key = (c.data.name + '|' + c.data.unit).toLowerCase();
    if (c.data.name && seen.has(key)) { c.problems.push('Same name and unit as row ' + (seen.get(key) + 1) + '.'); c.ok = false; }
    else seen.set(key, i);
    return c;
  });
}
function tenantDoc(d, today) {

    lease: { start, end: d.end || null, moveIn: start, noticeDate: null, moveOut: null, dueDay: null, graceDays: null },
    rent: [{ from: start, amount: d.rent }], recurring: [], trackFrom: D.max(tf, start),
    opening: d.balance ? { amount: d.balance } : null,

    insurance: null, links: [], about: '', log: {}, createdAt: now, updatedAt: now,

}

async function doImport(today) {
  if (!canWrite()) return;
  const p = parsed(); if (!p) return;
  const checks = checkAll(p, today).filter(c => c.ok);
  if (!checks.length) return;
  const removeSample = S().hasSample() && imp.removeSample !== false;
  if (removeSample) {
    const ts = S().tenantsList().filter(t => t.sample).length;
    const ok = await ui.confirm({
      title: 'Remove the example tenants and bring in yours?',
      body: h`<p>The <strong>${RB.plural(ts, 'example tenant')}</strong>, their payment history and the example repairs are deleted first. Then your <strong>${RB.plural(checks.length, 'tenant')}</strong> are added.</p>`,
      confirmLabel: 'Remove the examples and bring in mine', cancelLabel: 'Keep it as it is', danger: true,
    });
    if (!ok) return;
    try { await S().removeSample(); } catch (e) { return; }
  }
  const tenants = {};
  checks.forEach(c => { tenants[RB.id()] = tenantDoc(c.data, today); });
  const ids = Object.keys(tenants);
  try { await S().importAll({ tenants }); } catch (e) { ui.toast('Some tenants couldn’t be saved. Look at the Tenants list and try again.', { tone: 'bad' }); }
  imp.done = { count: ids.length, skipped: p.rows.length - ids.length, removed: removeSample };
  imp.text = ''; imp.fileName = ''; imp.map = null; imp.mapFor = null; imp.step = 1;
  ui.toast('Brought in ' + RB.plural(ids.length, 'tenant') + '.', { duration: 10000, undo: () => { ids.forEach(id => S().deleteTenant(id).catch(() => {})); imp.done = null; } });
  RB.shell.refresh();
}

function summarize(data) {

  const ledgers = RB.isObj(data.ledgers) ? data.ledgers : {};
  const entries = Object.keys(ledgers).reduce((n, k) => n + Object.keys((ledgers[k] && ledgers[k].entries) || {}).length, 0);
  const at = String(data.exportedAt || '').slice(0, 10);
  return { tenants: Object.keys(data.tenants).length, entries, tickets: RB.isObj(data.tickets) ? Object.keys(data.tickets).length : 0,

}
function readFile(input, cb) {
  const f = input.files && input.files[0]; if (!f) return;
  if (f.size > 15 * 1024 * 1024) { cb(null, f.name, 'the file is bigger than 15 MB.'); input.value = ''; return; }
  const fr = new FileReader();
  fr.onload = () => { cb(String(fr.result || ''), f.name); input.value = ''; };
  fr.onerror = () => { cb(null, f.name, 'the file couldn’t be opened.'); input.value = ''; };
  fr.readAsText(f);
}

const addBtn = (label, sec) => h`<button type="button" class="btn btn-ghost tn-addbtn" data-act="edit" data-sec="${sec}" data-write>${ui.icon('plus')}<span>${label}</span></button>`;

function contactPart(t) {
  const co = (t.coTenants || []).filter(c => c && (c.name || c.phone || c.email));
  const em = t.emergency || {};
  return h`<dl class="tn-facts">
    <div><dt>Phone</dt><dd>${t.phone ? contactLine(t.phone, 'phone') : addBtn('Add a phone number', 'contact')}</dd></div>
    <div><dt>Email</dt><dd>${t.email ? contactLine(t.email, 'email') : addBtn('Add an email address', 'contact')}</dd></div>
    ${co.length ? h`<div><dt>Also on the lease</dt><dd>${co.map(c => h`<div class="tn-person"><div class="tn-person-name">${c.name || 'Unnamed'}</div>${c.phone ? contactLine(c.phone, 'phone') : ''}${c.email ? contactLine(c.email, 'email') : ''}</div>`)}</dd></div>` : ''}
    ${em.name || em.phone ? h`<div><dt>In an emergency, call</dt><dd><div class="tn-person">${em.name ? h`<div class="tn-person-name">${em.name}</div>` : ''}${em.phone ? contactLine(em.phone, 'phone') : ''}</div></dd></div>` : ''}
  </dl>`;
}

function leasePart(t, lg, ls, settings, today) {
  const l = t.lease || {};
  const rows = [];
  const sched = (t.rent || []).filter(r => r && D.isDate(r.from)).slice().sort((a, b) => D.cmp(a.from, b.from));
  const nowIdx = sched.reduce((acc, r, i) => (r.from <= today ? i : acc), 0);
  const curR = sched[nowIdx], prevR = sched[nowIdx - 1], next = sched.filter(r => r.from > today);
  rows.push(['Rent', h`<div class="tn-big">${ui.money(lg.rent)} a month</div>
    ${prevR && curR ? h`<div class="tn-sub">Since ${W.date(curR.from, today)}. It was ${W.$(prevR.amount)} before that.</div>` : ''}
    ${next.map(r => h`<div class="tn-sub tone-accent">Goes to ${W.$(r.amount)} on ${W.date(r.from, today)}.</div>`)}`]);
  const terms = RB.model.termsOf(t, settings);
  rows.push(['When rent is due', h`On the ${T.ordinal(terms.dueDay)} of each month. It counts as late after ${RB.plural(terms.graceDays, 'more day')}${l.dueDay != null || l.graceDays != null ? ' (special for this tenant)' : ''}.`]);
  const rec = (t.recurring || []).filter(r => r && r.amount && !(r.to && r.to < today));
  if (rec.length) rows.push(['Other monthly charges', h`${rec.map(r => h`<div>${r.label || 'Monthly charge'}: ${W.$(r.amount)} a month${r.from && r.from > today ? ' from ' + W.date(r.from, today) : r.to ? ' until ' + W.date(r.to, today) : ''}</div>`)}`]);
  // lease
  let lease;
  if (t.status === 'past') lease = h`Moved out ${W.date(l.moveOut, today)}. They had moved in ${W.date(l.moveIn || l.start, today)}.`;
  else if (ls.kind === 'mtm') lease = h`Month-to-month${ls.holdover ? h` since the lease ended ${W.date(l.end, today)}` : ''}. Moved in ${W.date(l.moveIn || l.start, today)}.`;
  else if (ls.kind === 'upcoming') lease = h`Moves in ${W.date(l.moveIn, today)}${l.end ? h`. The lease ends ${W.date(l.end, today)}` : ' (month-to-month)'}.`;
  else lease = h`Runs from ${W.date(l.start, today)} to ${W.date(l.end, today)} — ${ls.daysLeft === 0 ? 'ends today' : W.days(ls.daysLeft) + ' left'}. Moved in ${W.date(l.moveIn || l.start, today)}.`;
  rows.push(['Lease', h`${lease}${l.moveOut && t.status !== 'past' ? h`<div class="tn-sub tone-warn">Moving out ${W.date(l.moveOut, today)} — ${W.rel(l.moveOut, today)}.</div>` : ''}`]);
  // deposit
  const dep = t.deposit || {};
  if (+dep.amount > 0) {
    if (dep.returned) {
      const kept = (dep.returned.deductions || []).reduce((s, d) => s + (+d.amount || 0), 0);
      rows.push(['Deposit', h`${W.$(dep.amount)}. Sorted out on ${W.date(dep.returned.date, today)}: ${W.$(dep.returned.refund || 0)} given back${kept ? ', ' + W.$(kept) + ' kept' : ''}${dep.returned.applied ? ', ' + W.$(dep.returned.applied) + ' used for unpaid rent' : ''}.`]);
    } else rows.push(['Deposit', h`${W.$(dep.amount)}${dep.received ? ', paid ' + W.date(dep.received, today) : ''}${dep.heldAt ? h`, kept at ${dep.heldAt}` : ''}.`]);
  }
  const ins = t.insurance;
  if (ins && (ins.carrier || ins.policy || ins.expires)) rows.push(['Renter’s insurance', h`${ins.carrier || 'Insurer'}${ins.policy ? h`, policy ${ins.policy}` : ''}${ins.expires ? h`<div class="tn-sub ${ins.expires < today ? 'tone-bad' : D.diffDays(today, ins.expires) <= 30 ? 'tone-warn' : ''}">${ins.expires < today ? 'Ran out' : 'Runs out'} ${W.date(ins.expires, today)}</div>` : ''}`]);
  const links = (t.links || []).filter(x => x && RB.safeUrl(x.url));
  if (links.length) rows.push(['Documents', h`${links.map(x => h`<div><a class="tn-link" href="${RB.safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${x.label || x.url} ${ui.icon('external', { size: 14 })}</a></div>`)}`]);
  if (t.about) rows.push(['About them', h`<div class="prewrap">${t.about}</div>`]);
  const live = t.status !== 'past';
  return h`<dl class="tn-facts">${rows.map(([k, v]) => h`<div><dt>${k}</dt><dd>${v}</dd></div>`)}</dl>
    <div class="tn-btnrow">
      ${live ? h`<button type="button" class="btn" data-act="rent" data-write>Raise or change the rent</button><button type="button" class="btn" data-act="renew" data-write>Renew the lease</button>` : ''}
      <button type="button" class="btn btn-ghost" data-act="edit" data-sec="lease" data-write>${ui.icon('edit')}<span>Change these details</span></button>
    </div>`;
}

// ---- payment history
/** Which payments were part payments: a payment after which a rent charge it went to is still not fully paid. */
function paymentKinds(rows) {
  const paidSoFar = {}, byId = {}, out = {};
  rows.forEach(r => { byId[r.id] = r; });
  rows.forEach(r => {
    if (r.type === 'charge' || r.void || !r.applied) return;
    let part = false, rest = false;
    r.applied.forEach(a => {
      const before = paidSoFar[a.id] || 0;
      paidSoFar[a.id] = before + a.amount;
      const c = byId[a.id];
      if (c && (c.kind === 'rent' || c.kind === 'recurring')) { if (paidSoFar[a.id] < c.amount) part = true; else if (before > 0) rest = true; }
    });
    out[r.id] = part ? 'part' : rest ? 'rest' : '';
  });
  return out;
}
function rowWhat(r, kinds) {
  if (r.kind === 'rent') return D.monthName(r.period) + (r.period.slice(0, 4) !== S().today().slice(0, 4) ? ' ' + r.period.slice(0, 4) : '') + ' rent';
  if (r.kind === 'recurring') return r.label || 'Monthly charge';
  if (r.kind === 'opening') return 'What they already owed';
  const e = r.entry || {};
  if (r.type === 'payment') { const k = kinds[r.id]; return (k === 'part' ? 'Part payment' : k === 'rest' ? 'Payment — the rest' : 'Payment') + (r.method ? ' (' + r.method + ')' : ''); }
  if (r.type === 'credit') return 'Money off' + (r.memo ? ': ' + r.memo : '');
  if (e.category === 'late_fee') return 'Late fee' + (r.period ? ' for ' + D.monthName(r.period) : '');
  return r.memo || 'Charge';
}
function rowSub(r, today) {
  const bits = [];
  if (r.void) bits.push('Removed — it was a mistake');
  if (r.prorate) bits.push(h`${r.prorate.days} of ${r.prorate.ofDays} days of ${W.$(r.prorate.full)}`);
  if (r.type === 'charge' && !r.void && r.amount > 0) {
    if (r.open === 0 && r.paidOn) bits.push(h`<span class="tone-ok">Paid ${W.date(r.paidOn, today)}</span>`);
    else if (r.open > 0 && r.paid > 0) bits.push(h`<span class="tone-warn">${W.$(r.paid)} paid so far, ${W.$(r.open)} still owed</span>`);
    else if (r.open > 0) bits.push(h`<span class="${r.date < today ? 'tone-bad' : ''}">Not paid yet</span>`);
  }
  if (r.kind === 'entry') {
    if (r.ref) bits.push(h`Reference ${r.ref}`);
    if (r.type === 'payment' && r.memo) bits.push(r.memo);
    if (r.type !== 'charge' && !r.void && r.unapplied > 0) bits.push(h`${W.$(r.unapplied)} paid ahead`);
  }
  return bits.length ? h`<span class="tn-l-sub">${RB.html.join(bits, ' · ')}</span>` : '';
}

function ledgerPart(t, lg, today, showAll) {
  const cutoff = D.monthStart(D.addMonthKey(D.monthKey(today), -11));
  const all = lg.rows.slice().reverse();
  const shown = showAll ? all : all.filter(r => r.date >= cutoff);
  const hidden = all.length - shown.length;
  const cells = RB.model.monthsBack(lg, D.monthKey(today), 12);
  const kinds = paymentKinds(lg.rows);
  const tools = h`<div class="tn-btnrow">
      <button type="button" class="btn" data-act="pay" data-write>${ui.icon('cash')}<span>Record a payment</span></button>
      <button type="button" class="btn" data-act="charge" data-write>${ui.icon('plus')}<span>Add a charge</span></button>
      <button type="button" class="btn btn-ghost" data-act="stmt">${ui.icon('copy')}<span>Copy a statement</span></button>
      <button type="button" class="btn btn-ghost" data-act="csv">${ui.icon('download')}<span>Download for Excel</span></button>
    </div>`;
  const strip = h`<figure class="tn-strip"><figcaption class="tn-strip-h">The last 12 months</figcaption>${ui.strip(cells, { lg: true, today })}<p class="tn-caption">${T.STRIP_CAPTION}</p></figure>`;
  if (!all.length) return h`${strip}${ui.empty({ quiet: true, title: 'Nothing here yet. Rent starts ' + W.date(lg.trackFrom, today) + '.' })}${tools}`;
  let last = null;
  const out = [];
  for (const r of shown) {
    const mk = D.monthKey(r.date);
    if (mk !== last) { out.push(h`<tr class="tn-l-month"><th colspan="6" scope="rowgroup">${D.fmtMonth(mk)}</th></tr>`); last = mk; }
    const stored = r.kind === 'entry';
    const what = rowWhat(r, kinds);
    out.push(h`<tr class="${r.void ? 'is-void' : ''}" data-row="${r.id}">
      <td class="tn-l-date">${W.date(r.date, today)}</td>
      <td class="tn-l-what"><span class="tn-l-text">${what}</span>${rowSub(r, today)}</td>
      <td class="tn-l-amt" data-label="Charged">${r.type === 'charge' ? ui.money(r.amount) : ''}</td>
      <td class="tn-l-amt tn-l-pay" data-label="Paid">${r.type !== 'charge' ? ui.money(r.amount) : ''}</td>
      <td class="tn-l-amt tn-l-bal" data-label="Still owed">${r.balance < 0 ? h`${ui.money(-r.balance)} ahead` : ui.money(r.balance)}</td>
      <td class="tn-l-act">${stored ? h`<button type="button" class="btn btn-ghost" data-act="lmenu" data-eid="${r.id}" aria-haspopup="menu" aria-label="More about: ${what}, ${W.date(r.date, today)}"><span>More</span></button>` : ''}</td></tr>`);
  }
  return h`${strip}${tools}
    <table class="tn-ledger" aria-describedby="tn-ledger-cap"><thead><tr><th scope="col">Date</th><th scope="col">What</th><th scope="col" class="tn-l-amt">Charged</th><th scope="col" class="tn-l-amt">Paid</th><th scope="col" class="tn-l-amt">Still owed</th><th scope="col" class="tn-l-act"><span class="vh">More</span></th></tr></thead><tbody>${out}</tbody></table>
    <p class="tn-caption" id="tn-ledger-cap">Newest first. “Still owed” is what they owed after each line${lg.balance < 0 ? ' (“ahead” means they have paid more than was due)' : ''}.</p>
    ${hidden > 0 ? h`<div class="tn-more-rows"><button type="button" class="btn" data-act="earlier">${ui.icon('chevron-down')}<span>Show ${RB.plural(hidden, 'older line')}</span></button></div>`
      : showAll && all.some(r => r.date < cutoff) ? h`<div class="tn-more-rows"><button type="button" class="btn" data-act="earlier">${ui.icon('chevron-up')}<span>Show only the last 12 months</span></button></div>` : ''}`;
}

function timelinePart(logs, today) {
  if (!logs.length) return h`<p class="tn-caption">No notes yet. Write down calls, texts and visits here so you remember them.</p>`;
  return h`<ul class="tn-notes">${logs.map(e => {
    const day = localDay(e.at);
    const fu = e.followUp;
    const fuText = fu ? (e.done ? h`Followed up (was due ${W.date(fu, today)})` : fu < today ? h`<span class="tone-bad">Follow up was due ${W.date(fu, today)} — ${W.rel(fu, today, { style: 'late' })}</span>` : fu === today ? h`<span class="tone-warn">Follow up today</span>` : h`Follow up ${W.date(fu, today)} — ${W.rel(fu, today)}`) : null;
    return h`<li class="tn-note${e.done && fu ? ' is-done' : ''}" data-lid="${e.id}">
      <div class="tn-note-meta">${day ? W.date(day, today) : ''} · ${T.KIND_LABEL[e.kind] || 'Note'}</div>
      <div class="tn-note-text prewrap">${e.text}</div>
      ${fuText ? h`<div class="tn-note-fu">${ui.icon('calendar', { size: 16 })}<span>${fuText}</span></div>` : ''}
      <div class="tn-note-acts">${fu ? h`<label class="check tn-tick"><input type="checkbox" data-change="fudone" data-lid="${e.id}"${e.done ? RB.raw(' checked') : ''} data-write><span>Followed up</span></label>` : ''}
        <button type="button" class="btn btn-ghost" data-act="logmenu" data-lid="${e.id}" aria-haspopup="menu"><span>More</span></button></div>
    </li>`;
  })}</ul>`;
}

/** Repairs in this unit: provided by the Repairs view (RB.repairs.unitSection) when it exists. null = hide the section. */
function repairsPart(t) {
  const R = RB.repairs;
  if (!R || typeof R.unitSection !== 'function') return null;
  try {
    const out = R.unitSection(t);
    if (out == null || out === '') return null;
    if (RB.isSafe(out)) return out;
    if (out && out.nodeType === 1) return RB.raw(out.outerHTML);
    return R.unitSectionIsSafe ? RB.raw(String(out)) : h`${String(out)}`;
  } catch (e) { console.warn(e); return null; }
}

// ------------------------------------------------------------------ note sheet (add + change)
T.noteSheet = function noteSheet(id, lid) {
  if (!T.guard()) return Promise.resolve(null);
  const t = S().tenant(id); if (!t) return Promise.resolve(null);
  const e = lid && t.log && t.log[lid] ? t.log[lid] : null;
  if (lid && !e) return Promise.resolve(null);
  const today = S().today();
  return new Promise(resolve => {
    let saved = null;
    ui.sheet({
      title: e ? 'Change this note' : 'Add a note', sub: t.name + ' — ' + T.place(t),
      body: h`<div class="tn-form">
        ${ui.field({ name: 'text', id: 'tn-note-text', label: 'What happened?', type: 'textarea', value: e ? e.text : '', required: true, requiredMsg: 'Write what happened first', rows: 4, placeholder: 'For example: Called about the late rent. She will pay on Friday.' })}
        ${T.pick({ name: 'kind', id: 'tn-note-kind', label: 'How?', value: e ? (e.kind === 'notice' ? 'note' : e.kind) : 'note', options: T.NOTE_KINDS })}
        ${ui.field({ name: 'followUp', id: 'tn-note-follow', label: 'Remind me to follow up on…', type: 'date', value: e ? e.followUp || '' : '', optional: true, hint: 'Leave this empty if you don’t need a reminder. On that day it shows on Today.' })}
      </div>`,
      initialFocus: '#tn-note-text',
      cancel: 'Close',
      actions: [{ id: 'save', label: e ? 'Save the note' : 'Add the note', kind: 'primary', onClick: s => {
        const v = ui.form(s.body, { validate: v => ({ followUp: v.followUp && !D.valid(v.followUp) ? 'Pick a date from the calendar' : '' }) });
        if (!v) return false;
        if (e) {
          const prev = { kind: e.kind || 'note', text: e.text || '', followUp: e.followUp || null, done: !!e.done };
          const patch = { kind: v.kind || 'note', text: v.text, followUp: v.followUp || null };
          if (patch.followUp !== prev.followUp) patch.done = false;
          S().updateLog(id, lid, patch).catch(() => {});
          saved = lid;
          ui.toast('Saved the note for ' + t.name + '.', { undo: () => S().updateLog(id, lid, prev), duration: 10000 });
        } else {
          const nid = RB.id();
          S().addLog(id, { id: nid, kind: v.kind || 'note', text: v.text, followUp: v.followUp || null, done: false }).catch(() => {});
          saved = nid;
          ui.toast('Added a note for ' + t.name + (v.followUp ? '. You’ll be reminded on ' + W.date(v.followUp, today) + '.' : '.'), { undo: () => S().deleteLog(id, nid), duration: 10000 });
        }
      } }],
      onClose: () => resolve(saved),
    });
  });
};

// ------------------------------------------------------------------ entries: remove / put back
const entryWord = e => (e.type === 'payment' ? 'payment' : e.type === 'credit' ? 'money off' : e.category === 'late_fee' ? 'late fee' : 'charge');
T.removeEntry = function removeEntry(id, eid) {
  if (!T.guard()) return;
  const e = S().entries(id)[eid]; if (!e) return;
  S().voidEntry(id, eid).catch(() => {});
  ui.toast('Removed the ' + W.$(e.amount) + ' ' + entryWord(e) + ' from ' + W.date(e.date, S().today()) + '.', { undo: () => S().unvoidEntry(id, eid), duration: 10000 });
};
T.putBack = function putBack(id, eid) {
  if (!T.guard()) return;
  const e = S().entries(id)[eid]; if (!e) return;
  S().unvoidEntry(id, eid).catch(() => {});
  ui.toast('Put back the ' + W.$(e.amount) + ' ' + entryWord(e) + '.', { undo: () => S().voidEntry(id, eid), duration: 10000 });
};
/** Payment history as a file for Excel — column headings in plain words. */
T.downloadHistory = function downloadHistory(id) {
  const t = S().tenant(id); const lg = S().ledger(id);
  if (!t || !lg) return Promise.resolve(false);
  const kinds = paymentKinds(lg.rows);
  const csv = RB.model.csv(lg.rows, [
    { label: 'Date', key: 'date' },
    { label: 'What', get: r => rowWhat(r, kinds) },
    { label: 'For month', get: r => (r.period ? D.fmtMonth(r.period) : '') },
    { label: 'Charged', money: true, get: r => (r.type === 'charge' ? r.amount : null) },
    { label: 'Paid or money off', money: true, get: r => (r.type !== 'charge' ? r.amount : null) },
    { label: 'Still owed after this line', money: true, get: r => r.balance },
    { label: 'How they paid', get: r => r.method || '' },
    { label: 'Reference', get: r => r.ref || '' },
    { label: 'Note', get: r => (r.kind === 'entry' ? r.memo || '' : '') },
    { label: 'Removed', get: r => (r.void ? 'Removed — it was a mistake' : '') },
  ]);
  const slug = String(t.unit + ' ' + t.name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'tenant';
  return RB.actions.downloadFile('payment-history-' + slug + '-' + S().today() + '.csv', csv, 'text/csv');
};

// ------------------------------------------------------------------ "More" — every other action, with a line each
T.moreSheet = function moreSheet(id) {
  const t = S().tenant(id); if (!t) return;
  const A = RB.actions;
  const today = S().today();
  const lg = S().ledger(id);
  const p = W.partial(lg, today);
  const l = t.lease || {};
  const live = t.status !== 'past';
  const items = [];
  if (p) items.push(['part', 'Record another part payment', 'They paid some more, but not all of it', () => A.recordPayment(id, { part: true })]);
  else if (lg.balance > 0) items.push(['payall', 'Record a payment', 'Someone paid you — write it down', () => A.recordPayment(id)]);
  items.push(['charge', 'Add a charge', 'A late fee, repair bill or utility', () => A.addCharge(id)]);
  items.push(['credit', 'Take money off what they owe', 'A discount, or money you are giving back', () => A.addCredit(id)]);
  if (live) {
    items.push(['rent', 'Raise or change the rent', 'Set a new monthly rent from a date you choose', () => A.changeRent(id)]);
    items.push(['renew', 'Renew the lease', 'Give the lease a new end date', () => A.renewLease(id)]);
    items.push(['moveout', t.status === 'notice' && l.moveOut && l.moveOut <= today ? 'Finish the move-out' : 'They are moving out', 'Set the date, see what they still owe, and sort out the deposit', () => A.moveOut(id)]);
  }
  if (t.deposit && +t.deposit.amount > 0 && !t.deposit.returned && l.moveOut && (t.status === 'past' || l.moveOut <= today)) items.push(['settle', 'Give back the deposit', 'Work out what to keep and what to give back', () => A.settleDeposit(id)]);
  items.push(['edit', 'Edit their details', 'Name, phone, unit, rent and more', () => A.editTenant(id)]);
  items.push(['delete', 'Remove this tenant', 'Only if they were added by mistake — this deletes all their history', () => T.deleteTenant(id)]);
  ui.sheet({
    title: 'What would you like to do?', sub: t.name + ' — ' + T.place(t), cancel: 'Close', actions: [],
    body: (el, sh) => {
      el.innerHTML = String(h`<div class="tn-morelist">${items.map(([k, label, sub]) => h`<button type="button" class="tn-moreitem${k === 'delete' ? ' is-danger' : ''}" data-more="${k}"${k === 'stmt' ? '' : RB.raw(' data-write')}><span class="tn-moreitem-l">${label}</span><span class="tn-moreitem-s">${sub}</span>${ui.icon('chevron-right')}</button>`)}</div>`);
      el.addEventListener('click', e => {
        const b = e.target.closest('[data-more]'); if (!b) return;
        const it = items.find(x => x[0] === b.dataset.more);
        sh.close();
        if (it) setTimeout(it[3], 0);
      });
    },
  });
};

function handlers(el, id) {
  const A = RB.actions;
  return {
    step: b => T.step(+b.dataset.d),
    pay: b => {
      const lg = S().ledger(id); const p = T.payLabel(lg, S().today());
      if (b.closest('.tn-dacts') && p.partial) A.recordPayment(id, { amount: p.amount });
      else A.recordPayment(id);
    },
    charge: () => A.addCharge(id),
    fee: () => A.addLateFee(id),
    settle: () => A.settleDeposit(id),
    moveout: () => A.moveOut(id),
    rent: () => A.changeRent(id),
    renew: () => A.renewLease(id),
    edit: b => A.editTenant(id, b.dataset.sec),
    stmt: () => A.copyStatement(id),
    csv: () => T.downloadHistory(id),
    more: () => T.moreSheet(id),
    note: () => T.noteSheet(id),
    earlier: () => { el._tnShowAll = !el._tnShowAll; renderDrawer(el, id); },
    fudone: b => { A.followupDone(id, b.dataset.lid, b.checked); },

            rent: rentEditable && v.rent !== null && v.rent <= 0 ? 'Write the monthly rent, for example 1,450' : '',

            graceDays: v.graceDays !== null && !(v.graceDays >= 0 && v.graceDays <= 31 && Number.isInteger(v.graceDays)) ? 'Use a number from 0 to 31, or leave it empty' : '',

          recurring: rec.map(r => ({ id: r.id || RB.id(8), label: r.label, amount: r.amount, from: r.from || moveIn, to: r.to || null })),
          trackFrom: v.trackFrom, opening: v.opening ? { amount: v.opening } : null,
          deposit: { amount: v.deposit || 0, received: v.depReceived || (v.deposit ? dep.received || moveIn : null), heldAt: v.heldAt },

        const prev = {};

        S().updateTenant(id, data).catch(() => {});
        saved = id;
        ui.toast('Saved the changes to ' + v.name + '.', { undo: () => S().updateTenant(id, prev), duration: 10000 });
      } }],

}

// ------------------------------------------------------------------ raise or change the rent
function changeRent(id) {
  if (!T.guard()) return Promise.resolve(false);
  const t = S().tenant(id); if (!t) return Promise.resolve(false);
  const today = S().today();
  const sched = (t.rent || []).filter(r => r && D.isDate(r.from)).slice().sort((a, b) => D.cmp(a.from, b.from));
  const last = sched[sched.length - 1];
  let from0 = D.monthStart(D.addMonthKey(D.monthKey(today), 1));
  if (last && from0 <= last.from) from0 = D.monthStart(D.addMonthKey(D.monthKey(last.from), 1));
  const cur = RB.model.rentOn(t, today);
  return new Promise(resolve => {
    let ok = false;
    ui.sheet({
      title: 'Raise or change the rent', sub: sub(t), cancel: 'Close',
      body: (el, sh) => {
        el.innerHTML = String(h`<div class="tn-form">
          <p class="tn-lead">The rent is ${$(cur)} a month now.</p>
          ${ui.field({ name: 'amount', id: 'cr-amount', label: 'What will the new rent be?', type: 'money', value: null, required: true, requiredMsg: 'Write the new monthly rent', placeholder: 'For example: ' + M.input(Math.round(cur * 1.03 / 2500) * 2500 || 145000) })}
          ${ui.field({ name: 'from', id: 'cr-from', label: 'From what date?', type: 'date', value: from0, required: true, requiredMsg: 'Choose when the new rent starts', hint: 'Usually the 1st of a month.' })}
          <p class="tn-summary-text" id="cr-sum" aria-live="polite"></p>
        </div>`);
        const upd = () => {
          const a = M.parse(el.querySelector('#cr-amount').value);
          const f = el.querySelector('#cr-from').value;
          const was = f && D.valid(f) ? RB.model.rentOn(t, f) : cur;
          const box = el.querySelector('#cr-sum');
          if (a > 0 && f && D.valid(f)) {
            const diff = a - was;
            box.innerHTML = String(h`Rent changes from <strong>${$(was)}</strong> to <strong>${$(a)}</strong> on <strong>${D.fmtLong(f)}</strong>${diff ? ` (${diff > 0 ? 'up' : 'down'} ${$(Math.abs(diff))} a month)` : ''}. Months before that keep the old rent.${f <= today ? h` <span class="tone-warn">That date has already passed, so months from ${D.fmt(f, today)} will use the new rent.</span>` : ''}`);
            sh.setAction('save', { label: 'Change the rent to ' + $(a) });
          } else { box.textContent = 'Months before the date you choose keep the old rent.'; sh.setAction('save', { label: 'Change the rent' }); }
        };
        el.addEventListener('input', upd); el.addEventListener('change', upd); upd();
      },
      actions: [{ id: 'save', label: 'Change the rent', kind: 'primary', onClick: s => {
        const v = ui.form(s.body, { validate: v => ({
          amount: v.amount !== null && v.amount <= 0 ? 'Write the new monthly rent, for example 1,450' : v.amount !== null && v.from && v.amount === RB.model.rentOn(t, v.from) ? 'That is already the rent on that date' : '',
          from: last && v.from && v.from <= last.from ? 'Choose a date after ' + D.fmt(last.from, today) + ' — the last change starts then' : '',
        }) });
        if (!v) return false;
        const prev = RB.clone(t.rent || []);
        S().updateTenant(id, { rent: prev.concat([{ from: v.from, amount: v.amount }]) }).catch(() => {});
        ok = true;
        ui.toast('The rent for ' + t.name + ' changes to ' + $(v.amount) + ' on ' + D.fmt(v.from, today) + '.', { undo: () => S().updateTenant(id, { rent: prev }), duration: 10000 });
      } }],
      onClose: () => resolve(ok),
    });
  });
}

// ------------------------------------------------------------------ deposit sums (shared by the move-out flow and "Give back the deposit")
function depositSums(t, data, balance) {
  const dep = +(t.deposit || {}).amount || 0;
  const ded = data.keep === 'yes' ? (data.ded || []).filter(d => d.reason || d.amount) : [];
  return RB.model.depositSettlement({ deposit: dep, deductions: ded.map(d => ({ reason: d.reason, amount: d.amount || 0 })), balance, applyToBalance: data.useForRent !== 'no' });
}
/** "Deposit $1,250 − cleaning $120 = $1,130 to give back, due by Nov 30" */
function depositSentence(st, dueDate, today) {
  const parts = ['Deposit ' + $(st.deposit)];
  st.lines.forEach(d => parts.push('− ' + (d.reason || 'other').toLowerCase() + ' ' + $(d.amount)));
  if (st.applied) parts.push('− unpaid rent ' + $(st.applied));
  if (st.creditRefunded) parts.push('+ money they paid ahead ' + $(st.creditRefunded));
  let s = parts.join(' ') + ' = ' + $(st.refund) + ' to give back';
  if (dueDate) s += ', due by ' + D.fmt(dueDate, today);
  s += '.';
  if (st.shortfall) s += ' What you are keeping is ' + $(st.shortfall) + ' more than the deposit — they still owe that.';
  else if (st.balanceAfter > 0) s += ' They will still owe ' + $(st.balanceAfter) + '.';
  return s;
}
function depositBody(el, data, t, balance, dueDate, today) {
  el.innerHTML = String(h`<div class="tn-form">
    <p class="tn-lead">They paid a deposit of ${$(+t.deposit.amount)}.${dueDate ? h` You need to give back what you don’t keep by <strong>${D.fmtLong(dueDate)}</strong>.` : ''}</p>
    ${T.pick({ name: 'keep', id: 'sd-keep', label: 'Do you need to keep any of it?', value: data.keep, options: [{ value: 'no', label: 'No — give it all back' }, { value: 'yes', label: 'Yes, some of it' }] })}
    <div class="field" id="sd-ded-wrap" data-field="_ded"><span class="field-label">What are you keeping it for?</span><div class="field-hint">For example cleaning, a repair, or a missing key.</div>
      ${repeater('ded', (data.ded && data.ded.length ? data.ded : [{}]), 'Add another amount', 'sd-add')}</div>
    ${balance > 0 ? T.pick({ name: 'useForRent', id: 'sd-apply', label: 'They still owe ' + $(balance) + '. Use the deposit to pay it?', value: data.useForRent, options: [{ value: 'yes', label: 'Yes' }, { value: 'no', label: 'No' }] }) : ''}
    ${balance < 0 ? h`<p class="tn-caption">They have ${$(-balance)} paid ahead. That is added to what you give back.</p>` : ''}
    <p class="tn-summary-text" id="sd-sum" aria-live="polite"></p>
  </div>`);
  wireRepeaters(el);
  const upd = () => {
    const vals = ui.readForm(el).values;
    data.keep = vals.keep; if (vals.useForRent !== undefined) data.useForRent = vals.useForRent;
    data.ded = readRep(el, 'ded').map(d => ({ reason: d.reason, amount: d.amount, _bad: d._amountBad }));
    show(el.querySelector('#sd-ded-wrap'), data.keep === 'yes');
    const st = depositSums(t, data, balance);
    el.querySelector('#sd-sum').textContent = depositSentence(st, dueDate, today);
  };
  el.addEventListener('input', upd); el.addEventListener('change', upd); upd();
}
function depositErrors(el, data) {
  if (data.keep !== 'yes') return null;
  const ded = readRep(el, 'ded');
  const filled = ded.filter(d => d.reason || d.amount !== null || d._amountBad);
  const bad = filled.find(d => d._amountBad || !(d.amount > 0) || !d.reason);
  const msg = !filled.length ? 'Write what you are keeping and how much — or choose “No”' : bad ? (!bad.reason ? 'Say what each amount is for — it goes on the statement' : 'Write an amount above zero, for example 150') : '';
  repError(el, 'ded', msg, bad ? bad._row : null);
  return msg ? { _ded: msg } : null;
}
/** Write a deposit settlement (entries + deposit.returned). Returns an undo function. */
function writeSettlement(id, st, date) {
  const entryIds = [];
  if (st.applied > 0) { const eid = RB.id(); entryIds.push(eid); S().addEntry(id, { id: eid, type: 'credit', date, amount: st.applied, memo: 'Deposit used for unpaid rent' }).catch(() => {}); }
  if (st.creditRefunded > 0) { const eid = RB.id(); entryIds.push(eid); S().addEntry(id, { id: eid, type: 'charge', date, amount: st.creditRefunded, category: 'other', period: D.monthKey(date), memo: 'Money paid ahead, given back with the deposit' }).catch(() => {}); }
  if (st.shortfall > 0) { const eid = RB.id(); entryIds.push(eid); S().addEntry(id, { id: eid, type: 'charge', date, amount: st.shortfall, category: 'damage', period: D.monthKey(date), memo: 'Kept beyond the deposit' }).catch(() => {}); }
  S().updateTenant(id, { deposit: { returned: { date, refund: st.refund, deductions: st.lines, applied: st.applied, creditRefunded: st.creditRefunded } } }).catch(() => {});
  return () => { S().updateTenant(id, { deposit: { returned: null } }); entryIds.forEach(eid => S().undoEntry(id, eid)); };
}

// ------------------------------------------------------------------ they are moving out (one flow; also "give notice")
function moveOutFlow(id) {
  if (!T.guard()) return Promise.resolve(false);
  const t = S().tenant(id); if (!t) return Promise.resolve(false);
  const today = S().today();
  const settings = S().settings();
  const l = t.lease || {};
  const dep = t.deposit || {};
  const holdsDeposit = +dep.amount > 0 && !dep.returned;
  const data = { moveOut: l.moveOut || (l.end && l.end >= today && t.status === 'active' ? l.end : today), keep: 'no', useForRent: 'yes', ded: [] };
  const preview = d => RB.model.moveOutPreview(t, S().entries(id), settings, today, d.moveOut);
  const dueOf = d => D.addDays(d.moveOut, +settings.depositReturnDays || 0);
  let ok = false;
  return T.steps({
    title: 'They are moving out',
    data,
    steps: [
      { title: 'When are they moving out?',
        body: (el, d) => {
          el.innerHTML = String(h`
            <p class="tn-lead">${t.name}, ${T.place(t)}.${l.end ? h` Their lease ends ${D.fmtLong(l.end)}.` : ' They are month-to-month.'}</p>
            ${ui.field({ name: 'moveOut', id: 'mo-date', label: 'Moving-out day', type: 'date', value: d.moveOut, hint: 'If they have already gone, choose the day they left.' })}
            <p class="tn-caption" id="mo-when"></p>`);
          const upd = () => {
            const box = el.querySelector('#mo-when');
            box.textContent = !d.moveOut || !D.valid(d.moveOut) ? '' : d.moveOut > today ? 'That is ' + W().rel(d.moveOut, today) + '. They stay on your list until then, marked “Moving out”.' : 'They will be marked “Moved out”. Next you’ll see what they still owe' + (holdsDeposit ? ' and sort out the deposit.' : '.');
          };
          syncData(el, d, upd); upd();
        },
        validate: d => ({ moveOut: !d.moveOut ? 'Choose the moving-out day' : l.moveIn && d.moveOut < l.moveIn ? 'That is before they moved in (' + D.fmt(l.moveIn, today) + ')' : '' }) },
      { title: 'What they still owe',
        body: (el, d) => {
          const pv = preview(d);
          const rentRow = pv.finalRows.find(r => r.kind === 'rent');
          const lines = pv.finalRows.map(r => r.kind === 'rent'
            ? h`<li>${D.monthName(pv.period)} rent${r.prorate ? h`: ${r.prorate.days} of ${r.prorate.ofDays} days, so ${$(r.amount)} instead of ${$(r.prorate.full)}` : h`: ${$(r.amount)} (the whole month)`}</li>`
            : h`<li>${r.label}${r.prorate ? h`: ${r.prorate.days} of ${r.prorate.ofDays} days,` : ':'} ${$(r.amount)}</li>`);
          el.innerHTML = String(h`<div class="tn-sum" id="mo-sum">
            ${rentRow ? h`<p class="tn-lead">Their last rent is for ${D.monthName(pv.period)}:</p><ul class="tn-sumlist">${lines}</ul>` : h`<p class="tn-lead">There is no more rent to add for ${D.monthName(pv.period)}.</p>`}
            <p class="tn-summary-text" id="mo-owed">${pv.balance > 0 ? h`If nothing more is paid, they will owe <strong>${$(pv.balance)}</strong> when they leave.` : pv.balance < 0 ? h`They will have <strong>${$(-pv.balance)}</strong> paid ahead when they leave.` : h`When they leave, they will be <strong>all paid up</strong>.`}${pv.balanceNow > 0 && pv.balanceNow !== pv.balance ? h` Today they owe ${$(pv.balanceNow)}.` : ''}</p>
          </div>`);
        } },
      { title: holdsDeposit ? 'The deposit' : 'Anything else',
        body: (el, d) => {
          if (!holdsDeposit) { el.innerHTML = String(h`<p class="tn-lead">${+dep.amount > 0 ? 'The deposit has already been sorted out.' : 'No deposit is recorded, so there is nothing to give back.'}</p>`); return; }
          if (d.moveOut > today) { el.innerHTML = String(h`<p class="tn-lead">They paid a ${$(+dep.amount)} deposit. Sort it out after they leave: on or after ${D.fmtLong(d.moveOut)}, open their page and choose “Give back the deposit”. Today will remind you.</p>`); return; }
          depositBody(el, d, t, preview(d).balance, dueOf(d), today);
          Object.defineProperty(d, '_el', { value: el, writable: true, configurable: true, enumerable: false });
        },
        validate: d => {
          if (!holdsDeposit || d.moveOut > today) return null;
          return d._el && d._el.isConnected ? depositErrors(d._el, d) : null;
        } },
    ],
    summary: d => {
      const pv = preview(d);
      if (d.moveOut > today) return h`<p class="tn-summary-text" id="mo-summary">${t.name} is moving out on ${D.fmtLong(d.moveOut)} (${W().rel(d.moveOut, today)}).</p>
        <p class="tn-summary-more">${pv.balance > 0 ? h`If nothing more is paid, they will owe ${$(pv.balance)} then.` : 'They will be all paid up by then.'} You can finish the move-out on that day from their page or from Today.</p>`;
      const st = holdsDeposit ? depositSums(t, d, pv.balance) : null;
      return h`<p class="tn-summary-text" id="mo-summary">${t.name} moved out on ${D.fmtLong(d.moveOut)}.</p>
        ${st ? h`<p class="tn-summary-more" id="mo-deposit">${depositSentence(st, dueOf(d), today)}</p>` : h`<p class="tn-summary-more">${pv.balance > 0 ? 'They still owe ' + $(pv.balance) + '.' : 'They are all paid up.'}</p>`}`;
    },
    doneLabel: d => (d.moveOut > today ? 'Save — moving out ' + D.fmt(d.moveOut, today) : 'Finish the move-out'),
    onDone: d => {
      ok = true;
      if (d.moveOut > today) {
        const prevN = { status: t.status || 'active', lease: { noticeDate: l.noticeDate || null, moveOut: l.moveOut || null } };
        const lid = RB.id();
        S().updateTenant(id, { status: 'notice', lease: { noticeDate: l.noticeDate || today, moveOut: d.moveOut } }).catch(() => {});
        S().addLog(id, { id: lid, kind: 'notice', text: 'Moving out ' + D.fmtLong(d.moveOut) + '.', followUp: null, done: false }).catch(() => {});
        ui.toast(firstName(t) + ' is moving out on ' + D.fmt(d.moveOut, today) + '.', { undo: () => { S().updateTenant(id, prevN); S().deleteLog(id, lid); }, duration: 10000 });
        return;
      }
      const prev = { status: t.status || 'active', lease: { moveOut: l.moveOut || null } };
      S().updateTenant(id, { status: 'past', lease: { moveOut: d.moveOut } }).catch(() => {});
      let undoDep = null;
      let st = null;
      if (holdsDeposit) { st = depositSums(t, d, S().ledger(id).balance); undoDep = writeSettlement(id, st, today); }
      ui.toast(t.name + ' moved out on ' + D.fmt(d.moveOut, today) + (st ? '. Give back ' + $(st.refund) + ' of the deposit.' : '.'), { undo: () => { if (undoDep) undoDep(); S().updateTenant(id, prev); }, duration: 10000 });
    },
  }).then(r => !!r && ok);
}

// ------------------------------------------------------------------ give back the deposit (after they have gone)
function settlementText(t, st, date, settings) {
  const W2 = 46;
  const line = (a, b) => { a = String(a); b = String(b); return a + ' '.repeat(Math.max(1, W2 - a.length - b.length)) + b; };
  const m = c => M.fmt(c, { cents: 'always' });
  const out = [];
  out.push((settings.portfolioName ? settings.portfolioName + ' — ' : '') + 'Deposit statement');
  out.push('');

    : h`Rent was due ${D.fmt(p.dueDate, today)}. Since ${D.fmt(D.addDays(p.graceEnd, 1), today)}, anything unpaid counts as late.`;
  const key = (cls, label, cents) => (cents ? h`<span class="bar-key bar-key-${cls}">${label}: ${M.fmt(cents)}</span>` : '');
  return h`<section class="td-collect" aria-labelledby="td-collect-t">
    <h2 class="sec-title" id="td-collect-t">${D.fmtMonth(p.period)} rent</h2>
    <p class="td-say" id="td-say">${sentence}</p>
    <div class="bar bar-lg td-bar" aria-hidden="true">
      <span class="bar-seg bar-seg-ok" style="width:${pct(p.collected)}%"></span>
      <span class="bar-seg bar-seg-warn" style="width:${pct(parts.partial)}%"></span>
      <span class="bar-seg bar-seg-bad" style="width:${pct(parts.late)}%"></span>
    </div>
    <div class="bar-legend td-legend">${key('ok', 'Collected', p.collected)}${key('warn', 'Part paid — still owed', parts.partial)}${key('bad', 'Late', parts.late)}${key('soft', 'Not paid yet', parts.due)}</div>
    <p class="caption td-grace">${grace}</p>
    <a class="btn btn-lg td-collect-go" href="#rent" id="td-go-rent">${owe ? 'See who still owes' : 'Open the Rent page'}${ui.icon('arrow-right')}</a>
  </section>`;
}

// ------------------------------------------------------------------ (2) what needs you
/** One plain sentence per item, built from the data (not the model's terse detail line). */
function sentence(S, a, today) {
  const t = a.tenantId ? S.tenant(a.tenantId) : null;
  const name = t ? t.name : a.title;
  const lg = t ? S.ledger(t.id) : null;
  switch (a.kind) {
    case 'delinquent': {
      const n = Object.values(lg.months).filter(m => m.open > 0).length;
      return h`${name} is behind on rent: owes <strong>${M.fmt(lg.balance)}</strong> from ${RB.plural(n, 'month')}. The oldest is from ${D.fmt(lg.oldestOpenDate, today)}.`;
    }
    case 'late': {
      const m = lg.current.status === 'late' ? lg.months[lg.current.period] : Object.values(lg.months).filter(x => x.status === 'late').pop();
      if (m.rentPaid > 0) return h`${name} has paid ${M.fmt(m.rentPaid)} of ${M.fmt(m.rentCharged)} for ${D.monthName(m.period)}. Still owes <strong>${M.fmt(m.open)}</strong>, ${D.days(m.daysLate)} late.`;
      return h`${name} hasn’t paid ${D.monthName(m.period)} rent (<strong>${M.fmt(m.open)}</strong>). It is ${D.days(m.daysLate)} late.`;
    }
    case 'partial': {
      const m = lg.months[lg.current.period];
      return h`${name} has paid ${M.fmt(m.rentPaid)} of ${M.fmt(m.rentCharged)} for ${D.monthName(m.period)}. Still owes <strong>${M.fmt(m.open)}</strong> — it becomes late after ${D.fmt(m.graceEnd, today)}.`;
    }
    case 'ticket': {
      const k = S.ticket(a.ticketId) || {};
      const where = k.unit ? (k.property ? k.property + ', ' : '') + RB.actions.who({ unit: k.unit }) : k.property || 'the building';
      const age = k.reported ? D.diffDays(k.reported, today) : 0;
      const when = k.status === 'scheduled' && k.scheduled ? 'Booked for ' + D.fmt(k.scheduled, today) + '.' : age > 0 ? 'Reported ' + D.days(age) + ' ago.' : 'Reported today.';
      return h`${k.priority === 'urgent' ? 'Urgent repair: ' : 'Repair: '}${(k.title || 'repair').replace(/^\w/, c => c.toLowerCase())} at ${where}. ${when}`;
    }
    case 'lease': {
      const ls = RB.model.leaseState(t, S.settings(), today);
      return h`${name}’s lease ends ${D.fmt(ls.end, today)} (${D.rel(ls.end, today)}). You haven’t decided yet whether to renew.`;
    }
    case 'moveout': {
      const mo = t.lease && t.lease.moveOut;
      return mo <= today ? h`${name} was due to move out ${mo === today ? 'today' : 'on ' + D.fmt(mo, today)}. Finish the move-out when they have gone.` : h`${name} moves out ${D.fmt(mo, today)} (${D.rel(mo, today)}).`;
    }
    case 'movein': return h`${name} moves in ${D.fmt(t.lease.moveIn, today)} (${D.rel(t.lease.moveIn, today)}).`;
    case 'deposit': {
      const dd = RB.model.depositDue(t, S.settings(), today);
      if (!dd) return a.detail;
      return dd.overdue ? h`${name}’s deposit of <strong>${M.fmt(dd.amount)}</strong> should have gone back by ${D.fmt(dd.dueDate, today)} — ${D.days(-dd.daysLeft)} ago.` : h`Give back ${name}’s deposit of <strong>${M.fmt(dd.amount)}</strong> by ${D.fmt(dd.dueDate, today)} (${D.rel(dd.dueDate, today)}).`;
    }
    case 'followup': {
      const e = t && t.log && t.log[a.logId];
      return h`Reminder about ${name}: “${String((e && e.text) || '').slice(0, 140)}”${e && e.followUp < today ? h` — due since ${D.fmt(e.followUp, today)}` : ''}.`;
    }
    case 'insurance': {
      const ex = t.insurance && t.insurance.expires;
      return ex < today ? h`${name}’s renter’s insurance ran out on ${D.fmt(ex, today)}. Ask them for the new policy.` : h`${name}’s renter’s insurance runs out ${D.fmt(ex, today)} (${D.rel(ex, today)}).`;
    }
    default: return h`${a.title}: ${a.detail}`;
  }
}
const BUTTON_WORDS = { recordPayment: 'Record a payment', addLateFee: null, openTenant: 'See their page', openTicket: 'Open the repair', followupDone: 'Mark it done', settleDeposit: 'Give back the deposit', renewLease: 'Renew or end the lease', moveOut: 'Finish the move-out' };
const PLAN = { moveout: 'Plan the move-out', movein: 'See their page', insurance: 'See their page' };
function buttonLabel(a) {
  if (a.action.type === 'addLateFee') return a.action.label;
  return (a.action.type === 'openTenant' && PLAN[a.kind]) || BUTTON_WORDS[a.action.type] || a.action.label;
}
function plateFor(S, a) {
  if (a.ticketId) { const k = S.ticket(a.ticketId); return k && k.unit ? ui.plate(k.unit, { property: k.property }) : h`<span class="td-lead-ico">${ui.icon('wrench')}</span>`; }
  const t = a.tenantId && S.tenant(a.tenantId);
  return t ? ui.plate(t.unit, { property: t.property }) : h`<span class="td-lead-ico">${ui.icon('dot')}</span>`;
}
const writeAct = t => !['openTenant', 'openTicket', 'renewLease', 'settleDeposit'].includes(t);
function attRow(S, a, today) {
  const sev = SEV[a.severity] || SEV.low;
  const isPay = a.action.type === 'recordPayment';
  const t = a.tenantId ? S.tenant(a.tenantId) : null;
  const lg = t ? S.ledger(t.id) : null;
  const partLate = isPay && lg && Object.values(lg.months).some(m => m.status === 'late' && m.rentPaid > 0);
  return h`<li class="td-row" data-item="${a.id}">
    <span class="td-lead">${plateFor(S, a)}</span>
    <div class="td-main">
      <p class="td-sentence"><span class="td-sev td-sev-${a.severity}">${ui.icon(sev.icon, { size: 14 })}<span class="vh">${sev.label}: </span></span>${sentence(S, a, today)}</p>
      <div class="td-actions">
        <button type="button" class="btn ${isPay ? 'btn-primary' : 'btn-soft'}" id="td-1-${a.id}" data-act="run" data-which="action" data-id="${a.id}"${writeAct(a.action.type) ? RB.raw(' data-write') : ''}>${buttonLabel(a)}</button>
        ${isPay && !partLate ? h`<button type="button" class="btn-link" id="td-part-${a.id}" data-act="part" data-id="${a.id}" data-write>They paid part of it</button>` : ''}
        ${a.secondary ? h`<button type="button" class="btn-link" id="td-2-${a.id}" data-act="run" data-which="secondary" data-id="${a.id}"${writeAct(a.secondary.type) ? RB.raw(' data-write') : ''}>${a.secondary.type === 'openTenant' ? 'See their page' : a.secondary.label}</button>` : ''}
      </div>
    </div>
  </li>`;
}
function attention(S, att, today) {
  if (!att.length) return h`<div class="sec"><h2 class="sec-title">What needs you</h2></div>${ui.empty({ quiet: true, title: 'Nothing needs you today. Enjoy your day.' })}`;
  const known = new Set(GROUPS.flatMap(g => g.kinds));
  const groups = GROUPS.map(g => ({ g, items: att.filter(a => g.kinds.includes(a.kind) || (g.key === 'follow' && !known.has(a.kind))) })).filter(x => x.items.length);
  return h`<div class="sec"><h2 class="sec-title" id="td-att-t">What needs you</h2><span class="sec-meta">${RB.plural(att.length, 'thing')}, most important first</span></div>
    ${groups.map(({ g, items }) => {
      const open = expanded[g.key] || items.length <= SHOW;
      const shown = open ? items : items.slice(0, SHOW);
      return h`<section class="td-group" aria-labelledby="td-g-${g.key}">
        <h3 class="td-group-label" id="td-g-${g.key}">${g.label} <span class="td-group-n">(${items.length})</span></h3>
        <ul class="td-rows">${shown.map(a => attRow(S, a, today))}</ul>
        ${items.length > SHOW ? h`<button type="button" class="btn td-more" id="td-more-${g.key}" data-act="more" data-g="${g.key}" aria-expanded="${open ? 'true' : 'false'}">${open ? 'Show fewer' : 'Show ' + (items.length - SHOW) + ' more'}</button>` : ''}
      </section>`;
    })}`;
}

// ------------------------------------------------------------------ (3) the month at a glance
function glance(S, today) {
  const period = D.monthKey(today);
  const byProp = new Map();
  for (const t of S.tenantsList({ includePast: false })) {
    const m = (S.ledger(t.id) || { months: {} }).months[period];
    const st = m && m.scheduled ? (m.status === 'late' && m.rentPaid > 0 ? 'partial' : m.status) : 'none';
    if (!byProp.has(t.property)) byProp.set(t.property, []);
    byProp.get(t.property).push({ t, st, m });
  }
  const keys = [['paid', 'Green with a tick = paid'], ['partial', 'Amber = paid part of it'], ['late', 'Red = late'], ['due', 'White = not paid yet']];
  return h`<section class="td-glance" aria-labelledby="td-glance-t">
    <div class="sec"><h2 class="sec-title" id="td-glance-t">${D.monthName(period)} at a glance</h2></div>
    <p class="caption td-glance-cap">Each box is one home, labelled with its unit. Tap a box to see that tenant.</p>
    ${Array.from(byProp.entries()).map(([prop, list]) => h`<div class="td-prop">
      <h3 class="td-prop-label">${prop || 'No property'}</h3>
      <div class="plates td-plates">${list.map(({ t, st, m }) => {
        const label = (t.unit || '—') + ', ' + t.name + ': ' + ui.statusWords(m, today);
        return ui.plate(t.unit, { size: 'lg', status: st, button: true, title: label, attrs: { 'data-act': 'open', 'data-id': t.id, id: 'td-p-' + t.id, 'aria-label': label } });
      })}</div>
    </div>`)}
    <ul class="td-keys" aria-label="What the colours mean">${keys.map(([k, words]) => h`<li class="td-keyitem"><span class="td-keyplate" aria-hidden="true">${ui.plate('', { size: 'lg', status: k })}</span><span>${words}</span></li>`)}</ul>
  </section>`;
}

// ------------------------------------------------------------------ (4) recent activity, in sentences
function events(S, today) {
  const out = [];
  for (const t of S.tenantsList()) {
    const ents = S.entries(t.id) || {};
    for (const id of Object.keys(ents)) {
      const e = ents[id];
      if (!e || e.undone) continue;
      const on = ' on ' + D.fmt(e.date, today);
      let text;
      if (e.type === 'payment') text = h`${t.name} paid <strong>${M.fmt(e.amount)}</strong>${byWord(e.method)}${on}`;
      else if (e.type === 'credit') text = h`You took ${M.fmt(e.amount)} off what ${t.name} owes${e.memo ? h` (${e.memo})` : ''}${on}`;
      else text = e.category === 'late_fee' ? h`You added a ${M.fmt(e.amount)} late fee for ${t.name}${on}` : h`You added a ${M.fmt(e.amount)} charge for ${t.name}${e.memo ? h` (${e.memo})` : ''}${on}`;
      if (e.void) text = h`${text} — removed as a mistake`;
      out.push({ id: 'e-' + id, at: e.createdAt || e.date, t, text, void: !!e.void });
    }
    const log = t.log || {};
    for (const id of Object.keys(log)) {
      const l = log[id];
      if (!l || !l.at) continue;
      const d = String(l.at).slice(0, 10);
      out.push({ id: 'l-' + id, at: l.at, t, quote: true, text: h`You ${KIND_WORD[l.kind] || 'wrote a note about'} ${t.name} on ${D.fmt(d, today)}: “${String(l.text || '').slice(0, 90)}${String(l.text || '').length > 90 ? '…' : ''}”` });
    }
  }
  out.sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
  return out.slice(0, 8);
}
function activity(S, today) {
  const list = events(S, today);
  return h`<section class="td-activity" aria-labelledby="td-act-t">
    <div class="sec"><h2 class="sec-title" id="td-act-t">What happened lately</h2></div>
    ${list.length ? h`<ul class="td-events">${list.map(ev => h`<li><button type="button" class="td-ev${ev.void ? ' is-void' : ''}" id="td-ev-${ev.id}" data-act="open" data-id="${ev.t.id}">
      ${ui.plate(ev.t.unit)}<span class="td-ev-text">${ev.text}${ev.quote ? '' : '.'}</span>${ui.icon('chevron-right', { cls: 'td-ev-chev' })}
    </button></li>`)}</ul>` : ui.empty({ quiet: true, title: 'Nothing yet. Payments and notes you record will show here.' })}
  </section>`;
}

RB.views.register('today', {
  title: 'Today',
  render(el, ctx) {
    const S = ctx.store;
    const att = S.attention();
    const byId = new Map(att.map(a => [a.id, a]));
    el.innerHTML = String(h`<div class="td">
      ${tasks()}
      ${collection(S, ctx.today)}
      <div class="td-attention">${attention(S, att, ctx.today)}</div>
      ${glance(S, ctx.today)}
      ${activity(S, ctx.today)}
    </div>`);
    ui.bind(el, {
      task: b => runTask(b.dataset.task),
      run: b => { const a = byId.get(b.dataset.id); if (a) RB.actions.run(a[b.dataset.which]); },
      part: b => { const a = byId.get(b.dataset.id); if (a && a.tenantId) RB.actions.recordPayment(a.tenantId, { part: true }); },
      more: b => { expanded[b.dataset.g] = !expanded[b.dataset.g]; RB.shell.refresh(); },
      open: b => RB.actions.openTenant(b.dataset.id),
    });
  },
});
})();

RB.shell.start();
RB.store.start();
RB.actions.warmDownloads();
})();
</script>
