/* ---- 00-tokens.css ---- */
/* Design tokens. Every colour lives here; component rules use var(--token) only.

:root {

  --surface: #FFFFFF;
  --sunk: #ECEEF3;
  --ink: #131A26;
  --ink-2: #3D4657;            /* 8.8:1 paper, 9.5 surface, 8.2 sunk */
  --ink-3: #566072;            /* v2: ≥5.4:1 on every ground (5.9 paper, 6.3 surface, 5.5 sunk) */
  --line: #E0E4EB;
  --line-2: #C9CFDA;
  --accent: #2440B8;           /* 7.8 paper, 8.4 surface; white on it 8.4 */
  --accent-ink: #FFFFFF;
  --accent-soft: #E7EBFA;
  --ok: #17663F;
  --ok-soft: #E2F2E9;
  --warn: #835005;
  --warn-soft: #FAEFD9;
  --bad: #A3302A;
  --bad-soft: #FAE6E4;

  /* derived (still tokens: no literal colours outside this file) */
  --hover: #EEF0F5;            /* row / ghost-button hover */
  --accent-line: #B7C3F1;      /* border of accent-soft things */
  --accent-hover: #1C3399;
  --ok-line: #A8D4BB;
  --warn-line: #E6C78C;
  --bad-line: #EBB3AD;
  --bad-ink: #FFFFFF;          /* text on solid --bad */
  --faint: #D5DAE3;            /* empty strip dots, skeletons */
  --scrim: rgba(19, 26, 38, .28);
  --toast-bg: #131A26;
  --toast-ink: #EEF1F6;
  --toast-accent: #A9B8FF;
  --toast-hover: rgba(255, 255, 255, .12);
  --shadow-float: 0 1px 2px rgba(19, 26, 38, .06), 0 10px 28px rgba(19, 26, 38, .12);
  --shadow-modal: 0 2px 6px rgba(19, 26, 38, .08), 0 24px 60px rgba(19, 26, 38, .22);
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 5px var(--accent);
  color-scheme: light;
}

/* Sizes. Declared on :root and on any .text-scope element so a subtree can use its own --text-scale (the kit shows
   all three sizes side by side that way). */
:root, .text-scope {
  /* type: every size multiplies by --text-scale (Text size control: 1 / 1.12 / 1.25 on the root element, data-text="…").
     Token names are historical; values were raised in v2 so nothing a person reads is under 14px. */

  --f-display: "Newsreader", "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --t-12: calc(14px * var(--text-scale));     /* smallest readable: hints, captions, pills */
  --t-13: calc(15px * var(--text-scale));     /* secondary lines */
  --t-15: calc(17px * var(--text-scale));     /* emphasis, buttons */
  --t-18: calc(20px * var(--text-scale));     /* section titles */
  --t-24: calc(27px * var(--text-scale));     /* view titles */
  --t-34: calc(38px * var(--text-scale));     /* large sums */
  --t-body: calc(16px * var(--text-scale));
  --t-micro: calc(14px * var(--text-scale));  /* uppercase labels (sparingly) */
  --lh: 1.5;

  /* space, radius, sizes (all scale with text) */
  --s1: calc(4px * var(--text-scale)); --s2: calc(8px * var(--text-scale)); --s3: calc(12px * var(--text-scale));
  --s4: calc(16px * var(--text-scale)); --s5: calc(24px * var(--text-scale)); --s6: calc(32px * var(--text-scale)); --s7: calc(48px * var(--text-scale));
  --r-ctl: 8px;
  --r-panel: 12px;
  --r-plate: 3px;
  --rail-w: calc(236px * var(--text-scale));
  --top-h: calc(64px * var(--text-scale));
  --tab-h: calc(68px * var(--text-scale));
  --ctl-h: calc(44px * var(--text-scale));     /* ≥40 desktop */
  --ctl-h-sm: calc(40px * var(--text-scale));
  --ctl-h-lg: calc(52px * var(--text-scale));
  --ctl-h-xl: calc(64px * var(--text-scale));  /* task buttons on Today */
  --row-h: calc(56px * var(--text-scale));     /* ≥52 */
  --gutter: 32px;
  --icon: calc(18px * var(--text-scale));
  --sticky-top: calc(env(safe-area-inset-top, 0px) + var(--top-h));

/* ---- 10-base.css ---- */
/* Base: element defaults, typography, utilities. */
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: var(--t-body);
  line-height: var(--lh);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, p, dl, dd, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
svg { display: block; flex: none; }
svg.ico { width: var(--icon); height: var(--icon); }
/* Plain sentences used across views: "Owes $1,550 for November — 22 days late". */
.say { font-size: var(--t-15); line-height: 1.45; color: var(--ink); }
.say-sub { font-size: var(--t-13); color: var(--ink-2); line-height: 1.45; }
.caption { font-size: var(--t-12); color: var(--ink-2); line-height: 1.45; }
table { border-collapse: separate; border-spacing: 0; }
::selection { background: var(--accent-soft); color: var(--ink); }
hr { border: 0; border-top: 1px solid var(--line); margin: var(--s4) 0; }

:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }

/* ---- type ---- */
.display { font-family: var(--f-display); font-optical-sizing: auto; font-weight: 400; letter-spacing: -0.005em; }
.t-12 { font-size: var(--t-12); }
.t-13 { font-size: var(--t-13); }
.t-15 { font-size: var(--t-15); }
.t-18 { font-size: var(--t-18); }
.t-24 { font-size: var(--t-24); line-height: 1.25; }
.t-34 { font-size: var(--t-34); line-height: 1.1; }
.h-view { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); font-weight: 500; line-height: 1.2; }
.micro {
  font-size: var(--t-micro); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2);
}
.mono { font-family: var(--f-mono); font-size: .93em; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.strong { font-weight: 600; }
.medium { font-weight: 500; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }   /* decoration only; anything meaningful uses .muted (ink-2) */
.tone-ok { color: var(--ok); }
.tone-warn { color: var(--warn); }
.tone-bad { color: var(--bad); }
.tone-accent { color: var(--accent); }

/* ---- layout utilities ---- */
.row { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.row-wrap { flex-wrap: wrap; }
.row-top { align-items: flex-start; }
.row-base { align-items: baseline; }
.gap-1 { gap: var(--s1); } .gap-3 { gap: var(--s3); } .gap-4 { gap: var(--s4); } .gap-5 { gap: var(--s5); }
.stack { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.stack-1 { gap: var(--s1); } .stack-3 { gap: var(--s3); } .stack-4 { gap: var(--s4); } .stack-5 { gap: var(--s5); } .stack-6 { gap: var(--s6); }
.spacer { flex: 1 1 auto; }
.grow { flex: 1 1 auto; min-width: 0; }
.mt-2 { margin-top: var(--s2); } .mt-4 { margin-top: var(--s4); } .mt-5 { margin-top: var(--s5); } .mt-6 { margin-top: var(--s6); }
.mb-2 { margin-bottom: var(--s2); } .mb-4 { margin-bottom: var(--s4); }
.vh {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
  clip-path: inset(50%); white-space: nowrap; margin: -1px; padding: 0; border: 0;
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); }
.rule { border-top: 1px solid var(--line); }

@media (max-width: 759.98px) { .hide-phone { display: none !important; } }
@media (min-width: 760px) { .show-phone { display: none !important; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}
/* ---- 20-components.css ---- */
/* Component library. See docs/CONTRACT.md §CSS for markup of each component. */

/* ================= Buttons ================= */
.btn {
  --btn-h: var(--ctl-h);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--btn-h); min-width: var(--btn-h); padding: 0 calc(16px * var(--text-scale));
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  background: var(--surface); color: var(--ink);
  font-size: var(--t-15); font-weight: 500; line-height: 1.2; white-space: nowrap;
  text-decoration: none; user-select: none; -webkit-user-select: none;
  transition: background-color 120ms, border-color 120ms, color 120ms;
}
.btn:hover { background: var(--hover); text-decoration: none; }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.btn[aria-busy="true"] { opacity: .7; pointer-events: none; }
.btn svg { width: var(--icon); height: var(--icon); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn-soft:hover { background: var(--accent-soft); border-color: var(--accent-line); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn-ghost:hover { background: var(--hover); color: var(--accent-hover); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.btn-danger:hover { background: var(--bad); border-color: var(--bad); filter: brightness(.94); }
.btn-danger-soft { background: var(--surface); border-color: var(--bad-line); color: var(--bad); }
.btn-danger-soft:hover { background: var(--bad-soft); }
/* .btn-icon: kept for compatibility. v2 helpers never render icon-only buttons; a .btn-icon that also has a
   visible label (.btn-label) gets normal padding. */
.btn-icon { padding: 0; width: var(--btn-h); }
.btn-icon:has(.btn-label), .btn-worded { width: auto; padding: 0 calc(12px * var(--text-scale)); }
.btn-sm { --btn-h: var(--ctl-h-sm); padding: 0 calc(12px * var(--text-scale)); font-size: var(--t-13); }
.btn-sm.btn-icon { padding: 0; }
.btn-lg { --btn-h: var(--ctl-h-lg); padding: 0 calc(22px * var(--text-scale)); font-size: var(--t-15); font-weight: 600; }
.btn-xl { --btn-h: var(--ctl-h-xl); padding: 0 calc(24px * var(--text-scale)); font-size: calc(18px * var(--text-scale)); font-weight: 600; }
.btn-block { width: 100%; }
.btn .btn-sub { font-weight: 400; opacity: .75; }
/* split button: [Mark paid][▾] */
.btn-group { display: inline-flex; }
.btn-group > .btn:not(:last-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.btn-group > .btn:not(:first-child) { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; }
.btn-group > .btn-primary + .btn-primary { border-left-color: var(--accent-hover); }
.btn-group > .btn-caret { width: var(--btn-h); min-width: var(--btn-h); padding: 0; }
.btn-group > .btn:focus-visible { position: relative; z-index: 1; }
/* text-only link button */
.linkbtn {
  display: inline; padding: 0; border: 0; background: none; color: var(--accent);
  font: inherit; font-weight: 500; text-decoration: none; cursor: pointer;
}
.linkbtn:hover { text-decoration: underline; text-underline-offset: 2px; }
.linkbtn-muted { color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
/* worded quiet action that still meets the touch-size rule: a link-looking button with a real hit area */
.btn-link { --btn-h: var(--ctl-h-sm); display: inline-flex; align-items: center; min-height: var(--btn-h); padding: 0 calc(4px * var(--text-scale)); border: 0; background: none; color: var(--accent); font: inherit; font-size: var(--t-13); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent-line); cursor: pointer; }
.btn-link:hover { color: var(--accent-hover); text-decoration-color: currentColor; }
.btn-link:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 4px; }

/* ================= Inputs ================= */
.input {
  display: block; width: 100%; height: var(--ctl-h); padding: 0 calc(12px * var(--text-scale));
  background: var(--sunk); color: var(--ink);
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  font-size: var(--t-15); font-variant-numeric: tabular-nums;
  transition: border-color 120ms, background-color 120ms, box-shadow 120ms;
  -webkit-appearance: none; appearance: none;
}
.input::placeholder { color: var(--ink-3); opacity: 1; }
.input:hover { border-color: var(--ink-3); }
.input:focus, .input:focus-visible { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft); outline: none; }
.input:disabled, .input[readonly] { opacity: .6; }
textarea.input, .textarea { height: auto; min-height: calc(96px * var(--text-scale)); padding: 10px 12px; line-height: 1.5; resize: vertical; }
input[type="date"].input { min-width: 0; }
input[type="date"].input::-webkit-calendar-picker-indicator { opacity: .6; cursor: pointer; }
input[type="search"].input::-webkit-search-cancel-button { -webkit-appearance: none; }
input.input-num { text-align: right; }
@media (max-width: 759.98px) { .input { font-size: max(16px, var(--t-15)); } }

/* select: <span class="select"><select class="input">…</select></span> */
.select { position: relative; display: block; min-width: 0; }
.select > select.input { padding-right: 30px; cursor: pointer; }
.select::after {
  content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
  border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(45deg); pointer-events: none;
}
.select-inline { display: inline-block; }

/* money: <span class="money-input"><span class="money-sym">$</span><input class="input" inputmode="decimal"></span> */
.money-input { position: relative; display: block; }
.money-input > .money-sym {
  position: absolute; left: 10px; top: 0; bottom: 0; display: flex; align-items: center;
  color: var(--ink-2); pointer-events: none; font-size: var(--t-15);
}
.money-input > .input { padding-left: calc(28px * var(--text-scale)); text-align: left; font-variant-numeric: tabular-nums; }
.money-input-lg > .input { height: var(--ctl-h-lg); font-size: calc(22px * var(--text-scale)); font-weight: 500; }
.money-input-lg > .money-sym { font-size: calc(20px * var(--text-scale)); left: 14px; }

/* checkbox / radio */
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: calc(22px * var(--text-scale)); height: calc(22px * var(--text-scale)); margin: 0; flex: none; }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; min-height: var(--ctl-h-sm); }

/* search field with icon */
.search { position: relative; display: block; min-width: 0; }
.search > .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search > .input { padding-left: calc(40px * var(--text-scale)); padding-right: 12px; }
.search > .search-kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.search > .input:focus ~ .search-kbd { display: none; }

/* ================= Fields & forms ================= */
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
/* labels are questions ("How much did they pay?"): ink, full size */
.field-label { font-size: var(--t-15); font-weight: 600; color: var(--ink); line-height: 1.35; }
.field-label .opt { font-weight: 400; color: var(--ink-2); font-size: var(--t-13); }
.field-hint { font-size: var(--t-12); color: var(--ink-2); }
.field-error { font-size: var(--t-13); color: var(--bad); font-weight: 600; }
.field-error:empty { display: none; }
.field.is-invalid .input { border-color: var(--bad); }
.field.is-invalid .input:focus { box-shadow: 0 0 0 3px var(--bad-soft); }
.field-inline { flex-direction: row; align-items: center; gap: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s5) var(--s4); }
/* v2 default for task forms: one column, one question at a time */
.form-col { display: flex; flex-direction: column; gap: var(--s5); }
.form-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid > .span-2, .form-grid > .span-all { grid-column: 1 / -1; }
.fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.fieldset + .fieldset { margin-top: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--line); }
.fieldset-title { display: block; float: left; width: 100%; margin-bottom: var(--s3); padding: 0; /* float: keeps the legend off the fieldset's top rule */ font-size: var(--t-15); font-weight: 600; color: var(--ink); font-family: var(--f-display); font-optical-sizing: auto; }
.fieldset-title + * { clear: both; }
.form-note { padding: 12px 14px; background: var(--sunk); border-radius: var(--r-ctl); font-size: var(--t-13); color: var(--ink); }
.form-sum { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px solid var(--line); font-size: var(--t-15); }
.form-sum strong { font-weight: 600; }
@media (max-width: 759.98px) {
  .form-grid, .form-grid-3 { grid-template-columns: minmax(0, 1fr); }
}

/* ================= Segmented control ================= */
.seg { align-self: flex-start; display: inline-flex; padding: 2px; gap: 2px; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-ctl); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg > button {
  display: inline-flex; align-items: center; gap: 6px; min-height: calc(var(--ctl-h) - 6px); padding: 0 calc(14px * var(--text-scale));
  border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink-2);
  font-size: var(--t-13); font-weight: 500; white-space: nowrap;
}
.seg > button:hover { color: var(--ink); }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"] { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.seg > button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent); }

/* ================= Filter chips ================= */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: var(--ctl-h-sm); padding: 0 calc(16px * var(--text-scale));
  border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); color: var(--ink);
  font-size: var(--t-13); font-weight: 500; white-space: nowrap;
}
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.chip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.chip-count { color: var(--ink-2); font-weight: 400; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .chip-count { color: var(--accent); }
.chip-count.is-bad { color: var(--bad); font-weight: 600; }
@media (max-width: 759.98px) {
  .chips-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); }
  .chips-scroll::-webkit-scrollbar { display: none; }
}

/* ================= Status pill ================= */
.pill {
  display: inline-flex; align-items: center; gap: 6px; min-height: calc(28px * var(--text-scale)); padding: 2px 10px 2px 8px;
  border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); color: var(--ink-2);
  font-size: var(--t-12); font-weight: 600; line-height: 1.2; white-space: nowrap; vertical-align: middle;
}
.pill svg { width: calc(14px * var(--text-scale)); height: calc(14px * var(--text-scale)); }
.pill-paid { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.pill-paid_late { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.pill-paid_late .pill-tick { color: var(--warn); }
.pill-partial { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.pill-due { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
/* part paid, rest past grace: warn tint with the late triangle — never just "Late" when money came in */
.pill-partial_late { background: var(--warn-soft); border-color: var(--bad-line); color: var(--bad); }
.pill-late { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.pill-none { background: transparent; border-color: transparent; color: var(--ink-2); padding-left: 2px; }
.pill-sm { min-height: calc(26px * var(--text-scale)); font-size: var(--t-12); padding: 1px 9px 1px 7px; }
/* generic tag (tenant/ticket status, priority): same shape, tones */
.tag {
  display: inline-flex; align-items: center; gap: 6px; min-height: calc(26px * var(--text-scale)); padding: 1px 9px;
  border: 1px solid var(--line-2); border-radius: 5px; color: var(--ink-2); background: var(--surface);
  font-size: var(--t-12); font-weight: 600; white-space: nowrap; vertical-align: middle;
}
.tag svg { width: calc(14px * var(--text-scale)); height: calc(14px * var(--text-scale)); }
.tag-accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.tag-ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.tag-warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.tag-bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.tag-quiet { border-color: transparent; background: var(--sunk); }

/* ================= Door plate ================= */
.plate {
  display: inline-flex; align-items: center; justify-content: center; position: relative;
  min-width: calc(44px * var(--text-scale)); height: calc(30px * var(--text-scale)); padding: 0 8px;
  border: 1px solid var(--ink-3); border-radius: var(--r-plate); background: var(--surface); color: var(--ink);
  font-family: var(--f-mono); font-size: var(--t-12); font-weight: 500; line-height: 1; letter-spacing: .01em;
  white-space: nowrap; vertical-align: middle; font-variant-numeric: tabular-nums;
}
.plate-sm.plate-late, .plate-sm.plate-partial { border-color: currentColor; }
.plate-sm.plate-late { color: var(--bad); }
.plate-sm.plate-partial { color: var(--warn); }
.plate-sm.plate-none { color: var(--ink-2); border-style: dashed; }
.plate-lg {
  min-width: calc(60px * var(--text-scale)); height: calc(52px * var(--text-scale)); padding: 0 10px; font-size: var(--t-13); border-width: 1px;
  flex-direction: column; gap: 1px;
}
.plate-lg .plate-unit { line-height: 1; }
.plate-lg .plate-glyph { position: absolute; top: 3px; right: 3px; width: 12px; height: 12px; }
.plate-lg .plate-glyph svg { width: 12px; height: 12px; }
.plate-lg.plate-paid { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.plate-lg.plate-paid_late { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.plate-lg.plate-paid_late .plate-glyph { color: var(--warn); }
.plate-lg.plate-partial { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.plate-lg.plate-due { background: var(--surface); border-color: var(--ink-3); color: var(--ink); }
.plate-lg.plate-late { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.plate-lg.plate-none { background: var(--sunk); border-color: var(--line-2); border-style: dashed; color: var(--ink-2); }
button.plate { cursor: pointer; }
button.plate:hover { filter: brightness(.97); border-color: var(--ink-3); }
button.plate:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.plates { display: flex; flex-wrap: wrap; gap: 8px; }
.plate-fixed { min-width: calc(60px * var(--text-scale)); } /* equal-width plates in table columns */
.stack > .plate, .stack > .pill, .stack > .tag, .stack > .seg, .stack > .chip { align-self: flex-start; }

/* ================= Payment strip (12 months) ================= */
.pstrip { display: inline-flex; align-items: center; gap: 2px; height: 16px; vertical-align: middle; }
.pc { position: relative; display: block; width: 7px; height: 14px; border-radius: 1px; background: transparent; flex: none; }
.pc-paid { background: var(--ok); }
.pc-paid_late { background: var(--ok); }
.pc-paid_late::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--warn); border-radius: 1px 1px 0 0; }
.pc-partial { box-shadow: inset 0 0 0 1px var(--warn); }
.pc-partial::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: var(--warn); }
.pc-late { background: var(--bad); }
.pc-due { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.pc-none::after { content: ""; position: absolute; left: 2px; top: 5px; width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
.pstrip-lg .pc { width: 10px; height: 20px; }
.pstrip-lg { height: 22px; gap: 3px; }
.pstrip-lg .pc-partial::after { height: 10px; }
.pstrip-lg .pc-none::after { left: 3px; top: 8px; width: 4px; height: 4px; }

/* ================= Money ================= */
.money { white-space: nowrap; font-variant-numeric: tabular-nums; }
.money .cur { color: var(--ink-2); font-weight: 400; margin-right: .04em; }
.money-lg { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-34); font-weight: 400; line-height: 1.05; letter-spacing: -0.01em; }
.money-lg .cur { font-size: .62em; vertical-align: .42em; margin-right: .06em; }
.money-md { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); line-height: 1.1; }
.money-md .cur { font-size: .7em; vertical-align: .25em; }
.amt-owed { color: var(--bad); }
.amt-credit { color: var(--ok); }
.amt-credit .cr { font-size: .85em; margin-left: 2px; }
.amt-zero { color: var(--ink-2); }
/* worded balance (ui.balance): "Owes $1,225" / "All paid up" / "$250 paid ahead" */
.bal { white-space: nowrap; font-weight: 500; }
.bal-owed { color: var(--bad); }
.bal-ahead { color: var(--ok); }
.bal-zero { color: var(--ink-2); font-weight: 400; }

/* ================= Data table ================= */
/* Header cells stick under the top bar (--sticky-top). Inside anything that scrolls on its own (.tbl-scroll, sheets,
   drawers) they stick to that container's top instead: those set --tbl-sticky-top: 0px. Cells are positioned so a
   visually-hidden (.vh, position:absolute) label inside a scrolled table is clipped with it, never widening the page. */
.tbl-wrap { position: relative; min-width: 0; }
.tbl-scroll { position: relative; min-width: 0; overflow: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; --tbl-sticky-top: 0px; }
@media (max-width: 759.98px) { .tbl-scroll-phone { position: relative; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; --tbl-sticky-top: 0px; } }
.sheet-body, .drawer-body, .popover, .palette-list { --tbl-sticky-top: 0px; }
.tbl { width: 100%; font-size: var(--t-body); }
.tbl th, .tbl td { position: relative; padding: 8px 14px; height: var(--row-h); border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl th:first-child, .tbl td:first-child { padding-left: 16px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 16px; }
.tbl thead th {
  position: sticky; top: var(--tbl-sticky-top, var(--sticky-top)); z-index: 2; height: calc(44px * var(--text-scale));
  background: var(--sunk); color: var(--ink-2); border-bottom: 1px solid var(--line-2);
  font-size: var(--t-13); font-weight: 600; white-space: nowrap;
}
.tbl thead th:first-child { border-top-left-radius: var(--r-ctl); }
.tbl thead th:last-child { border-top-right-radius: var(--r-ctl); }
.tbl .num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.shrink, .tbl th.shrink { width: 1%; white-space: nowrap; }
.tbl tbody tr { transition: background-color 80ms; }
.tbl tbody tr:hover td { background: var(--hover); }
.tbl tbody tr.is-link { cursor: pointer; }
.tbl tbody tr.is-selected td { background: var(--accent-soft); }
.tbl tbody tr.is-focused td { background: var(--hover); box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
.tbl tbody tr.is-focused td:first-child { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent), inset 1px 0 0 var(--accent); }
.tbl tbody tr.is-focused td:last-child { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent), inset -1px 0 0 var(--accent); }
.tbl tbody tr.is-muted td { color: var(--ink-2); }
.tbl tfoot td { height: var(--row-h); border-bottom: 0; border-top: 1px solid var(--line-2); font-weight: 600; background: transparent; }
.tbl .cell-name { font-weight: 500; color: var(--ink); }
.tbl .cell-sub { display: block; font-size: var(--t-13); color: var(--ink-2); font-weight: 400; }
.tbl-check { width: calc(52px * var(--text-scale)); }
.tbl-group td { height: calc(44px * var(--text-scale)); background: var(--paper); font-size: var(--t-13); font-weight: 600; color: var(--ink); }
/* .tbl-compact: removed in v2 (rows stay ≥52px). Kept as a harmless no-op class so older markup still works. */
.tbl-compact {}
/* sortable header: <th aria-sort="ascending"><button class="th-sort">Rent<svg/></button></th> */
.th-sort {
  display: inline-flex; align-items: center; gap: 4px; margin: 0 -6px; padding: 4px 6px; border: 0; border-radius: 4px;
  background: none; color: inherit; font: inherit; white-space: nowrap;
}
.th-sort:hover { color: var(--ink); background: var(--line); }
.th-sort .sort-ind { opacity: 0; width: 12px; height: 12px; transition: transform 120ms; }
.th-sort:hover .sort-ind { opacity: .5; }
th[aria-sort="ascending"] .th-sort, th[aria-sort="descending"] .th-sort { color: var(--ink); }
th[aria-sort="ascending"] .sort-ind, th[aria-sort="descending"] .sort-ind { opacity: 1; }
th[aria-sort="descending"] .sort-ind { transform: rotate(180deg); }
th.num .th-sort { flex-direction: row-reverse; }

/* ================= Phone card list (table-row equivalent) ================= */
.clist { border-top: 1px solid var(--line); }
.crow {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 14px; row-gap: 12px; align-items: center;
  padding: 16px 0; border-bottom: 1px solid var(--line); min-height: calc(72px * var(--text-scale));
}
.crow.is-link { cursor: pointer; }
.crow.is-selected { background: var(--accent-soft); margin: 0 calc(-1 * var(--gutter)); padding-left: var(--gutter); padding-right: var(--gutter); }
.crow-lead { grid-column: 1; align-self: start; padding-top: 1px; }
.crow-main { grid-column: 2; min-width: 0; }
.crow-title { font-weight: 600; font-size: var(--t-15); overflow-wrap: anywhere; }
.crow-sub { font-size: var(--t-13); color: var(--ink-2); overflow-wrap: anywhere; margin-top: 2px; }
.crow-aside { grid-column: 3; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.crow-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.crow-actions .btn { flex: 1 1 auto; }
.crow-actions .btn-group { flex: 1 1 auto; display: flex; }
.crow-actions .btn-group > .btn-caret { flex: none; width: var(--btn-h); }

/* ================= Ledger ================= */
.ledger { width: 100%; font-size: var(--t-body); }
.ledger th, .ledger td { padding: 6px 10px; height: calc(52px * var(--text-scale)); border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ledger th:first-child, .ledger td:first-child { padding-left: 0; }
.ledger th:last-child, .ledger td:last-child { padding-right: 0; }
.ledger thead th { height: calc(40px * var(--text-scale)); color: var(--ink-2); font-size: var(--t-13); font-weight: 600; border-bottom: 1px solid var(--line-2); }
.ledger .l-date { width: calc(76px * var(--text-scale)); font-family: var(--f-mono); font-size: var(--t-12); color: var(--ink-2); white-space: nowrap; }
.ledger .l-desc { min-width: 0; }
.ledger .l-sub { display: block; font-size: var(--t-12); color: var(--ink-2); line-height: 1.35; }
.ledger .l-amt, .ledger .l-bal { text-align: right; width: 1%; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ledger .l-bal { font-weight: 500; }
.ledger .l-pay { color: var(--ok); }
.ledger .l-act { width: 1%; padding-left: 4px; }
.ledger-month td {
  height: calc(40px * var(--text-scale)); padding-top: 12px; vertical-align: bottom; color: var(--ink-2); background: transparent;
  font-variant-caps: all-small-caps; letter-spacing: .06em; font-size: var(--t-15); font-weight: 600; border-bottom: 1px solid var(--line-2);
}
.ledger tr.is-void td { color: var(--ink-2); }
.ledger tr.is-void .l-desc-text, .ledger tr.is-void .l-amt { text-decoration: line-through; text-decoration-color: var(--ink-3); }
.ledger tbody tr:not(.ledger-month):hover td { background: var(--hover); }
@media (max-width: 759.98px) {
  .ledger { font-size: var(--t-13); }
  .ledger .l-date { width: calc(56px * var(--text-scale)); font-size: var(--t-12); }
  .ledger th, .ledger td { padding: 6px 4px; }
  .ledger thead th { font-size: var(--t-12); }
}

/* ================= Section header ================= */
.sec { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: var(--s7) 0 var(--s4); }
.sec:first-child { margin-top: 0; }
.sec-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; line-height: 1.25; color: var(--ink); }
.sec-meta { color: var(--ink-2); font-size: var(--t-13); }
.sec-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.sec-sm .sec-title { font-family: var(--f-ui); font-size: var(--t-13); font-weight: 600; color: var(--ink-2); }

/* ================= Key / value rows ================= */
.kv { display: grid; grid-template-columns: minmax(110px, 34%) minmax(0, 1fr); }
.kv > dt, .kv > dd { padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv > dt { color: var(--ink-2); font-size: var(--t-13); padding-top: 13px; padding-right: 12px; }
.kv > dd { overflow-wrap: anywhere; }
.kv > dt:first-of-type, .kv > dt:first-of-type + dd { border-top: 1px solid var(--line); }
.kv-plain > dt, .kv-plain > dd { border: 0 !important; padding: 4px 0; }
.kv-plain > dt { padding-top: 6px; }

/* copyable value: <span class="copyline"><span class="copyline-text">…</span><button class="btn btn-ghost btn-icon btn-sm">copy</button></span> */
.copyline { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; flex-wrap: wrap; }
.copyline-text { user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }

/* ================= Empty state & first run ================= */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 24px; color: var(--ink-2); }
.empty-icon { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: var(--r-panel); color: var(--ink-3); margin-bottom: 4px; }
.empty-icon svg { width: 20px; height: 20px; }
.empty-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; color: var(--ink); }
.empty-body { max-width: 46ch; font-size: var(--t-15); }
.empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
.empty-quiet { padding: 20px 0; align-items: flex-start; text-align: left; color: var(--ink-2); font-size: var(--t-15); }

.firstrun { max-width: 640px; margin: 24px auto 0; }
.firstrun-head { padding-bottom: var(--s5); }
.firstrun-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-34); font-weight: 400; line-height: 1.1; letter-spacing: -0.01em; }
.firstrun-lede { margin-top: 12px; color: var(--ink-2); font-size: var(--t-15); max-width: 52ch; }
.firstrun-opts { border-top: 1px solid var(--line-2); }
.firstrun-opt {
  display: grid; grid-template-columns: calc(48px * var(--text-scale)) minmax(0, 1fr) auto; gap: 16px; align-items: center; width: 100%;
  padding: 20px 8px; min-height: calc(80px * var(--text-scale)); border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; color: var(--ink);
}
.firstrun-opt:hover { background: var(--hover); }
.firstrun-opt:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.firstrun-ico { width: calc(48px * var(--text-scale)); height: calc(48px * var(--text-scale)); display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: var(--r-plate); color: var(--accent); font-family: var(--f-mono); }
.firstrun-opt-title { font-weight: 600; font-size: calc(18px * var(--text-scale)); }
.firstrun-opt-sub { color: var(--ink-2); font-size: var(--t-13); margin-top: 2px; }
.firstrun-opt .chev { color: var(--ink-2); }

/* ================= Skeleton ================= */
.skel { display: block; background: var(--sunk); border-radius: 3px; animation: rb-pulse 1.4s ease-in-out infinite; }
.skel-line { height: 10px; margin: 10px 0; }
.skel-title { height: 22px; width: 40%; margin: 4px 0 18px; }
.skel-row { display: flex; align-items: center; gap: 12px; height: var(--row-h); border-bottom: 1px solid var(--line); }
.skel-row .skel { height: 10px; }
.skel-plate { width: 34px; height: 22px !important; }
.loading-note { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: var(--t-13); padding: 8px 0 16px; }
@keyframes rb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* ================= Progress / bullet bar ================= */
.bar { position: relative; display: flex; height: 8px; background: var(--sunk); border-radius: 2px; overflow: visible; }
.bar-seg { height: 100%; background: var(--accent); flex: none; }
.bar-seg:first-child { border-radius: 2px 0 0 2px; }
.bar-seg-ok { background: var(--ok); }
.bar-seg-warn { background: var(--warn); }
.bar-seg-bad { background: var(--bad); }
.bar-seg-soft { background: var(--line-2); }
.bar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.bar-lg { height: 14px; }
.bar-lg .bar-mark { top: -5px; bottom: -5px; }
.bar-thin { height: 4px; }
.bar-thin .bar-mark { top: -3px; bottom: -3px; width: 2px; }
.bar-legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; font-size: var(--t-13); color: var(--ink); }
.bar-key { display: inline-flex; align-items: center; gap: 8px; }
.bar-key::before { content: ""; width: 12px; height: 12px; border-radius: 1px; background: var(--key, var(--accent)); }
.bar-key-ok { --key: var(--ok); } .bar-key-warn { --key: var(--warn); } .bar-key-bad { --key: var(--bad); } .bar-key-soft { --key: var(--line-2); }

/* ================= Kbd ================= */
.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--ink-2);
  font-family: var(--f-mono); font-size: var(--t-12); font-weight: 500; line-height: 1; white-space: nowrap;
}

/* ================= Banner strip ================= */
.banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 40px;
  padding: 8px var(--gutter); background: var(--accent-soft); color: var(--ink); border-bottom: 1px solid var(--accent-line);
  font-size: var(--t-13);
}
.banner-text { flex: 1 1 auto; min-width: 0; }
.banner-text strong { font-weight: 600; }
.banner-actions { display: flex; gap: 4px; flex-wrap: wrap; }

.banner-warn { background: var(--warn-soft); border-bottom-color: var(--warn-line); }

/* ================= Floating layers: shared ================= */
.layer { position: relative; z-index: 100; }
.scrim { position: fixed; inset: 0; background: var(--scrim); animation: rb-fade var(--dur) var(--ease); }
@keyframes rb-fade { from { opacity: 0; } }

/* ---- Menu / popover ---- */
.menu {
  position: fixed; z-index: 120; min-width: calc(240px * var(--text-scale)); max-width: min(380px, calc(100vw - 16px)); max-height: min(420px, calc(100vh - 16px)); overflow-y: auto;
  padding: 4px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow-float);
}
.menu-item {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: var(--ctl-h); padding: 8px 12px;
  border: 0; border-radius: 6px; background: none; color: var(--ink); text-align: left; font-size: var(--t-15); text-decoration: none;
}
.menu-item:hover { text-decoration: none; }
.menu-item svg { color: var(--ink-2); width: var(--icon); height: var(--icon); }
.menu-item:hover, .menu-item:focus-visible, .menu-item.is-active { background: var(--hover); outline: none; }
.menu-item:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
.menu-item.is-danger { color: var(--bad); }
.menu-item.is-danger svg { color: var(--bad); }
.menu-item:disabled { opacity: .45; }
.menu-item .menu-hint { margin-left: auto; padding-left: 12px; color: var(--ink-2); font-size: var(--t-12); }
.menu-sep { height: 1px; margin: 4px 6px; background: var(--line); }
.menu-label { padding: 10px 12px 4px; font-size: var(--t-13); font-weight: 600; color: var(--ink-2); }

/* popover: free content in a floating panel, positioned like a menu */
.popover { position: fixed; z-index: 120; max-width: min(360px, calc(100vw - 16px)); padding: 12px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow-float); }

/* ---- Drawer: right side on desktop, full screen on phone ---- */
.drawer {
  position: fixed; z-index: 110; top: 0; right: 0; bottom: 0; width: min(520px, 100vw);
  display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--line-2); box-shadow: var(--shadow-modal);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
  animation: rb-drawer-in 180ms var(--ease);
}
.drawer-scrim { background: var(--scrim); }
.drawer.is-closing { animation: rb-drawer-out 140ms ease-in forwards; }
@keyframes rb-drawer-in { from { transform: translateX(24px); opacity: 0; } }
@keyframes rb-drawer-out { to { transform: translateX(24px); opacity: 0; } }
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 24px 18px; border-bottom: 1px solid var(--line); flex: none; }
.drawer-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); font-weight: 500; line-height: 1.2; min-width: 0; }
.drawer-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 4px 24px 32px; }
.drawer-foot { flex: none; display: flex; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--line); }
.drawer-close { margin-left: auto; flex: none; }
/* the worded close/back control (ui.drawerClose): "Close" on desktop, "Back" on phone full-screen pages */
.drawer-close .close-phone { display: none; }
@media (max-width: 759.98px) { .drawer-close .close-desk { display: none; } .drawer-close .close-phone { display: inline; } .drawer-close { order: -1; margin-left: -8px; margin-right: auto; } }
@media (max-width: 759.98px) {
  .drawer { width: 100vw; border-left: 0; padding-left: env(safe-area-inset-left, 0px); }
  .drawer-head { padding: 12px max(16px, env(safe-area-inset-left, 0px)) 12px; }
  .drawer-body { padding: 4px 16px 32px; }
  .drawer-foot { padding: 10px 16px; }
}

/* ---- Sheet: centred modal on desktop, bottom sheet on phone ---- */
.sheet-wrap { position: fixed; inset: 0; z-index: 115; display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; overflow-y: auto; }
.sheet {
  position: relative; width: 100%; max-width: calc(540px * var(--text-scale)); display: flex; flex-direction: column; max-height: 84vh;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-panel); box-shadow: var(--shadow-modal);
  animation: rb-sheet-in 170ms var(--ease);
}
.sheet-wide { max-width: calc(720px * var(--text-scale)); }
.sheet-xwide { max-width: 960px; }
.sheet.is-closing { animation: rb-sheet-out 130ms ease-in forwards; }
@keyframes rb-sheet-in { from { transform: translateY(10px) scale(.985); opacity: 0; } }
@keyframes rb-sheet-out { to { transform: translateY(8px); opacity: 0; } }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 24px 14px; flex: none; }
.sheet-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); font-weight: 500; line-height: 1.2; }
.sheet-sub { font-size: var(--t-13); color: var(--ink-2); margin-top: 4px; }
.sheet-close { margin: -6px -10px 0 auto; flex: none; }
.sheet-body { flex: 1 1 auto; overflow-y: auto; padding: 6px 24px 24px; min-height: 0; }
.sheet-foot { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--line); flex-wrap: wrap; }
/* the live sentence ("After this, Claire will be all paid up.") */
.sheet-foot .sheet-foot-note { margin-right: auto; color: var(--ink); font-size: var(--t-15); flex: 1 1 100%; }
.sheet-foot .sheet-foot-note:empty { display: none; }
.sheet-foot .btn { min-height: var(--ctl-h-lg); font-size: var(--t-15); padding: 0 calc(22px * var(--text-scale)); }
.sheet-foot .btn-primary, .sheet-foot .btn-danger { font-weight: 600; }
.sheet form { display: contents; }
.sheet-foot.is-empty { display: none; }
.sheet-grabber { display: none; }
@media (max-width: 759.98px) {
  .sheet-wrap { align-items: flex-end; padding: 0; }
  .sheet, .sheet-wide, .sheet-xwide { max-width: none; max-height: 92vh; border-radius: var(--r-panel) var(--r-panel) 0 0; border-bottom: 0; animation-name: rb-sheet-up; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet.is-closing { animation-name: rb-sheet-down; }
  .sheet-grabber { display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 8px auto 0; flex: none; }
  .sheet-head { padding: 10px 16px 10px; }
  .sheet-body { padding: 4px 16px 16px; }
  .sheet-foot { padding: 12px 16px; }
  .sheet-foot .btn { flex: 1 1 auto; }
  .sheet-foot .btn-primary, .sheet-foot .btn-danger { flex-basis: 100%; order: -1; }
  .sheet-foot .sheet-foot-note { order: -2; }
}
@keyframes rb-sheet-up { from { transform: translateY(40px); opacity: 0; } }
@keyframes rb-sheet-down { to { transform: translateY(40px); opacity: 0; } }

/* ---- Toast ---- */
.toasts {
  position: fixed; z-index: 130; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 10px; width: max-content; max-width: min(640px, calc(100vw - 32px)); pointer-events: none;
}
/* large, plain confirmation: stays 10 s, big Undo */
.toast {
  display: flex; align-items: center; gap: 14px; min-height: calc(64px * var(--text-scale)); max-width: 100%; padding: 10px 10px 10px 18px;
  background: var(--toast-bg); color: var(--toast-ink); border-radius: var(--r-panel); box-shadow: var(--shadow-float);
  font-size: var(--t-15); line-height: 1.4; pointer-events: auto; animation: rb-toast-in 170ms var(--ease);
}
.toast.is-closing { animation: rb-toast-out 140ms ease-in forwards; }
.toast-msg { min-width: 0; }
.toast-ico { color: var(--toast-accent); }
.toast-action {
  flex: none; min-height: var(--ctl-h); padding: 0 calc(20px * var(--text-scale)); border: 0; border-radius: var(--r-ctl); background: var(--toast-accent);
  color: var(--toast-bg); font-weight: 700; font-size: var(--t-15);
}
.toast-action:hover { filter: brightness(1.08); }
.toast-action:focus-visible { outline: 3px solid var(--toast-ink); outline-offset: 2px; }
.toast-x { flex: none; min-height: var(--ctl-h); padding: 0 12px; display: inline-flex; align-items: center; border: 0; background: none; color: var(--toast-ink); border-radius: var(--r-ctl); font-size: var(--t-13); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.toast-x:hover { background: var(--toast-hover); }
.toast-x:focus-visible { outline: 3px solid var(--toast-accent); outline-offset: 0; }
.toast-bad .toast-ico { color: var(--bad); }
@keyframes rb-toast-in { from { transform: translateY(8px); opacity: 0; } }
@keyframes rb-toast-out { to { transform: translateY(6px); opacity: 0; } }
@media (max-width: 759.98px) {
  .toasts { bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom, 0px)); width: calc(100vw - 24px); }
  .toast { width: 100%; flex-wrap: wrap; }
  .toast-msg { flex: 1 1 60%; }
}

/* ---- Command palette ---- */
.palette-wrap { position: fixed; inset: 0; z-index: 125; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
.palette {
  position: relative; width: 100%; max-width: 600px; display: flex; flex-direction: column; max-height: 70vh;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-panel); box-shadow: var(--shadow-modal);
  animation: rb-sheet-in 150ms var(--ease); overflow: hidden;
}
.palette-head { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); flex: none; }
.palette-head svg { color: var(--ink-2); }
.palette-input { flex: 1 1 auto; height: calc(60px * var(--text-scale)); border: 0; background: none; font-size: calc(18px * var(--text-scale)); color: var(--ink); min-width: 0; }
.palette-input:focus { outline: none; }
.palette-input::placeholder { color: var(--ink-2); }
.palette-list { overflow-y: auto; padding: 6px; flex: 1 1 auto; }
.palette-group { padding: 12px 12px 4px; font-size: var(--t-13); font-weight: 600; color: var(--ink-2); }
.palette-item {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: var(--ctl-h-lg); padding: 8px 12px;
  border: 0; border-radius: 6px; background: none; text-align: left; color: var(--ink); font-size: var(--t-15);
}
.palette-item > svg { color: var(--ink-2); }
.palette-item[aria-selected="true"] { background: var(--accent-soft); }
.palette-item[aria-selected="true"] > svg { color: var(--accent); }
.palette-item-main { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-item-sub { color: var(--ink-2); margin-left: 6px; font-size: var(--t-13); }
.palette-item-hint { flex: none; color: var(--ink-2); font-size: var(--t-13); }
.palette-empty { padding: 24px 12px; color: var(--ink-2); text-align: center; }
.palette-foot { display: flex; justify-content: flex-end; gap: 14px; padding: 8px 10px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: var(--t-12); flex: none; }
.palette-foot .kbd { margin-right: 4px; }
.palette mark { background: none; color: var(--accent); font-weight: 600; }
@media (max-width: 759.98px) {
  .palette-wrap { padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 8px; }
  .palette { max-height: 80vh; }
  .palette-item { min-height: var(--ctl-h-lg); }
}

/* ================= Misc building blocks ================= */
/* month stepper: ‹ November 2026 › */
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper-label { min-width: 150px; text-align: center; font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); font-weight: 500; padding: 0 6px; }

/* sticky bottom action bar (bulk mode) */
.actionbar {
  position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 10px 10px 18px; max-width: calc(100vw - 32px); font-size: var(--t-15);
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-panel); box-shadow: var(--shadow-float);
}
@media (min-width: 760px) { .actionbar { margin-left: calc(var(--rail-w) / 2); } }
@media (max-width: 759.98px) { .actionbar { bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; transform: none; } }

/* totals footer line */
.totals { display: flex; flex-wrap: wrap; gap: 10px 32px; padding: 16px; border-top: 1px solid var(--line-2); }
.totals > div { display: flex; flex-direction: column; gap: 2px; }
.totals .micro { color: var(--ink-2); }
.totals .money { font-size: calc(18px * var(--text-scale)); font-weight: 600; }

/* notes / activity timeline */
.tl { position: relative; }
.tl-item { display: grid; grid-template-columns: calc(84px * var(--text-scale)) minmax(0, 1fr) auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.tl-when { font-family: var(--f-mono); font-size: var(--t-12); color: var(--ink-2); padding-top: 1px; white-space: nowrap; }
.tl-body { min-width: 0; overflow-wrap: anywhere; }
.tl-meta { font-size: var(--t-12); color: var(--ink-2); margin-top: 2px; }
.tl-item.is-done .tl-body { color: var(--ink-2); }

/* attention / generic list row: lead · main · action */
.lrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
.lrow-lead { align-self: start; padding-top: 1px; }
.lrow-title { font-weight: 600; font-size: var(--t-15); }
.lrow-detail { color: var(--ink); font-size: var(--t-15); margin-top: 2px; }
.lrow-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.lrow-sev { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.sev-high { background: var(--bad); } .sev-medium { background: var(--warn); } .sev-low { background: var(--line-2); }
@media (max-width: 759.98px) {
  .lrow { grid-template-columns: auto minmax(0, 1fr); }
  .lrow-actions { grid-column: 1 / -1; justify-content: flex-start; }
}

/* spinner dot for sync note */
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot-ok { background: var(--ok); } .dot-warn { background: var(--warn); } .dot-bad { background: var(--bad); } .dot-accent { background: var(--accent); }
.dot-pulse { animation: rb-pulse 1.2s ease-in-out infinite; }

/* read-only: controls marked data-write are disabled */
.is-readonly [data-write] { opacity: .5; pointer-events: none; }

/* text helpers inside long text */
.prewrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.code-block { font-family: var(--f-mono); font-size: var(--t-12); white-space: pre; overflow: auto; max-height: 50vh; padding: 12px; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-ctl); color: var(--ink); width: 100%; resize: vertical; }

/* ================= v2: plain, large building blocks ================= */
/* "Keep it" in confirm sheets: larger and calmer than the red button beside it */
.btn-keep { --btn-h: var(--ctl-h-lg); background: var(--surface); border: 2px solid var(--ink-2); color: var(--ink); font-weight: 600; padding: 0 calc(28px * var(--text-scale)); font-size: calc(18px * var(--text-scale)); }
.btn-keep:hover { background: var(--hover); }

/* large tappable choices (ui.field type 'choice') */
.choices { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.choices-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 759.98px) { .choices-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.choice { position: relative; display: block; cursor: pointer; min-width: 0; }
.choice > input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice-body {
  display: flex; align-items: center; gap: 12px; min-height: var(--ctl-h-lg); padding: 10px calc(14px * var(--text-scale));
  border: 1.5px solid var(--line-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink);
  font-size: var(--t-15); font-weight: 500; line-height: 1.3; transition: border-color 120ms, background-color 120ms;
}
.choice-body::before {
  content: ""; flex: none; width: calc(20px * var(--text-scale)); height: calc(20px * var(--text-scale)); border-radius: 50%;
  border: 2px solid var(--ink-2); background: var(--surface); box-sizing: border-box;
}
.choice-body > svg { color: var(--ink-2); flex: none; }
.choice-text { display: flex; flex-direction: column; min-width: 0; }
.choice-sub { font-size: var(--t-13); color: var(--ink-2); font-weight: 400; }
.choice:hover .choice-body { border-color: var(--ink-3); background: var(--hover); }
.choice > input:checked + .choice-body { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice > input:checked + .choice-body::before { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.choice > input:checked + .choice-body > svg { color: var(--accent); }
.choice > input:focus-visible + .choice-body { box-shadow: var(--focus-ring); }

/* "Add more details (optional)" */
.more-details { border-top: 1px solid var(--line); }
.more-details-sum {
  display: flex; align-items: center; gap: 10px; min-height: var(--ctl-h); padding: 6px 0; cursor: pointer; list-style: none;
  color: var(--accent); font-size: var(--t-15); font-weight: 600;
}
.more-details-sum::-webkit-details-marker { display: none; }
.more-details-sum:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 4px; }
.more-details-chev { transition: transform 140ms; }
.more-details[open] .more-details-chev { transform: rotate(90deg); }
.more-details-body { display: flex; flex-direction: column; gap: var(--s5); padding: var(--s3) 0 var(--s2); }

/* "Which tenant?" chooser (ui.pickTenant) */
.pick-find { margin-bottom: var(--s3); }
.pick-find > .input { height: var(--ctl-h-lg); font-size: calc(18px * var(--text-scale)); }
.pick-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.pick-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; width: 100%;
  min-height: calc(64px * var(--text-scale)); padding: 10px 8px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); text-align: left;
}
.pick-row:hover { background: var(--hover); }
.pick-row:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--accent); border-radius: 6px; }
.pick-main { display: flex; flex-direction: column; min-width: 0; }
.pick-name { font-size: calc(18px * var(--text-scale)); font-weight: 600; overflow-wrap: anywhere; }
.pick-sub { font-size: var(--t-13); color: var(--ink-2); }
.pick-owes { display: flex; flex-direction: column; align-items: flex-end; font-size: var(--t-15); color: var(--ink-2); white-space: nowrap; text-align: right; }
.pick-owes.is-owed { color: var(--bad); font-weight: 600; }
.pick-late { font-size: var(--t-13); font-weight: 400; }
.pick-empty { padding: 24px 8px; color: var(--ink-2); font-size: var(--t-15); }
@media (max-width: 759.98px) {
  .pick-row { grid-template-columns: auto minmax(0, 1fr); }
  .pick-owes { grid-column: 2; align-items: flex-start; flex-direction: row; gap: 8px; flex-wrap: wrap; }
}

/* step-by-step guide (ui.steps) */
.steps-head { margin-bottom: var(--s4); }
.steps-count { font-size: var(--t-13); font-weight: 600; color: var(--accent); }

/* text size control */

/* thin two-tone bar: paid share of a month, to scale */

.pick-skip { margin-bottom: var(--s3); justify-content: flex-start; }
/* ---- 30-shell.css ---- */
/* App chrome: rail (desktop), icon rail (<1100px), bottom tab bar (<760px), top bar, work column. */
.app { min-height: 100%; display: flex; flex-direction: column; }

/* ---- Rail ---- */
.rail {
  position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: calc(var(--rail-w) + env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 4px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 14px calc(14px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px));

  overflow-y: auto; scrollbar-width: thin;
}

.rail-brand:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.rail-mark {
  flex: none; display: grid; place-items: center; width: calc(36px * var(--text-scale)); height: calc(36px * var(--text-scale));
  border: 1px solid var(--ink); border-radius: var(--r-plate);

}
.rail-brand-text { display: flex; flex-direction: column; min-width: 0; }
.rail-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; line-height: 1.15; }
.rail-sub { font-size: var(--t-12); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-sub:empty { display: none; }
.rail-nav { display: flex; flex-direction: column; gap: 4px; }
.rail-link {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: var(--ctl-h); padding: 0 12px;
  border: 1px solid transparent; border-radius: var(--r-ctl); color: var(--ink); font-size: var(--t-15); font-weight: 500; text-decoration: none;
}
.rail-link svg { color: var(--ink-2); }
.rail-link:hover { background: var(--hover); text-decoration: none; }
.rail-link[aria-current="page"] { background: var(--surface); border-color: var(--line-2); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.rail-link[aria-current="page"] svg { color: var(--accent); }
.rail-link:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.rail-count {
  margin-left: auto; min-width: calc(26px * var(--text-scale)); padding: 1px 7px; border-radius: 999px; text-align: center;
  background: var(--bad-soft); border: 1px solid var(--bad-line); color: var(--bad); font-size: var(--t-12); font-weight: 600; font-variant-numeric: tabular-nums;
}
.rail-foot { margin-top: auto; padding: 16px 4px 0; display: flex; flex-direction: column; gap: 14px; font-size: var(--t-12); color: var(--ink-2); }

.rail-textsize .textsize-seg { flex-wrap: wrap; }

.rail-textsize .textsize-seg .textsize-lg { font-size: calc(var(--t-12) * 1.08); }
.rail-textsize .textsize-seg .textsize-xl { font-size: calc(var(--t-12) * 1.16); }

/* ---- Work column ---- */
.work {
  position: relative; flex: 1 0 auto;

  padding-right: env(safe-area-inset-right, 0px);
  display: flex; flex-direction: column; min-width: 0;
}
.topbar {

  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-inner { display: flex; align-items: center; gap: 12px; min-height: var(--top-h); max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter); }

.topbar-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); font-weight: 500; line-height: 1.1; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.view { flex: 1 0 auto; width: 100%; max-width: 1240px; margin: 0 auto; padding: 28px var(--gutter) 96px; min-width: 0; }

/* the one-line summary that opens a view: a sentence a person would say, figures in ink */

.view-summary strong { color: var(--ink); font-weight: 600; }

/* ---- Bottom tab bar (phone) ---- */
.tabbar { display: none; }

/* ---- Icon rail 760–1099: icons with their words underneath (never icon-only) ---- */
@media (max-width: 1099.98px) {
  .rail { padding-left: calc(8px + env(safe-area-inset-left, 0px)); padding-right: 8px; align-items: stretch; }

  .rail-link { flex-direction: column; justify-content: center; gap: 2px; min-height: calc(60px * var(--text-scale)); padding: 6px 2px; text-align: center; }
  .rail-link-label { font-size: var(--t-12); line-height: 1.15; overflow-wrap: anywhere; }
  .rail-link[aria-current="page"] { box-shadow: inset 0 3px 0 var(--accent); }
  .rail-foot { align-items: stretch; padding: 10px 0 0; }
  .rail-help { flex-direction: column; gap: 2px; padding: 6px 2px; min-height: calc(60px * var(--text-scale)); justify-content: center; font-size: var(--t-12); }

}

/* ---- Phone ---- */
@media (max-width: 759.98px) {
  .rail { display: none; }
  .work { margin-left: 0; border-left: 0; padding-right: 0; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); }
  .topbar-inner { padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); gap: 8px; }
  .topbar-brand { display: inline-flex; }
  .topbar-brand .rail-mark { width: var(--ctl-h); height: var(--ctl-h); box-shadow: none; }

  .view { padding: 20px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); }
  .banner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 8px; }
  .banner-text { flex-basis: 100%; }
  .banner-actions { flex-wrap: wrap; }
  .tabbar {
    position: fixed; z-index: 40; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: var(--surface); border-top: 1px solid var(--line-2);
  }
  .tab {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: 0; background: none; color: var(--ink-2); font-size: max(12px, calc(13px * var(--text-scale))); font-weight: 600; text-decoration: none; min-width: 0;
  }
  .tab svg { width: calc(22px * var(--text-scale)); height: calc(22px * var(--text-scale)); }
  .tab-label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .tab:hover { text-decoration: none; }
  .tab[aria-current="page"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
  .tab:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--accent); border-radius: 8px; }
  .tab-badge { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--bad); color: var(--bad-ink); font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
}

/* ---- More sheet (phone) ---- */
.more-list { display: flex; flex-direction: column; gap: 4px; }
.more-list .menu-item { min-height: var(--ctl-h-lg); font-size: calc(18px * var(--text-scale)); font-weight: 500; }
.more-textsize { margin-top: var(--s5); padding-top: var(--s4); border-top: 1px solid var(--line); }

/* ---- Help: "How do I…?" ---- */
.help-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; counter-reset: none; }
.help-item { padding: 16px 0 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.help-q { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; line-height: 1.25; }

.help-go { margin-top: 6px; white-space: normal; text-align: left; }
.help-foot { margin-top: var(--s5); display: flex; flex-direction: column; gap: 12px; max-width: 420px; }
@media (max-width: 759.98px) { .help-list { grid-template-columns: minmax(0, 1fr); } .help-go { width: 100%; justify-content: space-between; } }

/* ---- Keyboard shortcuts sheet ---- */
.keys { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 32px; }
.keys-group { break-inside: avoid; }
.keys-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: var(--t-13); }
.keys-row .kbd + .kbd { margin-left: 3px; }
@media (max-width: 759.98px) { .keys { grid-template-columns: minmax(0, 1fr); } }

/* ---- Component kit (#kit) ---- */
.kit-sec { padding: 28px 0; border-bottom: 1px solid var(--line); }
.kit-sec:first-child { padding-top: 0; }
.kit-label { margin-bottom: 14px; }
.kit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px 24px; }

.kit-sizes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.kit-size { min-width: 0; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-panel); }
.kit-size { font-size: var(--t-body); }
@media (max-width: 1099.98px) { .kit-sizes { grid-template-columns: minmax(0, 1fr); } }
/* ---- 40-today.css ---- */
/* Today view (#today). Layout only; components come from 20-components.css. */
.td { max-width: 1040px; }

/* ---- (0) three task buttons: start from what they want to do ---- */
.td-tasks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: var(--s6); }
.td-task {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
  min-height: calc(88px * var(--text-scale)); padding: 14px 16px; text-align: left;
  border: 1.5px solid var(--accent-line); border-radius: var(--r-panel); background: var(--accent-soft); color: var(--ink);
  transition: border-color 120ms, background-color 120ms;
}
.td-task:hover { border-color: var(--accent); }

.td-task-ico { display: grid; place-items: center; width: calc(48px * var(--text-scale)); height: calc(48px * var(--text-scale)); border-radius: var(--r-ctl); background: var(--accent); color: var(--accent-ink); }
.td-task-ico svg { width: calc(24px * var(--text-scale)); height: calc(24px * var(--text-scale)); }

@media (max-width: 899.98px) { .td-tasks { grid-template-columns: minmax(0, 1fr); gap: 10px; } .td-task { min-height: calc(72px * var(--text-scale)); } }

/* ---- (1) this month's rent ---- */
.td-collect { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 22px 24px; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--paper); }

.td-group { margin-top: var(--s4); }

.td-group-n { color: var(--ink-2); font-weight: 400; }
.td-rows { display: flex; flex-direction: column; }

.td-lead-ico { display: grid; place-items: center; width: calc(44px * var(--text-scale)); height: calc(30px * var(--text-scale)); color: var(--ink-2); }

}

/* ---- (3) the month at a glance ---- */

/* ---- 41-rent.css ---- */
/* Rent view (#rent). One large row per tenant; desktop lays the row out in columns, phone stacks it as a card. */
.rent { max-width: 1080px; }
.rent.has-bar { padding-bottom: calc(96px * var(--text-scale)); }

  background: transparent; color: var(--ink); font-size: var(--t-15); font-weight: 500;
}

/* rows */
.rent-list { display: flex; flex-direction: column; border-top: 1px solid var(--line-2); }
.rent-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "lead main status" "lead actions actions";
  column-gap: 16px; row-gap: 12px; align-items: start; padding: 18px 8px; border-bottom: 1px solid var(--line);
}

}
.rent-row.is-focused { box-shadow: inset 3px 0 0 var(--accent); background: var(--hover); }
.rent-row.is-selected { background: var(--accent-soft); }
.rent-lead { grid-area: lead; padding-top: 2px; }
.rent-main { grid-area: main; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.rent-late { color: var(--bad); font-weight: 600; }

/* totals in words */
.rent-totals { margin-top: var(--s5); padding: 18px 20px; border-radius: var(--r-panel); background: var(--paper); border: 1px solid var(--line); font-size: var(--t-15); color: var(--ink); }
.rent-totals-t { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; margin-bottom: 6px; }

.rent-bar .rent-bar-n { font-weight: 600; }

@media (max-width: 759.98px) {

  .rent-step { flex: 1 1 0; padding: 0 10px; }
  .rent-row { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "lead main" "status status" "actions actions"; padding: 18px 0; }
  .rent-status { justify-self: start; }
  .rent-actions > .rent-pay { flex: 1 1 100%; }
  .rent-actions > .btn.rent-part { flex: 1 1 auto; }
  .rent-actions > .rent-more { margin-left: auto; }
  .rent-tabs { flex: 1 1 100%; }
  .rent-tab { flex: 1 1 auto; padding: 0 10px; }
