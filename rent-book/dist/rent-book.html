/* ---- 00-tokens.css ---- */
/* Design tokens. Every colour lives here; component rules use var(--token) only.
   Light on bare :root, dark under prefers-color-scheme (unless data-theme="light"), and again for data-theme="dark".
   v3 (SPEC §10.1 laws 4 and 6): five type sizes × --text-scale, two weights, one spacing scale, three radii.
   The v2 token names are kept as aliases of the v3 ones so older CSS keeps working (and lands on the five sizes). */
:root {
  --paper: #F5F6F9;
  --surface: #FFFFFF;
  --sunk: #ECEEF3;
  --ink: #131A26;
  --ink-2: #3D4657;            /* 8.8:1 paper, 9.5 surface, 8.2 sunk */
  --ink-3: #566072;            /* ≥5.4:1 on every ground — decoration only */
  --line: #E0E4EB;
  --line-2: #C9CFDA;
  --accent: #2440B8;           /* 7.8 paper, 8.4 surface; white on it 8.4 */
  --accent-ink: #FFFFFF;
  --accent-soft: #E7EBFA;
  --ok: #17663F;
  --ok-soft: #E2F2E9;
  --warn: #835005;
  --warn-soft: #FAEFD9;
  --bad: #A3302A;
  --bad-soft: #FAE6E4;

  /* derived (still tokens: no literal colours outside this file) */
  --hover: #EEF0F5;            /* row / text-button hover */
  --press: #E4E8F0;            /* row press */
  --tint: #F1F3F8;             /* v3 callouts and the one summary panel: a surface tint, never brown/amber */
  --accent-line: #B7C3F1;
  --accent-hover: #1C3399;
  --ok-line: #A8D4BB;
  --warn-line: #E6C78C;
  --bad-line: #EBB3AD;
  --bad-ink: #FFFFFF;
  --faint: #D5DAE3;
  --scrim: rgba(19, 26, 38, .28);
  --toast-bg: #131A26;
  --toast-ink: #EEF1F6;
  --toast-accent: #A9B8FF;
  --toast-hover: rgba(255, 255, 255, .12);
  --shadow-float: 0 1px 2px rgba(19, 26, 38, .06), 0 10px 28px rgba(19, 26, 38, .12);
  --shadow-modal: 0 2px 6px rgba(19, 26, 38, .08), 0 24px 60px rgba(19, 26, 38, .22);
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);   /* 2px accent ring + 2px offset */
  color-scheme: light;
}

/* Sizes. Declared on :root and on any .text-scope element so a subtree can use its own --text-scale. */
:root, .text-scope {
  --text-scale: 1;
  --f-display: "Newsreader", "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;

  /* ---- v3 type: exactly five sizes (law 4) ---- */
  --t-cap: calc(14px * var(--text-scale));       /* captions, row-sub, status markers, group heads, tab labels */
  --t-body: calc(16px * var(--text-scale));      /* body, row titles, buttons, inputs (17 on phone) */
  --t-lead: calc(18px * var(--text-scale));      /* lead sentences, section headings */
  --t-title: calc(22px * var(--text-scale));     /* page / sheet titles */
  --t-display: calc(32px * var(--text-scale));   /* the ONE key figure or name per screen (36 on desktop) */
  /* ---- two weights ---- */
  --w-regular: 400;
  --w-strong: 600;                               /* row first line, button labels, sans headings — nothing else */
  /* ---- line heights ---- */
  --lh: 1.45; --lh-title: 1.25; --lh-display: 1.1;

  /* v2 names → v3 sizes (aliases; do not use in new CSS) */
  --t-12: var(--t-cap);
  --t-13: var(--t-cap);
  --t-micro: var(--t-cap);
  --t-15: var(--t-body);
  --t-18: var(--t-lead);
  --t-24: var(--t-title);
  --t-34: var(--t-display);

  /* ---- spacing: 4 8 12 16 24 32 48 64 only (law 6) ---- */
  --s1: calc(4px * var(--text-scale)); --s2: calc(8px * var(--text-scale)); --s3: calc(12px * var(--text-scale));
  --s4: calc(16px * var(--text-scale)); --s5: calc(24px * var(--text-scale)); --s6: calc(32px * var(--text-scale));
  --s7: calc(48px * var(--text-scale)); --s8: calc(64px * var(--text-scale));

  /* ---- radius: 6 controls · 10 panels · 16 sheets (and 999 for round marks) — nothing else ---- */
  --r-ctl: 6px;
  --r-panel: 10px;
  --r-sheet: 16px;
  --r-round: 999px;
  --r-plate: 6px;                                /* alias: door plates are controls-sized */

  --rail-w: calc(236px * var(--text-scale));
  --top-h: calc(64px * var(--text-scale));
  --tab-h: calc(68px * var(--text-scale));
  --ctl-h: calc(44px * var(--text-scale));
  --ctl-h-sm: calc(40px * var(--text-scale));
  --ctl-h-lg: calc(52px * var(--text-scale));
  --ctl-h-xl: calc(64px * var(--text-scale));
  --row-h: calc(64px * var(--text-scale));       /* the canonical row's minimum height */
  --gutter: 32px;
  --icon: calc(18px * var(--text-scale));
  --sticky-top: calc(env(safe-area-inset-top, 0px) + var(--top-h));

  /* ---- motion (SPEC §10.4): transform/opacity only ---- */
  --ease: cubic-bezier(.2, .7, .2, 1);
  --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --dur: 240ms;          /* sheets and the drawer */
  --dur-menu: 150ms;     /* menus, popovers, toasts */
  --dur-press: 100ms;    /* press feedback (scale .98) */
}
@media (min-width: 1100px) { :root, .text-scope { --t-display: calc(36px * var(--text-scale)); } }

@media (max-width: 1099.98px) {

/* ---- 10-base.css ---- */
/* Base: element defaults, typography, utilities. */
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: var(--t-body);
  line-height: var(--lh);
  font-weight: var(--w-regular);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, p, dl, dd, ul, ol, figure { margin: 0; }
h1, h2, h3, h4, strong, b, th { font-weight: var(--w-strong); }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--accent); text-decoration: none; }
@media (hover: hover) { a:hover { text-decoration: underline; text-underline-offset: 3px; } }
svg { display: block; flex: none; }
svg.ico { width: var(--icon); height: var(--icon); }
/* Plain sentences used across views: "Owes $1,550 for November — 22 days late". */
.say { font-size: var(--t-body); line-height: var(--lh); color: var(--ink); }
.say-sub { font-size: var(--t-cap); color: var(--ink-2); line-height: var(--lh); }
.caption { font-size: var(--t-cap); color: var(--ink-2); line-height: var(--lh); }
/* v3 lead sentence ("6 tenants owe $8,545 in total — $6,495 of it is November's rent.") */
.lead { font-size: var(--t-lead); line-height: var(--lh); color: var(--ink); max-width: 52ch; }
.lead strong { font-weight: var(--w-strong); }
table { border-collapse: separate; border-spacing: 0; }
::selection { background: var(--accent-soft); color: var(--ink); }
hr { border: 0; border-top: 1px solid var(--line); margin: var(--s4) 0; }

:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }

/* ---- type (v3: five sizes, two weights) ---- */
.display { font-family: var(--f-display); font-optical-sizing: auto; font-weight: var(--w-regular); letter-spacing: -0.005em; }
/* the ONE display element per screen: the page's key figure or name */
.t-display { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-display); font-weight: var(--w-regular); line-height: var(--lh-display); letter-spacing: -0.01em; }
.t-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-title); font-weight: var(--w-regular); line-height: var(--lh-title); }
.t-lead { font-size: var(--t-lead); line-height: var(--lh); }
.t-body { font-size: var(--t-body); }
.t-cap { font-size: var(--t-cap); line-height: var(--lh); }
/* v2 names (aliases) */
.t-12, .t-13 { font-size: var(--t-cap); }
.t-15 { font-size: var(--t-body); }
.t-18 { font-size: var(--t-lead); }
.t-24 { font-size: var(--t-title); line-height: var(--lh-title); }
.t-34 { font-size: var(--t-display); line-height: var(--lh-display); }
.h-view { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-title); font-weight: var(--w-regular); line-height: var(--lh-title); }
.micro { font-size: var(--t-cap); font-weight: var(--w-strong); color: var(--ink-2); }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.strong { font-weight: var(--w-strong); }
.medium { font-weight: var(--w-strong); }   /* v3: there is no 500 */
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }   /* decoration only; anything meaningful uses .muted (ink-2) */
.tone-ok { color: var(--ok); }
.tone-warn { color: var(--warn); }
.tone-bad { color: var(--bad); }
.tone-accent { color: var(--accent); }

/* ---- layout utilities ----
   v3: `.row` is now the canonical list row (20-components.css). The old flex utility is `.hstack`. */
.hstack { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.row-wrap { flex-wrap: wrap; }
.row-top { align-items: flex-start; }
.row-base { align-items: baseline; }
.gap-1 { gap: var(--s1); } .gap-3 { gap: var(--s3); } .gap-4 { gap: var(--s4); } .gap-5 { gap: var(--s5); }
.stack { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.stack-1 { gap: var(--s1); } .stack-3 { gap: var(--s3); } .stack-4 { gap: var(--s4); } .stack-5 { gap: var(--s5); } .stack-6 { gap: var(--s6); }
.spacer { flex: 1 1 auto; }
.grow { flex: 1 1 auto; min-width: 0; }
.mt-2 { margin-top: var(--s2); } .mt-4 { margin-top: var(--s4); } .mt-5 { margin-top: var(--s5); } .mt-6 { margin-top: var(--s6); }
.mb-2 { margin-bottom: var(--s2); } .mb-4 { margin-bottom: var(--s4); }
.vh {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
  clip-path: inset(50%); white-space: nowrap; margin: -1px; padding: 0; border: 0;
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); }
/* the single summary panel / callout a screen may have: surface tint, no border, no shadow */
.callout { background: var(--tint); border-radius: var(--r-panel); padding: var(--s4); color: var(--ink); }
.rule { border-top: 1px solid var(--line); }

@media (max-width: 759.98px) { .hide-phone { display: none !important; } }
@media (min-width: 760px) { .show-phone { display: none !important; } }

/* Reduced motion keeps fades only: movement keyframes are swapped for rb-fade, transforms on press are dropped. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; }
  .sheet, .drawer, .toast, .menu, .popover, .palette { animation-name: rb-fade !important; }
  .sheet.is-closing, .drawer.is-closing, .toast.is-closing { animation-name: rb-fade-out !important; }
  .btn:active, .row:active, .row-hit:active, .rows-more:active { transform: none !important; }
}
/* ---- 20-components.css ---- */
/* Component library. See docs/CONTRACT.md ("What changed in v3" and §9) for markup of each component.
   v3 laws (SPEC §10.1): five type sizes, weights 400/600, radius 6/10/16 (+999), spacing 4…64, hairlines not boxes,
   border OR shadow (never both), semantic colour only on status markers, one filled button per screen. */

/* ================= Buttons: hierarchy =================
   .btn-primary  filled (ONE per screen / sheet)
   .btn-soft     tonal (the one allowed per-row action)
   .btn / .btn-outline   bordered, quiet (secondary actions)
   .btn-ghost / .btn-link / .linkbtn   text links (tertiary)                                                  */
.btn {
  --btn-h: var(--ctl-h);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: var(--btn-h); min-width: var(--btn-h); padding: 0 var(--s4);
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  background: var(--surface); color: var(--ink);
  font-size: var(--t-body); font-weight: var(--w-strong); line-height: var(--lh-title); white-space: nowrap;
  text-decoration: none; user-select: none; -webkit-user-select: none;
  transition: transform var(--dur-press) ease-out, background-color var(--dur-press), border-color var(--dur-press), color var(--dur-press);
}
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: none; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.btn[aria-busy="true"] { opacity: .7; pointer-events: none; }
.btn svg { width: var(--icon); height: var(--icon); }
.btn-outline { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.btn-danger-soft { background: var(--surface); border-color: var(--bad-line); color: var(--bad); }
@media (hover: hover) {
  .btn:hover { background: var(--hover); text-decoration: none; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-soft:hover { background: var(--accent-soft); border-color: var(--accent-line); }
  .btn-ghost:hover { background: var(--hover); color: var(--accent-hover); }
  .btn-danger:hover { background: var(--bad); border-color: var(--bad); filter: brightness(.94); }
  .btn-danger-soft:hover { background: var(--bad-soft); }
}
/* .btn-icon: legacy. v2+ helpers never render icon-only buttons. */
.btn-icon { padding: 0; width: var(--btn-h); }
.btn-icon:has(.btn-label), .btn-worded { width: auto; padding: 0 var(--s3); }
.btn-sm { --btn-h: var(--ctl-h-sm); padding: 0 var(--s3); }
.btn-sm.btn-icon { padding: 0; }
.btn-lg { --btn-h: var(--ctl-h-lg); padding: 0 var(--s5); }
.btn-xl { --btn-h: var(--ctl-h-xl); padding: 0 var(--s5); }
.btn-block { width: 100%; }
.btn .btn-sub { font-weight: var(--w-regular); opacity: .75; }
.btn-group { display: inline-flex; }
.btn-group > .btn:not(:last-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.btn-group > .btn:not(:first-child) { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; }
.btn-group > .btn-primary + .btn-primary { border-left-color: var(--accent-hover); }
.btn-group > .btn-caret { width: var(--btn-h); min-width: var(--btn-h); padding: 0; }
.btn-group > .btn:focus-visible { position: relative; z-index: 1; }
/* inline text link button (inside sentences) */
.linkbtn {
  display: inline; padding: 0; border: 0; background: none; color: var(--accent);
  font: inherit; font-weight: var(--w-strong); text-decoration: none; cursor: pointer;
}
.linkbtn-muted { color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
/* standalone text link with a real hit area (≥48px on phone) */
.btn-link {
  --btn-h: var(--ctl-h-sm); display: inline-flex; align-items: center; gap: var(--s1); min-height: var(--btn-h); padding: 0 var(--s1);
  border: 0; background: none; color: var(--accent); font: inherit; font-size: var(--t-body); font-weight: var(--w-strong);
  text-decoration: none; cursor: pointer; border-radius: var(--r-ctl);
}
.btn-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-link:disabled { color: var(--ink-3); cursor: default; }
@media (hover: hover) {
  .linkbtn:hover, .btn-link:hover:not(:disabled) { text-decoration: underline; text-underline-offset: 3px; }
}

/* ================= Inputs ================= */
.input {
  display: block; width: 100%; height: var(--ctl-h); padding: 0 var(--s3);
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  font-size: var(--t-body); font-variant-numeric: tabular-nums;
  transition: border-color var(--dur-press);
  -webkit-appearance: none; appearance: none;
}
.input::placeholder { color: var(--ink-3); opacity: 1; }
.input:focus, .input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 0; }
.input:disabled, .input[readonly] { opacity: .6; }
@media (hover: hover) { .input:hover { border-color: var(--ink-3); } }
textarea.input, .textarea { height: auto; min-height: calc(96px * var(--text-scale)); padding: var(--s2) var(--s3); line-height: var(--lh); resize: vertical; }
input[type="date"].input { min-width: 0; }
input[type="date"].input::-webkit-calendar-picker-indicator { opacity: .6; cursor: pointer; }
input[type="search"].input::-webkit-search-cancel-button { -webkit-appearance: none; }
input.input-num { text-align: right; }

.select { position: relative; display: block; min-width: 0; }
.select > select.input { padding-right: var(--s6); cursor: pointer; }
.select::after {
  content: ""; position: absolute; right: var(--s3); top: 50%; width: 6px; height: 6px; margin-top: -5px;
  border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(45deg); pointer-events: none;
}
.select-inline { display: inline-block; }

/* money: sized to the answer (~10ch), not full width */
.money-input { position: relative; display: block; max-width: calc(12ch + 48px * var(--text-scale)); }
.money-input > .money-sym {
  position: absolute; left: var(--s3); top: 0; bottom: 0; display: flex; align-items: center;
  color: var(--ink-2); pointer-events: none; font-size: inherit;
}
.money-input > .input { padding-left: calc(28px * var(--text-scale)); text-align: left; font-variant-numeric: tabular-nums; }
.money-input-lg { font-size: var(--t-lead); }
.money-input-lg > .input { height: var(--ctl-h-lg); font-size: var(--t-lead); }

input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: calc(22px * var(--text-scale)); height: calc(22px * var(--text-scale)); margin: 0; flex: none; }
.check { display: inline-flex; align-items: center; gap: var(--s3); cursor: pointer; min-height: var(--ctl-h-sm); }

.search { position: relative; display: block; min-width: 0; }
.search > .search-icon { position: absolute; left: var(--s3); top: 50%; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
.search > .input { padding-left: calc(40px * var(--text-scale)); padding-right: var(--s3); }
.search > .search-kbd { position: absolute; right: var(--s2); top: 50%; transform: translateY(-50%); pointer-events: none; }
.search > .input:focus ~ .search-kbd { display: none; }

/* written-out date beside a native date field (ui.dateField): "Tuesday, November 24" */
.datefield { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.datefield > .input { width: auto; flex: 0 1 calc(190px * var(--text-scale)); }
.datefield-words { color: var(--ink); font-size: var(--t-body); }

/* ================= Fields & forms ================= */
.field { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.field-label { font-size: var(--t-body); font-weight: var(--w-strong); color: var(--ink); line-height: var(--lh-title); }
.field-label .opt { font-weight: var(--w-regular); color: var(--ink-2); font-size: var(--t-cap); }
.field-hint { font-size: var(--t-cap); color: var(--ink-2); }
.field-error { font-size: var(--t-cap); color: var(--bad); font-weight: var(--w-strong); }
.field-error:empty { display: none; }
.field.is-invalid .input { border-color: var(--bad); }
.field-inline { flex-direction: row; align-items: center; gap: var(--s3); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s5) var(--s4); }
.form-col { display: flex; flex-direction: column; gap: var(--s5); }
.form-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid > .span-2, .form-grid > .span-all { grid-column: 1 / -1; }
.fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.fieldset + .fieldset { margin-top: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--line); }
.fieldset-title { display: block; float: left; width: 100%; margin-bottom: var(--s3); padding: 0; font-size: var(--t-lead); font-weight: var(--w-strong); color: var(--ink); }
.fieldset-title + * { clear: both; }
.form-note { padding: var(--s3) var(--s4); background: var(--tint); border-radius: var(--r-ctl); font-size: var(--t-cap); color: var(--ink); }
.form-sum { display: flex; justify-content: space-between; align-items: baseline; padding-top: var(--s3); border-top: 1px solid var(--line); font-size: var(--t-body); }
.form-sum strong { font-weight: var(--w-strong); }
@media (max-width: 759.98px) { .form-grid, .form-grid-3 { grid-template-columns: minmax(0, 1fr); } }

/* ================= Segmented control — only for switching views; one row, never wraps (law 8) ================= */
.seg { align-self: flex-start; display: inline-flex; flex-wrap: nowrap; padding: 2px; gap: 2px; background: var(--sunk); border-radius: var(--r-ctl); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg > button {
  flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); min-height: calc(var(--ctl-h) - 4px); padding: 0 var(--s3);
  border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-2);
  font-size: var(--t-cap); font-weight: var(--w-regular); white-space: nowrap;
}
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"], .seg > button[aria-checked="true"] { background: var(--surface); color: var(--ink); font-weight: var(--w-strong); box-shadow: 0 0 0 1px var(--line-2); }
.seg > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg-n { font-variant-numeric: tabular-nums; color: inherit; font-weight: var(--w-regular); }
@media (hover: hover) { .seg > button:hover { color: var(--ink); } }
/* the view-switch segment (ui.segment): fills the row on phone */
.segment { display: flex; width: 100%; max-width: calc(560px * var(--text-scale)); }
.segment > button { min-height: var(--ctl-h); }

/* ================= Filter chips (filters only) ================= */
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip {
  display: inline-flex; align-items: center; gap: var(--s2); min-height: var(--ctl-h-sm); padding: 0 var(--s4);
  border: 1px solid var(--line-2); border-radius: var(--r-round); background: var(--surface); color: var(--ink);
  font-size: var(--t-cap); font-weight: var(--w-regular); white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: var(--w-strong); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip-count { color: var(--ink-2); font-weight: var(--w-regular); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .chip-count { color: var(--accent); }
.chip-count.is-bad { color: var(--ink); font-weight: var(--w-strong); }
@media (max-width: 759.98px) {
  .chips-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); }
  .chips-scroll::-webkit-scrollbar { display: none; }
}

/* ================= Status marker (ui.status) — the ONLY place semantic colour appears (law 5) ================= */
.status {
  display: inline-flex; align-items: center; gap: var(--s1); min-width: 0;
  font-size: var(--t-cap); font-weight: var(--w-regular); line-height: var(--lh-title); color: var(--ink-2); vertical-align: middle;
}
.status > svg { width: calc(14px * var(--text-scale)); height: calc(14px * var(--text-scale)); flex: none; }
.status-words { min-width: 0; }
.status-late, .status-bad { color: var(--bad); }
.status-partial, .status-partial_late, .status-warn { color: var(--warn); }
.status-partial_late > svg { color: var(--bad); }
.status-ok { color: var(--ok); }
.status-info { color: var(--accent); }
.status-due { color: var(--ink); }
.status-paid, .status-paid_late, .status-none, .status-quiet { color: var(--ink-2); }
/* legacy pill classes now render as status markers (no tinted boxes) */
.pill { white-space: nowrap; }
.pill-sm { font-size: var(--t-cap); }
/* tag: a small neutral label ("Month-to-month", "View only"); semantic tones render as status markers */
.tag {
  display: inline-flex; align-items: center; gap: var(--s1); min-height: calc(26px * var(--text-scale)); padding: 0 var(--s2);
  border: 1px solid var(--line-2); border-radius: var(--r-ctl); color: var(--ink-2); background: transparent;
  font-size: var(--t-cap); font-weight: var(--w-regular); white-space: nowrap; vertical-align: middle;
}
.tag svg { width: calc(14px * var(--text-scale)); height: calc(14px * var(--text-scale)); }
.tag.status { border: 0; padding: 0; min-height: 0; }
.tag-accent { color: var(--accent); border-color: var(--accent-line); }
.tag-quiet { border-color: transparent; background: var(--sunk); }

/* ================= Door plate — neutral everywhere (law 5) ================= */
.plate {
  display: inline-flex; align-items: center; justify-content: center; position: relative;
  min-width: calc(48px * var(--text-scale)); height: calc(32px * var(--text-scale)); padding: 0 var(--s2);
  border: 1px solid var(--ink-3); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink);
  font-family: var(--f-mono); font-size: var(--t-cap); font-weight: var(--w-regular); line-height: 1; letter-spacing: 0;
  white-space: nowrap; vertical-align: middle; font-variant-numeric: tabular-nums;
}
.plate-sm.plate-none { border-style: dashed; color: var(--ink-2); }
.plate-lg { min-width: calc(64px * var(--text-scale)); height: calc(48px * var(--text-scale)); padding: 0 var(--s2); }
.plate-lg .plate-unit { line-height: 1; }
.plate-lg .plate-glyph { position: absolute; top: 3px; right: 3px; display: flex; }
.plate-lg .plate-glyph svg { width: calc(12px * var(--text-scale)); height: calc(12px * var(--text-scale)); }
.plate-lg.plate-late .plate-glyph, .plate-lg.plate-partial_late .plate-glyph { color: var(--bad); }
.plate-lg.plate-partial .plate-glyph, .plate-lg.plate-paid_late .plate-glyph .pill-tick { color: var(--warn); }
.plate-lg.plate-paid .plate-glyph, .plate-lg.plate-paid_late .plate-glyph { color: var(--ink-2); }
.plate-lg.plate-none { border-style: dashed; color: var(--ink-2); }
button.plate { cursor: pointer; transition: transform var(--dur-press) ease-out; }
button.plate:active { transform: scale(.98); }
button.plate:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) { button.plate:hover { background: var(--hover); } }
.plates { display: flex; flex-wrap: wrap; gap: var(--s2); }
.plate-fixed { min-width: calc(64px * var(--text-scale)); }
.stack > .plate, .stack > .pill, .stack > .tag, .stack > .seg, .stack > .chip, .stack > .status { align-self: flex-start; }

/* ================= Payment strip (12 months) — itself a status marker (role=img) ================= */
.pstrip { display: inline-flex; align-items: center; gap: 2px; height: 16px; vertical-align: middle; }
.pc { position: relative; display: block; width: 7px; height: 14px; background: transparent; flex: none; }
.pc-paid { background: var(--ok); }
.pc-paid_late { background: var(--ok); }
.pc-paid_late::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--warn); }
.pc-partial { box-shadow: inset 0 0 0 1px var(--warn); }
.pc-partial::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: var(--warn); }
.pc-late { background: var(--bad); }
.pc-due { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.pc-none::after { content: ""; position: absolute; left: 2px; top: 5px; width: 3px; height: 3px; border-radius: var(--r-round); background: var(--faint); }
.pstrip-lg .pc { width: 10px; height: 20px; }
.pstrip-lg { height: 22px; gap: 3px; }
.pstrip-lg .pc-partial::after { height: 10px; }
.pstrip-lg .pc-none::after { left: 3px; top: 8px; width: 4px; height: 4px; }

/* ================= Money — always ink (law 5) ================= */
.money { white-space: nowrap; font-variant-numeric: tabular-nums; }
.money .cur { color: var(--ink-2); }
.money-lg { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-display); font-weight: var(--w-regular); line-height: var(--lh-display); letter-spacing: -0.01em; }
.money-md { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-title); line-height: var(--lh-title); }
.amt-owed, .amt-credit, .amt-zero { color: inherit; }
.bal { white-space: nowrap; }
.bal-owed, .bal-ahead { color: var(--ink); }
.bal-zero { color: var(--ink-2); }

/* ================= The canonical row (SPEC §10.2) — every list uses it =================
   <ul class="rows [rows-inset]"><li><a|button class="row">lead · main(title/sub) · end(amt/status) · chev</a></li></ul>
   With the one allowed soft button: <div class="row row-act"> … <button class="row-hit"> (stretched) … <button class="btn btn-soft row-btn"> */
.rows { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.rows > li { position: relative; border-bottom: 1px solid var(--line); }
.rows-inset { border-top: 0; }
.rows-inset > li { border-bottom: 0; }
.rows-inset > li::after { content: ""; position: absolute; left: calc(var(--row-lead-w) + var(--s3)); right: 0; bottom: 0; border-bottom: 1px solid var(--line); }
.rows-inset > li.row-nolead::after, .rows-inset.rows-nolead > li::after, .rows-inset > li:has(> .row-nolead)::after { left: 0; }
.row {
  --row-lead-w: calc(64px * var(--text-scale));
  position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; column-gap: var(--s3);
  width: 100%; min-height: var(--row-h); padding: var(--s3) 0; margin: 0;
  border: 0; background: none; color: var(--ink); font: inherit; text-align: left; text-decoration: none;
  transition: transform var(--dur-press) ease-out, background-color var(--dur-press);
}
.rows-inset { --row-lead-w: calc(64px * var(--text-scale)); }
a.row:hover { text-decoration: none; }
a.row, button.row { cursor: pointer; }
a.row:active, button.row:active { transform: scale(.98); background: var(--press); }
a.row:focus-visible, button.row:focus-visible, .row-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r-ctl); }
@media (hover: hover) { a.row:hover, button.row:hover, .row-act:has(.row-hit:hover) { background: var(--hover); } }
.row-lead { grid-column: 1; width: var(--row-lead-w); display: flex; align-items: center; }
.row-nolead .row-lead, .row-lead:empty { display: none; }
/* no door plate: no empty first column (and no gap) — the text sits flush with the group heading */
.row-nolead { grid-template-columns: minmax(0, 1fr) auto auto; }
.row-nolead > .row-main { grid-column: 1; }
.row-nolead > .row-end { grid-column: 2; }
.row-nolead > .row-chev { grid-column: 3; }
.row-main { grid-column: 2; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-size: var(--t-body); font-weight: var(--w-strong); line-height: var(--lh-title); color: var(--ink); overflow-wrap: anywhere; }
.row-sub { font-size: var(--t-cap); color: var(--ink-2); line-height: var(--lh); overflow-wrap: anywhere; }
.row-sub strong { font-weight: var(--w-regular); color: var(--ink); }
.row-main > .status { margin-top: 2px; }
.row-bar { display: block; margin-top: var(--s1); }
.row-end { grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
.row-end:empty { display: none; }
.row-amt { font-size: var(--t-body); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.row-status { font-size: var(--t-cap); color: var(--ink-2); }
.row-chev { grid-column: 4; display: flex; color: var(--ink-2); }
.row-chev svg { width: var(--icon); height: var(--icon); }
.row.is-selected { background: var(--accent-soft); }
.row.is-focused { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r-ctl); }
/* the row with its one soft button: status marker and button share a line on phone */
.row-act { grid-template-columns: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "lead main end btn chev" "lead st end btn chev"; row-gap: 2px; }
.row-act.row-nolead { grid-template-columns: minmax(0, 1fr) auto auto auto; grid-template-areas: "main end btn chev" "st end btn chev"; }
.row-act > .row-lead { grid-area: lead; }
.row-act > .row-main { grid-area: main; }
.row-act-foot { display: contents; }
.row-act-foot > .row-act-status { grid-area: st; min-width: 0; }
.row-act > .row-end { grid-area: end; }
.row-hit { all: unset; display: block; font-size: var(--t-body); font-weight: var(--w-strong); line-height: var(--lh-title); color: var(--ink); overflow-wrap: anywhere; cursor: pointer; }
.row-hit::after { content: ""; position: absolute; inset: 0; z-index: 0; }
.row-act-foot > .row-btn { grid-area: btn; position: relative; z-index: 1; min-height: var(--ctl-h); }
.row-act > .row-chev { grid-area: chev; }
.row-act:active:not(:has(.row-btn:active)) { transform: scale(.98); background: var(--press); }
.row-act .row-check { position: relative; z-index: 1; }
@media (max-width: 759.98px) {
  .row { --row-lead-w: calc(56px * var(--text-scale)); }
  .rows-inset { --row-lead-w: calc(56px * var(--text-scale)); }
  .row-act { grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: "lead main end chev" "foot foot foot foot"; row-gap: var(--s2); }
  .row-act.row-nolead { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "main end chev" "foot foot foot"; }
  .row-act > .row-act-foot { grid-area: foot; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2); }
  .row-act-foot > .row-act-status { flex: 1 1 auto; max-width: 100%; white-space: nowrap; }   /* the marker stays whole; the button drops below when they cannot share the line */
  .row-act-foot > .row-btn { position: relative; z-index: 1; margin-left: auto; min-height: var(--ctl-h); padding: 0 var(--s2); }
}
/* group heading, count, and the quiet "Show all 14" */
.rows-head { display: flex; align-items: baseline; gap: var(--s2); margin: var(--s5) 0 var(--s2); font-size: var(--t-cap); font-weight: var(--w-strong); color: var(--ink-2); line-height: var(--lh-title); }
.rows-head:first-child { margin-top: 0; }
.rows-count { font-weight: var(--w-regular); font-variant-numeric: tabular-nums; }
.rows-more {
  display: flex; align-items: center; gap: var(--s2); width: 100%; min-height: var(--ctl-h); padding: 0;
  border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--accent);
  font: inherit; font-size: var(--t-body); font-weight: var(--w-strong); text-align: left; cursor: pointer;
  transition: transform var(--dur-press) ease-out;
}
.rows-more:active { transform: scale(.98); }
.rows-more:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r-ctl); }
.rows-more svg { width: var(--icon); height: var(--icon); }
@media (hover: hover) { .rows-more:hover { text-decoration: underline; text-underline-offset: 3px; } }

/* ================= Data table ================= */
.tbl-wrap { position: relative; min-width: 0; }
.tbl-scroll { position: relative; min-width: 0; overflow: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; --tbl-sticky-top: 0px; }
@media (max-width: 759.98px) { .tbl-scroll-phone { position: relative; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; --tbl-sticky-top: 0px; } }
.sheet-body, .drawer-body, .popover, .palette-list { --tbl-sticky-top: 0px; }
.tbl { width: 100%; font-size: var(--t-body); }
.tbl th, .tbl td { position: relative; padding: var(--s2) var(--s3); height: calc(56px * var(--text-scale)); border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl th:first-child, .tbl td:first-child { padding-left: 0; }
.tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.tbl thead th {
  position: sticky; top: var(--tbl-sticky-top, var(--sticky-top)); z-index: 2; height: calc(44px * var(--text-scale));
  background: var(--surface); color: var(--ink-2); border-bottom: 1px solid var(--line-2);
  font-size: var(--t-cap); font-weight: var(--w-strong); white-space: nowrap;
}
.tbl .num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.shrink, .tbl th.shrink { width: 1%; white-space: nowrap; }
.tbl tbody tr.is-link { cursor: pointer; }
.tbl tbody tr.is-selected td { background: var(--accent-soft); }
.tbl tbody tr.is-focused td { background: var(--hover); }
.tbl tbody tr.is-muted td { color: var(--ink-2); }
@media (hover: hover) { .tbl tbody tr:hover td { background: var(--hover); } }
.tbl tfoot td { height: calc(56px * var(--text-scale)); border-bottom: 0; border-top: 1px solid var(--line-2); font-weight: var(--w-strong); background: transparent; }
.tbl .cell-name { font-weight: var(--w-strong); color: var(--ink); }
.tbl .cell-sub { display: block; font-size: var(--t-cap); color: var(--ink-2); font-weight: var(--w-regular); }
.tbl-check { width: calc(48px * var(--text-scale)); }
.tbl-group td { height: calc(44px * var(--text-scale)); background: transparent; font-size: var(--t-cap); font-weight: var(--w-strong); color: var(--ink-2); }
.tbl-compact {}
.th-sort {
  display: inline-flex; align-items: center; gap: var(--s1); margin: 0 -6px; padding: var(--s1) 6px; border: 0; border-radius: var(--r-ctl);
  background: none; color: inherit; font: inherit; white-space: nowrap;
}
.th-sort .sort-ind { opacity: 0; width: 12px; height: 12px; transition: transform var(--dur-press); }
th[aria-sort="ascending"] .th-sort, th[aria-sort="descending"] .th-sort { color: var(--ink); }
th[aria-sort="ascending"] .sort-ind, th[aria-sort="descending"] .sort-ind { opacity: 1; }
th[aria-sort="descending"] .sort-ind { transform: rotate(180deg); }
th.num .th-sort { flex-direction: row-reverse; }
@media (hover: hover) { .th-sort:hover { color: var(--ink); background: var(--hover); } .th-sort:hover .sort-ind { opacity: .5; } }

/* ================= Phone list (legacy .clist) — hairline rows, no cards ================= */
.clist { border-top: 1px solid var(--line); }
.crow {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: var(--s3); row-gap: var(--s3); align-items: center;
  padding: var(--s4) 0; border-bottom: 1px solid var(--line); min-height: var(--row-h);
}
.crow.is-link { cursor: pointer; }
.crow.is-selected { background: var(--accent-soft); }
.crow-lead { grid-column: 1; align-self: start; }
.crow-main { grid-column: 2; min-width: 0; }
.crow-title { font-weight: var(--w-strong); font-size: var(--t-body); overflow-wrap: anywhere; }
.crow-sub { font-size: var(--t-cap); color: var(--ink-2); overflow-wrap: anywhere; margin-top: 2px; }
.crow-aside { grid-column: 3; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: var(--s1); }
.crow-actions { grid-column: 1 / -1; display: flex; gap: var(--s2); flex-wrap: wrap; }
.crow-actions .btn { flex: 1 1 auto; }
.crow-actions .btn-group { flex: 1 1 auto; display: flex; }
.crow-actions .btn-group > .btn-caret { flex: none; width: var(--btn-h); }

/* ================= Ledger ================= */
.ledger { width: 100%; font-size: var(--t-body); }
.ledger th, .ledger td { padding: var(--s2) var(--s3); height: calc(52px * var(--text-scale)); border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ledger th:first-child, .ledger td:first-child { padding-left: 0; }
.ledger th:last-child, .ledger td:last-child { padding-right: 0; }
.ledger thead th { height: calc(40px * var(--text-scale)); color: var(--ink-2); font-size: var(--t-cap); font-weight: var(--w-strong); border-bottom: 1px solid var(--line-2); }
.ledger .l-date { width: calc(76px * var(--text-scale)); font-family: var(--f-mono); font-size: var(--t-cap); color: var(--ink-2); white-space: nowrap; }
.ledger .l-desc { min-width: 0; }
.ledger .l-sub { display: block; font-size: var(--t-cap); color: var(--ink-2); line-height: var(--lh); }
.ledger .l-amt, .ledger .l-bal { text-align: right; width: 1%; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ledger .l-pay { color: var(--ink); }
.ledger .l-act { width: 1%; padding-left: var(--s1); }
.ledger-month td { height: calc(40px * var(--text-scale)); padding-top: var(--s3); vertical-align: bottom; color: var(--ink-2); background: transparent; font-size: var(--t-cap); font-weight: var(--w-strong); border-bottom: 1px solid var(--line-2); }
.ledger tr.is-void td { color: var(--ink-2); }
.ledger tr.is-void .l-desc-text, .ledger tr.is-void .l-amt { text-decoration: line-through; text-decoration-color: var(--ink-3); }
@media (max-width: 759.98px) {
  .ledger, .ledger tbody { display: block; width: 100%; }
  .ledger thead { display: none; }
  .ledger tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "date amt" "desc desc" "bal act"; column-gap: var(--s3); row-gap: 2px; padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
  .ledger td, .ledger th { display: block; height: auto; padding: 0; border: 0; width: auto; }
  .ledger .l-date { grid-area: date; width: auto; }
  .ledger .l-desc { grid-area: desc; }
  .ledger .l-amt { grid-area: amt; font-weight: var(--w-strong); text-align: right; }
  .ledger .l-amt:empty { display: none; }
  .ledger .l-bal { grid-area: bal; align-self: center; text-align: left; color: var(--ink-2); font-size: var(--t-cap); }
  .ledger .l-bal::before { content: "Balance after: "; }
  .ledger .l-act { grid-area: act; width: auto; justify-self: end; }
  .ledger tr.ledger-month { display: block; padding: var(--s4) 0 var(--s1); border-bottom: 1px solid var(--line-2); }
  .ledger tr.ledger-month td { padding: 0; height: auto; border: 0; }
}

/* ================= Section header ================= */
.sec { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; margin: var(--s7) 0 var(--s3); }
.sec:first-child { margin-top: 0; }
.sec-title { font-family: var(--f-ui); font-size: var(--t-lead); font-weight: var(--w-strong); line-height: var(--lh-title); color: var(--ink); }
.sec-meta { color: var(--ink-2); font-size: var(--t-cap); }
.sec-actions { margin-left: auto; display: flex; align-items: center; gap: var(--s2); }
.sec-sm .sec-title { font-size: var(--t-cap); color: var(--ink-2); }

/* ================= Key / value rows ================= */
.kv { display: grid; grid-template-columns: minmax(110px, 34%) minmax(0, 1fr); }
.kv > dt, .kv > dd { padding: var(--s3) 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv > dt { color: var(--ink-2); font-size: var(--t-cap); padding-right: var(--s3); }
.kv > dd { overflow-wrap: anywhere; }
.kv > dt:first-of-type, .kv > dt:first-of-type + dd { border-top: 1px solid var(--line); }
.kv-plain > dt, .kv-plain > dd { border: 0 !important; padding: var(--s1) 0; }

.copyline { display: inline-flex; align-items: center; gap: var(--s2); max-width: 100%; flex-wrap: wrap; }
.copyline-text { user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }

/* ================= Empty state: one sentence + one action, no illustration ================= */
.empty { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: var(--s3); padding: var(--s5) 0; color: var(--ink-2); }
.empty-icon { display: none; }
.empty-title { font-size: var(--t-body); font-weight: var(--w-regular); color: var(--ink); }
.empty-body { max-width: 52ch; font-size: var(--t-body); }
.empty-actions { display: flex; flex-wrap: wrap; gap: var(--s2); }
.empty-quiet { padding: var(--s4) 0; color: var(--ink-2); font-size: var(--t-body); }

.firstrun { max-width: 640px; margin: var(--s5) auto 0; }
.firstrun-head { padding-bottom: var(--s5); }
.firstrun-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-display); font-weight: var(--w-regular); line-height: var(--lh-display); letter-spacing: -0.01em; }
.firstrun-lede { margin-top: var(--s3); color: var(--ink-2); font-size: var(--t-body); max-width: 52ch; }
.firstrun-opts { border-top: 1px solid var(--line); }
.firstrun-opt {
  display: grid; grid-template-columns: calc(48px * var(--text-scale)) minmax(0, 1fr) auto; gap: var(--s4); align-items: center; width: 100%;
  padding: var(--s4) 0; min-height: calc(80px * var(--text-scale)); border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; color: var(--ink);
  transition: transform var(--dur-press) ease-out;
}
.firstrun-opt:active { transform: scale(.98); }
.firstrun-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (hover: hover) { .firstrun-opt:hover { background: var(--hover); } }
.firstrun-ico { width: calc(48px * var(--text-scale)); height: calc(48px * var(--text-scale)); display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: var(--r-ctl); color: var(--accent); }
.firstrun-opt-title { font-weight: var(--w-strong); font-size: var(--t-body); }
.firstrun-opt-sub { color: var(--ink-2); font-size: var(--t-cap); margin-top: 2px; }
.firstrun-opt .chev { color: var(--ink-2); }

/* ================= Skeleton ================= */
.skel { display: block; background: var(--sunk); border-radius: var(--r-ctl); animation: rb-pulse 1.4s ease-in-out infinite; }
.skel-line { height: 10px; margin: var(--s3) 0; }
.skel-title { height: 22px; width: 40%; margin: var(--s1) 0 var(--s4); }
.skel-row { display: flex; align-items: center; gap: var(--s3); height: var(--row-h); border-bottom: 1px solid var(--line); }
.skel-row .skel { height: 10px; }
.skel-plate { width: 48px; height: 24px !important; }
.loading-note { display: flex; align-items: center; gap: var(--s2); color: var(--ink-2); font-size: var(--t-cap); padding: var(--s2) 0 var(--s4); }
@keyframes rb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* ================= Progress / bullet bar ================= */
.bar { position: relative; display: flex; height: 8px; background: var(--sunk); border-radius: var(--r-round); overflow: hidden; }
.bar-seg { height: 100%; background: var(--accent); flex: none; }
.bar-seg-ok { background: var(--ok); }
.bar-seg-warn { background: var(--warn); }
.bar-seg-bad { background: var(--bad); }
.bar-seg-soft { background: var(--line-2); }
.bar-mark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); }
.bar-lg { height: 12px; }
.bar-thin { height: 4px; }
.bar-legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); margin-top: var(--s3); font-size: var(--t-cap); color: var(--ink); }
.bar-key { display: inline-flex; align-items: center; gap: var(--s2); }
.bar-key::before { content: ""; width: 12px; height: 12px; background: var(--key, var(--accent)); }
.bar-key-ok { --key: var(--ok); } .bar-key-warn { --key: var(--warn); } .bar-key-bad { --key: var(--bad); } .bar-key-soft { --key: var(--line-2); }

.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 var(--s1);
  border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink-2);
  font-family: var(--f-mono); font-size: var(--t-cap); font-weight: var(--w-regular); line-height: 1; white-space: nowrap;
}

/* ================= Banner strip: one line, one link, never taller than 96px ================= */
.banner {
  display: flex; align-items: center; gap: 0 var(--s2); flex-wrap: nowrap; min-height: 48px; max-height: 96px; overflow: hidden;
  padding: 0 var(--gutter); background: var(--tint); color: var(--ink); border-bottom: 1px solid var(--line);
  font-size: var(--t-cap);
}
.banner-text { flex: 0 1 auto; min-width: 0; }
.banner-text strong { font-weight: var(--w-strong); }
.banner-actions { display: flex; gap: var(--s1); flex: none; }
.banner .btn-link { white-space: nowrap; padding: 0; }
.banner .btn-link { font-size: var(--t-cap); min-height: 48px; }
.banner-warn { background: var(--tint); }

/* ================= Floating layers ================= */
.layer { position: relative; z-index: 100; }
.scrim { position: fixed; inset: 0; background: var(--scrim); animation: rb-fade var(--dur) var(--ease-sheet); }
@keyframes rb-fade { from { opacity: 0; } }
@keyframes rb-fade-out { to { opacity: 0; } }

.menu {
  position: fixed; z-index: 120; min-width: calc(240px * var(--text-scale)); max-width: min(380px, calc(100vw - 16px)); max-height: min(420px, calc(100vh - 16px)); overflow-y: auto;
  padding: var(--s1); background: var(--surface); border-radius: var(--r-panel); box-shadow: var(--shadow-float);
  animation: rb-menu-in var(--dur-menu) var(--ease);
}
@keyframes rb-menu-in { from { opacity: 0; transform: translateY(-4px); } }
.menu-item {
  display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: var(--ctl-h); padding: var(--s2) var(--s3);
  border: 0; border-radius: var(--r-ctl); background: none; color: var(--ink); text-align: left; font-size: var(--t-body); text-decoration: none;
}
.menu-item:hover { text-decoration: none; }
.menu-item svg { color: var(--ink-2); width: var(--icon); height: var(--icon); }
.menu-item:focus-visible, .menu-item.is-active { background: var(--hover); outline: none; }
.menu-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (hover: hover) { .menu-item:hover { background: var(--hover); } }
.menu-item.is-danger, .menu-item.is-danger svg { color: var(--bad); }
.menu-item:disabled { opacity: .45; }
.menu-item .menu-hint { margin-left: auto; padding-left: var(--s3); color: var(--ink-2); font-size: var(--t-cap); }
.menu-sep { height: 1px; margin: var(--s1) var(--s2); background: var(--line); }
.menu-label { padding: var(--s3) var(--s3) var(--s1); font-size: var(--t-cap); font-weight: var(--w-strong); color: var(--ink-2); }
.popover { position: fixed; z-index: 120; max-width: min(360px, calc(100vw - 16px)); padding: var(--s3); background: var(--surface); border-radius: var(--r-panel); box-shadow: var(--shadow-float); animation: rb-menu-in var(--dur-menu) var(--ease); }

/* ---- Drawer: right side on desktop, full screen on phone ---- */
.drawer {
  position: fixed; z-index: 110; top: 0; right: 0; bottom: 0; width: min(520px, 100vw);
  display: flex; flex-direction: column;
  background: var(--surface); box-shadow: var(--shadow-modal);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
  animation: rb-drawer-in var(--dur) var(--ease-sheet);
}
.drawer-scrim { background: var(--scrim); }
.drawer.is-closing { animation: rb-drawer-out 180ms ease-in forwards; }
@keyframes rb-drawer-in { from { transform: translateX(32px); opacity: 0; } }
@keyframes rb-drawer-out { to { transform: translateX(32px); opacity: 0; } }
.drawer-head { display: flex; align-items: flex-start; gap: var(--s3); padding: var(--s5) var(--s5) var(--s4); border-bottom: 1px solid var(--line); flex: none; }
.drawer-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-title); font-weight: var(--w-regular); line-height: var(--lh-title); min-width: 0; overflow-wrap: anywhere; }
.drawer-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: var(--s1) var(--s5) var(--s6); }
.drawer-foot { flex: none; display: flex; gap: var(--s2); padding: var(--s3) var(--s5); border-top: 1px solid var(--line); }
.drawer-close { margin-left: auto; flex: none; }
.drawer-close .close-phone { display: none; }
@media (max-width: 759.98px) {
  .drawer-close .close-desk { display: none; } .drawer-close .close-phone { display: inline; } .drawer-close { order: -1; margin-left: calc(-1 * var(--s2)); margin-right: auto; }
  .drawer { width: 100vw; padding-left: env(safe-area-inset-left, 0px); }
  .drawer-head { padding: var(--s3) max(16px, env(safe-area-inset-left, 0px)); }
  .drawer-body { padding: var(--s1) var(--s4) var(--s6); }
  .drawer-foot { padding: var(--s3) var(--s4); }
}

/* ---- Sheet: centred modal on desktop, bottom sheet on phone. Radius 16, shadow only. ---- */
.sheet-wrap { position: fixed; inset: 0; z-index: 115; display: flex; align-items: flex-start; justify-content: center; padding: 10vh var(--s4) var(--s4); overflow-y: auto; }
.sheet {
  position: relative; width: 100%; max-width: calc(540px * var(--text-scale)); display: flex; flex-direction: column; max-height: 84vh;
  background: var(--surface); border-radius: var(--r-sheet); box-shadow: var(--shadow-modal);
  animation: rb-sheet-in var(--dur) var(--ease-sheet);
}
.sheet-wide { max-width: calc(720px * var(--text-scale)); }
.sheet-xwide { max-width: 960px; }
.sheet-page { max-width: calc(720px * var(--text-scale)); }
.sheet.is-closing { animation: rb-sheet-out 180ms ease-in forwards; }
@keyframes rb-sheet-in { from { transform: translateY(16px); opacity: 0; } }
@keyframes rb-sheet-out { to { transform: translateY(16px); opacity: 0; } }
.sheet-head { display: flex; align-items: flex-start; gap: var(--s3); padding: var(--s5) var(--s5) var(--s3); flex: none; }
.sheet-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-title); font-weight: var(--w-regular); line-height: var(--lh-title); overflow-wrap: anywhere; }
.sheet-sub { font-size: var(--t-cap); color: var(--ink-2); margin-top: var(--s1); }
.sheet-close { margin: calc(-1 * var(--s2)) calc(-1 * var(--s3)) 0 auto; flex: none; }
.sheet-body { flex: 1 1 auto; overflow-y: auto; padding: var(--s1) var(--s5) var(--s5); min-height: 0; }
.sheet-foot { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: var(--s3); padding: var(--s3) var(--s5); border-top: 1px solid var(--line); flex-wrap: wrap; }
.sheet-foot .sheet-foot-note { margin-right: auto; color: var(--ink); font-size: var(--t-body); flex: 1 1 100%; }
.sheet-foot .sheet-foot-note:empty { display: none; }
.sheet-foot .btn { min-height: var(--ctl-h-lg); padding: 0 var(--s5); }
.sheet form { display: contents; }
.sheet-foot.is-empty { display: none; }
.sheet-grabber { display: none; }
@media (max-width: 759.98px) {
  .sheet-wrap { align-items: flex-end; padding: 0; }
  .sheet, .sheet-wide, .sheet-xwide, .sheet-page { max-width: none; max-height: 92vh; border-radius: var(--r-sheet) var(--r-sheet) 0 0; animation-name: rb-sheet-up; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet.is-closing { animation-name: rb-sheet-down; }
  .sheet-grabber { display: block; width: 36px; height: 4px; border-radius: var(--r-round); background: var(--line-2); margin: var(--s2) auto 0; flex: none; }
  .sheet-head { padding: var(--s3) var(--s4); }
  .sheet-body { padding: var(--s1) var(--s4) var(--s4); }
  .sheet-foot { padding: var(--s3) var(--s4); }
  .sheet-foot .btn { flex: 1 1 auto; }
  .sheet-foot .btn-primary, .sheet-foot .btn-danger { flex-basis: 100%; order: -1; }
  .sheet-foot .sheet-foot-note { order: -2; }
  .sheet-foot .btn-keep { flex-basis: 100%; order: -1; }
  .sheet-foot .btn-keep ~ .btn-danger, .sheet-foot .btn-danger:has(~ .btn-keep) { order: 0; }
}
@keyframes rb-sheet-up { from { transform: translateY(48px); opacity: 0; } }
@keyframes rb-sheet-down { to { transform: translateY(48px); opacity: 0; } }

/* ---- Toast: never over a sheet (dismissed when one opens; one raised while a sheet is open goes to the top) ---- */
.toasts {
  position: fixed; z-index: 130; left: 50%; transform: translateX(-50%);
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: var(--s3); width: max-content; max-width: min(640px, calc(100vw - 32px)); pointer-events: none;
}
.toasts.is-top { bottom: auto; top: calc(16px + env(safe-area-inset-top, 0px)); }
.toast {
  display: flex; align-items: center; gap: var(--s3); min-height: calc(64px * var(--text-scale)); max-width: 100%; padding: var(--s2) var(--s2) var(--s2) var(--s4);
  background: var(--toast-bg); color: var(--toast-ink); border-radius: var(--r-panel); box-shadow: var(--shadow-float);
  font-size: var(--t-body); line-height: var(--lh-title); pointer-events: auto; animation: rb-toast-in var(--dur-menu) var(--ease);
}
.toast.is-closing { animation: rb-toast-out var(--dur-menu) ease-in forwards; }
.toast-msg { min-width: 0; }
.toast-ico { color: var(--toast-accent); }
.toast-action {
  flex: none; display: inline-flex; align-items: center; gap: var(--s2); min-height: var(--ctl-h); padding: 0 var(--s5); border: 0; border-radius: var(--r-ctl); background: var(--toast-accent);
  color: var(--toast-bg); font-weight: var(--w-strong); font-size: var(--t-body);
  transition: transform var(--dur-press) ease-out;
}
.toast-action:active { transform: scale(.98); }
.toast-action:focus-visible { outline: 2px solid var(--toast-ink); outline-offset: 2px; }
.toast-x { flex: none; min-height: var(--ctl-h); padding: 0 var(--s3); display: inline-flex; align-items: center; border: 0; background: none; color: var(--toast-ink); border-radius: var(--r-ctl); font-size: var(--t-cap); font-weight: var(--w-regular); text-decoration: underline; text-underline-offset: 3px; }
.toast-x:focus-visible { outline: 2px solid var(--toast-accent); outline-offset: 0; }
@media (hover: hover) { .toast-x:hover { background: var(--toast-hover); } }
.toast-bad .toast-ico { color: var(--bad); }
@keyframes rb-toast-in { from { transform: translateY(8px); opacity: 0; } }
@keyframes rb-toast-out { to { transform: translateY(8px); opacity: 0; } }
@media (max-width: 759.98px) {
  .toasts { bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom, 0px)); width: calc(100vw - 24px); }
  .toast { width: 100%; flex-wrap: wrap; row-gap: var(--s2); padding: var(--s3); }
  .toast-msg { flex: 1 1 100%; padding: 0 var(--s1); }
  .toast-ico { display: none; }
  .toast-action { flex: 1 1 auto; justify-content: center; }
}

/* ---- Find (palette) ---- */
.palette-wrap { position: fixed; inset: 0; z-index: 125; display: flex; justify-content: center; align-items: flex-start; padding: 12vh var(--s4) var(--s4); }
.palette {
  position: relative; width: 100%; max-width: 600px; display: flex; flex-direction: column; max-height: 70vh;
  background: var(--surface); border-radius: var(--r-sheet); box-shadow: var(--shadow-modal);
  animation: rb-sheet-in var(--dur) var(--ease-sheet); overflow: hidden;
}
.palette-head { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4); border-bottom: 1px solid var(--line); flex: none; }
.palette-head svg { color: var(--ink-2); }
.palette-input { flex: 1 1 auto; height: calc(60px * var(--text-scale)); border: 0; background: none; font-size: var(--t-lead); color: var(--ink); min-width: 0; }
.palette-input:focus { outline: none; }
.palette-input::placeholder { color: var(--ink-2); }
.palette-list { overflow-y: auto; padding: var(--s2); flex: 1 1 auto; }
.palette-group { padding: var(--s3) var(--s3) var(--s1); font-size: var(--t-cap); font-weight: var(--w-strong); color: var(--ink-2); }
.palette-item {
  display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: var(--ctl-h-lg); padding: var(--s2) var(--s3);

/* ================= Misc building blocks ================= */

/* sticky bottom action bar (bulk mode): shadow only */

  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; padding: var(--s2) var(--s2) var(--s2) var(--s4); max-width: calc(100vw - 32px); font-size: var(--t-body);

}
@media (min-width: 760px) { .actionbar { margin-left: calc(var(--rail-w) / 2); } }
@media (max-width: 759.98px) { .actionbar { bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; transform: none; } }

.totals { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s6); padding: var(--s4) 0; border-top: 1px solid var(--line-2); }
.totals > div { display: flex; flex-direction: column; gap: 2px; }

.tl { position: relative; }
.tl-item { display: grid; grid-template-columns: calc(84px * var(--text-scale)) minmax(0, 1fr) auto; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line); align-items: start; }
.tl-when { font-family: var(--f-mono); font-size: var(--t-cap); color: var(--ink-2); white-space: nowrap; }

.lrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s4); align-items: center; padding: var(--s4) 0; border-bottom: 1px solid var(--line); }
.lrow-lead { align-self: start; }
.lrow-title { font-weight: var(--w-strong); font-size: var(--t-body); }
.lrow-detail { color: var(--ink); font-size: var(--t-body); margin-top: 2px; }
.lrow-actions { display: flex; gap: var(--s2); align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.lrow-sev { width: 8px; height: 8px; border-radius: var(--r-round); display: inline-block; }
.sev-high { background: var(--bad); } .sev-medium { background: var(--warn); } .sev-low { background: var(--line-2); }
@media (max-width: 759.98px) { .lrow { grid-template-columns: auto minmax(0, 1fr); } .lrow-actions { grid-column: 1 / -1; justify-content: flex-start; } }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: var(--r-round); background: var(--ink-3); flex: none; }
.dot-ok { background: var(--ok); } .dot-warn { background: var(--warn); } .dot-bad { background: var(--bad); } .dot-accent { background: var(--accent); }
.dot-pulse { animation: rb-pulse 1.2s ease-in-out infinite; }

.is-readonly [data-write] { opacity: .5; pointer-events: none; }

.prewrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.code-block { font-family: var(--f-mono); font-size: var(--t-cap); white-space: pre; overflow: auto; max-height: 50vh; padding: var(--s3); background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-ctl); color: var(--ink); width: 100%; resize: vertical; }

/* "Keep it" in confirm sheets: larger and calmer than the red button beside it */
.btn-keep { --btn-h: var(--ctl-h-lg); background: var(--surface); border: 2px solid var(--ink-2); color: var(--ink); padding: 0 var(--s6); }
@media (hover: hover) { .btn-keep:hover { background: var(--hover); } }

/* ================= One choice control (law 8): radio cards for 2–4 options ================= */
.choices { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s2); }
.choices-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.choice { position: relative; display: block; cursor: pointer; min-width: 0; }

.choice-body {
  display: flex; align-items: center; gap: var(--s3); min-height: var(--ctl-h-lg); padding: var(--s2) var(--s4);
  border: 2px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink);

  border: 2px solid var(--ink-2); background: var(--surface); box-sizing: border-box;
}

.choice-text { display: flex; flex-direction: column; min-width: 0; }
.choice-label { font-weight: var(--w-strong); }
.choice-sub { font-size: var(--t-cap); color: var(--ink-2); font-weight: var(--w-regular); }

.choice > input:checked + .choice-body > svg { color: var(--accent); }

/* "Add more details (optional)" */
.more-details { border-top: 1px solid var(--line); }
.more-details-sum {
  display: flex; align-items: center; gap: var(--s2); min-height: var(--ctl-h); padding: var(--s1) 0; cursor: pointer; list-style: none;
  color: var(--accent); font-size: var(--t-body); font-weight: var(--w-strong);
}

.more-details-sum:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-ctl); }
.more-details-chev { transition: transform var(--dur-menu); }
.more-details[open] .more-details-chev { transform: rotate(90deg); }
.more-details-body { display: flex; flex-direction: column; gap: var(--s5); padding: var(--s3) 0 var(--s2); }

/* "Which tenant?" chooser (ui.pickTenant) — canonical rows */
.pick-find { margin-bottom: var(--s3); }
.pick-find > .input { height: var(--ctl-h-lg); font-size: var(--t-lead); }
.pick-empty { padding: var(--s5) 0; color: var(--ink-2); font-size: var(--t-body); }
.pick-skip { margin-bottom: var(--s3); justify-content: flex-start; }

/* "What would you like to do?" (ui.choices) */
.choices-list .row { min-height: var(--ctl-h-xl); }
.choices-list .row-title.is-danger { color: var(--ink); }

/* step-by-step guide (ui.steps) */
.steps-head { margin-bottom: var(--s4); }
.steps-count { font-size: var(--t-cap); font-weight: var(--w-regular); color: var(--ink-2); }
.steps-title { font-size: var(--t-lead); font-weight: var(--w-strong); margin-top: 2px; }
.steps-summary { padding: var(--s4); background: var(--tint); border-radius: var(--r-panel); font-size: var(--t-lead); }

/* text size control: three "A" buttons on one row, the chosen size written beneath */
.textsize { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.textsize-label { font-size: var(--t-cap); font-weight: var(--w-strong); color: var(--ink); }
.textsize-seg { align-self: stretch; display: flex; }

.textsize-seg .textsize-lg { font-size: var(--t-lead); }
.textsize-seg .textsize-xl { font-size: var(--t-title); }
.textsize-now { font-size: var(--t-cap); color: var(--ink-2); }
.textsize-words > button { font-family: var(--f-ui); font-size: var(--t-cap) !important; }

/* thin two-tone bar: paid share of a month, to scale — neutral, not red */
.splitbar { display: block; position: relative; height: 6px; width: 100%; max-width: 280px; border-radius: var(--r-round); background: var(--line); overflow: hidden; }
.splitbar-paid { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
/* ---- 30-shell.css ---- */
/* App chrome: rail (desktop), icon rail (<1100px), bottom tab bar (<760px), top bar, work column. v3 (SPEC §10.3 Shell). */
.app { min-height: 100%; display: flex; flex-direction: column; }

/* ---- Rail ---- */
.rail {
  position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: calc(var(--rail-w) + env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: var(--s1);
  padding: calc(16px + env(safe-area-inset-top, 0px)) var(--s3) calc(16px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px));
  background: var(--paper); color: var(--ink-2);
  overflow-y: auto; scrollbar-width: thin;
}
.rail-brand { display: flex; align-items: center; gap: var(--s3); padding: var(--s1) var(--s2) var(--s4); color: var(--ink); text-decoration: none; min-width: 0; border-radius: var(--r-ctl); }
.rail-brand:hover { text-decoration: none; }
.rail-brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rail-mark {
  flex: none; display: grid; place-items: center; width: calc(36px * var(--text-scale)); height: calc(36px * var(--text-scale));
  border: 1px solid var(--ink); border-radius: var(--r-ctl);
  font-family: var(--f-mono); font-size: var(--t-cap); font-weight: var(--w-regular); color: var(--ink);
}
.rail-brand-text { display: flex; flex-direction: column; min-width: 0; }
.rail-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-lead); font-weight: var(--w-regular); line-height: var(--lh-title); }
.rail-sub { font-size: var(--t-cap); color: var(--ink-2); overflow-wrap: anywhere; line-height: var(--lh-title); }
.rail-sub:empty { display: none; }
.rail-nav { display: flex; flex-direction: column; gap: 2px; }
.rail-link {
  position: relative; display: flex; align-items: center; gap: var(--s3); min-height: var(--ctl-h); padding: 0 var(--s3);
  border-radius: var(--r-ctl); color: var(--ink); font-size: var(--t-body); font-weight: var(--w-regular); text-decoration: none;
  transition: transform var(--dur-press) ease-out;
}
.rail-link:active { transform: scale(.98); }
.rail-link svg { color: var(--ink-2); }

.rail-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (hover: hover) { .rail-link:hover { background: var(--hover); text-decoration: none; } }
/* the one badge (Today): neutral, never red */
.rail-count {
  margin-left: auto; min-width: calc(28px * var(--text-scale)); padding: 0 var(--s2); border-radius: var(--r-round); text-align: center;
  background: var(--sunk); color: var(--ink); font-size: var(--t-cap); font-weight: var(--w-strong); font-variant-numeric: tabular-nums; line-height: var(--lh);
}
.rail-foot { margin-top: auto; padding: var(--s4) 0 0; display: flex; flex-direction: column; gap: var(--s3); font-size: var(--t-cap); color: var(--ink-2); }
.rail-foot-row { display: flex; align-items: flex-start; gap: var(--s2); }
.rail-help { flex: none; justify-content: flex-start; padding: 0 var(--s2); }
.rail-help svg { color: var(--accent); }
.rail-textsize { flex: 1 1 auto; min-width: 0; }
.rail-textsize .textsize-seg > button { min-height: var(--ctl-h); }
.sync-note { display: flex; align-items: center; gap: var(--s2); line-height: var(--lh-title); font-size: var(--t-cap); color: var(--ink-2); }

/* ---- Work column ---- */
.work {
  position: relative; flex: 1 0 auto;
  margin-left: calc(var(--rail-w) + env(safe-area-inset-left, 0px));
  background: var(--surface); border-left: 1px solid var(--line);
  padding-right: env(safe-area-inset-right, 0px);
  display: flex; flex-direction: column; min-width: 0;
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; flex: none;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-inner { display: flex; align-items: center; gap: var(--s3); min-height: var(--top-h); max-width: 1240px; margin: 0 auto; padding: var(--s2) var(--gutter); }
.topbar-brand { display: none; text-decoration: none; flex: none; border-radius: var(--r-ctl); }
.topbar-brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* law 12: titles wrap, never truncate */
.topbar-title { flex: 1 1 auto; font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-title); font-weight: var(--w-regular); line-height: var(--lh-title); min-width: 0; overflow-wrap: anywhere; }
.topbar-note { flex: none; }
.topbar-search { width: calc(320px * var(--text-scale)); flex: 0 1 calc(320px * var(--text-scale)); min-width: 160px; }
.topbar-search > .input { height: var(--ctl-h); }
.topbar-findbtn { display: none; }
.view { flex: 1 0 auto; width: 100%; max-width: 1240px; margin: 0 auto; padding: var(--s6) var(--gutter) var(--s8); min-width: 0; }
.view:focus { outline: none; }
.view-head { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s5); }
.view-summary { color: var(--ink); font-size: var(--t-body); font-variant-numeric: tabular-nums; min-width: 0; }
.view-summary strong { color: var(--ink); font-weight: var(--w-strong); }

.tabbar { display: none; }

/* ---- Icon rail 760–1099: icons with their words underneath ---- */
@media (max-width: 1099.98px) {
  .rail { padding-left: calc(8px + env(safe-area-inset-left, 0px)); padding-right: var(--s2); align-items: stretch; }
  .rail-brand { padding: var(--s1) 0 var(--s3); justify-content: center; }
  .rail-brand-text, .rail-count, .rail-textsize { display: none; }
  .rail-link { flex-direction: column; justify-content: center; gap: 2px; min-height: calc(64px * var(--text-scale)); padding: var(--s1) 2px; text-align: center; }
  .rail-link-label { font-size: var(--t-cap); line-height: var(--lh-title); overflow-wrap: anywhere; }
  .rail-link[aria-current="page"]::before { left: var(--s2); right: var(--s2); top: 0; bottom: auto; width: auto; height: 3px; }
  .rail-foot { align-items: stretch; padding: var(--s3) 0 0; }
  .rail-foot-row { flex-direction: column; }
  .rail-help { flex-direction: column; gap: 2px; padding: var(--s1) 2px; min-height: calc(64px * var(--text-scale)); justify-content: center; width: 100%; }
  .topbar-search { width: 220px; flex-basis: 220px; }
}

/* ---- Phone ---- */
@media (max-width: 759.98px) {
  .rail { display: none; }
  .work { margin-left: 0; border-left: 0; padding-right: 0; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); }
  .topbar-inner { padding: var(--s2) max(16px, env(safe-area-inset-right, 0px)) var(--s2) max(16px, env(safe-area-inset-left, 0px)); gap: var(--s2); }
  .topbar-brand { display: inline-flex; }
  .topbar-brand .rail-mark { width: var(--ctl-h); height: var(--ctl-h); }
  .topbar-search { display: none; }
  .topbar-findbtn { display: inline-flex; flex: none; padding: 0 var(--s3); }
  .view { padding: var(--s4) max(16px, env(safe-area-inset-right, 0px)) var(--s5) max(16px, env(safe-area-inset-left, 0px)); }
  .banner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tabbar {
    position: fixed; z-index: 40; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: var(--surface); border-top: 1px solid var(--line-2);
  }
  .tab {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 0; background: none; color: var(--ink-2); font-size: var(--t-cap); font-weight: var(--w-regular); text-decoration: none; min-width: 0;
    transition: transform var(--dur-press) ease-out;
  }
  .tab:active { transform: scale(.98); }
  .tab svg { width: calc(22px * var(--text-scale)); height: calc(22px * var(--text-scale)); }
  .tab-label { max-width: 100%; padding: 0 2px; line-height: var(--lh-title); white-space: nowrap; }
  .tab:hover { text-decoration: none; }
  .tab[aria-current="page"] { color: var(--accent); font-weight: var(--w-strong); }
  .tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; background: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r-ctl); }
  .tab-badge { position: absolute; top: var(--s1); left: calc(50% + 8px); min-width: calc(22px * var(--text-scale)); padding: 0 var(--s1); border-radius: var(--r-round); background: var(--ink); color: var(--surface); font-size: var(--t-cap); font-weight: var(--w-strong); line-height: var(--lh); text-align: center; }
}
/* Extra large on a phone: the five tab labels stay on one line by giving the icon less room */
@media (max-width: 759.98px) { :root[data-text="xl"] .tab svg { width: 20px; height: 20px; } }

/* ---- More sheet (phone) ---- */
.more-list { display: flex; flex-direction: column; gap: var(--s1); }
.more-list .menu-item { min-height: var(--ctl-h-lg); font-size: var(--t-body); }

/* ---- Help: "How do I…?" ---- */
.help-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--s6); }
.help-item { padding: var(--s4) 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; align-items: flex-start; gap: var(--s2); min-width: 0; }
.help-q { font-size: var(--t-body); font-weight: var(--w-strong); line-height: var(--lh-title); }

.help-go { white-space: normal; text-align: left; }
.help-foot { margin-top: var(--s5); display: flex; flex-direction: column; gap: var(--s3); max-width: 420px; }
@media (max-width: 759.98px) { .help-list { grid-template-columns: minmax(0, 1fr); } .help-go { width: 100%; justify-content: space-between; } }

/* ---- Keyboard shortcuts sheet ---- */
.keys { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 var(--s6); }
.keys-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line); font-size: var(--t-cap); }
