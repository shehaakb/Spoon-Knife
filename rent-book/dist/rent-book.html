:root {

/* ---- 10-base.css ---- */
/* Base: element defaults, typography, utilities. */
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: var(--t-body);
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, p, dl, dd, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
svg { display: block; flex: none; }
table { border-collapse: separate; border-spacing: 0; }
::selection { background: var(--accent-soft); color: var(--ink); }
hr { border: 0; border-top: 1px solid var(--line); margin: var(--s4) 0; }

:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }

/* ---- type ---- */
.display { font-family: var(--f-display); font-optical-sizing: auto; font-weight: 400; letter-spacing: -0.005em; }
.t-12 { font-size: var(--t-12); }
.t-13 { font-size: var(--t-13); }
.t-15 { font-size: var(--t-15); }
.t-18 { font-size: var(--t-18); }
.t-24 { font-size: var(--t-24); line-height: 1.2; }
.t-34 { font-size: var(--t-34); line-height: 1.1; }
.h-view { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); font-weight: 500; line-height: 1.2; }
.micro {
  font-size: var(--t-micro); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
}
.mono { font-family: var(--f-mono); font-size: .93em; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.strong { font-weight: 600; }
.medium { font-weight: 500; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.tone-ok { color: var(--ok); }
.tone-warn { color: var(--warn); }
.tone-bad { color: var(--bad); }
.tone-accent { color: var(--accent); }

/* ---- layout utilities ---- */
.row { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.row-wrap { flex-wrap: wrap; }
.row-top { align-items: flex-start; }
.row-base { align-items: baseline; }
.gap-1 { gap: var(--s1); } .gap-3 { gap: var(--s3); } .gap-4 { gap: var(--s4); } .gap-5 { gap: var(--s5); }
.stack { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.stack-1 { gap: var(--s1); } .stack-3 { gap: var(--s3); } .stack-4 { gap: var(--s4); } .stack-5 { gap: var(--s5); } .stack-6 { gap: var(--s6); }
.spacer { flex: 1 1 auto; }
.grow { flex: 1 1 auto; min-width: 0; }
.mt-2 { margin-top: var(--s2); } .mt-4 { margin-top: var(--s4); } .mt-5 { margin-top: var(--s5); } .mt-6 { margin-top: var(--s6); }
.mb-2 { margin-bottom: var(--s2); } .mb-4 { margin-bottom: var(--s4); }
.vh {

  clip-path: inset(50%); white-space: nowrap; margin: -1px; padding: 0; border: 0;

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); }
.rule { border-top: 1px solid var(--line); }

/* ---- 20-components.css ---- */
/* Component library. See docs/CONTRACT.md §CSS for markup of each component. */

/* ================= Buttons ================= */
.btn {
  --btn-h: var(--ctl-h);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: var(--btn-h); min-width: var(--btn-h); padding: 0 12px;
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  background: var(--surface); color: var(--ink);
  font-size: var(--t-13); font-weight: 500; line-height: 1; white-space: nowrap;
  text-decoration: none; user-select: none; -webkit-user-select: none;
  transition: background-color 120ms, border-color 120ms, color 120ms;
}
.btn:hover { background: var(--hover); text-decoration: none; }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.btn[aria-busy="true"] { opacity: .7; pointer-events: none; }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn-soft:hover { background: var(--accent-soft); border-color: var(--accent-line); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--hover); color: var(--ink); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.btn-danger:hover { background: var(--bad); border-color: var(--bad); filter: brightness(.94); }
.btn-danger-soft { background: transparent; border-color: var(--bad-line); color: var(--bad); }
.btn-danger-soft:hover { background: var(--bad-soft); }
.btn-icon { padding: 0; width: var(--btn-h); }
.btn-sm { --btn-h: var(--ctl-h-sm); padding: 0 10px; font-size: var(--t-12); }
.btn-sm.btn-icon { padding: 0; }
.btn-lg { --btn-h: var(--ctl-h-lg); padding: 0 18px; font-size: var(--t-15); }
.btn-block { width: 100%; }
.btn .btn-sub { font-weight: 400; opacity: .75; }
/* split button: [Mark paid][▾] */
.btn-group { display: inline-flex; }
.btn-group > .btn:not(:last-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.btn-group > .btn:not(:first-child) { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; }
.btn-group > .btn-primary + .btn-primary { border-left-color: var(--accent-hover); }
.btn-group > .btn-caret { width: 28px; min-width: 28px; padding: 0; }
.btn-group > .btn:focus-visible { position: relative; z-index: 1; }
/* text-only link button */
.linkbtn {
  display: inline; padding: 0; border: 0; background: none; color: var(--accent);
  font: inherit; font-weight: 500; text-decoration: none; cursor: pointer;
}
.linkbtn:hover { text-decoration: underline; text-underline-offset: 2px; }
.linkbtn-muted { color: var(--ink-2); }

/* ================= Inputs ================= */
.input {
  display: block; width: 100%; height: var(--ctl-h); padding: 0 10px;
  background: var(--sunk); color: var(--ink);
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  font-size: var(--t-13); font-variant-numeric: tabular-nums;
  transition: border-color 120ms, background-color 120ms, box-shadow 120ms;
  -webkit-appearance: none; appearance: none;
}
.input::placeholder { color: var(--ink-3); opacity: 1; }
.input:hover { border-color: var(--ink-3); }
.input:focus, .input:focus-visible { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.input:disabled, .input[readonly] { opacity: .6; }
textarea.input, .textarea { height: auto; min-height: 84px; padding: 8px 10px; line-height: 1.45; resize: vertical; }
input[type="date"].input { min-width: 0; }
input[type="date"].input::-webkit-calendar-picker-indicator { opacity: .6; cursor: pointer; }
input[type="search"].input::-webkit-search-cancel-button { -webkit-appearance: none; }
input.input-num { text-align: right; }
@media (max-width: 759.98px) { .input { font-size: 16px; } }

/* select: <span class="select"><select class="input">…</select></span> */
.select { position: relative; display: block; min-width: 0; }
.select > select.input { padding-right: 30px; cursor: pointer; }
.select::after {
  content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
  border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(45deg); pointer-events: none;
}
.select-inline { display: inline-block; }

/* money: <span class="money-input"><span class="money-sym">$</span><input class="input" inputmode="decimal"></span> */
.money-input { position: relative; display: block; }
.money-input > .money-sym {
  position: absolute; left: 10px; top: 0; bottom: 0; display: flex; align-items: center;
  color: var(--ink-3); pointer-events: none; font-size: var(--t-13);
}
.money-input > .input { padding-left: 22px; text-align: right; font-variant-numeric: tabular-nums; }

/* checkbox / radio */

.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 24px; }

/* search field with icon */
.search { position: relative; display: block; min-width: 0; }

.search > .input { padding-left: 32px; padding-right: 30px; }

.search > .input:focus ~ .search-kbd { display: none; }

/* ================= Fields & forms ================= */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: var(--t-12); font-weight: 500; color: var(--ink-2); }
.field-label .opt { font-weight: 400; color: var(--ink-3); }
.field-hint { font-size: var(--t-12); color: var(--ink-3); }
.field-error { font-size: var(--t-12); color: var(--bad); font-weight: 500; }
.field-error:empty { display: none; }
.field.is-invalid .input { border-color: var(--bad); }
.field.is-invalid .input:focus { box-shadow: 0 0 0 3px var(--bad-soft); }
.field-inline { flex-direction: row; align-items: center; gap: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid > .span-2, .form-grid > .span-all { grid-column: 1 / -1; }
.fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.fieldset + .fieldset { margin-top: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--line); }
.fieldset-title { display: block; float: left; width: 100%; margin-bottom: var(--s3); padding: 0; /* float: keeps the legend off the fieldset's top rule */ font-size: var(--t-micro); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.fieldset-title + * { clear: both; }
.form-note { padding: 10px 12px; background: var(--sunk); border-radius: var(--r-ctl); font-size: var(--t-12); color: var(--ink-2); }
.form-sum { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--line); font-size: var(--t-13); }
.form-sum strong { font-weight: 600; }
@media (max-width: 759.98px) {
  .form-grid, .form-grid-3 { grid-template-columns: minmax(0, 1fr); }
}

/* ================= Segmented control ================= */
.seg { align-self: flex-start; display: inline-flex; padding: 2px; gap: 2px; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-ctl); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg > button {
  display: inline-flex; align-items: center; gap: 6px; height: calc(var(--ctl-h) - 6px); padding: 0 10px;
  border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--ink-2);
  font-size: var(--t-12); font-weight: 500; white-space: nowrap;
}
.seg > button:hover { color: var(--ink); }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"] { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.seg > button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent); }

/* ================= Filter chips ================= */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px;
  border: 1px solid var(--line-2); border-radius: 14px; background: var(--surface); color: var(--ink-2);
  font-size: var(--t-12); font-weight: 500; white-space: nowrap;
}
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.chip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.chip-count { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .chip-count { color: var(--accent); }
.chip-count.is-bad { color: var(--bad); font-weight: 600; }
@media (max-width: 759.98px) {

  .chip { height: 34px; padding: 0 13px; border-radius: 17px; }
}

.pill {

  border: 1px solid var(--line-2); border-radius: 11px; background: var(--surface); color: var(--ink-2);

}
.pill svg { width: 12px; height: 12px; }

.pill-partial { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.pill-due { background: var(--surface); border-color: var(--line-2); color: var(--ink-2); }
.pill-late { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.pill-none { background: transparent; border-color: transparent; color: var(--ink-3); padding-left: 2px; }
.pill-sm { height: 20px; font-size: 11.5px; padding: 0 7px 0 5px; }
/* generic tag (tenant/ticket status, priority): same shape, tones */
.tag {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
  border: 1px solid var(--line-2); border-radius: 4px; color: var(--ink-2); background: var(--surface);
  font-size: 11.5px; font-weight: 500; white-space: nowrap; vertical-align: middle;
}
.tag svg { width: 12px; height: 12px; }
.tag-accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.tag-ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.tag-warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.tag-bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.tag-quiet { border-color: transparent; background: var(--sunk); }

/* ================= Door plate ================= */
.plate {
  display: inline-flex; align-items: center; justify-content: center; position: relative;
  min-width: 34px; height: 22px; padding: 0 6px;
  border: 1px solid var(--line-2); border-radius: var(--r-plate); background: var(--surface); color: var(--ink);
  font-family: var(--f-mono); font-size: 12px; font-weight: 500; line-height: 1; letter-spacing: .01em;
  white-space: nowrap; vertical-align: middle; font-variant-numeric: tabular-nums;
}
.plate-sm.plate-late, .plate-sm.plate-partial { border-color: currentColor; }
.plate-sm.plate-late { color: var(--bad); }
.plate-sm.plate-partial { color: var(--warn); }
.plate-sm.plate-none { color: var(--ink-3); border-style: dashed; }
.plate-lg {
  min-width: 52px; height: 44px; padding: 0 9px; font-size: 13px; border-width: 1px;
  flex-direction: column; gap: 1px;
}
.plate-lg .plate-unit { line-height: 1; }
.plate-lg .plate-glyph { position: absolute; top: 3px; right: 3px; width: 10px; height: 10px; }
.plate-lg .plate-glyph svg { width: 10px; height: 10px; }
.plate-lg.plate-paid { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.plate-lg.plate-paid_late { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.plate-lg.plate-paid_late .plate-glyph { color: var(--warn); }
.plate-lg.plate-partial { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.plate-lg.plate-due { background: var(--surface); border-color: var(--ink-3); color: var(--ink); }
.plate-lg.plate-late { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.plate-lg.plate-none { background: var(--sunk); border-color: var(--line); border-style: dashed; color: var(--ink-3); }
button.plate { cursor: pointer; }
button.plate:hover { filter: brightness(.97); border-color: var(--ink-3); }
button.plate:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.plates { display: flex; flex-wrap: wrap; gap: 6px; }
.plate-fixed { min-width: 52px; } /* equal-width plates in table columns */
.stack > .plate, .stack > .pill, .stack > .tag, .stack > .seg, .stack > .chip { align-self: flex-start; }

/* ================= Payment strip (12 months) ================= */
.pstrip { display: inline-flex; align-items: center; gap: 2px; height: 16px; vertical-align: middle; }
.pc { position: relative; display: block; width: 7px; height: 14px; border-radius: 1px; background: transparent; flex: none; }
.pc-paid { background: var(--ok); }
.pc-paid_late { background: var(--ok); }
.pc-paid_late::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--warn); border-radius: 1px 1px 0 0; }
.pc-partial { box-shadow: inset 0 0 0 1px var(--warn); }
.pc-partial::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: var(--warn); }
.pc-late { background: var(--bad); }
.pc-due { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.pc-none::after { content: ""; position: absolute; left: 2px; top: 5px; width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
.pstrip-lg .pc { width: 10px; height: 20px; }
.pstrip-lg { height: 22px; gap: 3px; }
.pstrip-lg .pc-partial::after { height: 10px; }
.pstrip-lg .pc-none::after { left: 3px; top: 8px; width: 4px; height: 4px; }

/* ================= Money ================= */
.money { white-space: nowrap; font-variant-numeric: tabular-nums; }
.money .cur { color: var(--ink-3); font-weight: 400; margin-right: .04em; }
.money-lg { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-34); font-weight: 400; line-height: 1.05; letter-spacing: -0.01em; }
.money-lg .cur { font-size: .62em; vertical-align: .42em; margin-right: .06em; }
.money-md { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); line-height: 1.1; }
.money-md .cur { font-size: .7em; vertical-align: .25em; }
.amt-owed { color: var(--bad); }
.amt-credit { color: var(--ink-3); }
.amt-credit .cr { font-size: .85em; margin-left: 2px; }
.amt-zero { color: var(--ink-3); }

/* ================= Data table ================= */
.tbl-wrap { position: relative; min-width: 0; }
.tbl { width: 100%; font-size: var(--t-13); }
.tbl th, .tbl td { padding: 0 12px; height: var(--row-h); border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl th:first-child, .tbl td:first-child { padding-left: 16px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 16px; }
.tbl thead th {
  position: sticky; top: var(--sticky-top); z-index: 2; height: 34px;
  background: var(--sunk); color: var(--ink-3); border-bottom: 1px solid var(--line-2);
  font-size: var(--t-12); font-weight: 500; white-space: nowrap;
}
.tbl thead th:first-child { border-top-left-radius: var(--r-ctl); }
.tbl thead th:last-child { border-top-right-radius: var(--r-ctl); }
.tbl .num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.shrink, .tbl th.shrink { width: 1%; white-space: nowrap; }
.tbl tbody tr { transition: background-color 80ms; }
.tbl tbody tr:hover td { background: var(--hover); }
.tbl tbody tr.is-link { cursor: pointer; }
.tbl tbody tr.is-selected td { background: var(--accent-soft); }
.tbl tbody tr.is-focused td { background: var(--hover); box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
.tbl tbody tr.is-focused td:first-child { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent), inset 1px 0 0 var(--accent); }
.tbl tbody tr.is-focused td:last-child { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent), inset -1px 0 0 var(--accent); }
.tbl tbody tr.is-muted td { color: var(--ink-3); }
.tbl tfoot td { height: 40px; border-bottom: 0; border-top: 1px solid var(--line-2); font-weight: 600; background: transparent; }
.tbl .cell-name { font-weight: 500; color: var(--ink); }
.tbl .cell-sub { display: block; font-size: var(--t-12); color: var(--ink-3); font-weight: 400; }
.tbl-check { width: 40px; }
.tbl-group td { height: 34px; background: var(--paper); font-size: var(--t-12); font-weight: 600; color: var(--ink-2); }
.tbl-compact th, .tbl-compact td { height: 34px; }
/* sortable header: <th aria-sort="ascending"><button class="th-sort">Rent<svg/></button></th> */
.th-sort {
  display: inline-flex; align-items: center; gap: 4px; margin: 0 -6px; padding: 4px 6px; border: 0; border-radius: 4px;
  background: none; color: inherit; font: inherit; white-space: nowrap;
}
.th-sort:hover { color: var(--ink); background: var(--line); }
.th-sort .sort-ind { opacity: 0; width: 12px; height: 12px; transition: transform 120ms; }
.th-sort:hover .sort-ind { opacity: .5; }
th[aria-sort="ascending"] .th-sort, th[aria-sort="descending"] .th-sort { color: var(--ink); }
th[aria-sort="ascending"] .sort-ind, th[aria-sort="descending"] .sort-ind { opacity: 1; }
th[aria-sort="descending"] .sort-ind { transform: rotate(180deg); }
th.num .th-sort { flex-direction: row-reverse; }

/* ================= Phone card list (table-row equivalent) ================= */
.clist { border-top: 1px solid var(--line); }
.crow {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; row-gap: 8px; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 60px;
}
.crow.is-link { cursor: pointer; }
.crow.is-selected { background: var(--accent-soft); margin: 0 calc(-1 * var(--gutter)); padding-left: var(--gutter); padding-right: var(--gutter); }
.crow-lead { grid-column: 1; align-self: start; padding-top: 1px; }
.crow-main { grid-column: 2; min-width: 0; }
.crow-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow-sub { font-size: var(--t-12); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.crow-aside { grid-column: 3; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.crow-actions { grid-column: 1 / -1; display: flex; gap: 8px; }
.crow-actions .btn { flex: 1 1 auto; }
.crow-actions .btn-group { flex: 1 1 auto; display: flex; }
.crow-actions .btn-group > .btn-caret { flex: none; width: 44px; }

/* ================= Ledger ================= */
.ledger { width: 100%; font-size: var(--t-13); }
.ledger th, .ledger td { padding: 0 10px; height: 38px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ledger th:first-child, .ledger td:first-child { padding-left: 0; }
.ledger th:last-child, .ledger td:last-child { padding-right: 0; }
.ledger thead th { height: 30px; color: var(--ink-3); font-size: var(--t-micro); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line-2); }
.ledger .l-date { width: 64px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.ledger .l-desc { min-width: 0; }
.ledger .l-sub { display: block; font-size: var(--t-12); color: var(--ink-3); line-height: 1.3; }
.ledger .l-amt, .ledger .l-bal { text-align: right; width: 1%; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ledger .l-bal { font-weight: 500; }
.ledger .l-pay { color: var(--ok); }
.ledger .l-act { width: 1%; padding-left: 4px; }
.ledger-month td {
  height: 30px; padding-top: 10px; vertical-align: bottom; color: var(--ink-3); background: transparent;
  font-variant-caps: all-small-caps; letter-spacing: .07em; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line-2);
}
.ledger tr.is-void td { color: var(--ink-3); }
.ledger tr.is-void .l-desc-text, .ledger tr.is-void .l-amt { text-decoration: line-through; text-decoration-color: var(--ink-3); }
.ledger tbody tr:not(.ledger-month):hover td { background: var(--hover); }
@media (max-width: 759.98px) {
  .ledger { font-size: 14px; }
  .ledger .l-date { width: 48px; font-size: 11.5px; }
  .ledger th, .ledger td { padding: 0 4px; }
  .ledger thead th { letter-spacing: .03em; font-size: 10px; }
  .ledger .l-act .btn { width: 32px; min-width: 32px; }
}

/* ================= Section header ================= */
.sec { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: var(--s6) 0 var(--s3); }
.sec:first-child { margin-top: 0; }
.sec-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; line-height: 1.25; color: var(--ink); }
.sec-meta { color: var(--ink-3); font-size: var(--t-13); }
.sec-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.sec-sm .sec-title { font-family: var(--f-ui); font-size: var(--t-micro); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* ================= Key / value rows ================= */
.kv { display: grid; grid-template-columns: minmax(110px, 34%) minmax(0, 1fr); }
.kv > dt, .kv > dd { padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv > dt { color: var(--ink-3); font-size: var(--t-12); padding-top: 11px; padding-right: 12px; }
.kv > dd { overflow-wrap: anywhere; }
.kv > dt:first-of-type, .kv > dt:first-of-type + dd { border-top: 1px solid var(--line); }
.kv-plain > dt, .kv-plain > dd { border: 0 !important; padding: 4px 0; }
.kv-plain > dt { padding-top: 6px; }

/* copyable value: <span class="copyline"><span class="copyline-text">…</span><button class="btn btn-ghost btn-icon btn-sm">copy</button></span> */
.copyline { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
.copyline-text { user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }

/* ================= Empty state & first run ================= */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 48px 24px; color: var(--ink-2); }
.empty-icon { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: var(--r-panel); color: var(--ink-3); margin-bottom: 4px; }
.empty-icon svg { width: 20px; height: 20px; }
.empty-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; color: var(--ink); }
.empty-body { max-width: 42ch; font-size: var(--t-13); }
.empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
.empty-quiet { padding: 20px 0; align-items: flex-start; text-align: left; color: var(--ink-3); }

.firstrun { max-width: 640px; margin: 24px auto 0; }
.firstrun-head { padding-bottom: var(--s5); }
.firstrun-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-34); font-weight: 400; line-height: 1.1; letter-spacing: -0.01em; }
.firstrun-lede { margin-top: 10px; color: var(--ink-2); font-size: var(--t-15); max-width: 52ch; }
.firstrun-opts { border-top: 1px solid var(--line-2); }
.firstrun-opt {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%;
  padding: 16px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; color: var(--ink);
}
.firstrun-opt:hover { background: var(--hover); }
.firstrun-opt:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.firstrun-ico { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: var(--r-plate); color: var(--accent); font-family: var(--f-mono); }
.firstrun-opt-title { font-weight: 600; font-size: var(--t-15); }
.firstrun-opt-sub { color: var(--ink-3); font-size: var(--t-13); margin-top: 2px; }
.firstrun-opt .chev { color: var(--ink-3); }

/* ================= Skeleton ================= */
.skel { display: block; background: var(--sunk); border-radius: 3px; animation: rb-pulse 1.4s ease-in-out infinite; }
.skel-line { height: 10px; margin: 10px 0; }
.skel-title { height: 22px; width: 40%; margin: 4px 0 18px; }
.skel-row { display: flex; align-items: center; gap: 12px; height: var(--row-h); border-bottom: 1px solid var(--line); }
.skel-row .skel { height: 10px; }
.skel-plate { width: 34px; height: 22px !important; }
.loading-note { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: var(--t-12); padding: 8px 0 16px; }
@keyframes rb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* ================= Progress / bullet bar ================= */
.bar { position: relative; display: flex; height: 8px; background: var(--sunk); border-radius: 2px; overflow: visible; }
.bar-seg { height: 100%; background: var(--accent); flex: none; }
.bar-seg:first-child { border-radius: 2px 0 0 2px; }
.bar-seg-ok { background: var(--ok); }
.bar-seg-warn { background: var(--warn); }
.bar-seg-bad { background: var(--bad); }
.bar-seg-soft { background: var(--line-2); }
.bar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.bar-lg { height: 14px; }
.bar-lg .bar-mark { top: -5px; bottom: -5px; }
.bar-thin { height: 4px; }
.bar-thin .bar-mark { top: -3px; bottom: -3px; width: 2px; }
.bar-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: var(--t-12); color: var(--ink-2); }
.bar-key { display: inline-flex; align-items: center; gap: 6px; }
.bar-key::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: var(--key, var(--accent)); }
.bar-key-ok { --key: var(--ok); } .bar-key-warn { --key: var(--warn); } .bar-key-bad { --key: var(--bad); } .bar-key-soft { --key: var(--line-2); }

/* ================= Kbd ================= */
.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--ink-2);
  font-family: var(--f-mono); font-size: 11px; font-weight: 500; line-height: 1; white-space: nowrap;
}

/* ================= Banner strip ================= */
.banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 40px;
  padding: 6px var(--gutter); background: var(--accent-soft); color: var(--ink); border-bottom: 1px solid var(--accent-line);
  font-size: var(--t-13);
}
.banner-text { flex: 1 1 auto; min-width: 0; }
.banner-text strong { font-weight: 600; }
.banner-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.banner .btn { height: 28px; }
.banner-warn { background: var(--warn-soft); border-bottom-color: var(--warn-line); }

/* ================= Floating layers: shared ================= */
.layer { position: relative; z-index: 100; }
.scrim { position: fixed; inset: 0; background: var(--scrim); animation: rb-fade var(--dur) var(--ease); }
@keyframes rb-fade { from { opacity: 0; } }

/* ---- Menu / popover ---- */
.menu {
  position: fixed; z-index: 120; min-width: 200px; max-width: min(320px, calc(100vw - 16px)); max-height: min(420px, calc(100vh - 16px)); overflow-y: auto;
  padding: 4px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow-float);
}
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 6px 10px;
  border: 0; border-radius: 5px; background: none; color: var(--ink); text-align: left; font-size: var(--t-13);
}
.menu-item svg { color: var(--ink-3); width: 16px; height: 16px; }
.menu-item:hover, .menu-item:focus-visible, .menu-item.is-active { background: var(--hover); outline: none; }
.menu-item:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
.menu-item.is-danger { color: var(--bad); }
.menu-item.is-danger svg { color: var(--bad); }
.menu-item:disabled { opacity: .45; }
.menu-item .menu-hint { margin-left: auto; padding-left: 12px; color: var(--ink-3); font-size: var(--t-12); }
.menu-sep { height: 1px; margin: 4px 6px; background: var(--line); }
.menu-label { padding: 8px 10px 4px; font-size: var(--t-micro); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
@media (max-width: 759.98px) { .menu-item { min-height: 44px; font-size: var(--t-15); } }

/* popover: free content in a floating panel, positioned like a menu */
.popover { position: fixed; z-index: 120; max-width: min(360px, calc(100vw - 16px)); padding: 12px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow-float); }

/* ---- Drawer: right side on desktop, full screen on phone ---- */
.drawer {
  position: fixed; z-index: 110; top: 0; right: 0; bottom: 0; width: min(520px, 100vw);
  display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--line-2); box-shadow: var(--shadow-modal);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
  animation: rb-drawer-in 180ms var(--ease);
}
.drawer-scrim { background: var(--scrim); }
.drawer.is-closing { animation: rb-drawer-out 140ms ease-in forwards; }
@keyframes rb-drawer-in { from { transform: translateX(24px); opacity: 0; } }
@keyframes rb-drawer-out { to { transform: translateX(24px); opacity: 0; } }
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 24px 16px; border-bottom: 1px solid var(--line); flex: none; }
.drawer-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); font-weight: 500; line-height: 1.2; min-width: 0; }
.drawer-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 4px 24px 32px; }
.drawer-foot { flex: none; display: flex; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--line); }
.drawer-close { margin-left: auto; flex: none; }
@media (max-width: 759.98px) {
  .drawer { width: 100vw; border-left: 0; padding-left: env(safe-area-inset-left, 0px); }
  .drawer-head { padding: 12px max(16px, env(safe-area-inset-left, 0px)) 12px; }
  .drawer-body { padding: 4px 16px 32px; }
  .drawer-foot { padding: 10px 16px; }
}

/* ---- Sheet: centred modal on desktop, bottom sheet on phone ---- */
.sheet-wrap { position: fixed; inset: 0; z-index: 115; display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; overflow-y: auto; }
.sheet {
  position: relative; width: 100%; max-width: 480px; display: flex; flex-direction: column; max-height: 80vh;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-panel); box-shadow: var(--shadow-modal);
  animation: rb-sheet-in 170ms var(--ease);
}

  let s = '';
  for (const k of Object.keys(obj)) {
    const v = obj[k];
    if (v === false || v === null || v === undefined) continue;
    if (!/^[a-zA-Z_:][-a-zA-Z0-9_:.]*$/.test(k)) continue;
    s += v === true ? ' ' + k : ' ' + k + '="' + RB.esc(v) + '"';
  }
  return raw(s);
};

// ================================================================= renderers
const STATUS_ICON = { paid: 'check', paid_late: 'check-late', partial: 'half', due: 'circle', late: 'triangle', none: 'dash' };
ui.STATUS_ICON = STATUS_ICON;

/**
 * Status pill (SafeHTML). status: paid|paid_late|partial|due|late|none.
 * opts: {daysLate (late → "9 d late"), label (override text), size:'sm', title}
 */
ui.pill = function pill(status, opts) {
  const o = opts || {};
  const st = STATUS_ICON[status] ? status : 'none';
  let label = o.label;
  if (!label) {
    if (st === 'late') label = o.daysLate ? o.daysLate + ' d late' : 'Late';
    else if (st === 'none') label = null;
    else label = RB.model.STATUS_LABEL[st];
  }
  if (label === null) return h`<span class="pill pill-none${o.size === 'sm' ? ' pill-sm' : ''}" title="${o.title || 'No charge this month'}">${ui.icon('dash', { size: 12 })}<span class="vh">No charge</span></span>`;
  return h`<span class="pill pill-${st}${o.size === 'sm' ? ' pill-sm' : ''}"${o.title ? h` title="${o.title}"` : ''}>${ui.icon(STATUS_ICON[st], { size: 12 })}<span>${label}</span></span>`;
};

/** Generic tag. tone: ''|'accent'|'ok'|'warn'|'bad'|'quiet' */
ui.tag = (text, tone, icon) => h`<span class="tag${tone ? ' tag-' + tone : ''}">${icon ? ui.icon(icon, { size: 12 }) : ''}${text}</span>`;

/** Tenant status tag: active (no tag unless opts.all), notice, past. */
ui.tenantTag = function tenantTag(status) {
  if (status === 'notice') return ui.tag('Notice given', 'warn', 'door');
  if (status === 'past') return ui.tag('Past', 'quiet');
  return ui.tag('Active', 'ok');
};

/**
 * Door plate (SafeHTML). opts: {size:'sm'|'lg', status (month status, colours lg plates; sm plates only tint late/partial/none),
 *   title, button:true (renders a <button>), attrs:{...} extra attributes (escaped), property}
 */
ui.plate = function plate(unit, opts) {
  const o = opts || {};
  const lg = o.size === 'lg';
  const st = o.status && STATUS_ICON[o.status] ? o.status : '';
  const cls = 'plate ' + (lg ? 'plate-lg' : 'plate-sm') + (st ? ' plate-' + st : '');
  const tag = o.button ? 'button' : 'span';
  const title = o.title || (o.property ? o.property + ' ' + unit : '');
  const inner = lg
    ? h`<span class="plate-unit">${unit || '—'}</span>${st && st !== 'none' ? h`<span class="plate-glyph">${ui.icon(STATUS_ICON[st], { size: 10 })}</span>` : ''}`
    : h`${unit || '—'}`;
  return h`<${raw(tag)} class="${cls}"${o.button ? raw(' type="button"') : ''}${title ? h` title="${title}"` : ''}${ui.attrs(o.attrs)}>${inner}</${raw(tag)}>`;
};

const STRIP_WORD = { paid: 'paid', paid_late: 'paid late', partial: 'partly paid', due: 'due', late: 'late', none: 'no charge' };
/**
 * 12-month payment strip (SafeHTML). cells = RB.model.monthsBack(ledger, endKey, 12) (oldest → newest). opts: {lg:true, today}
 */
ui.strip = function strip(cells, opts) {
  const o = opts || {};
  const today = o.today || (RB.store ? RB.store.today() : D.today());
  const parts = (cells || []).map(c => {
    const mon = D.fmtMonthShort(c.period, today, { year: true });
    let t = mon + ' — ' + STRIP_WORD[c.status];
    if ((c.status === 'paid' || c.status === 'paid_late') && c.paidOn) t += ' ' + D.fmt(c.paidOn, today) + (c.status === 'paid_late' ? ' (' + c.daysLate + ' d late)' : '');
    else if (c.status === 'partial' || c.status === 'late') t += ': ' + M.fmt(c.open) + ' open' + (c.paid ? ', ' + M.fmt(c.paid) + ' paid' : '') + (c.status === 'late' ? ', ' + c.daysLate + ' d' : '');
    else if (c.status === 'due' && c.due) t += ' ' + D.fmt(c.due, today);
    return h`<i class="pc pc-${c.status}" title="${t}"></i>`;
  });
  const label = (cells || []).map(c => D.fmtMonthShort(c.period, today) + ' ' + STRIP_WORD[c.status]).join(', ');
  return h`<span class="pstrip${o.lg ? ' pstrip-lg' : ''}" role="img" aria-label="Last ${(cells || []).length} months: ${label}">${parts}</span>`;
};

/**
 * Money (SafeHTML) with muted currency symbol: <span class="money"><span class="cur">$</span>1,450</span>.
 * opts: {size:'lg'|'md', cls, sign:true (+$50), cents:'always'|'never', tone:'owed'|'credit'}
 */
ui.money = function money(cents, opts) {
  const o = opts || {};
  const n = Math.round(cents || 0);
  const sign = n < 0 ? '−' : o.sign && n > 0 ? '+' : '';
  const cls = 'money' + (o.size ? ' money-' + o.size : '') + (o.tone ? ' amt-' + o.tone : '') + (o.cls ? ' ' + o.cls : '');
  return h`<span class="${cls}">${sign}<span class="cur">${M.symbol}</span>${M.digits(n, o)}</span>`;
};

/** Balance cell: owed → danger colour; credit → muted "$120 cr"; zero → em-rule (or opts.zero text). */
ui.balance = function balance(cents, opts) {
  const o = opts || {};
  if (!cents) return o.zero === undefined ? raw('<span class="amt-zero" aria-label="No balance">—</span>') : h`<span class="amt-zero">${o.zero}</span>`;
  if (cents > 0) return ui.money(cents, { tone: 'owed' });
  return h`<span class="money amt-credit"><span class="cur">${M.symbol}</span>${M.digits(-cents)}<span class="cr">cr</span></span>`;
};

/** Plain date text: "Nov 3" / "Nov 3, 2025". opts.mono → mono class. */
ui.date = (d, opts) => h`<time class="${opts && opts.mono ? 'mono' : ''}" datetime="${d || ''}">${D.fmt(d, RB.store ? RB.store.today() : undefined)}</time>`;

/** <kbd> chip(s): ui.kbd('⌘K') or ui.kbd('g', 't') */
ui.kbd = (...keys) => h`${keys.map(k => h`<kbd class="kbd">${k}</kbd>`)}`;

/** Copyable value: text + copy button (data-copy holds the text; handled globally). */
ui.copyline = function copyline(text, what, opts) {
  if (!text) return h`<span class="faint">—</span>`;
  const extra = opts && opts.href ? h` <a class="btn btn-ghost btn-icon btn-sm" href="${opts.href}" aria-label="${opts.hrefLabel || 'Open'}">${ui.icon(opts.hrefIcon || 'external')}</a>` : '';
  return h`<span class="copyline"><span class="copyline-text">${text}</span><button type="button" class="btn btn-ghost btn-icon btn-sm" data-copy="${text}" data-copy-what="${what || 'text'}" aria-label="Copy ${what || 'text'}" title="Copy">${ui.icon('copy')}</button>${extra}</span>`;
};

/**
 * Empty state. opts: {icon, title, body, actions:[{label, kind:'primary'|'soft'|..., cmd (RB.commands id) | act (data-act) | attrs}], quiet:true}
 */
ui.empty = function empty(opts) {
  const o = opts || {};
  if (o.quiet) return h`<div class="empty empty-quiet">${o.title}</div>`;
  return h`<div class="empty">
    ${o.icon ? h`<div class="empty-icon">${ui.icon(o.icon, { size: 20 })}</div>` : ''}
    ${o.title ? h`<div class="empty-title">${o.title}</div>` : ''}
    ${o.body ? h`<div class="empty-body">${o.body}</div>` : ''}
    ${o.actions && o.actions.length ? h`<div class="empty-actions">${o.actions.map(ui.button)}</div>` : ''}
  </div>`;
};

/**
 * Button (SafeHTML). b: {label, kind:'primary'|'soft'|'ghost'|'danger'|'danger-soft'|'', size:'sm'|'lg', icon, iconOnly, cmd, act, id, attrs, disabled, write:true (marks data-write)}
 */
ui.button = function button(b) {
  const cls = 'btn' + (b.kind ? ' btn-' + b.kind : '') + (b.size ? ' btn-' + b.size : '') + (b.iconOnly ? ' btn-icon' : '') + (b.cls ? ' ' + b.cls : '');
  const a = Object.assign({ type: 'button', class: cls, id: b.id, 'data-cmd': b.cmd, 'data-act': b.act, disabled: !!b.disabled, 'data-write': b.write ? '' : null,
    'aria-label': b.iconOnly ? b.label : null, title: b.iconOnly ? b.label : b.title }, b.attrs || {});
  return h`<button${ui.attrs(a)}>${b.icon ? ui.icon(b.icon) : ''}${b.iconOnly ? '' : h`<span>${b.label}</span>`}</button>`;
};

/** Loading skeleton. opts: {rows=6, title:true, plates:true} */
ui.skeleton = function skeleton(opts) {
  const o = Object.assign({ rows: 6, title: true, plates: true }, opts);
  const widths = [38, 52, 30, 44, 60, 34, 48, 40];
  const rows = Array.from({ length: o.rows }, (_, i) => h`<div class="skel-row">${o.plates ? raw('<span class="skel skel-plate"></span>') : ''}<span class="skel" style="width:${widths[i % 8]}%"></span><span class="spacer"></span><span class="skel" style="width:12%"></span></div>`);
  return h`<div class="skeleton" aria-busy="true" aria-label="Loading">${o.title ? raw('<span class="skel skel-title"></span>') : ''}${rows}</div>`;
};
/** One-line loading note ("Loading your rent book…"). */
ui.loadingNote = text => h`<div class="loading-note"><span class="dot dot-accent dot-pulse"></span>${text || 'Loading your rent book…'}</div>`;

/** First-run panel (no tenants yet). Buttons run commands: tenant:add, setup:import, sample:load. */
ui.firstRun = function firstRun() {
  const opt = (cmd, ico, title, sub) => h`<button type="button" class="firstrun-opt" data-cmd="${cmd}" data-write><span class="firstrun-ico">${ui.icon(ico)}</span><span><span class="firstrun-opt-title">${title}</span><span class="firstrun-opt-sub" style="display:block">${sub}</span></span><span class="chev">${ui.icon('chevron-right')}</span></button>`;
  return h`<section class="firstrun" aria-labelledby="fr-title">
    <div class="firstrun-head">
      <div class="micro">Rent Book</div>
      <h2 class="firstrun-title" id="fr-title">Start your rent book</h2>
      <p class="firstrun-lede">One page for who owes what, whose lease is ending and what needs fixing. Add tenants one at a time, bring them in from a spreadsheet, or look around with sample data first.</p>
    </div>
    <div class="firstrun-opts">
      ${opt('tenant:add', 'plus', 'Add your first tenant', 'Name, unit, rent and lease dates — the ledger builds itself from there.')}
      ${opt('setup:import', 'upload', 'Import from a spreadsheet', 'Paste rows or choose a CSV. Columns are matched for you.')}
      ${opt('sample:load', 'sample', 'Explore with sample data', '27 invented tenants across three buildings. Remove it with one click.')}
    </div>
  </section>`;
};

// ================================================================= layer stack, focus trap, Esc
const layers = []; // {el, kind:'sheet'|'drawer'|'menu'|'palette'|'popover', close(), modal, restore}
ui.layers = layers;
const layerRoot = () => document.getElementById('rb-layer') || document.body;
const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
function focusables(el) { return Array.from(el.querySelectorAll(FOCUSABLE)).filter(x => x.offsetParent !== null || x === document.activeElement); }
function pushLayer(l) { l.restore = document.activeElement; layers.push(l); return l; }
function popLayer(l) {
  const i = layers.indexOf(l);
  if (i < 0) return;
  layers.splice(i, 1);
  const r = l.restore;
  if (l.restoreFocus !== false && r && r.isConnected && typeof r.focus === 'function') { try { r.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}
ui.topLayer = () => layers[layers.length - 1] || null;
/** True when a modal layer (sheet, palette, menu, confirm) is open. Drawers are not counted: views keep keyboard control while their drawer is open. */
ui.hasModal = () => layers.some(l => l.kind !== 'drawer');
ui.closeAll = () => layers.slice().reverse().forEach(l => l.close());
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
function animateOut(el, then) {
  if (reduceMotion()) { then(); return; }
  el.classList.add('is-closing');
  let done = false;
  const fin = () => { if (!done) { done = true; then(); } };
  el.addEventListener('animationend', fin, { once: true });
  setTimeout(fin, 220);
}
const isPhone = () => { try { return matchMedia('(max-width: 759.98px)').matches; } catch (e) { return false; } };
ui.isPhone = isPhone;

document.addEventListener('keydown', e => {
  const top = ui.topLayer();
  if (!top) return;
  if (e.key === 'Escape') {
    if (top.kind === 'drawer' && e.target && e.target.matches && e.target.matches('input, textarea, select') && e.target.value) return; // let Esc clear the field
    e.preventDefault(); e.stopPropagation();
    top.close();
    return;
  }
  if (e.key === 'Tab' && top.modal !== false) {
    const f = focusables(top.el);
    if (!f.length) { e.preventDefault(); return; }
    const first = f[0], last = f[f.length - 1];
    if (!top.el.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}, true);

// ================================================================= toast
let toastBox = null;
/**
 * Toast. opts: {undo: fn (adds "Undo"), action:{label, run}, tone:'bad', duration (ms, default 7000; 0 = sticky), icon}
 * Returns {close}.
 */
ui.toast = function toast(message, opts) {
  const o = opts || {};
  if (!toastBox || !toastBox.isConnected) {
    toastBox = document.createElement('div');
    toastBox.className = 'toasts';
    toastBox.setAttribute('role', 'status');
    toastBox.setAttribute('aria-live', 'polite');
    layerRoot().appendChild(toastBox);
  }
  while (toastBox.children.length >= 3) toastBox.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (o.tone === 'bad' ? ' toast-bad' : '');
  const act = o.undo ? { label: 'Undo', run: o.undo } : o.action;
  el.innerHTML = String(h`${o.tone === 'bad' ? h`<span class="toast-ico">${ui.icon('alert')}</span>` : o.icon ? h`<span class="toast-ico">${ui.icon(o.icon)}</span>` : ''}<span class="toast-msg">${message}</span>${act ? h`<button type="button" class="toast-action">${act.label}</button>` : ''}<button type="button" class="toast-x" aria-label="Dismiss">${ui.icon('x', { size: 14 })}</button>`);
  toastBox.appendChild(el);
  let timer = null;
  const close = () => { clearTimeout(timer); if (!el.isConnected) return; animateOut(el, () => el.remove()); };
  const arm = () => { clearTimeout(timer); const d = o.duration === undefined ? 7000 : o.duration; if (d) timer = setTimeout(close, d); };
  if (act) el.querySelector('.toast-action').addEventListener('click', () => { close(); try { act.run(); } catch (e) { console.error(e); } });
  el.querySelector('.toast-x').addEventListener('click', close);
  el.addEventListener('mouseenter', () => clearTimeout(timer));
  el.addEventListener('mouseleave', arm);
  el.addEventListener('focusin', () => clearTimeout(timer));
  arm();
  return { el, close };
};

// ================================================================= sheet / confirm
let sheetSeq = 0;
/**
 * Sheet: centred modal (desktop) / bottom sheet (phone).
 * opts: {title, sub, body: (bodyEl, handle) => void | SafeHTML | string(escaped), size:'wide'|'xwide',
 *        actions:[{id, label, kind:'primary'|'danger'|'ghost'|'soft'|'', onClick(handle) → false|Promise (false keeps it open)}],
 *        cancel:'Cancel' | false, note (SafeHTML/str in the footer), initialFocus (selector), onClose(result)}
 * The first 'primary'/'danger' action is the form's submit (Enter in a text field triggers it).
 * Returns handle {el, body, close(result), action(id) → button, setAction(id,{label,disabled}), setNote(html), setTitle(text)}
 */
ui.sheet = function sheet(opts) {
  const o = opts || {};
  const n = ++sheetSeq;
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  const actions = (o.actions || [{ id: 'ok', label: 'Done', kind: 'primary' }]).map((a, i) => Object.assign({ id: a.id || 'a' + i }, a));
  const submitIdx = actions.findIndex(a => a.kind === 'primary' || a.kind === 'danger');
  const cancel = o.cancel === undefined ? (actions.length && submitIdx >= 0 ? 'Cancel' : false) : o.cancel;
  wrap.innerHTML = String(h`<div class="scrim" data-close></div>
    <div class="sheet${o.size ? ' sheet-' + o.size : ''}" role="dialog" aria-modal="true" aria-labelledby="rb-sheet-${n}-t">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <form class="sheet-form" novalidate autocomplete="off">
        <div class="sheet-head"><div class="grow"><h2 class="sheet-title" id="rb-sheet-${n}-t">${o.title || ''}</h2>${o.sub ? h`<div class="sheet-sub">${o.sub}</div>` : ''}</div>
          <button type="button" class="btn btn-ghost btn-icon btn-sm sheet-close" data-close aria-label="Close">${ui.icon('x')}</button></div>
        <div class="sheet-body"></div>
        <div class="sheet-foot"><span class="sheet-foot-note">${o.note || ''}</span>
          ${cancel ? h`<button type="button" class="btn btn-ghost" data-close>${cancel}</button>` : ''}
          ${actions.map((a, i) => h`<button type="${i === submitIdx ? 'submit' : 'button'}" class="btn${a.kind ? ' btn-' + a.kind : ''}" data-action="${a.id}"${a.disabled ? raw(' disabled') : ''}>${a.label}</button>`)}
        </div>
      </form>
    </div>`);
  layerRoot().appendChild(wrap);
  if (!actions.length && !cancel && !o.note) wrap.querySelector('.sheet-foot').classList.add('is-empty');
  const sheetEl = wrap.querySelector('.sheet');
  const body = wrap.querySelector('.sheet-body');
  const form = wrap.querySelector('form');
  let closed = false;
  const handle = {
    el: sheetEl, body, form,
    close(result) {
      if (closed) return; closed = true;
      popLayer(layer);
      animateOut(sheetEl, () => wrap.remove());
      wrap.querySelector('.scrim').style.opacity = '0';
      if (o.onClose) try { o.onClose(result); } catch (e) { console.error(e); }
    },
    action: id => wrap.querySelector('[data-action="' + id + '"]'),
    setAction(id, p) { const b = handle.action(id); if (!b) return; if (p.label !== undefined) b.textContent = p.label; if (p.disabled !== undefined) b.disabled = !!p.disabled; },
    setNote(x) { wrap.querySelector('.sheet-foot-note').innerHTML = String(x && RB.isSafe(x) ? x : RB.esc(x || '')); },
    setTitle(t) { wrap.querySelector('.sheet-title').textContent = t; },
    get closed() { return closed; },
  };
  const layer = pushLayer({ el: wrap, kind: 'sheet', close: () => handle.close() });
  if (typeof o.body === 'function') { const r = o.body(body, handle); if (r !== undefined && r !== null) body.innerHTML = String(RB.isSafe(r) ? r : RB.esc(r)); }
  else if (o.body !== undefined && o.body !== null) body.innerHTML = String(RB.isSafe(o.body) ? o.body : RB.esc(o.body));
  const run = async a => {
    const btn = handle.action(a.id);
    if (!a.onClick) { handle.close(a.id); return; }
    try {
      btn.setAttribute('aria-busy', 'true');
      const r = await a.onClick(handle);
      if (r !== false) handle.close(a.id);
    } catch (e) { console.error(e); }
    finally { if (btn) btn.removeAttribute('aria-busy'); }
  };
  wrap.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { e.preventDefault(); handle.close(); return; }
    const b = e.target.closest('[data-action]');
    if (b && b.type !== 'submit') { e.preventDefault(); run(actions.find(a => a.id === b.dataset.action)); }
  });
  form.addEventListener('submit', e => { e.preventDefault(); if (submitIdx >= 0 && !handle.action(actions[submitIdx].id).disabled) run(actions[submitIdx]); });
  // initial focus
  requestAnimationFrame(() => {
    const target = (o.initialFocus && sheetEl.querySelector(o.initialFocus)) || body.querySelector('input:not([type=hidden]):not([type=checkbox]), select, textarea') || (submitIdx >= 0 ? handle.action(actions[submitIdx].id) : null) || sheetEl.querySelector('.sheet-close');
    if (target) { try { target.focus({ preventScroll: true }); if (target.select && target.type !== 'date' && target.tagName === 'INPUT') target.select(); } catch (e) { /* ignore */ } }
  });
  return handle;
};

/** In-page confirm (only for irreversible bulk actions). opts: {title, body (str|SafeHTML), confirmLabel, cancelLabel, danger} → Promise<boolean> */
ui.confirm = function confirm(opts) {
  const o = opts || {};
  return new Promise(resolve => {
    let ok = false;
    ui.sheet({
      title: o.title || 'Are you sure?',
      body: o.body ? (RB.isSafe(o.body) ? o.body : h`<p class="muted">${o.body}</p>`) : '',
      cancel: o.cancelLabel || 'Cancel',
      actions: [{ id: 'confirm', label: o.confirmLabel || 'Confirm', kind: o.danger ? 'danger' : 'primary', onClick: () => { ok = true; } }],
      initialFocus: '[data-action="confirm"]',
      onClose: () => resolve(ok),
    });
  });
};

// ================================================================= menu
let openMenu = null;
/**
 * Dropdown menu anchored to an element. items: [{label, icon, hint, danger, disabled, onSelect(), checked} | {sep:true} | {heading:'…'}]
 * opts: {align:'start'|'end'}. Calling again on the same anchor toggles it closed. Returns {close}.
 */
ui.menu = function menu(anchor, items, opts) {
  const o = opts || {};
  if (openMenu && openMenu.anchor === anchor) { openMenu.close(); return null; }
  if (openMenu) openMenu.close();
  const el = document.createElement('div');
  el.className = 'menu';
  el.setAttribute('role', 'menu');
  el.innerHTML = String(h`${items.map((it, i) => it.sep ? raw('<div class="menu-sep" role="separator"></div>')
    : it.heading ? h`<div class="menu-label">${it.heading}</div>`
    : h`<button type="button" role="menuitem" class="menu-item${it.danger ? ' is-danger' : ''}" data-i="${i}"${it.disabled ? raw(' disabled') : ''}${it.write ? raw(' data-write') : ''}>${it.icon ? ui.icon(it.icon) : it.checked !== undefined ? ui.icon(it.checked ? 'check' : 'dot', { cls: it.checked ? '' : 'vh' }) : ''}<span>${it.label}</span>${it.hint ? h`<span class="menu-hint">${it.hint}</span>` : ''}</button>`)}`);
  layerRoot().appendChild(el);
  // position
  const r = anchor.getBoundingClientRect();
  const mw = el.offsetWidth, mh = el.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  let left = o.align === 'end' ? r.right - mw : r.left;
  left = Math.max(8, Math.min(left, vw - mw - 8));
  let top = r.bottom + 4;
  if (top + mh > vh - 8 && r.top - mh - 4 > 8) top = r.top - mh - 4;
  el.style.left = left + 'px'; el.style.top = Math.max(8, top) + 'px';
  anchor.setAttribute('aria-expanded', 'true');
  const btns = () => Array.from(el.querySelectorAll('.menu-item:not(:disabled)'));
  let closed = false;
  const onDoc = e => { if (!el.contains(e.target) && !anchor.contains(e.target)) close(); };
  const close = () => {
    if (closed) return; closed = true;
    document.removeEventListener('pointerdown', onDoc, true);
    window.removeEventListener('resize', close);
    anchor.setAttribute('aria-expanded', 'false');
    el.remove(); popLayer(layer);

/** Record payments for several tenants at once (full open balance each, today, last-used method). Single toast with Undo. */
function recordPayments(tenantIds, opts) {
  if (!guard()) return Promise.resolve([]);
  const today = S().today();
  const amounts = (opts && opts.amounts) || null; // optional {tenantId: cents} (capped at the balance), e.g. one past month's open amount
  const done = [];
  let total = 0;
  for (const tid of tenantIds) {
    const lg = S().ledger(tid); if (!lg || lg.balance <= 0) continue;
    const amount = amounts && amounts[tid] > 0 ? Math.min(amounts[tid], lg.balance) : lg.balance;
    const id = RB.id();
    S().addEntry(tid, { id, type: 'payment', date: today, amount, method: lastMethod(tid), ref: '', memo: '' }).catch(() => {});
    done.push([tid, id]); total += amount;
  }
  if (done.length) ui.toast('Recorded ' + RB.plural(done.length, 'payment') + ' · ' + M.fmt(total), { undo: () => done.forEach(([tid, id]) => S().undoEntry(tid, id)) });
  return Promise.resolve(done.map(d => d[1]));
}

let downloadsP = null;
/** Start resolving the downloads capability early (boot calls this) so a click doesn't wait. */
function warmDownloads() {
  if (downloadsP) return downloadsP;
  try {
    const c = window.claude;
    downloadsP = c && typeof c.use === 'function' ? Promise.resolve(c.use('downloads')).catch(() => null) : Promise.resolve(null);
  } catch (e) { downloadsP = Promise.resolve(null); }
  return downloadsP;
}
/**
 * Offer a file to the viewer via the downloads capability (viewer confirms). Falls back to a sheet with the text
 * and a Copy button when downloads are unavailable or refused. Resolves true if saved.
 */
async function downloadFile(filename, text, mime) {
  const dl = await warmDownloads();
  if (dl && typeof dl.save === 'function') {
    try {
      await dl.save({ filename, data: text });
      ui.toast('Saved ' + filename, { icon: 'check', duration: 3000 });
      return true;
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') return false;
      if (code === 'rate_limited') { ui.toast('A download is already waiting for you to confirm.'); return false; }
    }
  }
  ui.showText({ title: 'Download ' + filename, filename, text, note: 'Downloads aren’t available here — copy the text and paste it into a file named ' + filename + '.' });
  return false;
}

function leaseRows(today, settings) {
  return S().tenantsList({ includePast: false }).map(t => {
    const ls = RB.model.leaseState(t, settings, today);
    const l = t.lease || {};

    if (ls.noticeGiven || t.status === 'notice' || (l.moveOut && ls.kind !== 'upcoming')) { group = 'moving'; endDate = l.moveOut || l.end; }

function tenantDoc(d, today) {
  const tf = D.monthStart(D.monthKey(today));

    insurance: null, links: [], about: '', log: {}, createdAt: now, updatedAt: now,

async function doImport(el, today) {
  if (!canWrite()) return;
  const p = parsed(); if (!p) return;
  const checks = checkAll(p, today).filter(c => c.ok);
  if (!checks.length) return;
  const removeSample = S().hasSample() && imp.removeSample !== false;
  if (removeSample) {
    const ts = S().tenantsList().filter(t => t.sample).length;
    const ok = await ui.confirm({
      title: 'Import ' + RB.plural(checks.length, 'tenant') + ' and remove sample data?',
      body: h`<p class="muted">The <strong>${RB.plural(ts, 'sample tenant')}</strong>, their ledgers and sample upkeep requests are deleted first. Then <strong>${RB.plural(checks.length, 'tenant')}</strong> from your spreadsheet are added.</p>`,
      confirmLabel: 'Remove sample and import', danger: true,
    });
    if (!ok) return;
    try { await S().removeSample(); } catch (e) { return; }
  }
  const tenants = {};
  checks.forEach(c => { tenants[RB.id()] = tenantDoc(c.data, today); });
  const ids = Object.keys(tenants);
  try { await S().importAll({ tenants }); } catch (e) { ui.toast('Some tenants couldn’t be saved — check the Tenants list and try again.', { tone: 'bad' }); }
  imp.done = { count: ids.length, skipped: p.rows.length - ids.length, removed: removeSample };
  imp.text = ''; imp.fileName = ''; imp.map = null; imp.mapFor = null;
  ui.toast('Imported ' + RB.plural(ids.length, 'tenant'), { undo: () => { ids.forEach(id => S().deleteTenant(id).catch(() => {})); imp.done = null; } });
  RB.shell.refresh();
}

function summarize(data) {
  if (!data || data.format !== 'rent-book-backup' || !RB.isObj(data.tenants)) return null;
  const ledgers = RB.isObj(data.ledgers) ? data.ledgers : {};
  const entries = Object.keys(ledgers).reduce((n, k) => n + Object.keys((ledgers[k] && ledgers[k].entries) || {}).length, 0);
  const at = String(data.exportedAt || '').slice(0, 10);
  return { tenants: Object.keys(data.tenants).length, entries, tickets: RB.isObj(data.tickets) ? Object.keys(data.tickets).length : 0,
    when: D.valid(at) ? D.fmtLong(at) : 'an unknown date', portfolio: data.settings && typeof data.settings.portfolioName === 'string' ? data.settings.portfolioName.slice(0, 80) : '' };
}
function readFile(input, cb) {
  const f = input.files && input.files[0]; if (!f) return;
  if (f.size > 15 * 1024 * 1024) { cb(null, f.name, 'The file is larger than 15 MB.'); input.value = ''; return; }
  const fr = new FileReader();
  fr.onload = () => { cb(String(fr.result || ''), f.name); input.value = ''; };
  fr.onerror = () => { cb(null, f.name, 'The file couldn’t be read.'); input.value = ''; };
  fr.readAsText(f);
}

function ledgerPart(t, lg, today, showAll) {

// ------------------------------------------------------------------ change rent
function changeRent(id) {
  if (!T.guard()) return Promise.resolve(false);
  const t = S().tenant(id); if (!t) return Promise.resolve(false);
  const today = S().today();
  const sched = (t.rent || []).filter(r => r && D.isDate(r.from)).slice().sort((a, b) => D.cmp(a.from, b.from));
  const last = sched[sched.length - 1];
  let from0 = D.monthStart(D.addMonthKey(D.monthKey(today), 1));
  if (last && from0 <= last.from) from0 = D.monthStart(D.addMonthKey(D.monthKey(last.from), 1));
  const cur = RB.model.rentOn(t, today);
  return new Promise(resolve => {
    let ok = false;
    ui.sheet({
      title: 'Change rent', sub: sub(t),
      body: (el, sh) => {
        el.innerHTML = String(h`<div class="form-grid">
          ${ui.field({ name: 'amount', id: 'cr-amount', label: 'New monthly rent', type: 'money', value: null, required: true, hint: 'Now ' + M.fmt(cur) })}
          ${ui.field({ name: 'from', id: 'cr-from', label: 'Starting', type: 'date', value: from0, required: true, hint: last ? 'After ' + D.fmt(last.from, today) + ', the last change' : null })}
        </div>
        <div class="form-note mt-4" id="cr-sum" aria-live="polite"></div>`);
        const upd = () => {
          const a = M.parse(el.querySelector('#cr-amount').value);
          const f = el.querySelector('#cr-from').value;
          const was = f && D.valid(f) ? RB.model.rentOn(t, f) : cur;
          const box = el.querySelector('#cr-sum');
          if (a > 0 && f && D.valid(f)) {
            const diff = a - was;
            box.innerHTML = String(h`Rent changes from <strong>${M.fmt(was)}</strong> to <strong>${M.fmt(a)}</strong> on <strong>${D.fmtLong(f)}</strong>${diff ? h` <span class="faint">(${M.fmt(diff, { sign: true })} a month${was ? ', ' + (Math.round(diff / was * 1000) / 10).toFixed(1).replace(/\.0$/, '') + '%' : ''})</span>` : ''}.${f <= today ? h`<br><span class="tone-warn">That date has passed — charges already posted from ${D.fmt(f, today)} will use the new amount.</span>` : ''} Earlier months keep the old rent.`);
            sh.setAction('save', { label: 'Change rent to ' + M.fmt(a) });
          } else { box.textContent = 'Earlier months keep the old rent — the change is added to the rent history.'; sh.setAction('save', { label: 'Change rent' }); }
        };
        el.addEventListener('input', upd); el.addEventListener('change', upd); upd();
      },
      actions: [{ id: 'save', label: 'Change rent', kind: 'primary', onClick: s => {
        const v = ui.form(s.body, { validate: v => ({
          amount: v.amount !== null && v.amount <= 0 ? 'Enter the new monthly rent, like 1,450' : v.amount !== null && v.from && v.amount === RB.model.rentOn(t, v.from) ? 'That’s already the rent on that date' : '',
          from: last && v.from && v.from <= last.from ? 'Pick a date after ' + D.fmt(last.from, today) + ' — the last change starts then, and history isn’t rewritten' : '',
        }) });
        if (!v) return false;
        const prev = RB.clone(t.rent || []);
        S().updateTenant(id, { rent: prev.concat([{ from: v.from, amount: v.amount }]) }).catch(() => {});
        ok = true;
        ui.toast('Rent changes to ' + M.fmt(v.amount) + ' on ' + D.fmt(v.from, today), { undo: () => S().updateTenant(id, { rent: prev }) });
      } }],
      onClose: () => resolve(ok),
    });
  });
}

// ------------------------------------------------------------------ settle deposit
function settlementText(t, st, date, settings) {
  const W = 46;
  const line = (a, b) => { a = String(a); b = String(b); return a + ' '.repeat(Math.max(1, W - a.length - b.length)) + b; };
  const m = c => M.fmt(c, { cents: 'always' });
  const out = [];
  out.push((settings.portfolioName ? settings.portfolioName + ' — ' : '') + 'Security deposit statement');
  out.push('');
  out.push('Tenant:     ' + t.name);
  out.push('Unit:       ' + RB.model.unitLabel(t));
  if (t.lease && t.lease.moveOut) out.push('Moved out:  ' + D.fmtLong(t.lease.moveOut));
  out.push('-'.repeat(W));
  out.push(line('Deposit held', m(st.deposit)));
  st.lines.forEach(d => out.push(line('Less: ' + (d.reason || 'Deduction').slice(0, 30), '−' + m(d.amount))));
  if (st.applied) out.push(line('Applied to unpaid rent', '−' + m(st.applied)));
  if (st.creditRefunded) out.push(line('Plus credit on account', '+' + m(st.creditRefunded)));
  out.push('-'.repeat(W));
  out.push(line('Refund to tenant', m(st.refund)));
  if (st.shortfall) out.push(line('Still owed beyond the deposit', m(st.shortfall)));
  out.push('');
  out.push('Returned on ' + (date && D.valid(date) ? D.fmtLong(date) : '—'));
  return out.join('\n');
}

function settleDeposit(id, opts) {
  if (!T.guard()) return Promise.resolve(false);
  const t = S().tenant(id); if (!t) return Promise.resolve(false);
  const today = S().today();

  const dep = t.deposit || {};
  if (!(+dep.amount > 0)) { ui.toast('No deposit is recorded for ' + t.name + ' — add one in Edit details.'); return Promise.resolve(false); }
  if (dep.returned) { ui.toast('The deposit was already settled on ' + D.fmt(dep.returned.date, today) + '.'); return Promise.resolve(false); }
  const l = t.lease || {};
  const dueDate = l.moveOut ? D.addDays(l.moveOut, +settings.depositReturnDays || 0) : null;
  let cur = null;
  return new Promise(resolve => {
    let ok = false;
    const sh = ui.sheet({
      title: 'Settle deposit', size: 'wide',
      sub: (opts && opts.afterMoveOut ? 'Moved out · ' : '') + sub(t),
      body: (el, sh2) => {
        sh2.el.classList.add('tn-settle-sheet');
        const bal0 = S().ledger(id).balance;
        el.innerHTML = String(h`
