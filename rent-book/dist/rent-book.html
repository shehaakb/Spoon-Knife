  if (dd) out.push(h`<li class="tn-alert"><span class="tn-alert-text">The ${W.$(dd.amount)} deposit has to go back by ${T.day(dd.dueDate, today)} — ${dd.overdue ? W.days(-dd.daysLeft) + ' overdue' : W.rel(dd.dueDate, today)}.</span><button type="button" class="btn-link" data-act="settle" data-write>Give back the deposit</button></li>`);
  const ls = RB.model.leaseState(t, settings, today);
  if (t.status === 'notice' && ls.moveOut && ls.moveOut <= today) out.push(h`<li class="tn-alert"><span class="tn-alert-text">${ls.moveOut === today ? 'They move out today.' : h`They were moving out on ${T.day(ls.moveOut, today)}.`} When they have gone, finish the move-out.</span><button type="button" class="btn-link" data-act="moveout" data-write>Finish the move-out</button></li>`);
  return out.length ? h`<ul class="tn-alerts">${out}</ul>` : '';
}

// ---- contact: the number and the address are the tap targets; Copy lives in More
const telHref = p => { const d = String(p || '').replace(/[^\d+]/g, ''); return d.length >= 5 ? 'tel:' + d : null; };
const mailHref = e => (/^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(String(e || '').trim()) ? 'mailto:' + String(e).trim() : null);
T.telHref = telHref; T.mailHref = mailHref;
function contactRow(value, kind, sub) {
  const href = kind === 'phone' ? telHref(value) : mailHref(value);
  const title = (kind === 'phone' ? 'Call ' : 'Email ') + value;
  return href ? T.row({ title, sub, href, attrs: { 'data-contact': kind } }) : T.row({ title: value, sub });
}
function contactPart(t) {
  const co = (t.coTenants || []).filter(c => c && (c.name || c.phone || c.email));
  const em = t.emergency || {};
  const rows = [];
  if (t.phone) rows.push(contactRow(t.phone, 'phone'));
  if (t.email) rows.push(contactRow(t.email, 'email'));
  co.forEach(c => {
    const who = (c.name || 'Someone') + ' — also on the lease';
    if (c.phone) rows.push(contactRow(c.phone, 'phone', who));
    if (c.email) rows.push(contactRow(c.email, 'email', who));
    if (!c.phone && !c.email) rows.push(T.row({ title: c.name || 'Unnamed', sub: 'Also on the lease' }));
  });
  if (em.phone) rows.push(contactRow(em.phone, 'phone', (em.name ? em.name + ' — ' : '') + 'in an emergency'));
  else if (em.name) rows.push(T.row({ title: em.name, sub: 'In an emergency' }));
  const missing = !t.phone && !t.email;
  return h`${rows.length ? h`<ul class="rows rows-inset rows-nolead">${rows.map(r => h`<li>${r}</li>`)}</ul>` : ''}
    ${missing ? h`<p class="tn-empty">No phone number or email yet. <button type="button" class="btn-link" data-act="edit" data-sec="contact" data-write>Add them</button></p>` : ''}`;
}

// ---- lease and rent: short label/value rows, one "Change" link in the section head
function leasePart(t, lg, ls, settings, today) {
  const l = t.lease || {};
  const rows = [];
  const sched = (t.rent || []).filter(r => r && D.isDate(r.from)).slice().sort((a, b) => D.cmp(a.from, b.from));
  const nowIdx = sched.reduce((acc, r, i) => (r.from <= today ? i : acc), 0);
  const curR = sched[nowIdx], prevR = sched[nowIdx - 1], next = sched.filter(r => r.from > today);
  const terms = RB.model.termsOf(t, settings);
  rows.push(['Rent', h`${W.$(lg.rent)} a month, due on the ${T.ordinal(terms.dueDay)} — late after ${RB.plural(terms.graceDays, 'more day')}${l.dueDay != null || l.graceDays != null ? ' (special for this tenant)' : ''}.${prevR && curR ? h` It was ${W.$(prevR.amount)} until ${T.day(curR.from, today)}.` : ''}${next.map(r => h` Goes to ${W.$(r.amount)} on ${T.day(r.from, today)}.`)}`]);
  const rec = (t.recurring || []).filter(r => r && r.amount && !(r.to && r.to < today));
  if (rec.length) rows.push(['Each month also', RB.html.join(rec.map(r => h`${r.label || 'Monthly charge'} ${W.$(r.amount)}${r.from && r.from > today ? ' from ' + T.day(r.from, today) : r.to ? ' until ' + T.day(r.to, today) : ''}`), ', ')]);
  let lease;
  if (t.status === 'past') lease = h`Moved out ${T.day(l.moveOut, today)}`;
  else if (ls.kind === 'mtm') lease = h`Month-to-month${ls.holdover ? h` since ${T.day(l.end, today)}` : ''}`;
  else if (ls.kind === 'upcoming') lease = h`Starts ${T.day(l.moveIn, today)}${l.end ? h`, ends ${T.day(l.end, today)}` : ''}`;
  else lease = h`Ends ${T.day(l.end, today)} — ${ls.daysLeft === 0 ? 'today' : 'in ' + W.days(ls.daysLeft)}`;
  rows.push(['Lease', h`${lease}. Moved in ${T.day(l.moveIn || l.start, today)}.`]);
  if (l.moveOut && t.status !== 'past') rows.push(['Moving out', h`${T.day(l.moveOut, today)} — ${W.rel(l.moveOut, today)}`]);
  const dep = t.deposit || {};
  if (+dep.amount > 0) {
    if (dep.returned) {
      const kept = (dep.returned.deductions || []).reduce((s, d) => s + (+d.amount || 0), 0);
      rows.push(['Deposit', h`${W.$(dep.amount)} — ${W.$(dep.returned.refund || 0)} given back ${T.day(dep.returned.date, today)}${kept ? ', ' + W.$(kept) + ' kept' : ''}${dep.returned.applied ? ', ' + W.$(dep.returned.applied) + ' used for unpaid rent' : ''}`]);
    } else rows.push(['Deposit', h`${W.$(dep.amount)}${dep.heldAt ? h`, kept at ${dep.heldAt}` : ''}`]);
  }
  const ins = t.insurance;
  if (ins && (ins.carrier || ins.policy || ins.expires)) rows.push(['Insurance', h`${ins.carrier || 'Insurer'}${ins.expires ? h`, ${ins.expires < today ? 'ran out' : 'runs out'} ${T.day(ins.expires, today)}` : ''}`]);
  const links = (t.links || []).filter(x => x && RB.safeUrl(x.url));
  if (links.length) rows.push(['Documents', RB.html.join(links.map(x => h`<a class="tn-link" href="${RB.safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${x.label || x.url}</a>`), ', ')]);
  if (t.about) rows.push(['About them', h`<span class="prewrap">${t.about}</span>`]);
  return h`<dl class="tn-kv">${rows.map(([k, v]) => h`<div><dt>${k}</dt><dd>${v}</dd></div>`)}</dl>`;
}

// ---- payment history: by month, newest month first; each month's lines in the order they happened
/** Which payments were part payments: a payment after which a rent charge it went to is still not fully paid. */
function paymentKinds(rows) {
  const paidSoFar = {}, byId = {}, out = {};
  rows.forEach(r => { byId[r.id] = r; });
  rows.forEach(r => {
    if (r.type === 'charge' || r.void || !r.applied) return;
    let part = false, rest = false;
    r.applied.forEach(a => {
      const before = paidSoFar[a.id] || 0;
      paidSoFar[a.id] = before + a.amount;
      const c = byId[a.id];
      if (c && (c.kind === 'rent' || c.kind === 'recurring')) { if (paidSoFar[a.id] < c.amount) part = true; else if (before > 0) rest = true; }
    });
    out[r.id] = part ? 'part' : rest ? 'rest' : '';
  });
  return out;
}
function rowWhat(r, kinds) {
  if (r.kind === 'rent') return D.monthName(r.period) + (r.period.slice(0, 4) !== S().today().slice(0, 4) ? ' ' + r.period.slice(0, 4) : '') + ' rent';
  if (r.kind === 'recurring') return r.label || 'Monthly charge';
  if (r.kind === 'opening') return 'What they already owed';
  const e = r.entry || {};
  if (r.type === 'payment') { const k = kinds[r.id]; return (k === 'part' ? 'Part payment' : k === 'rest' ? 'Payment — the rest' : 'Payment') + (r.method ? ' by ' + r.method : ''); }
  if (r.type === 'credit') return 'Money off' + (r.memo ? ': ' + r.memo : '');
  if (e.category === 'late_fee') return 'Late fee' + (r.period ? ' for ' + D.monthName(r.period) : '');
  return r.memo || 'Charge';
}
function rowSub(r, today) {
  const bits = [T.day(r.date, today)];
  if (r.void) bits.push('Removed — it was a mistake');
  if (r.prorate) bits.push(r.prorate.days + ' of ' + r.prorate.ofDays + ' days of ' + W.$(r.prorate.full));
  if (r.type === 'charge' && !r.void && r.amount > 0) {
    if (r.open === 0 && r.paidOn) bits.push('paid ' + T.day(r.paidOn, today));
    else if (r.open > 0 && r.paid > 0) bits.push(W.$(r.paid) + ' paid so far, ' + W.$(r.open) + ' still owed');
    else if (r.open > 0) bits.push('not paid yet');
  }
  if (r.kind === 'entry') {
    if (r.ref) bits.push('reference ' + r.ref);
    if (r.type === 'payment' && r.memo) bits.push(r.memo);
    if (r.type !== 'charge' && !r.void && r.unapplied > 0) bits.push(W.$(r.unapplied) + ' paid ahead');
  }
  return bits.filter(Boolean).join(' · ');
}
/** Sums for one month of lines (void lines left out): {due, paid, owed}. Exposed for the smoke test. */
T.monthSums = function monthSums(rows) {
  const live = rows.filter(r => !r.void);
  return {
    due: live.filter(r => r.type === 'charge').reduce((s, r) => s + r.amount, 0),
    paid: live.filter(r => r.type !== 'charge').reduce((s, r) => s + r.amount, 0),
    owed: live.filter(r => r.type === 'charge').reduce((s, r) => s + (r.open || 0), 0),
  };
};
/** "November 2026 — $1,475 due, $800 paid, $675 still owed" / "… — $1,475 due, $1,475 paid, paid in full" */
T.monthHeading = function monthHeading(key, rows) {
  const s = T.monthSums(rows);
  const bits = [];
  if (s.due > 0) {
    bits.push(W.$(s.due) + ' due');
    if (s.paid > 0) bits.push(W.$(s.paid) + ' paid');
    bits.push(s.owed === 0 ? 'paid in full' : s.paid === 0 && s.owed === s.due ? 'not paid yet' : W.$(s.owed) + ' still owed');
  } else bits.push(s.paid > 0 ? W.$(s.paid) + ' paid' : 'nothing due');
  return D.fmtMonth(key) + ' — ' + bits.join(', ');
};
/** The lines of the payment history grouped by month: [{key, rows}] newest month first, rows oldest first. */
T.historyMonths = function historyMonths(lg) {
  const by = new Map();
  lg.rows.forEach(r => { const k = D.monthKey(r.date); if (!by.has(k)) by.set(k, []); by.get(k).push(r); });
  return Array.from(by.keys()).sort().reverse().map(key => ({ key, rows: by.get(key) }));
};

function ledgerPart(t, lg, today, showAll) {
  const months = T.historyMonths(lg);
  if (!months.length) return h`<p class="tn-empty">Nothing here yet. Rent starts ${T.day(lg.trackFrom, today)}.</p>`;
  const kinds = paymentKinds(lg.rows);
  const shown = showAll ? months : months.slice(0, MONTHS_SHOWN);
  const line = r => {
    const what = rowWhat(r, kinds);
    const stored = r.kind === 'entry';
    const amt = h`<span class="${r.void ? 'tn-struck' : ''}">${W.$(r.amount)}</span>`;
    const o = { title: what, sub: rowSub(r, today), amt, attrs: { 'data-row': r.id } };
    if (stored) Object.assign(o, { act: 'line', attrs: { 'data-row': r.id, 'data-eid': r.id, 'aria-haspopup': 'dialog' } });
    return h`<li class="${r.void ? 'is-void' : ''}">${T.row(o)}</li>`;
  };
  return h`<div class="tn-history" id="tn-history">${shown.map(m => h`<h4 class="rows-head tn-month" data-month="${m.key}">${T.monthHeading(m.key, m.rows)}</h4>
      <ul class="rows rows-inset rows-nolead">${m.rows.map(line)}</ul>`)}</div>
    ${months.length > MONTHS_SHOWN ? h`<button type="button" class="rows-more" data-act="earlier">${showAll ? 'Show only the last 3 months' : 'Show earlier months (' + (months.length - MONTHS_SHOWN) + ')'}</button>` : ''}`;
}

// ---- notes: latest 3 + "Show all"
function noteRow(e, today) {
  const day = localDay(e.at);
  const fu = e.followUp;
  let status = null;
  if (fu) {
    if (e.done) status = T.status('paid', 'Followed up');
    else if (fu < today) status = T.status('late', 'Follow up — ' + W.rel(fu, today, { style: 'late' }));
    else if (fu === today) status = T.status('due', 'Follow up today');
    else status = T.status('none', 'Follow up ' + T.day(fu, today));
  }
  const text = String(e.text || '');
  return T.row({ title: text.length > 72 ? text.slice(0, 70).trim() + '…' : text, sub: [day ? T.day(day, today) : '', T.KIND_LABEL[e.kind] || 'Note'].filter(Boolean).join(' · '), status, statusPos: 'main', act: 'notemenu', attrs: { 'data-lid': e.id, 'aria-haspopup': 'dialog' } });
}
function timelinePart(logs, today, showAll) {
  if (!logs.length) return h`<p class="tn-empty">No notes yet. Write down calls, texts and visits here so you remember them.</p>`;
  const shown = showAll ? logs : logs.slice(0, NOTES_SHOWN);
  return h`<ul class="rows rows-inset rows-nolead tn-notes">${shown.map(e => h`<li class="tn-note${e.done && e.followUp ? ' is-done' : ''}" data-lid="${e.id}">${noteRow(e, today)}</li>`)}</ul>
    ${logs.length > NOTES_SHOWN ? h`<button type="button" class="rows-more" data-act="allnotes">${showAll ? 'Show only the latest 3' : 'Show all ' + logs.length + ' notes'}</button>` : ''}`;
}

/** Repairs in this unit: provided by the Repairs view (RB.repairs.unitSection), which brings its own heading. null = hide. */
function repairsPart(t) {
  const R = RB.repairs;
  if (!R || typeof R.unitSection !== 'function') return null;
  try {
    let out = R.unitSection(t);
    if (out == null || out === '') return null;
    if (out && out.nodeType === 1) out = RB.raw(out.outerHTML);
    else if (!RB.isSafe(out)) out = R.unitSectionIsSafe ? RB.raw(String(out)) : h`${String(out)}`;
    if (!String(out).trim()) return null;
    // One heading only: add ours only if the section does not bring one.
    return /<h[2-4][\s>]/i.test(String(out)) ? out : h`<div class="tn-sec-head"><h3 class="tn-sec-title">Repairs in this unit</h3></div>${out}`;
  } catch (e) { console.warn(e); return null; }
}

// ------------------------------------------------------------------ note sheet (add + change)
T.noteSheet = function noteSheet(id, lid) {
  if (!T.guard()) return Promise.resolve(null);
  const t = S().tenant(id); if (!t) return Promise.resolve(null);
  const e = lid && t.log && t.log[lid] ? t.log[lid] : null;
  if (lid && !e) return Promise.resolve(null);
  const today = S().today();
  return new Promise(resolve => {
    let saved = null;
    ui.sheet({
      title: e ? 'Change this note' : 'Add a note', sub: t.name + ' — ' + T.place(t),
      body: el => {
        el.innerHTML = String(h`<div class="tn-form">
        ${ui.field({ name: 'text', id: 'tn-note-text', label: 'What happened?', type: 'textarea', value: e ? e.text : '', required: true, requiredMsg: 'Write what happened first', rows: 4, placeholder: 'For example: Called about the late rent. She will pay on Friday.' })}
        ${ui.field({ name: 'kind', id: 'tn-note-kind', label: 'How?', type: 'select', value: e ? (e.kind === 'notice' ? 'note' : e.kind) : 'note', options: T.NOTE_KINDS })}
        ${T.dateField({ name: 'followUp', id: 'tn-note-follow', label: 'Remind me to follow up on…', value: e ? e.followUp || '' : '', optional: true, hint: 'Leave this empty if you don’t need a reminder. On that day it shows on Today.' })}
      </div>`);
      },
      initialFocus: '#tn-note-text',
      actions: [{ id: 'save', label: e ? 'Save the note' : 'Add the note', kind: 'primary', onClick: s => {
        const v = ui.form(s.body, { validate: v => ({ followUp: v.followUp && !D.valid(v.followUp) ? 'Pick a date from the calendar' : '' }) });
        if (!v) return false;
        if (e) {
          const prev = { kind: e.kind || 'note', text: e.text || '', followUp: e.followUp || null, done: !!e.done };
          const patch = { kind: v.kind || 'note', text: v.text, followUp: v.followUp || null };
          if (patch.followUp !== prev.followUp) patch.done = false;
          S().updateLog(id, lid, patch).catch(() => {});
          saved = lid;
          ui.toast('Saved the note for ' + t.name + '.', { undo: () => S().updateLog(id, lid, prev), duration: 10000 });
        } else {
          const nid = RB.id();
          S().addLog(id, { id: nid, kind: v.kind || 'note', text: v.text, followUp: v.followUp || null, done: false }).catch(() => {});
          saved = nid;
          ui.toast('Added a note for ' + t.name + (v.followUp ? '. You’ll be reminded on ' + T.day(v.followUp, today) + '.' : '.'), { undo: () => S().deleteLog(id, nid), duration: 10000 });
        }
      } }],
      onClose: () => resolve(saved),
    });
  });
};

// ------------------------------------------------------------------ written-out date fields (law 11)
/** A date field with the day written out beside it ("Tuesday, November 24"). Same options as ui.field. */
T.dateField = o => ui.dateField(o);

// ------------------------------------------------------------------ entries: remove / put back
const entryWord = e => (e.type === 'payment' ? 'payment' : e.type === 'credit' ? 'money off' : e.category === 'late_fee' ? 'late fee' : 'charge');
T.removeEntry = function removeEntry(id, eid) {
  if (!T.guard()) return;
  const e = S().entries(id)[eid]; if (!e) return;
  S().voidEntry(id, eid).catch(() => {});
  ui.toast('Removed the ' + W.$(e.amount) + ' ' + entryWord(e) + ' from ' + T.day(e.date, S().today()) + '.', { undo: () => S().unvoidEntry(id, eid), duration: 10000 });
};
T.putBack = function putBack(id, eid) {
  if (!T.guard()) return;
  const e = S().entries(id)[eid]; if (!e) return;
  S().unvoidEntry(id, eid).catch(() => {});
  ui.toast('Put back the ' + W.$(e.amount) + ' ' + entryWord(e) + '.', { undo: () => S().voidEntry(id, eid), duration: 10000 });
};
/** Payment history as a file for Excel — column headings in plain words. */
T.downloadHistory = function downloadHistory(id) {
  const t = S().tenant(id); const lg = S().ledger(id);
  if (!t || !lg) return Promise.resolve(false);
  const kinds = paymentKinds(lg.rows);
  const csv = RB.model.csv(lg.rows, [
    { label: 'Date', key: 'date' },
    { label: 'What', get: r => rowWhat(r, kinds) },
    { label: 'For month', get: r => (r.period ? D.fmtMonth(r.period) : '') },
    { label: 'Charged', money: true, get: r => (r.type === 'charge' ? r.amount : null) },
    { label: 'Paid or money off', money: true, get: r => (r.type !== 'charge' ? r.amount : null) },
    { label: 'Still owed after this line', money: true, get: r => r.balance },
    { label: 'How they paid', get: r => r.method || '' },
    { label: 'Reference', get: r => r.ref || '' },
    { label: 'Note', get: r => (r.kind === 'entry' ? r.memo || '' : '') },
    { label: 'Removed', get: r => (r.void ? 'Removed — it was a mistake' : '') },
  ]);
  const slug = String(t.unit + ' ' + t.name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'tenant';
  return RB.actions.downloadFile('payment-history-' + slug + '-' + S().today() + '.csv', csv, 'text/csv');
};

// ------------------------------------------------------------------ "More" — every other action, with a line each
T.moreSheet = function moreSheet(id) {
  const t = S().tenant(id); if (!t) return;
  const A = RB.actions;
  const today = S().today();
  const lg = S().ledger(id);
  const p = W.partial(lg, today);
  const l = t.lease || {};
  const live = t.status !== 'past';
  const items = [];
  const add = (id2, label, hint, run, extra) => items.push(Object.assign({ id: 'tn-more-' + id2, label, hint, run, write: true }, extra || {}));
  if (p) add('part', 'Record another part payment', 'They paid some more, but not all of it', () => A.recordPayment(id, { part: true }));
  const fee = lg.suggestedLateFee;
  if (fee && live) { const fm = lg.months[fee.period]; add('fee', 'Add a ' + W.$(fee.amount) + ' late fee', D.monthName(fee.period) + ' rent is ' + (fm ? W.days(fm.daysLate) + ' ' : '') + 'late — your rules suggest it', () => A.addLateFee(id)); }
  add('charge', 'Add a charge', 'A late fee, repair bill or utility', () => A.addCharge(id));
  add('credit', 'Take money off what they owe', 'A discount, or money you are giving back', () => A.addCredit(id));
  if (live) {
    add('rent', 'Change the rent', 'Set a new monthly rent from a date you choose', () => A.changeRent(id));
    add('renew', 'Renew the lease', 'Give the lease a new end date', () => A.renewLease(id));
    add('moveout', t.status === 'notice' && l.moveOut && l.moveOut <= today ? 'Finish the move-out' : 'They are moving out', 'Set the date, see what they still owe, and sort out the deposit', () => A.moveOut(id));
  }
  if (t.deposit && +t.deposit.amount > 0 && !t.deposit.returned && l.moveOut && (t.status === 'past' || l.moveOut <= today)) add('settle', 'Give back the deposit', 'Work out what to keep and what to give back', () => A.settleDeposit(id));
  add('stmt', 'Copy a statement', 'Every charge and payment, ready to paste into a message', () => A.copyStatement(id), { write: false });
  add('csv', 'Download for Excel', 'The whole payment history as a spreadsheet file', () => T.downloadHistory(id), { write: false });
  if (t.phone) add('copyphone', 'Copy their phone number', t.phone, () => ui.copy(t.phone, 'phone number'), { write: false });
  if (t.email) add('copyemail', 'Copy their email address', t.email, () => ui.copy(t.email, 'email address'), { write: false });
  add('edit', 'Change their details', 'Name, phone, unit, rent and more', () => A.editTenant(id));
  add('delete', 'Remove this tenant', 'Only if they were added by mistake — this deletes all their history', () => T.deleteTenant(id), { danger: true });
  return T.choices({ title: 'What would you like to do?', sub: t.name + ' — ' + T.place(t), items });
};

/** Tapping a line in the payment history: Change · Remove this payment — it was a mistake · Copy a receipt. */
T.lineSheet = function lineSheet(id, eid) {
  const t = S().tenant(id);
  const e = S().entries(id)[eid];
  if (!t || !e) return;
  const A = RB.actions;
  const w = entryWord(e);
  const today = S().today();
  const items = [{ id: 'tn-line-change', label: 'Change', hint: 'Fix the amount, the date or how they paid', run: () => A.editEntry(id, eid), write: true }];
  if (e.void) items.push({ id: 'tn-line-putback', label: 'Put this ' + w + ' back', hint: 'It was removed by mistake', run: () => T.putBack(id, eid), write: true });

// ------------------------------------------------------------------ raise or change the rent
function changeRent(id) {
  if (!T.guard()) return Promise.resolve(false);
  const t = S().tenant(id); if (!t) return Promise.resolve(false);
  const today = S().today();
  const sched = (t.rent || []).filter(r => r && D.isDate(r.from)).slice().sort((a, b) => D.cmp(a.from, b.from));
  const last = sched[sched.length - 1];
  let from0 = D.monthStart(D.addMonthKey(D.monthKey(today), 1));
  if (last && from0 <= last.from) from0 = D.monthStart(D.addMonthKey(D.monthKey(last.from), 1));
  const cur = RB.model.rentOn(t, today);
  return new Promise(resolve => {
    let ok = false;
    ui.sheet({
      title: 'Change the rent', sub: sub(t),
      body: (el, sh) => {
        el.innerHTML = String(h`<div class="tn-form">
          <p class="tn-lead">The rent is ${$(cur)} a month now.</p>
          ${ui.field({ name: 'amount', id: 'cr-amount', label: 'What will the new rent be?', type: 'money', value: null, required: true, requiredMsg: 'Write the new monthly rent', placeholder: 'For example: ' + M.input(Math.round(cur * 1.03 / 2500) * 2500 || 145000) })}
          ${T.dateField({ name: 'from', id: 'cr-from', label: 'From what date?', value: from0, required: true, requiredMsg: 'Choose when the new rent starts', hint: 'Usually the 1st of a month.' })}
          <p class="tn-summary-text" id="cr-sum" aria-live="polite"></p>
        </div>`);
        const upd = () => {
          const a = M.parse(el.querySelector('#cr-amount').value);
          const f = el.querySelector('#cr-from').value;
          const was = f && D.valid(f) ? RB.model.rentOn(t, f) : cur;
          const box = el.querySelector('#cr-sum');
          if (a > 0 && f && D.valid(f)) {
            const diff = a - was;
            box.innerHTML = String(h`Rent changes from ${$(was)} to ${$(a)} on ${T.dayLong(f, today)}${diff ? ` (${diff > 0 ? 'up' : 'down'} ${$(Math.abs(diff))} a month)` : ''}. Months before that keep the old rent.${f <= today ? h` That date has already passed, so months from ${T.day(f, today)} will use the new rent.` : ''}`);
            sh.setAction('save', { label: 'Change the rent to ' + $(a) });
          } else { box.textContent = 'Months before the date you choose keep the old rent.'; sh.setAction('save', { label: 'Change the rent' }); }
        };
        el.addEventListener('input', upd); el.addEventListener('change', upd); upd();
      },
      actions: [{ id: 'save', label: 'Change the rent', kind: 'primary', onClick: s => {
        const v = ui.form(s.body, { validate: v => ({
          amount: v.amount !== null && v.amount <= 0 ? 'Write the new monthly rent, for example 1,450' : v.amount !== null && v.from && v.amount === RB.model.rentOn(t, v.from) ? 'That is already the rent on that date' : '',
          from: last && v.from && v.from <= last.from ? 'Choose a date after ' + T.day(last.from, today) + ' — the last change starts then' : '',
        }) });
        if (!v) return false;
        const prev = RB.clone(t.rent || []);
        S().updateTenant(id, { rent: prev.concat([{ from: v.from, amount: v.amount }]) }).catch(() => {});
        ok = true;
        ui.toast('The rent for ' + t.name + ' changes to ' + $(v.amount) + ' on ' + T.day(v.from, today) + '.', { undo: () => S().updateTenant(id, { rent: prev }), duration: 10000 });
      } }],
      onClose: () => resolve(ok),
    });
  });
}

// ------------------------------------------------------------------ deposit sums (shared by the move-out flow and "Give back the deposit")
function depositSums(t, data, balance) {
  const dep = +(t.deposit || {}).amount || 0;
  const ded = data.keep === 'yes' ? (data.ded || []).filter(d => d.reason || d.amount) : [];
  return RB.model.depositSettlement({ deposit: dep, deductions: ded.map(d => ({ reason: d.reason, amount: d.amount || 0 })), balance, applyToBalance: data.useForRent !== 'no' });
}
/** "Deposit $1,250 − cleaning $120 = $1,130 to give back, due by Nov 30" */
function depositSentence(st, dueDate, today) {
  const parts = ['Deposit ' + $(st.deposit)];
  st.lines.forEach(d => parts.push('− ' + (d.reason || 'other').toLowerCase() + ' ' + $(d.amount)));
  if (st.applied) parts.push('− unpaid rent ' + $(st.applied));
  if (st.creditRefunded) parts.push('+ money they paid ahead ' + $(st.creditRefunded));
  let s = parts.join(' ') + ' = ' + $(st.refund) + ' to give back';
  if (dueDate) s += ', due by ' + T.day(dueDate, today);
  s += '.';
  if (st.shortfall) s += ' What you are keeping is ' + $(st.shortfall) + ' more than the deposit — they still owe that.';
  else if (st.balanceAfter > 0) s += ' They will still owe ' + $(st.balanceAfter) + '.';
  return s;
}
function depositBody(el, data, t, balance, dueDate, today) {
  el.innerHTML = String(h`<div class="tn-form">
    <p class="tn-lead">They paid a deposit of ${$(+t.deposit.amount)}.${dueDate ? h` Give back what you don’t keep by ${T.dayLong(dueDate, today)}.` : ''}</p>
    ${ui.field({ name: 'keep', id: 'sd-keep', label: 'Do you need to keep any of it?', type: 'choice', cols: 2, value: data.keep, options: [{ value: 'no', label: 'No — give it all back' }, { value: 'yes', label: 'Yes, some of it' }] })}
    <div class="field" id="sd-ded-wrap" data-field="_ded"><span class="field-label">What are you keeping it for?</span><div class="field-hint">For example cleaning, a repair, or a missing key.</div>
      ${repeater('ded', (data.ded && data.ded.length ? data.ded : [{}]), 'Add another amount', 'sd-add')}</div>
    ${balance > 0 ? ui.field({ name: 'useForRent', id: 'sd-apply', label: 'They still owe ' + $(balance) + '. Use the deposit to pay it?', type: 'choice', cols: 2, value: data.useForRent, options: [{ value: 'yes', label: 'Yes' }, { value: 'no', label: 'No' }] }) : ''}
    ${balance < 0 ? h`<p class="tn-caption">They have ${$(-balance)} paid ahead. That is added to what you give back.</p>` : ''}
    <p class="tn-summary-text" id="sd-sum" aria-live="polite"></p>
  </div>`);
  wireRepeaters(el);
  const upd = () => {
    const vals = ui.readForm(el).values;
    data.keep = vals.keep; if (vals.useForRent !== undefined) data.useForRent = vals.useForRent;
    data.ded = readRep(el, 'ded').map(d => ({ reason: d.reason, amount: d.amount, _bad: d._amountBad }));
    if (data.ded.some(d => d.reason && d.amount > 0) || data.keep !== 'yes') repError(el, 'ded', '');
    show(el.querySelector('#sd-ded-wrap'), data.keep === 'yes');
    const st = depositSums(t, data, balance);
    el.querySelector('#sd-sum').textContent = depositSentence(st, dueDate, today);
  };
  el.addEventListener('input', upd); el.addEventListener('change', upd); upd();
}
function depositErrors(el, data) {
  if (data.keep !== 'yes') return null;
  const ded = readRep(el, 'ded');
  const filled = ded.filter(d => d.reason || d.amount !== null || d._amountBad);
  const bad = filled.find(d => d._amountBad || !(d.amount > 0) || !d.reason);
  const msg = !filled.length ? 'Write what you are keeping and how much — or choose “No”' : bad ? (!bad.reason ? 'Say what each amount is for — it goes on the statement' : 'Write an amount above zero, for example 150') : '';
  repError(el, 'ded', msg, bad ? bad._row : null);
  return msg ? { _ded: msg } : null;
}
/** Write a deposit settlement (entries + deposit.returned). Returns an undo function. */
function writeSettlement(id, st, date) {
  const entryIds = [];
  if (st.applied > 0) { const eid = RB.id(); entryIds.push(eid); S().addEntry(id, { id: eid, type: 'credit', date, amount: st.applied, memo: 'Deposit used for unpaid rent' }).catch(() => {}); }
  if (st.creditRefunded > 0) { const eid = RB.id(); entryIds.push(eid); S().addEntry(id, { id: eid, type: 'charge', date, amount: st.creditRefunded, category: 'other', period: D.monthKey(date), memo: 'Money paid ahead, given back with the deposit' }).catch(() => {}); }
  if (st.shortfall > 0) { const eid = RB.id(); entryIds.push(eid); S().addEntry(id, { id: eid, type: 'charge', date, amount: st.shortfall, category: 'damage', period: D.monthKey(date), memo: 'Kept beyond the deposit' }).catch(() => {}); }
  S().updateTenant(id, { deposit: { returned: { date, refund: st.refund, deductions: st.lines, applied: st.applied, creditRefunded: st.creditRefunded } } }).catch(() => {});
  return () => { S().updateTenant(id, { deposit: { returned: null } }); entryIds.forEach(eid => S().undoEntry(id, eid)); };
}

// ------------------------------------------------------------------ they are moving out (one flow; also "give notice")
function moveOutFlow(id) {
  if (!T.guard()) return Promise.resolve(false);
  const t = S().tenant(id); if (!t) return Promise.resolve(false);
  const today = S().today();
  const settings = S().settings();
  const l = t.lease || {};
  const dep = t.deposit || {};
  const holdsDeposit = +dep.amount > 0 && !dep.returned;
  const data = { moveOut: l.moveOut || (l.end && l.end >= today && t.status === 'active' ? l.end : today), keep: 'no', useForRent: 'yes', ded: [] };
  const preview = d => RB.model.moveOutPreview(t, S().entries(id), settings, today, d.moveOut);
  const dueOf = d => D.addDays(d.moveOut, +settings.depositReturnDays || 0);
  let ok = false;
  return T.steps({
    title: 'They are moving out',
    data,
    steps: [
      { title: 'When are they moving out?',
        body: (el, d) => {
          el.innerHTML = String(h`
            <p class="tn-lead">${l.end ? h`Their lease ends ${T.dayLong(l.end, today)}.` : 'They are month-to-month.'}</p>
            ${T.dateField({ name: 'moveOut', id: 'mo-date', label: 'Moving-out day', value: d.moveOut, hint: 'If they have already gone, choose the day they left.' })}
            <p class="tn-caption" id="mo-when"></p>`);
          const upd = () => {
            const box = el.querySelector('#mo-when');
            box.textContent = !d.moveOut || !D.valid(d.moveOut) ? '' : d.moveOut > today ? 'That is ' + W().rel(d.moveOut, today) + '. They stay on your list until then, marked “Moving out”.' : 'They will be marked “Moved out”. Next you’ll see what they still owe' + (holdsDeposit ? ' and sort out the deposit.' : '.');
          };
          syncData(el, d, upd); upd();
        },
        validate: d => ({ moveOut: !d.moveOut ? 'Choose the moving-out day' : l.moveIn && d.moveOut < l.moveIn ? 'That is before they moved in (' + T.day(l.moveIn, today) + ')' : '' }) },
      { title: holdsDeposit ? 'What they owe, and the deposit' : 'What they still owe',
        body: (el, d) => {
          const pv = preview(d);
          const rentRow = pv.finalRows.find(r => r.kind === 'rent');
          const lines = pv.finalRows.map(r => r.kind === 'rent'
            ? h`<li>${D.monthName(pv.period)} rent${r.prorate ? h`: ${r.prorate.days} of ${r.prorate.ofDays} days, so ${$(r.amount)} instead of ${$(r.prorate.full)}` : h`: ${$(r.amount)} (the whole month)`}</li>`
            : h`<li>${r.label}${r.prorate ? h`: ${r.prorate.days} of ${r.prorate.ofDays} days,` : ':'} ${$(r.amount)}</li>`);
          el.innerHTML = String(h`<div class="tn-sum" id="mo-sum">
            ${rentRow ? h`<p class="tn-lead">Their last rent is for ${D.monthName(pv.period)}:</p><ul class="tn-sumlist">${lines}</ul>` : h`<p class="tn-lead">There is no more rent to add for ${D.monthName(pv.period)}.</p>`}
            <p class="tn-lead" id="mo-owed">${pv.balance > 0 ? h`If nothing more is paid, they will owe ${$(pv.balance)} when they leave.` : pv.balance < 0 ? h`They will have ${$(-pv.balance)} paid ahead when they leave.` : h`When they leave, they will be all paid up.`}${pv.balanceNow > 0 && pv.balanceNow !== pv.balance ? h` Today they owe ${$(pv.balanceNow)}.` : ''}</p>
          </div><div class="tn-dep" id="mo-dep"></div>`);
          const box = el.querySelector('#mo-dep');
          if (!holdsDeposit) { box.innerHTML = String(h`<p class="tn-caption">${+dep.amount > 0 ? 'The deposit has already been sorted out.' : 'No deposit is recorded, so there is nothing to give back.'}</p>`); return; }
          if (d.moveOut > today) { box.innerHTML = String(h`<p class="tn-caption">They paid a ${$(+dep.amount)} deposit. Sort it out after they leave: on or after ${T.day(d.moveOut, today)}, open their page and choose “Give back the deposit”. Today will remind you.</p>`); return; }
          depositBody(box, d, t, pv.balance, dueOf(d), today);
          Object.defineProperty(d, '_el', { value: box, writable: true, configurable: true, enumerable: false });
        },
        checkOnLeave: false,   // the amounts kept are checked on Next (a half-typed row is not an error)
        validate: d => {
          if (!holdsDeposit || d.moveOut > today) return null;
          return d._el && d._el.isConnected ? depositErrors(d._el, d) : null;
        } },
    ],
    summary: d => {
      const pv = preview(d);
      if (d.moveOut > today) return h`<p class="tn-summary-text" id="mo-summary">${t.name} is moving out on ${T.dayLong(d.moveOut, today)} (${W().rel(d.moveOut, today)}).</p>
        <p class="tn-summary-more">${pv.balance > 0 ? h`If nothing more is paid, they will owe ${$(pv.balance)} then.` : 'They will be all paid up by then.'} You can finish the move-out on that day from their page or from Today.</p>`;
      const st = holdsDeposit ? depositSums(t, d, pv.balance) : null;
      return h`<p class="tn-summary-text" id="mo-summary">${t.name} moved out on ${T.dayLong(d.moveOut, today)}.</p>
        ${st ? h`<p class="tn-summary-more" id="mo-deposit">${depositSentence(st, dueOf(d), today)}</p>` : h`<p class="tn-summary-more">${pv.balance > 0 ? 'They still owe ' + $(pv.balance) + '.' : 'They are all paid up.'}</p>`}`;
    },
    doneLabel: d => (d.moveOut > today ? 'Save — moving out ' + T.day(d.moveOut, today) : 'Finish the move-out'),
    onDone: d => {
      ok = true;
      if (d.moveOut > today) {
        const prevN = { status: t.status || 'active', lease: { noticeDate: l.noticeDate || null, moveOut: l.moveOut || null } };
        const lid = RB.id();

// ------------------------------------------------------------------ give back the deposit (after they have gone)
function settlementText(t, st, date, settings) {
  const W2 = 46;
  const line = (a, b) => { a = String(a); b = String(b); return a + ' '.repeat(Math.max(1, W2 - a.length - b.length)) + b; };
  const m = c => M.fmt(c, { cents: 'always' });
  const out = [];
  out.push((settings.portfolioName ? settings.portfolioName + ' — ' : '') + 'Deposit statement');
  out.push('');
  out.push('Tenant:     ' + t.name);
  out.push('Unit:       ' + RB.model.unitLabel(t));
  if (t.lease && t.lease.moveOut) out.push('Moved out:  ' + D.fmtLong(t.lease.moveOut));
  out.push('-'.repeat(W2));
  out.push(line('Deposit paid', m(st.deposit)));
  st.lines.forEach(d => out.push(line('Kept for: ' + (d.reason || 'other').slice(0, 30), '−' + m(d.amount))));
  if (st.applied) out.push(line('Used for unpaid rent', '−' + m(st.applied)));
  if (st.creditRefunded) out.push(line('Plus money paid ahead', '+' + m(st.creditRefunded)));
  out.push('-'.repeat(W2));
  out.push(line('Given back to tenant', m(st.refund)));
  if (st.shortfall) out.push(line('Still owed beyond the deposit', m(st.shortfall)));
  out.push('');
  out.push('Given back on ' + (date && D.valid(date) ? D.fmtLong(date) : '—'));
  return out.join('\n');
}

function settleDeposit(id) {
  if (!T.guard()) return Promise.resolve(false);
  const t = S().tenant(id); if (!t) return Promise.resolve(false);
  const today = S().today();
  const settings = S().settings();
  const dep = t.deposit || {};
  if (!(+dep.amount > 0)) { ui.toast('No deposit is recorded for ' + t.name + '. You can add one under Change their details.'); return Promise.resolve(false); }
  if (dep.returned) { ui.toast('The deposit was already sorted out on ' + T.day(dep.returned.date, today) + '.'); return Promise.resolve(false); }
  const l = t.lease || {};
  const dueDate = l.moveOut ? D.addDays(l.moveOut, +settings.depositReturnDays || 0) : null;
  const data = { keep: 'no', useForRent: 'yes', ded: [] };
  return new Promise(resolve => {
    let ok = false;
    ui.sheet({
      title: 'Give back the deposit', size: 'wide', sub: sub(t),
      body: (el, sh) => {
        sh.el.classList.add('tn-settle-sheet');
        const inner = document.createElement('div');
        el.appendChild(inner);
        depositBody(inner, data, t, S().ledger(id).balance, dueDate, today);
        el.insertAdjacentHTML('beforeend', String(h`<div class="tn-form tn-form-after">${T.dateField({ name: 'date', id: 'sd-date', label: 'When did you give it back?', value: today, required: true, requiredMsg: 'Choose the day you gave it back' })}</div>`));
      },
      actions: [
        { id: 'copy', label: 'Copy the deposit sums', kind: 'outline', onClick: s => {
          ui.copy(settlementText(S().tenant(id) || t, depositSums(t, data, S().ledger(id).balance), s.body.querySelector('#sd-date').value, settings), 'deposit sums');
          return false;
        } },
        { id: 'save', label: 'Save', kind: 'primary', onClick: s => {
          const v = ui.form(s.body);
          if (!v) return false;
          if (depositErrors(s.body, data)) return false;
          const st = depositSums(t, data, S().ledger(id).balance);
          const undo = writeSettlement(id, st, v.date);
          ok = true;

      onClose: () => resolve(ok),
    });
  });
}

    ? (() => { const k = S.ticket(a.ticketId); return k && k.unit ? ui.plate(k.unit, { property: k.property }) : h`<span class="td-lead-ico">${ui.icon('wrench')}</span>`; })()
    : t ? ui.plate(t.unit, { property: t.property }) : '';
  const name = t ? t.name : a.title;
  switch (a.kind) {
    case 'delinquent': {
      const n = Object.values(lg.months).filter(m => m.open > 0).length;
      return { lead, title: name, sub: 'Owes ' + M.fmt(lg.balance) + ' from ' + RB.plural(n, 'month'), status: ui.status('late', 'Behind on rent') };
    }
    case 'late': {
      const m = lg.current.status === 'late' ? lg.months[lg.current.period] : Object.values(lg.months).filter(x => x.status === 'late').pop();
      return { lead, title: name, sub: m.rentPaid > 0 ? 'Owes ' + M.fmt(m.open) + ' of ' + D.monthName(m.period) + '’s ' + M.fmt(m.rentCharged) : 'Owes ' + M.fmt(m.open) + ' for ' + D.monthName(m.period),
        // the button already says "Record the rest ($675)", so the marker stays short
        status: ui.status('late', 'Late — ' + D.days(m.daysLate)) };
    }
    case 'partial': {
      const m = lg.months[lg.current.period];
      return { lead, title: name, sub: 'Owes ' + M.fmt(m.open) + ' for ' + D.monthName(m.period), status: ui.status('partial', 'Part paid — ' + M.fmt(m.rentPaid) + ' of ' + M.fmt(m.rentCharged)) };
    }
    case 'ticket': {
      const k = S.ticket(a.ticketId) || {};
      const where = k.unit ? ui.place(k) : k.property || 'The whole building';
      const age = k.reported ? D.diffDays(k.reported, today) : 0;
      const when = k.status === 'scheduled' && k.scheduled ? 'booked for ' + D.fmt(k.scheduled, today) : age > 0 ? 'waiting ' + D.days(age) : 'reported today';
      return { lead, title: cap(k.title || 'Repair'), sub: where + ' · ' + when, status: k.priority === 'urgent' ? ui.status('urgent', 'Urgent') : '' };
    }
    case 'lease': {
      const ls = RB.model.leaseState(t, S.settings(), today);
      return { lead, title: name, sub: 'Lease ends ' + D.fmt(ls.end, today) + ' — renew or not?', status: ui.status('warn', cap(D.rel(ls.end, today))) };
    }
    case 'moveout': {
      const mo = t.lease && t.lease.moveOut;
      return mo <= today
        ? { lead, title: name, sub: 'Was due to move out ' + (mo === today ? 'today' : D.fmt(mo, today)), status: ui.status('warn', 'Finish the move-out') }
        : { lead, title: name, sub: 'Moves out ' + D.fmt(mo, today), status: ui.status('warn', cap(D.rel(mo, today))) };
    }
    case 'movein': return { lead, title: name, sub: 'Moves in ' + D.fmt(t.lease.moveIn, today), status: ui.status('info', cap(D.rel(t.lease.moveIn, today))) };
    case 'deposit': {
      const dd = RB.model.depositDue(t, S.settings(), today);
      if (!dd) return { lead, title: name, sub: a.detail };
      return { lead, title: name, sub: 'Give back the ' + M.fmt(dd.amount) + ' deposit by ' + D.fmt(dd.dueDate, today),
        status: dd.overdue ? ui.status('late', 'Overdue — ' + D.days(-dd.daysLeft)) : ui.status(dd.daysLeft <= 7 ? 'late' : 'warn', cap(D.rel(dd.dueDate, today))) };
    }
    case 'followup': {
      const e = t && t.log && t.log[a.logId];
      const text = String((e && e.text) || '');
      return { lead, title: name, sub: 'Reminder: “' + (text.length > 90 ? text.slice(0, 88) + '…' : text) + '”',
        status: ui.status('warn', e && e.followUp < today ? 'Due since ' + D.fmt(e.followUp, today) : 'Due today') };
    }
    case 'insurance': {
      const ex = t.insurance && t.insurance.expires;
      return { lead, title: name, sub: 'Renter’s insurance ' + (ex < today ? 'ran out ' : 'runs out ') + D.fmt(ex, today), status: ui.status(ex < today ? 'warn' : 'quiet', ex < today ? 'Ask for the new policy' : cap(D.rel(ex, today))) };
    }
    default: return { lead, title: a.title, sub: a.detail };
  }
}
function attRow(S, a, today) {
  const r = itemRow(S, a, today);
  const pay = RENT_KINDS.includes(a.kind) && a.tenantId;
  const lg = pay ? S.ledger(a.tenantId) : null;
  const cur = pay ? lg.months[lg.current.period] : null;
  const partPaid = pay && a.kind !== 'delinquent' && cur && cur.open > 0 && cur.rentPaid > 0;
  if (pay) { r.amt = M.fmt(lg.balance); r.sub = ''; }
  return ui.row(Object.assign(r, {
    act: 'item', attrs: { id: 'td-row-' + a.id, 'data-id': a.id, 'aria-haspopup': pay || a.kind === 'followup' ? 'dialog' : null },
    statusPos: 'main',
    btn: pay ? { label: partPaid ? 'Record the rest (' + M.fmt(lg.balance) + ')' : 'Record a payment', act: 'pay', id: 'td-pay-' + a.id, attrs: { 'data-id': a.id } } : null,
    liAttrs: { 'data-item': a.id },
  }));
}
function needsYou(S, att, today) {
  if (!att.length) return h`<section class="td-needs" aria-labelledby="td-needs-t"><h2 class="sec-title" id="td-needs-t">Needs you</h2>${ui.empty({ quiet: true, title: 'Nothing needs you today.' })}</section>`;
  const more = att.length > TOP;
  let body;
  if (showAll && more) {
    const known = new Set(GROUPS.flatMap(g => g.kinds));
    body = GROUPS.map(g => ({ g, items: att.filter(a => g.kinds.includes(a.kind) || (g.key === 'follow' && !known.has(a.kind))) })).filter(x => x.items.length)
      .map(({ g, items }) => h`${ui.rowsHead(g.label, items.length, { id: 'td-g-' + g.key })}<ul class="rows rows-inset td-rows" aria-labelledby="td-g-${g.key}">${items.map(a => attRow(S, a, today))}</ul>`);
  } else body = h`<ul class="rows rows-inset td-rows" aria-labelledby="td-needs-t">${att.slice(0, TOP).map(a => attRow(S, a, today))}</ul>`;
  return h`<section class="td-needs" aria-labelledby="td-needs-t">
    <h2 class="sec-title td-needs-t" id="td-needs-t">Needs you <span class="rows-count">${att.length}</span></h2>
    ${body}
    ${more ? ui.rowsMore(att.length, { id: 'td-more', act: 'more', expanded: showAll }) : ''}
  </section>`;
}
/** Tapping a row opens the thing, or a short "What would you like to do?" sheet. */
function openItem(S, a) {
  const A = RB.actions;
  const t = a.tenantId ? S.tenant(a.tenantId) : null;
  if (RENT_KINDS.includes(a.kind) && t) {
    const lg = S.ledger(t.id);
    const fee = lg.suggestedLateFee;
    return ui.choices({ title: t.name, sub: ui.place(t) + ' · ' + ui.balanceWords(lg.balance), items: [
      { label: 'They paid part of it', hint: 'Type the amount you got', run: () => A.recordPayment(t.id, { part: true }), write: true, id: 'td-c-part' },
      fee ? { label: 'Add a ' + M.fmt(fee.amount) + ' late fee', hint: 'For ' + D.monthName(fee.period), run: () => A.addLateFee(t.id, fee.period), write: true, id: 'td-c-fee' } : null,
      { label: 'See their page', hint: 'Payment history, notes and lease', run: () => A.openTenant(t.id), id: 'td-c-open' },
    ] });
  }
  if (a.kind === 'followup' && t) {
    return ui.choices({ title: 'Reminder about ' + t.name, items: [
      { label: 'Mark it done', run: () => A.run(a.action), write: true, id: 'td-c-done' },
      { label: 'See their page', run: () => A.openTenant(t.id), id: 'td-c-open' },
    ] });
  }
  return A.run(a.action);
}

// ------------------------------------------------------------------ (4) what you did recently (page-like sheet)
function events(S, today) {
  const out = [];
  for (const t of S.tenantsList()) {
    const ents = S.entries(t.id) || {};
    for (const id of Object.keys(ents)) {
      const e = ents[id];
      if (!e || e.undone) continue;
      let sub;
      if (e.type === 'payment') sub = 'Paid ' + M.fmt(e.amount) + (e.method ? ' by ' + (METHOD_WORD[e.method] || e.method) : '');
      else if (e.type === 'credit') sub = 'You took ' + M.fmt(e.amount) + ' off' + (e.memo ? ' (' + e.memo + ')' : '');
      else sub = e.category === 'late_fee' ? 'You added a ' + M.fmt(e.amount) + ' late fee' : 'You added a ' + M.fmt(e.amount) + ' charge' + (e.memo ? ' (' + e.memo + ')' : '');
      out.push({ id: 'e-' + id, at: e.createdAt || e.date, date: e.date, t, sub: sub + (e.void ? ' — removed as a mistake' : '') });
    }
    const log = t.log || {};
    for (const id of Object.keys(log)) {
      const l = log[id];
      if (!l || !l.at) continue;
      const text = String(l.text || '');
      out.push({ id: 'l-' + id, at: l.at, date: String(l.at).slice(0, 10), t, sub: (KIND_WORD[l.kind] || 'Note') + ': “' + (text.length > 80 ? text.slice(0, 78) + '…' : text) + '”' });
    }
  }
  out.sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
  return out.slice(0, 20);
}
function recentSheet(S, today) {
  const list = events(S, today);
  const days = [];
  for (const ev of list) { const last = days[days.length - 1]; if (last && last.date === ev.date) last.items.push(ev); else days.push({ date: ev.date, items: [ev] }); }
  ui.sheet({
    title: 'What you did recently', page: true, cancel: false, actions: [{ id: 'close', label: 'Close', kind: '' }],
    body: (el, sh) => {
      el.innerHTML = String(list.length ? h`${days.map(d => h`<div class="recent-day">${ui.rowsHead(ui.dateWords(d.date, today))}<ul class="rows rows-inset">${d.items.map(ev => ui.row({
        lead: ui.plate(ev.t.unit, { property: ev.t.property }), title: ev.t.name, sub: ev.sub, act: 'open', attrs: { id: 'td-ev-' + ev.id, 'data-id': ev.t.id } }))}</ul></div>`)}`
        : ui.empty({ quiet: true, title: 'Nothing yet. Payments and notes you record will show here.' }));
      el.addEventListener('click', e => { const b = e.target.closest('[data-act="open"]'); if (!b) return; sh.close(); RB.actions.openTenant(b.dataset.id); });
    },
  });
}

RB.views.register('today', {
  title: 'Today',
  render(el, ctx) {
    const S = ctx.store;
    const att = S.attention();
    const byId = new Map(att.map(a => [a.id, a]));
    el.innerHTML = String(h`<div class="td">
      <div class="td-main">${money(S, ctx.today)}${actions()}</div>
      <div class="td-side">${needsYou(S, att, ctx.today)}
        <p class="td-recent"><button type="button" class="btn-link" id="td-recent" data-act="recent" aria-haspopup="dialog">See what you did recently${ui.icon('chevron-right')}</button></p>
      </div>
    </div>`);
    ui.bind(el, {
      task: b => runTask(b.dataset.task),
      item: b => { const a = byId.get(b.dataset.id); if (a) openItem(S, a); },
      pay: b => { const a = byId.get(b.dataset.id); if (a && a.tenantId) RB.actions.recordPayment(a.tenantId); },
      more: () => { showAll = !showAll; RB.shell.refresh(); const m = document.getElementById('td-more'); if (m) m.focus({ preventScroll: true }); },
      recent: () => recentSheet(S, ctx.today),
    });
  },
  destroy() { showAll = false; },
});
})();
