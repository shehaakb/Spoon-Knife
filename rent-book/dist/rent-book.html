  .rent-bar { flex-direction: column; align-items: stretch; }
}
/* ---- 42-tenants.css ---- */
/* Tenants list (#tenants) + tenant page (#t-<id>) + tenant sheets. Tokens only; sizes scale with --text-scale.
   Also defines two small pieces reused by Leases, Reports and Settings: .tn-pick (big worded choices) and .tn-form. */

/* ================= shared within my views ================= */
/* big single-choice buttons (on top of .seg so the shared click handler and ui.setValue work) */
.seg.tn-pick { display: flex; flex-wrap: wrap; gap: var(--s2); padding: 0; background: none; border: 0; overflow: visible; max-width: 100%; }
.seg.tn-pick > button {
  min-height: var(--ctl-h-lg); padding: var(--s2) var(--s4); flex: 0 1 auto; max-width: 100%;
  display: inline-flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left; gap: 2px;
  border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink);
  font-size: var(--t-15); font-weight: 500; line-height: 1.3; white-space: normal;
}
.seg.tn-pick > button:hover { background: var(--hover); }
.seg.tn-pick > button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.seg.tn-pick > button[aria-pressed="true"] .tn-pick-l::before { content: "✓ "; color: var(--accent); }
.seg.tn-pick.tn-pick-stack { flex-direction: column; }
.seg.tn-pick.tn-pick-stack > button { width: 100%; }
.tn-pick-s { font-size: var(--t-13); font-weight: 400; color: var(--ink-2); }
.field.is-invalid .seg.tn-pick > button { border-color: var(--bad-line); }

.tn-form { display: flex; flex-direction: column; gap: var(--s5); }
.tn-form .field-label { font-size: var(--t-15); font-weight: 600; color: var(--ink); }
.tn-form .field-hint { font-size: var(--t-13); color: var(--ink-2); line-height: 1.45; }
.tn-form .input { min-height: var(--ctl-h-lg); font-size: var(--t-15); }
.tn-form textarea.input { min-height: calc(var(--ctl-h-lg) * 2); }
.tn-lead { font-size: var(--t-15); line-height: 1.5; color: var(--ink); }
.tn-caption { font-size: var(--t-13); line-height: 1.5; color: var(--ink-2); max-width: 62ch; }
.tn-summary-text { font-size: var(--t-18); line-height: 1.45; color: var(--ink); }
.tn-summary-more { font-size: var(--t-15); line-height: 1.5; color: var(--ink-2); margin-top: var(--s3); }
.tn-summary-box { display: flex; flex-direction: column; }
.tn-btnrow { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.tn-static { font-size: var(--t-18); padding: var(--s1) 0; }

/* ================= Tenants list ================= */
.tn-top { display: flex; align-items: flex-start; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s5); }
.tn-summary { flex: 1 1 320px; font-size: var(--t-15); line-height: 1.5; color: var(--ink-2); }
.tn-summary strong { color: var(--ink); font-weight: 600; }
.tn-find { margin-bottom: var(--s4); max-width: 640px; }
.tn-find-label { display: block; font-size: var(--t-15); font-weight: 600; margin-bottom: var(--s2); }
.tn-find-row { display: flex; gap: var(--s2); }
.tn-search { flex: 1 1 auto; min-width: 0; }
.tn-search > .input { min-height: var(--ctl-h-lg); font-size: var(--t-18); }
.tn-show { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s3); }
.tn-choice {
  min-height: var(--ctl-h-lg); padding: 0 var(--s4); border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  background: var(--surface); color: var(--ink); font-size: var(--t-15); font-weight: 500; cursor: pointer;
}
.tn-choice:hover { background: var(--hover); }
.tn-choice[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tn-choice-n { color: var(--ink-2); font-weight: 400; }
.tn-ending { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s2) var(--s3); margin: 0 0 var(--s3); padding: var(--s3) var(--s4); background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: var(--r-panel); font-size: var(--t-15); line-height: 1.45; }
.tn-ending > svg { color: var(--warn); flex: none; }
.tn-ending > span { flex: 1 1 260px; }
.tn-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5); margin: var(--s4) 0 var(--s2); }
.tn-sort { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s2); }
.tn-sort-label { font-size: var(--t-15); color: var(--ink-2); }
.tn-sortseg { flex-wrap: wrap; overflow: visible; max-width: 100%; }
.tn-sortseg > button { min-height: var(--ctl-h); font-size: var(--t-15); padding: 0 var(--s3); }
.tn-groupby { min-height: var(--ctl-h); font-size: var(--t-15); }
.tn-groupby input { width: 22px; height: 22px; }
.tn-count { font-size: var(--t-13); color: var(--ink-2); margin-bottom: var(--s2); }

.tn-list { border-top: 1px solid var(--line); }
.tn-row {
  display: grid; grid-template-columns: auto minmax(160px, 1.1fr) minmax(200px, 1.4fr) minmax(160px, 1fr) auto;
  align-items: center; gap: var(--s2) var(--s4); min-height: var(--row-h); padding: var(--s3) var(--s3);
  border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; cursor: pointer;
}
.tn-row:hover { background: var(--hover); text-decoration: none; }
.tn-row:focus-visible { outline: none; box-shadow: inset var(--focus-ring); }
.tn-row.is-selected { background: var(--accent-soft); }
.tn-row.is-focused { box-shadow: inset 3px 0 0 var(--accent); }
.tn-row.is-past { color: var(--ink-2); }
.tn-row-plate .plate { min-width: calc(44px * var(--text-scale)); font-size: var(--t-13); }
.tn-row-who { display: flex; flex-direction: column; min-width: 0; }
.tn-row-name { font-size: var(--t-15); font-weight: 600; overflow-wrap: anywhere; }
.tn-row-place { font-size: var(--t-13); color: var(--ink-2); overflow-wrap: anywhere; }
.tn-row-money { font-size: var(--t-15); line-height: 1.35; }
.tn-row-lease { font-size: var(--t-13); color: var(--ink-2); line-height: 1.35; }
.tn-row-open { display: inline-flex; align-items: center; gap: 2px; font-size: var(--t-13); font-weight: 600; color: var(--accent); white-space: nowrap; }
.tone-ink { color: var(--ink); }
.tn-group { font-size: var(--t-15); font-weight: 600; padding: var(--s5) var(--s3) var(--s2); border-bottom: 1px solid var(--line-2); }
.tn-group-n { font-weight: 400; color: var(--ink-2); }

/* tenant page open beside the list: drop the lease line as the list narrows */
.view-tenants.tn-split .tn-row { grid-template-columns: auto minmax(140px, 1fr) minmax(180px, 1.3fr) minmax(140px, 1fr) auto; }
.view-tenants.tn-narrow .tn-row { grid-template-columns: auto minmax(0, 1fr) auto; }
.view-tenants.tn-narrow .tn-row-money { grid-column: 2; }
.view-tenants.tn-narrow .tn-row-lease { grid-column: 2; }
.view-tenants.tn-narrow .tn-row-open { grid-column: 3; grid-row: 1; }

@media (max-width: 1099.98px) {
  .tn-row { grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) auto; }
  .tn-row-lease { grid-column: 3; }
  .tn-row-money { grid-column: 3; grid-row: 1; }
  .tn-row-open { grid-column: 4; grid-row: 1 / span 2; }
  .tn-row-who { grid-row: 1 / span 2; }
  .tn-row-plate { grid-row: 1 / span 2; }
}
@media (max-width: 759.98px) {
  .tn-top { flex-direction: column; gap: var(--s3); }
  .tn-add-btn { width: 100%; }
  .tn-show { display: grid; grid-template-columns: minmax(0, 1fr); }
  .tn-choice { text-align: left; }
  .tn-list { border-top: 0; display: flex; flex-direction: column; gap: var(--s3); }
  .tn-row {
    grid-template-columns: auto minmax(0, 1fr); gap: var(--s1) var(--s3); padding: var(--s4);
    border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface);
  }
  .tn-row-plate { grid-row: 1 / span 2; align-self: start; }
  .tn-row-who { grid-column: 2; grid-row: 1; }
  .tn-row-money { grid-column: 1 / -1; grid-row: auto; margin-top: var(--s2); }
  .tn-row-lease { grid-column: 1 / -1; }
  .tn-row-lease:empty { display: none; }
  .tn-row-open { grid-column: 1 / -1; grid-row: auto; justify-content: center; min-height: var(--ctl-h); margin-top: var(--s2); border: 1px solid var(--line-2); border-radius: var(--r-ctl); font-size: var(--t-15); }
  .tn-group { padding-left: 0; }
}

/* ================= Tenant page ================= */
.drawer.tn-drawer { width: min(600px, 100vw); }
.drawer[data-tid]:focus, .drawer[data-tid]:focus-visible { outline: none; }
.tn-dhead { flex-direction: column; align-items: stretch; padding-top: var(--s3); padding-bottom: var(--s3); }
.tn-dtop { display: flex; flex-direction: column; gap: var(--s3); padding-top: var(--s4); }
.tn-dhead-bar { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.tn-back { margin-left: -4px; }
.tn-steps { display: inline-flex; gap: var(--s1); }
.tn-dident { display: flex; align-items: center; gap: var(--s4); }
.tn-dident .drawer-title { overflow-wrap: anywhere; font-size: var(--t-34); }
.tn-dplace { font-size: var(--t-15); color: var(--ink-2); margin-top: 2px; }
.tn-dstatus { font-size: var(--t-18); font-weight: 600; line-height: 1.4; }
.tn-dlease { font-size: var(--t-15); color: var(--ink-2); margin-top: calc(var(--s2) * -1); }

.tn-dacts { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 0.8fr); gap: var(--s2); }
.tn-dacts .btn { white-space: normal; text-align: center; padding: var(--s2) var(--s3); }
.tn-alerts { display: flex; flex-direction: column; gap: var(--s2); margin: var(--s4) 0 0; }
.tn-alert { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); padding: var(--s3) var(--s4); border: 1px solid var(--warn-line); background: var(--warn-soft); border-radius: var(--r-panel); }
.tn-alert-text { flex: 1 1 240px; font-size: var(--t-15); line-height: 1.45; }
.tn-alert .btn { white-space: normal; }

.tn-dsec { padding-top: var(--s6); }
.tn-dsec[hidden] { display: none; }
.tn-sec-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; padding-bottom: var(--s3); margin-bottom: var(--s3); border-bottom: 1px solid var(--line-2); }
.tn-sec-title { font-family: var(--f-display); font-size: var(--t-24); font-weight: 500; }
.tn-facts { display: flex; flex-direction: column; gap: var(--s4); margin-bottom: var(--s4); }
.tn-facts dt { font-size: var(--t-13); font-weight: 600; color: var(--ink-2); margin-bottom: 2px; }
.tn-facts dd { font-size: var(--t-15); line-height: 1.5; }
.tn-big { font-size: var(--t-18); font-weight: 600; }
.tn-sub { font-size: var(--t-13); color: var(--ink-2); }
.tn-sub.tone-warn { color: var(--warn); } .tn-sub.tone-bad { color: var(--bad); } .tn-sub.tone-accent { color: var(--accent); }
.tn-cline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); }
.tn-cval { font-size: var(--t-18); font-weight: 500; overflow-wrap: anywhere; min-width: 0; user-select: all; -webkit-user-select: all; }
.tn-cbtns { display: inline-flex; gap: var(--s2); }
.tn-person + .tn-person { margin-top: var(--s3); }
.tn-person-name { font-weight: 600; }
.tn-addbtn { margin-left: -8px; }
.tn-link { overflow-wrap: anywhere; }

.tn-strip { margin: 0 0 var(--s4); padding: var(--s4); background: var(--sunk); border-radius: var(--r-panel); }
.tn-strip-h { font-size: var(--t-15); font-weight: 600; margin-bottom: var(--s2); }
.tn-strip .pstrip { display: flex; width: 100%; height: auto; gap: 4px; }
.tn-strip .pc { flex: 1 1 0; width: auto; height: calc(28px * var(--text-scale)); max-width: 32px; }
.tn-strip .pc-partial::after { height: 50%; }
.tn-strip .tn-caption { margin-top: var(--s3); }

.tn-ledger { width: 100%; border-collapse: collapse; margin-top: var(--s4); font-size: var(--t-15); }
.tn-ledger thead th { text-align: left; font-size: var(--t-13); font-weight: 600; color: var(--ink-2); padding: var(--s2) var(--s2); border-bottom: 1px solid var(--line-2); }
.tn-ledger td { padding: var(--s3) var(--s1); border-bottom: 1px solid var(--line); vertical-align: top; }
.tn-ledger tr:not(.tn-l-month) td { height: var(--row-h); }
.tn-l-month th { text-align: left; font-size: var(--t-13); font-weight: 600; color: var(--ink-2); padding: var(--s4) var(--s2) var(--s1); border-bottom: 1px solid var(--line); }
.tn-l-date { white-space: nowrap; color: var(--ink-2); }
.tn-l-what { min-width: 0; width: 46%; }
.tn-ledger .tn-l-amt .money { white-space: nowrap; }
.tn-l-text { display: block; font-weight: 500; }
.tn-l-sub { display: block; font-size: var(--t-13); color: var(--ink-2); line-height: 1.4; margin-top: 2px; }
.tn-ledger .tn-l-amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tn-l-pay { color: var(--ok); }
.tn-l-act { text-align: right; width: 1%; white-space: nowrap; }
.tn-ledger tr.is-void .tn-l-text, .tn-ledger tr.is-void .tn-l-amt .money { text-decoration: line-through; color: var(--ink-2); }
.tn-more-rows { margin-top: var(--s3); }

.tn-notes { list-style: none; display: flex; flex-direction: column; }
.tn-note { padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
.tn-note-meta { font-size: var(--t-13); color: var(--ink-2); font-weight: 600; }
.tn-note-text { font-size: var(--t-15); line-height: 1.5; margin-top: 2px; overflow-wrap: anywhere; }
.tn-note-fu { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-13); color: var(--ink-2); margin-top: var(--s1); }
.tn-note.is-done .tn-note-fu { text-decoration: line-through; }
.tn-note-acts { display: flex; align-items: center; justify-content: flex-end; gap: var(--s3); flex-wrap: wrap; }
.tn-tick { min-height: var(--ctl-h); font-size: var(--t-15); }
.tn-tick input { width: 22px; height: 22px; }

.tn-dnav { display: flex; justify-content: space-between; gap: var(--s2); padding-top: var(--s6); margin-top: var(--s5); border-top: 1px solid var(--line); }

.tn-morelist { display: flex; flex-direction: column; gap: var(--s2); }
.tn-moreitem {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: var(--s3); text-align: left;
  min-height: var(--ctl-h-xl, var(--ctl-h-lg)); padding: var(--s3) var(--s4); border: 1px solid var(--line-2); border-radius: var(--r-panel);
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.tn-moreitem:hover { background: var(--hover); }
.tn-moreitem:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.tn-moreitem > svg { grid-column: 2; grid-row: 1 / span 2; color: var(--ink-2); }
.tn-moreitem-l { font-size: var(--t-15); font-weight: 600; }
.tn-moreitem-s { font-size: var(--t-13); color: var(--ink-2); line-height: 1.4; }

@media (max-width: 759.98px) {

  .tn-dacts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .tn-dacts .btn-primary { grid-column: 1 / -1; }

  .tn-ledger tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line); }

  .tn-ledger .tn-l-amt { grid-column: 1; text-align: left; font-size: var(--t-15); }
  .tn-ledger .tn-l-amt:empty { display: none; }
  .tn-ledger .tn-l-amt::before { content: attr(data-label) ": "; color: var(--ink-2); font-size: var(--t-13); }
  .tn-l-act { grid-column: 2; grid-row: 1 / span 5; align-self: center; }

/* ================= Sheets ================= */

.tn-stepcount { font-size: var(--t-13); font-weight: 600; color: var(--ink-2); }
.tn-steptitle { font-family: var(--f-display); font-size: var(--t-24); font-weight: 500; margin-top: 2px; }
.tn-more-toggle {
  display: flex; align-items: center; gap: var(--s2); width: 100%; min-height: var(--ctl-h-lg); padding: 0 var(--s4);
  border: 1px dashed var(--line-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--accent);
  font-size: var(--t-15); font-weight: 600; text-align: left; cursor: pointer;
}
.tn-more-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.tn-more-toggle:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.tn-more-body { padding: var(--s4) 0 0; }
.tn-more-body[hidden] { display: none; }
.tn-rep { display: flex; flex-direction: column; gap: var(--s3); margin: var(--s2) 0; }
.tn-rep-row { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: flex-end; padding: var(--s3); border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--sunk); }
.tn-rep-cell { display: flex; flex-direction: column; gap: 2px; flex: 1 1 180px; min-width: 0; }
.tn-rep-label { font-size: var(--t-13); color: var(--ink-2); font-weight: 600; }
.tn-rep-cell .input { min-height: var(--ctl-h); }
.tn-rep-x { flex: none; }
.tn-rep-add { align-self: flex-start; }
.tn-sumlist { margin: var(--s2) 0 var(--s4) var(--s5); font-size: var(--t-15); line-height: 1.6; }
@media (max-width: 759.98px) {
  .tn-rep-cell { flex-basis: 100%; }
  .tn-rep-x { width: 100%; }
}
/* ---- 43-leases.css ---- */
/* Leases view: the plain list first, the calendar behind a switch (desktop). Tokens only. */
.view-leases { --lz-name-w: 260px; --lz-act-w: 140px; --lz-row-h: calc(56px * var(--text-scale)); }
.lz-top { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s3) var(--s5); margin-bottom: var(--s5); }
.lz-summary { flex: 1 1 360px; font-size: var(--t-15); line-height: 1.5; color: var(--ink-2); }
.lz-summary strong { color: var(--ink); }
.lz-calswitch { min-height: var(--ctl-h); font-size: var(--t-15); }
.lz-calswitch input { width: 22px; height: 22px; }

/* ---- list ---- */
.lz-sec + .lz-sec { margin-top: var(--s6); }
.lz-sec-title { font-family: var(--f-display); font-size: var(--t-24); font-weight: 500; margin-bottom: var(--s2); }
.lz-sec-n { color: var(--ink-2); font-size: var(--t-18); }
.lz-sec > .tn-caption { margin-bottom: var(--s3); }
.lz-empty { font-size: var(--t-15); color: var(--ink-2); padding: var(--s3) 0; }
.lz-items { list-style: none; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.lz-item { display: flex; align-items: flex-start; gap: var(--s4); padding: var(--s4) var(--s2); border-bottom: 1px solid var(--line); }
.lz-item.is-soon { background: var(--surface); }
.lz-item > .plate { flex: none; margin-top: 2px; }
.lz-item-main { flex: 1 1 auto; min-width: 0; }
.lz-item-text { font-size: var(--t-18); line-height: 1.4; overflow-wrap: anywhere; }
.lz-item-sub { font-size: var(--t-13); color: var(--ink-2); margin-top: 2px; }
.lz-item-acts { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.lz-item-acts .btn { white-space: normal; }
.lz-name { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; min-height: 0; }
.lz-name:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 2px; }
.lz-quiet { color: var(--ink-2); }
@media (max-width: 759.98px) {
  .lz-item { padding: var(--s4) 0; gap: var(--s3); }
  .lz-item-acts .btn { flex: 1 1 100%; }
}

/* ---- calendar ---- */
.lz-cal-cap { margin-bottom: var(--s4); }
.lz-who { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; min-height: var(--ctl-h); padding: 4px 6px; margin: 0 -6px; border: 0; border-radius: var(--r-ctl); background: none; text-align: left; color: var(--ink); font-size: var(--t-15); cursor: pointer; }
.lz-who:hover { background: var(--hover); }
.lz-who:hover .lz-who-name { text-decoration: underline; text-underline-offset: 2px; }
.lz-who .plate { min-width: 58px; flex: none; }
.lz-who-name { font-weight: 500; }
.lz-tl { position: relative; border-top: 1px solid var(--line-2); }
.lz-head, .lz-row { display: grid; grid-template-columns: var(--lz-name-w) minmax(0, 1fr) var(--lz-act-w); align-items: center; }
.lz-head { position: sticky; top: var(--sticky-top); z-index: 3; min-height: calc(40px * var(--text-scale)); background: var(--sunk); border-bottom: 1px solid var(--line-2); }
.lz-head-name { padding-left: 12px; font-size: var(--t-13); color: var(--ink-2); font-weight: 600; }
.lz-track { position: relative; height: 100%; min-width: 0; }
.lz-months { height: 100%; min-height: calc(40px * var(--text-scale)); }
.lz-month { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 6px; border-left: 1px solid var(--line-2); font-size: var(--t-12); color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.lz-month.is-year { color: var(--ink); font-weight: 600; }
.lz-body { position: relative; }
.lz-grid { position: absolute; top: 0; bottom: 0; left: var(--lz-name-w); right: var(--lz-act-w); pointer-events: none; }
.lz-gl { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--line); }
.lz-gl.is-year { border-left-color: var(--line-2); }
.lz-window { position: absolute; top: 0; bottom: 0; background: var(--warn-soft); opacity: .55; border-right: 1px dashed var(--warn-line); }
.lz-grid i { font-style: normal; }
.lz-today { position: absolute; top: 0; bottom: -10px; width: 0; border-left: 2px solid var(--accent); margin-left: -1px; z-index: 2; }
.lz-foot { display: grid; grid-template-columns: var(--lz-name-w) minmax(0, 1fr) var(--lz-act-w); min-height: calc(40px * var(--text-scale)); }
.lz-foot .lz-track { position: relative; }
.lz-today-label { position: absolute; top: 10px; white-space: nowrap; font-size: var(--t-12); line-height: 1.4; transform: translateX(-50%); padding: 0 6px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.lz-row { position: relative; height: var(--lz-row-h); border-bottom: 1px solid var(--line); }
.lz-row:hover { background: var(--hover); }
.lz-row .lz-cname { padding: 0 12px; min-width: 0; }
.lz-row .lz-act { display: flex; justify-content: flex-end; padding-right: 4px; }
.lz-bar {
  position: absolute; top: 50%; height: calc(24px * var(--text-scale)); transform: translateY(-50%); z-index: 1;
  display: flex; align-items: center; justify-content: flex-end;
  background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 3px;
}
.lz-bar-due { background: var(--warn-soft); border-color: var(--warn); }
.lz-bar-off { border-right: 0; border-radius: 3px 0 0 3px; }
.lz-bar-mtm { background: transparent; border: 1.5px dashed var(--ink-2); border-right: 0; border-radius: 3px 0 0 3px; }
.lz-bar-moving { background: var(--sunk); border-color: var(--line-2); }
.lz-cap { position: absolute; right: -2px; top: -5px; bottom: -5px; width: 4px; border-radius: 1px; background: var(--ink); }
.lz-arrow { position: absolute; right: 2px; color: var(--accent); }
.lz-label { font-size: var(--t-12); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lz-bar-in .lz-label { padding: 0 8px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lz-bar-off .lz-label { padding-right: 20px; }
.lz-bar-due .lz-label, .lz-bar-due + .lz-label-out { color: var(--warn); font-weight: 500; }
.lz-label-out { position: absolute; top: 50%; transform: translateY(-50%); z-index: 1; }
@media (max-width: 1099.98px) { .view-leases { --lz-name-w: 200px; --lz-act-w: 120px; } .lz-yr { display: none; } }

/* long unit labels never push the page sideways */
.view-leases .plate { max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
/* ---- 44-repairs.css ---- */
/* Repairs (#repairs, #upkeep alias): worded tabs, the To do board (three columns on desktop, one at a time on phone),
   History by property cards, the repair forms (category choices, saved banner) and the tenant page's
   "Repairs in this unit" block. Tokens only; sizes follow --text-scale through the tokens. */

/* ---- two big worded tabs */
.rp-tabs { display: flex; gap: var(--s2); margin-bottom: var(--s5); border-bottom: 1px solid var(--line-2); }
.rp-tab {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: var(--ctl-h-lg); padding: var(--s1) var(--s5); margin-bottom: -1px;
  border: 0; border-bottom: 3px solid transparent; border-radius: var(--r-ctl) var(--r-ctl) 0 0;
  background: none; color: var(--ink-2); font-size: var(--t-15); font-weight: 600; line-height: 1.25;
}
.rp-tab:hover { color: var(--ink); background: var(--hover); }
.rp-tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.rp-tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.rp-tab svg { flex: none; }

/* ---- To do board */
.uk-head { margin-bottom: var(--s4); flex-wrap: wrap; row-gap: var(--s3); }
.uk-filter { margin-bottom: var(--s5); flex-wrap: wrap; }
.uk-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s5); align-items: start; }
.uk-col-head { display: flex; align-items: baseline; gap: var(--s2); padding-bottom: var(--s2); margin-bottom: var(--s3); border-bottom: 2px solid var(--line-2); }
.uk-col-title { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; color: var(--ink); }
.uk-col-count { font-size: var(--t-15); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.uk-col-body { display: flex; flex-direction: column; gap: var(--s3); }
.uk-empty { padding: var(--s4) 0; color: var(--ink-2); font-size: var(--t-body); }
.uk-older { align-self: flex-start; white-space: normal; text-align: left; height: auto; }

.uk-card { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s4); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-panel); min-width: 0; }
.uk-card.is-urgent { border-color: var(--bad-line); box-shadow: inset 0 3px 0 var(--bad); }
.uk-card-top { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s2); min-width: 0; }
.uk-plate { flex: none; max-width: 100%; }
.uk-title { display: block; width: 100%; padding: var(--s1) 0; border: 0; background: none; text-align: left; font-size: var(--t-15); font-weight: 600; color: var(--ink); line-height: 1.35; overflow-wrap: anywhere; cursor: pointer; }
.uk-title:hover { text-decoration: underline; text-underline-offset: 3px; }
.uk-title:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 4px; }
.uk-prio { flex: none; }
.uk-meta { font-size: var(--t-13); color: var(--ink-2); line-height: 1.45; overflow-wrap: anywhere; }
.uk-money { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px var(--s3); }
.uk-money .money { color: var(--ink); font-weight: 600; }
.uk-actions { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.uk-actions .btn { white-space: normal; text-align: left; }

.uk-inline { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--line); }
.uk-inline-btns { display: flex; flex-wrap: wrap; gap: var(--s2); }
.uk-inline .money-input { min-width: 0; }
.uk-inline-charge { font-size: var(--t-13); color: var(--ink); align-items: flex-start; }
.uk-tabs { margin-bottom: var(--s4); }
.uk-tabs > button { min-height: var(--ctl-h); }
.uk-tab-n { color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* "Whole building" in place of a door plate */
.rp-whole { display: inline-flex; align-items: center; min-height: calc(30px * var(--text-scale)); padding: 0 var(--s2); border: 1px dashed var(--ink-3); border-radius: var(--r-plate); font-size: var(--t-12); font-weight: 600; color: var(--ink); white-space: nowrap; }
/* long unit labels never push the page sideways */
.view-repairs .plate { max-width: 10em; overflow: hidden; text-overflow: ellipsis; }

/* ---- History by property: one large card per property */
.rp-lede { margin: 0 0 var(--s5); max-width: 62ch; color: var(--ink-2); font-size: var(--t-body); line-height: 1.5; }
.rp-props { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(19em * var(--text-scale))), 1fr)); gap: var(--s4); }
.rp-prop {
  display: flex; flex-direction: column; gap: var(--s2); min-width: 0; padding: var(--s5);
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-panel);
  color: var(--ink); text-decoration: none;
}
.rp-prop:hover { border-color: var(--accent-line); background: var(--hover); }
.rp-prop:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.rp-prop-name { font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-24); font-weight: 500; line-height: 1.2; overflow-wrap: anywhere; }
.rp-prop-units { color: var(--ink-2); font-size: var(--t-13); }
.rp-prop-line { font-size: var(--t-body); line-height: 1.5; overflow-wrap: anywhere; }
.rp-prop-open { display: block; }
.rp-prop-go { display: inline-flex; align-items: center; gap: var(--s2); margin-top: auto; padding-top: var(--s3); min-height: var(--ctl-h); color: var(--accent); font-size: var(--t-15); font-weight: 600; }
.rp-prop:hover .rp-prop-go span { text-decoration: underline; text-underline-offset: 3px; }

/* ---- forms: category choices, "more details", saved banner */
.rp-form { display: flex; flex-direction: column; }
.rp-form > [hidden], .rp-more[hidden] { display: none !important; }
.rp-cats { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s1); }
.rp-cat {
  display: inline-flex; align-items: center; gap: var(--s1); min-height: var(--ctl-h); padding: 0 var(--s3);
  border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink);
  font-size: var(--t-13); font-weight: 500; text-align: left; line-height: 1.25;
}
.rp-cat:hover { border-color: var(--ink-3); }
.rp-cat[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.rp-cat[aria-checked="true"]::before { content: "✓"; }
.rp-cat:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.rp-cat-hint:empty { display: none; }
.rp-more-btn { align-self: flex-start; margin-left: calc(-1 * var(--s3)); }
.rp-more { padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--paper); }
.rp-saved { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s3); margin-bottom: var(--s5); padding: var(--s3) var(--s4); background: var(--ok-soft); border: 1px solid var(--ok-line); border-radius: var(--r-panel); color: var(--ink); font-size: var(--t-15); line-height: 1.45; }
.rp-saved-text { display: flex; align-items: flex-start; gap: var(--s2); flex: 1 1 16em; min-width: 0; overflow-wrap: anywhere; }
.rp-saved-text svg { flex: none; margin-top: .2em; color: var(--ok); }

/* ---- tenant page: "Repairs in this unit" */
.rp-unit-title { margin: 0 0 var(--s3); font-family: var(--f-display); font-optical-sizing: auto; font-size: var(--t-18); font-weight: 500; }
.rp-unit-list { list-style: none; margin: 0; padding: 0; }
.rp-unit-row { display: grid; grid-template-columns: minmax(7.5em, auto) minmax(0, 1fr) auto; gap: var(--s1) var(--s3); align-items: baseline; padding: var(--s3) 0; border-top: 1px solid var(--line); font-size: var(--t-body); }
.rp-unit-date { color: var(--ink-2); white-space: nowrap; }
.rp-unit-what { overflow-wrap: anywhere; }
.rp-unit-cost { text-align: right; font-weight: 600; }
.rp-unit-none { margin: 0; font-size: var(--t-body); }
.rp-unit-actions { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.rp-unit-actions .btn { white-space: normal; }

@media (max-width: 1099.98px) { .uk-cols { gap: var(--s4); } }
@media (max-width: 759.98px) {
  .rp-tabs { gap: 0; }
  .rp-tabs > .rp-tab { flex: 1 1 0; padding: var(--s1) var(--s2); text-align: center; }
  .uk-head > .btn-primary { flex: 1 1 100%; }
  .uk-tabs { display: flex; width: 100%; }
  .uk-tabs > button { flex: 1 1 0; justify-content: center; white-space: normal; }
  .uk-cols { grid-template-columns: minmax(0, 1fr); }
  .uk-cols[data-tab="open"] > .uk-col:not([aria-labelledby="uk-col-open"]),
  .uk-cols[data-tab="scheduled"] > .uk-col:not([aria-labelledby="uk-col-scheduled"]),
  .uk-cols[data-tab="done"] > .uk-col:not([aria-labelledby="uk-col-done"]) { display: none; }
  .uk-col-head { display: none; }
  .uk-actions .btn, .uk-inline-btns .btn { flex: 1 1 auto; justify-content: center; }
  .view-head > .btn-primary#rp-past { flex: 1 1 100%; }
  .rp-prop { padding: var(--s4); }
  .rp-unit-row { grid-template-columns: minmax(0, 1fr) auto; }
  .rp-unit-date { grid-column: 1 / -1; }
  .rp-unit-actions .btn { flex: 1 1 100%; }
  .rp-cat { flex: 1 1 auto; }
}
.uk-filter .chip { white-space: normal; max-width: 100%; text-align: left; overflow-wrap: anywhere; }
/* ---- 45-reports.css ---- */
/* Reports view: big worded choices, a plain answer, then the table (cards on phone). Tokens only. */
.view-reports .rp-choose { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s6); }
.view-reports .rp-choice {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--s1); text-align: left;
  min-height: var(--ctl-h-xl, var(--ctl-h-lg)); padding: var(--s3) var(--s4);
  border: 1px solid var(--line-2); border-radius: var(--r-panel); background: var(--surface); color: var(--ink); cursor: pointer;
}
.view-reports .rp-choice:hover { background: var(--hover); }
.view-reports .rp-choice:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.view-reports .rp-choice[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.view-reports .rp-choice-l { font-size: var(--t-15); font-weight: 600; line-height: 1.3; }
.view-reports .rp-choice-s { font-size: var(--t-13); color: var(--ink-2); line-height: 1.4; }

.view-reports .rp-title { font-family: var(--f-display); font-size: var(--t-34); font-weight: 500; line-height: 1.15; margin-bottom: var(--s3); }
.view-reports .rp-answer { display: flex; flex-direction: column; gap: var(--s2); max-width: 70ch; font-size: var(--t-18); line-height: 1.5; color: var(--ink); margin-bottom: var(--s4); }
.view-reports .rp-answer .tn-caption { font-size: var(--t-13); }
.view-reports .rp-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); margin-bottom: var(--s5); padding-bottom: var(--s4); border-bottom: 1px solid var(--line); }
.view-reports .rp-actions-note { flex: 1 1 320px; font-size: var(--t-13); color: var(--ink-2); line-height: 1.45; }
.view-reports .rp-year { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); margin-bottom: var(--s4); }
.view-reports .rp-year-q { font-size: var(--t-15); font-weight: 600; }
.view-reports .rp-year-label { font-size: var(--t-24); font-family: var(--f-display); min-width: 3.2em; text-align: center; }

.view-reports .rp-name { padding: 0; border: 0; background: none; color: var(--ink); font: inherit; font-weight: 600; text-align: left; max-width: 100%; cursor: pointer; min-height: var(--ctl-h-sm); }
.view-reports .rp-name:hover { text-decoration: underline; text-underline-offset: 2px; }
.view-reports .rp-name:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 2px; }
.view-reports .tbl tr.is-muted .rp-name { color: var(--ink-2); font-weight: 400; }
.view-reports .rp-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.view-reports .rp-who .plate { min-width: 52px; flex: none; }
.view-reports .rp-sub { font-size: var(--t-13); color: var(--warn); }
.view-reports .rp-dash { color: var(--ink-2); }
.view-reports .rp-group-meta { font-weight: 400; color: var(--ink-2); }
.view-reports .rp-tbl { font-size: var(--t-15); }
.view-reports .rp-tbl .tbl-group td { border-top: 1px solid var(--line); font-weight: 600; }
.view-reports .rp-tbl tbody:first-of-type .tbl-group td { border-top: 0; }
.view-reports .rp-subtotal td { font-weight: 500; color: var(--ink-2); border-bottom: 1px solid var(--line-2); }
.view-reports .rp-subtotal:hover td { background: transparent !important; }
.view-reports .rp-tbl .plate { min-width: 52px; }

/* collection chart: bars drawn to scale with percentage heights against a nice axis */
.view-reports .rp-chart { margin: 0 0 var(--s5); }
.view-reports .rp-chart-plot { position: relative; height: calc(240px * var(--text-scale)); margin: 12px 0 calc(48px * var(--text-scale)) calc(56px * var(--text-scale)); border-bottom: 1px solid var(--line-2); }

}

/**
 * Derive the full ledger. See docs/CONTRACT.md "buildLedger output" for the exact shape.
 * @param tenant   tenant doc
 * @param entries  ledger entries map {id: entry} (or a ledger doc {entries}, or an array)
 * @param settings settings doc (defaults filled in)
 * @param today    'YYYY-MM-DD'
 */
function buildLedger(tenant, entries, settings, today) {
  settings = settingsWithDefaults(settings);
  const { dueDay, graceDays } = termsOf(tenant, settings);
  const lease = tenant.lease || {};
  const trackFrom = trackStart(tenant);
  const moveIn = lease.moveIn || null;
  const moveOut = lease.moveOut || null;
  const rows = [];
  const todayKey = D.monthKey(today);

  // ---- 1. generated charges (rent + recurring), one set per month
  if (trackFrom && D.isDate(trackFrom)) {
    const firstKey = D.monthKey(trackFrom);
    let lastKey = todayKey;
    if (moveOut && D.monthKey(moveOut) < lastKey) lastKey = D.monthKey(moveOut);
    const prorateFirst = !!moveIn && trackFrom === moveIn && D.parts(trackFrom).d !== 1;
    for (let k = firstKey; k <= lastKey; k = D.addMonthKey(k, 1)) {
      const mStart = D.monthStart(k), mEnd = D.monthEnd(k), ofDays = D.daysInMonth(k);
      let due = D.dayIn(k, dueDay);
      let from = mStart, to = mEnd;
      if (k === firstKey) {
        if (prorateFirst) { from = trackFrom; if (due < trackFrom) due = trackFrom; }
        else if (trackFrom > due) continue; // rent due before tracking began is part of `opening`
      }
      if (moveOut && moveOut < to) to = moveOut;
      if (to < from) continue;
      const days = D.diffDays(from, to) + 1;
      const prorated = days !== ofDays;
      const ratio = days / ofDays;
      const fullRent = rentOn(tenant, due);
      const rentAmt = prorated ? Math.round(fullRent * ratio) : fullRent;
      const name = D.monthName(k);
      rows.push({
        id: 'rent-' + k, kind: 'rent', type: 'charge', generated: true, date: due, period: k, amount: rentAmt,
        label: 'Rent — ' + name + (k.slice(0, 4) !== todayKey.slice(0, 4) ? ' ' + k.slice(0, 4) : ''),
        prorate: prorated ? { days, ofDays, full: fullRent, from, to } : null,
      });
      for (const rc of tenant.recurring || []) {
        if (!rc || !rc.amount) continue;
        if (rc.from && rc.from > mEnd) continue;
        if (rc.to && rc.to < mStart) continue;
        rows.push({
          id: 'rec-' + (rc.id || rc.label) + '-' + k, kind: 'recurring', type: 'charge', generated: true, date: due, period: k,
          amount: prorated ? Math.round(rc.amount * ratio) : rc.amount, label: rc.label || 'Recurring charge', recurringId: rc.id || null,
          prorate: prorated ? { days, ofDays, full: rc.amount, from, to } : null,
        });
      }
    }
  }

  // ---- 2. opening balance
  const open0 = tenant.opening && +tenant.opening.amount;
  if (open0) {
    rows.push({
      id: 'opening', kind: 'opening', type: open0 > 0 ? 'charge' : 'credit', generated: true,
      date: trackFrom || today, period: trackFrom ? D.monthKey(trackFrom) : todayKey, amount: Math.abs(open0), label: 'Balance brought forward',
    });
  }

  // ---- 3. stored entries
  for (const e of entryList(entries)) {
    if (e.undone) continue; // undone = removed via Undo; never shown
    if (!D.isDate(e.date) || !(e.type === 'payment' || e.type === 'charge' || e.type === 'credit')) continue;
    const amount = Math.abs(Math.round(+e.amount || 0));
    let label;
    if (e.type === 'payment') label = 'Payment' + (e.method ? ' · ' + e.method : '');
    else if (e.type === 'credit') label = e.memo || 'Credit';
    else label = e.memo || (CATEGORY_LABEL[e.category] || 'Charge') + (e.period ? ' — ' + D.monthName(e.period) : '');
    rows.push({
      id: e.id, kind: 'entry', type: e.type, entry: e, date: e.date,
      period: e.type === 'charge' ? (D.isMonth(e.period) ? e.period : D.monthKey(e.date)) : D.monthKey(e.date),
      amount, label, method: e.method || null, ref: e.ref || null, memo: e.memo || null, category: e.category || null,
      void: !!e.void, createdAt: e.createdAt || '',
    });
  }

  // ---- 4. sort: date, then opening < charge < credit < payment, then createdAt, then id
  const ord = r => (r.kind === 'opening' ? 0 : TYPE_ORDER[r.type]);
  const kindOrd = r => (r.kind === 'rent' ? 0 : r.kind === 'recurring' ? 1 : 2);
  rows.sort((a, b) => D.cmp(a.date, b.date) || ord(a) - ord(b) || kindOrd(a) - kindOrd(b) ||
    D.cmp(a.createdAt || '', b.createdAt || '') || D.cmp(a.id, b.id));

  // ---- 5. running balance + FIFO allocation
  let bal = 0;
  const queue = [];   // open charges, oldest first
  const pool = [];    // unapplied money [{amount, date, rowId}]
  const applyPool = ch => {
    while (ch.open > 0 && pool.length) {
      const f = pool[0];
      const take = Math.min(f.amount, ch.open);
      ch.open -= take; ch.paid += take; f.amount -= take;
      ch.paidOn = D.max(ch.paidOn, f.date);
      f.row.applied.push({ id: ch.id, amount: take });
      if (f.amount === 0) pool.shift();
    }
    if (ch.open === 0) { const i = queue.indexOf(ch); if (i >= 0) queue.splice(i, 1); }
  };
  for (const r of rows) {
    if (r.void) { r.balance = bal; continue; }
    if (r.type === 'charge') {
      bal += r.amount;
      r.paid = 0; r.open = r.amount; r.paidOn = r.amount === 0 ? r.date : null;
      if (r.amount > 0) { queue.push(r); applyPool(r); if (r.open > 0) r.paidOn = null; }
    } else {
      bal -= r.amount;
      r.applied = [];
      let left = r.amount;
      while (left > 0 && queue.length) {
        const ch = queue[0];
        const take = Math.min(left, ch.open);
        ch.open -= take; ch.paid += take; left -= take;
        r.applied.push({ id: ch.id, amount: take });
        if (ch.open === 0) { ch.paidOn = r.date; queue.shift(); }
      }
      r.unapplied = left;
      if (left > 0) pool.push({ amount: left, date: r.date, row: r });
    }
    r.balance = bal;
  }

  // ---- 6. month summaries
  const months = {};
  for (const r of rows) {
    if (r.void || r.type !== 'charge' || r.kind === 'opening') continue;
    const m = months[r.period] || (months[r.period] = {
      period: r.period, charged: 0, paid: 0, open: 0, rentCharged: 0, rentPaid: 0, rentOpen: 0, rent: 0,
      due: null, graceEnd: null, status: 'none', paidOn: null, daysLate: 0, scheduled: false, lateFee: false, prorate: null,
    });
    m.charged += r.amount; m.paid += r.paid; m.open += r.open;
    if (r.kind === 'rent' || r.kind === 'recurring') {
      m.scheduled = true;
      m.rentCharged += r.amount; m.rentPaid += r.paid; m.rentOpen += r.open;
      if (r.kind === 'rent') { m.rent = r.amount; m.prorate = r.prorate; }
      m.due = D.min(m.due, r.date);
      if (r.open === 0) m.paidOn = D.max(m.paidOn, r.paidOn);
    }
    if (r.category === 'late_fee') m.lateFee = true;
  }
  for (const k of Object.keys(months)) {
    const m = months[k];
    if (!m.scheduled) { m.status = 'none'; continue; }
    m.graceEnd = D.addDays(m.due, graceDays);
    if (m.rentOpen === 0) {
      if (!m.paidOn || m.paidOn <= m.graceEnd) { m.status = 'paid'; m.daysLate = 0; }
      else { m.status = 'paid_late'; m.daysLate = D.diffDays(m.due, m.paidOn); }
      m.paidOn = m.paidOn || m.due;
    } else {
      m.paidOn = null;
      if (today > m.graceEnd) { m.status = 'late'; m.daysLate = D.diffDays(m.due, today); }
      else { m.status = m.rentPaid > 0 ? 'partial' : 'due'; m.daysLate = 0; }
    }
  }

  // ---- 7. aging, delinquency, current, last payment, late-fee suggestion
  const aging = { d0_30: 0, d31_60: 0, d61_90: 0, d90: 0 };
  let oldestOpenDate = null;
  for (const r of rows) {
    if (r.void || r.type !== 'charge' || !r.open) continue;
    const age = D.diffDays(r.date, today);
    if (age <= 30) aging.d0_30 += r.open; else if (age <= 60) aging.d31_60 += r.open; else if (age <= 90) aging.d61_90 += r.open; else aging.d90 += r.open;
    oldestOpenDate = D.min(oldestOpenDate, r.date);
  }
  const delinquent = !!oldestOpenDate && D.diffDays(oldestOpenDate, today) > 30;

  const cm = months[todayKey];
  const current = cm && cm.scheduled
    ? { period: todayKey, status: cm.status, due: cm.due, graceEnd: cm.graceEnd, charged: cm.rentCharged, paid: cm.rentPaid, open: cm.rentOpen, daysLate: cm.daysLate, paidOn: cm.paidOn }
    : { period: todayKey, status: 'none', due: null, graceEnd: null, charged: 0, paid: 0, open: 0, daysLate: 0, paidOn: null };

  let lastPayment = null;
  for (const r of rows) if (!r.void && r.type === 'payment' && (!lastPayment || r.date >= lastPayment.date)) lastPayment = { date: r.date, amount: r.amount, method: r.method, id: r.id };

  let suggestedLateFee = null;
  if (settings.lateFee && settings.lateFee.type !== 'none' && +settings.lateFee.amount > 0) {
    const feePeriods = new Set(rows.filter(r => !r.void && r.type === 'charge' && r.category === 'late_fee' && r.entry && r.entry.period).map(r => r.entry.period));
    const lateKeys = Object.keys(months).filter(k => months[k].status === 'late' && !feePeriods.has(k)).sort();
    if (lateKeys.length) {
      const k = lateKeys[lateKeys.length - 1];
      suggestedLateFee = { period: k, amount: lateFeeAmount(tenant, settings, k) };
    }
  }

  const credit = bal < 0 ? -bal : 0;
  return {
    tenantId: tenant.id || null,
    rows, balance: bal, credit, months, current, aging, oldestOpenDate, delinquent, lastPayment, suggestedLateFee,
    dueDay, graceDays, trackFrom, rent: rentOn(tenant, today), today,
  };
}

/** Late fee (cents) for a period under settings.lateFee: flat = amount cents; percent = amount% of that month's rent. */
function lateFeeAmount(tenant, settings, period) {
  settings = settingsWithDefaults(settings);
  const lf = settings.lateFee || {};
  if (lf.type === 'flat') return Math.round(+lf.amount || 0);
  if (lf.type === 'percent') {
    const { dueDay } = termsOf(tenant, settings);
    return Math.round(rentOn(tenant, D.dayIn(period, dueDay)) * (+lf.amount || 0) / 100);
  }
  return 0;
}

/**
 * Last n months ending at endKey (oldest → newest), filling gaps with status 'none'.
 * Each cell: {period, status, charged, paid, open, paidOn, daysLate, due}
 */
function monthsBack(ledger, endKey, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = D.addMonthKey(endKey, -i);
    const m = ledger && ledger.months[k];
    out.push(m && m.scheduled
      ? { period: k, status: m.status, charged: m.charged, paid: m.paid, open: m.open, paidOn: m.paidOn, daysLate: m.daysLate, due: m.due }
      : { period: k, status: 'none', charged: m ? m.charged : 0, paid: m ? m.paid : 0, open: m ? m.open : 0, paidOn: null, daysLate: 0, due: null });
  }
  return out;
}

/** Status of one month ('none' when not tracked). */
function monthStatus(ledger, key) { const m = ledger && ledger.months[key]; return m && m.scheduled ? m.status : 'none'; }

/**
 * Lease position. kind: 'fixed' (has an end date in the future or today), 'mtm' (no end, or end passed while still
 * living there = holdover), 'ended' (status past, or moved out on/before today), 'upcoming' (moveIn after today).
 */
function leaseState(tenant, settings, today) {
  settings = settingsWithDefaults(settings);
  const l = tenant.lease || {};
  const out = {
    kind: 'fixed', start: l.start || null, end: l.end || null, moveIn: l.moveIn || null, moveOut: l.moveOut || null,
    noticeDate: l.noticeDate || null, noticeGiven: !!l.noticeDate, daysLeft: null, inNoticeWindow: false, progress: null,
    holdover: false, label: '', daysToMoveOut: null,
  };
  if (l.moveOut) out.daysToMoveOut = D.diffDays(today, l.moveOut);
  if (tenant.status === 'past' || (l.moveOut && l.moveOut < today)) { out.kind = 'ended'; out.label = 'ended'; return out; }
  if (l.moveIn && l.moveIn > today) { out.kind = 'upcoming'; out.label = 'moves in ' + D.rel(l.moveIn, today); }
  if (!l.end) {
    if (out.kind !== 'upcoming') { out.kind = 'mtm'; out.label = 'month-to-month'; }
  } else if (l.end < today) {
    out.kind = 'mtm'; out.holdover = true; out.label = 'month-to-month';
    out.daysLeft = D.diffDays(today, l.end);
  } else {
    out.daysLeft = D.diffDays(today, l.end);
    out.inNoticeWindow = out.daysLeft <= settings.leaseNoticeDays;
    if (out.kind !== 'upcoming') out.label = out.daysLeft === 0 ? 'ends today' : 'in ' + D.days(out.daysLeft);
    if (l.start && l.end > l.start) out.progress = Math.max(0, Math.min(1, D.diffDays(l.start, today) / D.diffDays(l.start, l.end)));
  }
  if (out.noticeGiven && l.moveOut) out.label = 'moving out ' + D.rel(l.moveOut, today);
  return out;
}

/** Deposit to return after move-out, or null. {amount, moveOut, dueDate, daysLeft, overdue} */
function depositDue(tenant, settings, today) {
  settings = settingsWithDefaults(settings);
  const l = tenant.lease || {}, dep = tenant.deposit;
  if (!l.moveOut || !dep || !(+dep.amount > 0) || dep.returned) return null;
  if (l.moveOut > today && tenant.status !== 'past') return null;
  const dueDate = D.addDays(l.moveOut, +settings.depositReturnDays || 0);
  const daysLeft = D.diffDays(today, dueDate);
  return { amount: +dep.amount, moveOut: l.moveOut, dueDate, daysLeft, overdue: daysLeft < 0 };
}

function tenantsArr(state) {
  const t = state.tenants || {};
  return Array.isArray(t) ? t.slice() : Object.keys(t).map(id => (t[id] ? Object.assign({ id }, t[id], { id: t[id].id || id }) : null)).filter(Boolean);
}
function ticketsArr(state) {
  const t = state.tickets || {};
  return Array.isArray(t) ? t.slice() : Object.keys(t).map(id => (t[id] ? Object.assign({ id }, t[id], { id: t[id].id || id }) : null)).filter(Boolean);
}
function ledgerGetter(state, today, getLedger) {
  if (getLedger) return getLedger;
  const cache = {};
  const settings = settingsWithDefaults(state.settings);
  return id => {
    if (cache[id]) return cache[id];
    const t = (state.tenants || {})[id] || tenantsArr(state).find(x => x.id === id);
    const lg = (state.ledgers || {})[id];
    return (cache[id] = buildLedger(Object.assign({ id }, t), lg ? lg.entries || lg : {}, settings, today));
  };
}
const unitLabel = t => [t.property, t.unit].filter(Boolean).join(' ');
const sortTenants = list => list.sort((a, b) => RB.natCmp(a.property, b.property) || RB.natCmp(a.unit, b.unit) || RB.natCmp(a.name, b.name));
const isCurrent = t => t.status !== 'past';

/**
 * Prioritised "needs attention" items for the Today view.
 * Item: {id, kind, severity:'high'|'medium'|'low', rank, tenantId?, ticketId?, logId?, title, detail, amount?, date?,
 *        action:{type, label, ...args}, secondary?:{type, label, ...args}}
 * kinds: delinquent, late, partial, ticket, lease, moveout, movein, deposit, followup, insurance
 * action.type: recordPayment {tenantId} | addLateFee {tenantId, period} | openTenant {tenantId} | openTicket {ticketId}
 *              | followupDone {tenantId, logId} | settleDeposit {tenantId} | renewLease {tenantId}
 */
function attention(state, today, getLedger) {
  const settings = settingsWithDefaults(state.settings);
  const L = ledgerGetter(state, today, getLedger);
  const items = [];
  const sevRank = { high: 0, medium: 1, low: 2 };
  for (const t of tenantsArr(state)) {
    const name = t.name || 'Unnamed tenant';
    const unit = unitLabel(t);
    const lg = L(t.id);
    const pay = { type: 'recordPayment', tenantId: t.id, label: 'Record payment' };
    if (lg.balance > 0 && (lg.delinquent || lg.current.status === 'late' || lg.current.status === 'partial' || Object.values(lg.months).some(m => m.status === 'late'))) {
      const lateFee = lg.suggestedLateFee ? { type: 'addLateFee', tenantId: t.id, period: lg.suggestedLateFee.period, amount: lg.suggestedLateFee.amount, label: 'Add late fee ' + M.fmt(lg.suggestedLateFee.amount) } : null;
      if (lg.delinquent) {
        const behind = Object.values(lg.months).filter(m => m.open > 0).length;
        items.push({ id: 'delinquent-' + t.id, kind: 'delinquent', severity: 'high', rank: -D.diffDays(lg.oldestOpenDate, today), tenantId: t.id, unit,
          title: name, detail: M.fmt(lg.balance) + ' owed · ' + RB.plural(behind, 'month') + ' behind · oldest ' + D.fmt(lg.oldestOpenDate, today),
          amount: lg.balance, date: lg.oldestOpenDate, action: pay, secondary: lateFee });
      } else if (lg.current.status === 'late' || Object.values(lg.months).some(m => m.status === 'late')) {
        const lateM = lg.current.status === 'late' ? lg.months[lg.current.period] : Object.values(lg.months).filter(m => m.status === 'late').pop();
        items.push({ id: 'late-' + t.id, kind: 'late', severity: 'high', rank: -lateM.daysLate, tenantId: t.id, unit,
          title: name, detail: D.monthName(lateM.period) + ' rent · ' + M.fmt(lateM.open) + (lateM.paid > 0 ? ' still open (' + M.fmt(lateM.paid) + ' paid)' : '') + ' · ' + D.days(lateM.daysLate) + ' late',
          amount: lg.balance, date: lateM.due, action: pay, secondary: lateFee });
      } else {
        items.push({ id: 'partial-' + t.id, kind: 'partial', severity: 'medium', rank: 0, tenantId: t.id, unit,
          title: name, detail: 'Paid ' + M.fmt(lg.current.paid) + ' of ' + M.fmt(lg.current.charged) + ' · grace ends ' + D.rel(lg.current.graceEnd, today),
          amount: lg.current.open, date: lg.current.graceEnd, action: pay });
      }
    }
    if (isCurrent(t)) {
      const ls = leaseState(t, settings, today);
      if (ls.kind === 'fixed' && ls.inNoticeWindow && !ls.noticeGiven && t.status === 'active') {
        items.push({ id: 'lease-' + t.id, kind: 'lease', severity: ls.daysLeft <= 30 ? 'medium' : 'low', rank: ls.daysLeft, tenantId: t.id, unit,
          title: name, detail: 'Lease ends ' + D.fmt(ls.end, today) + ' (' + ls.label + ') · no renewal decided', date: ls.end,
          action: { type: 'renewLease', tenantId: t.id, label: 'Decide' } });
      }
      const l = t.lease || {};
      if (l.moveOut && l.moveOut <= today && t.status === 'notice') {
        // The date has come: the tenant is still marked as on notice, so ask to complete the move-out.
        items.push({ id: 'moveout-' + t.id, kind: 'moveout', severity: 'medium', rank: D.diffDays(today, l.moveOut), tenantId: t.id, unit,
          title: name, detail: l.moveOut === today ? 'Moves out today' : 'Was due to move out ' + D.fmt(l.moveOut, today) + ' (' + D.rel(l.moveOut, today) + ')', date: l.moveOut,
          action: { type: 'moveOut', tenantId: t.id, label: 'Complete move-out' } });
      } else if (l.moveOut && l.moveOut > today && D.diffDays(today, l.moveOut) <= 30) {
        items.push({ id: 'moveout-' + t.id, kind: 'moveout', severity: 'medium', rank: D.diffDays(today, l.moveOut), tenantId: t.id, unit,
          title: name, detail: 'Moves out ' + D.fmt(l.moveOut, today) + ' (' + D.rel(l.moveOut, today) + ')', date: l.moveOut,
          action: { type: 'openTenant', tenantId: t.id, label: 'Plan move-out' } });
      }
      if (l.moveIn && l.moveIn > today && D.diffDays(today, l.moveIn) <= 30) {
        items.push({ id: 'movein-' + t.id, kind: 'movein', severity: 'low', rank: D.diffDays(today, l.moveIn), tenantId: t.id, unit,
          title: name, detail: 'Moves in ' + D.fmt(l.moveIn, today) + ' (' + D.rel(l.moveIn, today) + ')', date: l.moveIn,
          action: { type: 'openTenant', tenantId: t.id, label: 'Open' } });
      }
      const ins = t.insurance;
      if (ins && ins.expires && D.diffDays(today, ins.expires) <= 30) {
        const n = D.diffDays(today, ins.expires);
        items.push({ id: 'insurance-' + t.id, kind: 'insurance', severity: n < 0 ? 'medium' : 'low', rank: n, tenantId: t.id, unit,
          title: name, detail: 'Renter’s insurance ' + (n < 0 ? 'expired ' + D.fmt(ins.expires, today) : 'expires ' + D.fmt(ins.expires, today) + ' (' + D.rel(ins.expires, today) + ')'),
          date: ins.expires, action: { type: 'openTenant', tenantId: t.id, label: 'Open' } });
      }
    }
    const dd = depositDue(t, settings, today);
    if (dd) {
      items.push({ id: 'deposit-' + t.id, kind: 'deposit', severity: dd.daysLeft <= 7 ? 'high' : 'medium', rank: dd.daysLeft, tenantId: t.id, unit,
        title: name, detail: 'Deposit ' + M.fmt(dd.amount) + ' due back ' + D.fmt(dd.dueDate, today) + ' (' + (dd.overdue ? D.days(-dd.daysLeft) + ' overdue' : D.rel(dd.dueDate, today)) + ')',
        amount: dd.amount, date: dd.dueDate, action: { type: 'settleDeposit', tenantId: t.id, label: 'Settle deposit' } });
    }
    const log = t.log || {};
    for (const lid of Object.keys(log)) {
      const e = log[lid];
      if (!e || e.done || !e.followUp || e.followUp > today) continue;
      items.push({ id: 'followup-' + t.id + '-' + lid, kind: 'followup', severity: 'medium', rank: D.diffDays(today, e.followUp), tenantId: t.id, logId: lid, unit,
        title: name, detail: 'Follow up: ' + String(e.text || '').slice(0, 120) + (e.followUp < today ? ' (since ' + D.fmt(e.followUp, today) + ')' : ''),
        date: e.followUp, action: { type: 'followupDone', tenantId: t.id, logId: lid, label: 'Mark done' }, secondary: { type: 'openTenant', tenantId: t.id, label: 'Open' } });
    }
  }
  for (const k of ticketsArr(state)) {
    if (k.status === 'done') continue;
    const age = k.reported ? D.diffDays(k.reported, today) : 0;
    if (k.priority !== 'urgent' && !(k.status === 'open' && k.priority === 'normal')) continue;
    items.push({ id: 'ticket-' + k.id, kind: 'ticket', severity: k.priority === 'urgent' ? 'high' : 'low', rank: -age, ticketId: k.id, tenantId: k.tenantId || null,
      unit: unitLabel(k), title: k.title || 'Upkeep request',
      detail: unitLabel(k) + ' · ' + (k.status === 'scheduled' && k.scheduled ? 'scheduled ' + D.fmt(k.scheduled, today) : age + ' d open') + (k.priority === 'urgent' ? ' · urgent' : ''),
      date: k.reported, action: { type: 'openTicket', ticketId: k.id, label: 'Open' } });
  }
  items.sort((a, b) => sevRank[a.severity] - sevRank[b.severity] || a.rank - b.rank || RB.natCmp(a.title, b.title));
  return items;
}

/**
 * Month totals for the portfolio. period 'YYYY-MM' (default: today's month).
 * {period, charged, collected, outstanding, received, tenants, counts:{paid,paid_late,partial,due,late,none}, paidCount, dueDate, graceEnd}
 * charged/collected/outstanding count all charges for that period (rent, recurring, manual); received = payments dated in the period.
 */
function portfolio(state, today, period, getLedger) {
  period = period || D.monthKey(today);
  const settings = settingsWithDefaults(state.settings);
  const L = ledgerGetter(state, today, getLedger);
  const out = { period, charged: 0, collected: 0, outstanding: 0, received: 0, tenants: 0,
    counts: { paid: 0, paid_late: 0, partial: 0, due: 0, late: 0, none: 0 }, paidCount: 0,
    dueDate: D.dayIn(period, settings.dueDay), graceEnd: D.addDays(D.dayIn(period, settings.dueDay), settings.graceDays) };
  for (const t of tenantsArr(state)) {
    const lg = L(t.id);
    const m = lg.months[period];
    for (const r of lg.rows) if (!r.void && r.type === 'payment' && D.monthKey(r.date) === period) out.received += r.amount;
    if (!m || !m.scheduled) continue;
    out.tenants++;
    out.charged += m.charged; out.collected += m.paid; out.outstanding += m.open;
    out.counts[m.status]++;
  }
  out.paidCount = out.counts.paid + out.counts.paid_late;
  return out;
}

/** Rent roll. {rows:[{tenantId,property,unit,name,status,rent,leaseStart,leaseEnd,deposit,balance,monthStatus}], totals:{rent,deposit,balance}, occupancy:{occupied,units,rate}} */
function rentRoll(state, today, getLedger) {
  const L = ledgerGetter(state, today, getLedger);
  const list = sortTenants(tenantsArr(state));
  const rows = list.map(t => {
    const lg = L(t.id);
    return { tenantId: t.id, property: t.property || '', unit: t.unit || '', name: t.name || '', status: t.status || 'active',
      rent: rentOn(t, today), leaseStart: (t.lease || {}).start || null, leaseEnd: (t.lease || {}).end || null,
      moveOut: (t.lease || {}).moveOut || null, deposit: (t.deposit && +t.deposit.amount) || 0, balance: lg.balance, monthStatus: lg.current.status };
  });
  const cur = rows.filter(r => r.status !== 'past');
  const units = new Set(rows.map(r => r.property + '\u0000' + r.unit));
  const occ = new Set(cur.map(r => r.property + '\u0000' + r.unit));
  return {
    rows,
    totals: { rent: cur.reduce((s, r) => s + r.rent, 0), deposit: rows.reduce((s, r) => s + r.deposit, 0), balance: rows.reduce((s, r) => s + r.balance, 0) },
    occupancy: { occupied: occ.size, units: units.size, rate: units.size ? occ.size / units.size : 0 },
  };
}

/** Aging report: tenants with open charges. {rows:[{tenantId,name,property,unit,d0_30,d31_60,d61_90,d90,total}], totals} */
function aging(state, today, getLedger) {
  const L = ledgerGetter(state, today, getLedger);
  const rows = [];
  const totals = { d0_30: 0, d31_60: 0, d61_90: 0, d90: 0, total: 0 };
  for (const t of sortTenants(tenantsArr(state))) {
    const a = L(t.id).aging;
    const total = a.d0_30 + a.d31_60 + a.d61_90 + a.d90;
    if (!total) continue;
    rows.push({ tenantId: t.id, name: t.name || '', property: t.property || '', unit: t.unit || '', ...a, total });
    for (const k of Object.keys(totals)) totals[k] += k === 'total' ? total : a[k];
  }
  return { rows, totals };
}

/** Last n months (default 12), oldest → newest: [{period, charged, collected, outstanding, rate}] (rate 0..1 or null when nothing charged) */
function collectionByMonth(state, today, n, getLedger) {
  n = n || 12;
  const L = ledgerGetter(state, today, getLedger);
  const end = D.monthKey(today);
  const out = [];
  const list = tenantsArr(state);
  for (let i = n - 1; i >= 0; i--) {
    const k = D.addMonthKey(end, -i);
    let charged = 0, collected = 0, outstanding = 0;
    for (const t of list) { const m = L(t.id).months[k]; if (m) { charged += m.charged; collected += m.paid; outstanding += m.open; } }
    out.push({ period: k, charged, collected, outstanding, rate: charged ? collected / charged : null });
  }
  return out;
}

/** Cash received per tenant in a calendar year (payments dated in year). {year, rows:[{tenantId,name,property,unit,payments,credits,count,byMonth[12]}], totals:{payments,credits,byMonth}} */
function incomeByYear(state, year, getLedger, today) {
  year = String(year);
  const L = ledgerGetter(state, today || D.today(), getLedger);
  const rows = [];
  const totals = { payments: 0, credits: 0, byMonth: new Array(12).fill(0) };
  for (const t of sortTenants(tenantsArr(state))) {
    const r = { tenantId: t.id, name: t.name || '', property: t.property || '', unit: t.unit || '', payments: 0, credits: 0, count: 0, byMonth: new Array(12).fill(0) };
    for (const row of L(t.id).rows) {
      if (row.void || row.kind !== 'entry' || row.date.slice(0, 4) !== year) continue;
      if (row.type === 'payment') { r.payments += row.amount; r.count++; r.byMonth[+row.date.slice(5, 7) - 1] += row.amount; }
      if (row.type === 'credit') r.credits += row.amount;
    }
    if (!r.payments && !r.credits) continue;
    rows.push(r);
    totals.payments += r.payments; totals.credits += r.credits; r.byMonth.forEach((v, i) => (totals.byMonth[i] += v));
  }
  return { year, rows, totals };
}

/** Plain-text receipt for a payment row. args: {tenant, ledger, entryId, settings} */
function receiptText({ tenant, ledger, entryId, settings }) {
  settings = settingsWithDefaults(settings);
  const row = ledger.rows.find(r => r.id === entryId);
  if (!row) return '';
  const today = ledger.today;
  const lines = [];
  lines.push((settings.portfolioName || 'Rent receipt') + (settings.portfolioName ? ' — ' : '') + (row.type === 'payment' ? 'Payment receipt' : row.type === 'credit' ? 'Credit note' : 'Charge'));
  lines.push('');
  const kv = (k, v) => lines.push((k + ':').padEnd(15) + v);
  kv('Tenant', tenant.name || '');
  kv('Unit', unitLabel(tenant));
  kv('Amount', M.fmt(row.amount));
  kv('Date', D.fmtLong(row.date));
  if (row.method) kv('Method', row.method + (row.ref ? ' (ref ' + row.ref + ')' : ''));
  else if (row.ref) kv('Reference', row.ref);
  if (row.applied && row.applied.length) {
    const byId = {}; ledger.rows.forEach(r => (byId[r.id] = r));
    kv('Applied to', row.applied.map(a => (byId[a.id] ? byId[a.id].label : 'charge') + ' ' + M.fmt(a.amount)).join('; '));
  }
  if (row.memo && row.type === 'payment') kv('Memo', row.memo);
  const after = row.balance;
  kv('Balance after', after > 0 ? M.fmt(after) + ' owed' : after < 0 ? M.fmt(-after) + ' credit' : M.fmt(0) + ' (paid in full)');
  if (row.void) lines.push('', 'VOID — this entry was voided.');
  lines.push('', 'Issued ' + D.fmtLong(today));
  return lines.join('\n');
}

/** Plain-text statement. args: {tenant, ledger, settings, from?, to?} — from/to 'YYYY-MM-DD' inclusive. */
function statementText({ tenant, ledger, settings, from, to }) {
  settings = settingsWithDefaults(settings);
  const rows = ledger.rows.filter(r => !r.void && (!from || r.date >= from) && (!to || r.date <= to));
  const startBal = (() => { if (!from) return 0; let b = 0; for (const r of ledger.rows) { if (r.void) continue; if (r.date >= from) break; b = r.balance; } return b; })();
  const W = 44;
  const money = c => M.fmt(c, { cents: 'always' });
  const line = (l, r) => { l = String(l); r = String(r); const sp = Math.max(1, W - l.length - r.length); return l + ' '.repeat(sp) + r; };
  const out = [];
  out.push(settings.portfolioName ? settings.portfolioName + ' — Statement' : 'Statement');
  out.push(tenant.name + ' · ' + unitLabel(tenant));
  out.push((from ? D.fmtLong(from) : 'Start') + ' to ' + D.fmtLong(to || ledger.today));
  out.push('-'.repeat(W));
  if (from) out.push(line('Opening balance', money(startBal)));
  for (const r of rows) {
    const amt = r.type === 'charge' ? money(r.amount) : '−' + money(r.amount);
    out.push(line(D.fmtNum(r.date, { mon: true }) + '  ' + r.label.slice(0, 24), amt));
  }
  out.push('-'.repeat(W));
  const end = rows.length ? rows[rows.length - 1].balance : startBal;
  out.push(line(end < 0 ? 'Credit on account' : 'Balance due', money(Math.abs(end))));
  return out.join('\n');
}

// ---------------------------------------------------------------- CSV
function csvCell(v) {
  if (v === null || v === undefined) return '';
  let s = String(v);
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s; // formula-injection guard
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
/** Generic CSV: columns [{label, get(row) | key, money?:true}] → string with CRLF line ends. */
function csv(rows, columns) {
  const head = columns.map(c => csvCell(c.label)).join(',');
  const body = rows.map(r => columns.map(c => { const v = c.get ? c.get(r) : r[c.key]; return csvCell(c.money ? (v == null ? '' : M.plain(v)) : v); }).join(','));
  return [head].concat(body).join('\r\n') + '\r\n';
}
function ledgerCsv(ledger) {

    { label: 'Date', key: 'date' },
    { label: 'Description', key: 'label' },

}
function rentRollCsv(rr) {

    { label: 'Deposit', key: 'deposit', money: true }, { label: 'Balance', key: 'balance', money: true }, { label: 'This month', key: 'monthStatus' },

function agingCsv(ag) {

    { label: '0-30', key: 'd0_30', money: true }, { label: '31-60', key: 'd31_60', money: true }, { label: '61-90', key: 'd61_90', money: true },

function collectionCsv(rows) {

  ]);

function incomeCsv(inc) {

  return csv(inc.rows.concat([Object.assign({ name: 'Total', property: '', unit: '', count: '' }, inc.totals)]), [

/** Parse CSV or tab-separated text (auto-detected) into an array of string arrays. Handles quotes, CRLF, BOM. */
function parseDelimited(text) {
  text = String(text || '').replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? '\t' : (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = []; let cell = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.some(x => x.trim() !== '')) rows.push(row);
      row = [];
    } else cell += c;
  }
  row.push(cell);
  if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows.map(r => r.map(x => x.trim()));
}

/**
 * One-line summary for lists/sorting. {tenantId, name, unit, property, rent, status, monthStatus, balance, delinquent,
 *  lease (leaseState), daysLate, urgency (lower = more urgent)}
 */
function tenantSummary(tenant, ledger, settings, today) {
  const ls = leaseState(tenant, settings, today);
  const st = ledger.current.status;
  let urgency = 100;
  if (ledger.delinquent) urgency = 0;
  else if (st === 'late') urgency = 10 - Math.min(9, ledger.current.daysLate / 10);
  else if (st === 'partial') urgency = 20;
  else if (st === 'due') urgency = 40;
  else if (ledger.balance > 0) urgency = 30;
  if (urgency >= 40 && tenant.status === 'notice') urgency = 35;
  if (urgency >= 40 && ls.inNoticeWindow && !ls.noticeGiven) urgency = 38;
  if (tenant.status === 'past') urgency = 200;
  return { tenantId: tenant.id, name: tenant.name || '', unit: tenant.unit || '', property: tenant.property || '', rent: rentOn(tenant, today),
    status: tenant.status || 'active', monthStatus: st, balance: ledger.balance, delinquent: ledger.delinquent, lease: ls, daysLate: ledger.current.daysLate, urgency };
}

// ---------------------------------------------------------------- move-out & deposit settlement (Tenants view)
/**
 * Preview of a move-out on `moveOut` (pure). Builds the ledger as it will stand on the later of today and moveOut,
 * with lease.moveOut set, assuming no further payments.
 * → {moveOut, period, finalRows — generated rent+recurring rows of the final month (with prorate), finalTotal,
 *    balance — owed at move-out (>0) or credit (<0), balanceNow, depositDueDate}
 */
function moveOutPreview(tenant, entries, settings, today, moveOut) {
  settings = settingsWithDefaults(settings);
  const t = RB.clone(tenant);
  t.lease = Object.assign({}, t.lease || {}, { moveOut });
  const asOf = D.max(today, moveOut);
  const lg = buildLedger(t, entries, settings, asOf);
  const period = D.monthKey(moveOut);
  const finalRows = lg.rows.filter(r => r.generated && (r.kind === 'rent' || r.kind === 'recurring') && r.period === period);
  const now = buildLedger(tenant, entries, settings, today);
  return {
    moveOut, period, finalRows, finalTotal: finalRows.reduce((s, r) => s + r.amount, 0),
    balance: lg.balance, balanceNow: now.balance,
    depositDueDate: D.addDays(moveOut, +settings.depositReturnDays || 0),
  };
}

/**
 * Deposit settlement arithmetic (pure). args: {deposit (cents), deductions:[{reason, amount}], balance (ledger balance,
 * >0 owed, <0 credit), applyToBalance:bool — use the deposit against what is owed, or refund a credit with it}
 * → {deposit, deducted, available, applied — deposit used to pay the unpaid balance, creditRefunded, refund, shortfall — deductions
 *    beyond the deposit, balanceAfter — ledger balance once `applied` is credited and `shortfall` charged, lines}
 */
function depositSettlement({ deposit, deductions, balance, applyToBalance }) {
  const dep = Math.max(0, Math.round(+deposit || 0));
  const lines = (deductions || []).filter(d => d && Math.round(+d.amount || 0) > 0).map(d => ({ reason: String(d.reason || '').trim(), amount: Math.round(+d.amount) }));
  const deducted = lines.reduce((s, d) => s + d.amount, 0);
  const available = Math.max(0, dep - deducted);
  const shortfall = Math.max(0, deducted - dep);
  const bal = Math.round(+balance || 0);
  const owed = Math.max(0, bal);
  const applied = applyToBalance ? Math.min(owed, available) : 0;
  const creditRefunded = applyToBalance && bal < 0 ? -bal : 0;   // credit on account paid back with the deposit
  const refund = available - applied + creditRefunded;
  return { deposit: dep, deducted, available, applied, creditRefunded, refund, shortfall, balanceAfter: bal - applied + creditRefunded + shortfall, lines };
}
RB.model.moveOutPreview = moveOutPreview;
RB.model.depositSettlement = depositSettlement;

// ================================================================= Repairs history (SPEC §9) — pure, tested in
// test/repairs-model.test.mjs. A "repair" is a ticket doc. Appended section: owned by the Repairs view.
const REPAIR_CATEGORIES = Object.freeze([
  { key: 'plumbing', label: 'Plumbing', noun: 'plumbing' },
  { key: 'electrical', label: 'Electrical', noun: 'electrical' },
  { key: 'heating', label: 'Heating & cooling', noun: 'heating & cooling' },
  { key: 'appliance', label: 'Appliances', noun: 'appliance' },
  { key: 'roof', label: 'Roof & outside', noun: 'roof & outside' },
  { key: 'doors', label: 'Doors, windows & locks', noun: 'door, window & lock' },
  { key: 'pest', label: 'Pests', noun: 'pest' },
  { key: 'painting', label: 'Painting & floors', noun: 'painting & floor' },
  { key: 'other', label: 'Other', noun: '' },
]);
const REPAIR_CATEGORY_LABEL = Object.freeze(Object.fromEntries(REPAIR_CATEGORIES.map(c => [c.key, c.label])));
const REPAIR_BUILDING = '*building';          // unit filter / unitKey for whole-building work

/** The repair's category key; missing or unknown → 'other'. */
function repairCategory(k) { return k && REPAIR_CATEGORY_LABEL[k.category] ? k.category : 'other'; }

// Pests and phrases first (they beat single words), then nouns (earliest in the text wins), then weak words like "leak".
const CAT_PHRASES = [
  ['pest', /\b(pest|mice\b|mouse|rats?\b|roach|cockroach|ants?\b|bed ?bugs?|termite|wasp|hornet|bees?\b|exterminat|rodent|squirrel|raccoon)/],
  ['plumbing', /\b(water heater|hot water|no water|water pressure|sump pump|running toilet)/],
  ['electrical', /\b(smoke (detector|alarm)|carbon monoxide|co (detector|alarm)|(bathroom|exhaust|ceiling|extractor) fan|door ?bell|light fixture)/],
  ['appliance', /\b(garbage disposal|washing machine|range hood|ice maker)/],
  ['doors', /\b(garage door|sliding door|screen door|front door|back door)/],
  ['heating', /\b(air con|a\/c\b|heat pump|mini ?split)/],
  ['roof', /\b(snow removal|tree (trim|removal|work)|power ?wash)/],
];
const CAT_WORDS = [
  ['appliance', /\b(dishwasher|fridge|refrigerator|freezer|oven|stove|cooktop|range\b|washer|dryer|microwave|disposal|appliance)/],
  ['plumbing', /\b(tap\b|taps\b|faucet|sink|toilet|drain|pipe|plumb|shower|bath|tub\b|sewer|septic|valve|cistern|spigot)/],
  ['heating', /\b(heat|furnace|boiler|radiator|thermostat|hvac|ac\b|cooling|air condition|vent\b|vents\b|duct)/],
  ['electrical', /\b(electric|outlet|socket|switch|light|bulb|breaker|fuse|wiring|wire|power\b|gfci|fan\b|fans\b)/],
  ['doors', /\b(door|window|lock|key\b|keys\b|screen|glass|pane\b|blind|latch|hinge|deadbolt|shutter)/],
  ['roof', /\b(roof|gutter|downspout|siding|fence|deck\b|porch|driveway|yard|tree|lawn|snow|paving|exterior|shingle|flashing|chimney|brick|masonry|steps\b|stair|railing|walkway)/],
  ['painting', /\b(paint|floor|carpet|tile|drywall|plaster|walls?\b|ceiling|grout|caulk|refinish|sanding|laminate|hardwood|repaint)/],
];
const CAT_WEAK = [['plumbing', /\b(leak|drip|clog|block(ed)? drain|flood|water)/]];
/** Suggest a category key from a repair title ("Leaking tap" → 'plumbing'); null when nothing matches. */
function suggestCategory(text) {
  const s = ' ' + String(text || '').toLowerCase() + ' ';
  if (!s.trim()) return null;
  for (const [key, re] of CAT_PHRASES) if (re.test(s)) return key;
  let best = null, at = Infinity;
  for (const [key, re] of CAT_WORDS) { const m = s.match(re); if (m && m.index < at) { best = key; at = m.index; } }
  if (best) return best;
  for (const [key, re] of CAT_WEAK) if (re.test(s)) return key;
  return null;
}

/** URL-safe slug for #p-<slug>: "418 Marlow Street" → "418-marlow-street". Never empty. */
function propertySlug(name) {
  const s = String(name || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60).replace(/-+$/, '');
  return s || 'property';
}
const repairIsBuilding = k => k.scope === 'building' || !String(k.unit || '').trim();
const repairUnitKey = k => (repairIsBuilding(k) ? REPAIR_BUILDING : String(k.unit).trim());
/** The date a repair belongs to in its history: when it was done, else when it was reported. */
const repairDate = k => (D.isDate(k.completed) ? k.completed : D.isDate(k.reported) ? k.reported : D.isDate(k.scheduled) ? k.scheduled : '');
/** "Unit 2B" / "No. 4" / "the whole building". */
function unitWords(unit, building) {
  if (building || unit === REPAIR_BUILDING || !String(unit || '').trim()) return 'the whole building';
  const u = String(unit).trim();
  return /^(no\.?|unit|apt\.?|flat|house|suite|#)\s*/i.test(u) ? u : 'Unit ' + u;
}
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);

function repairsNoun(n, category) {
  const c = category && REPAIR_CATEGORIES.find(x => x.key === category);
  const word = n === 1 ? 'repair' : 'repairs';
  if (!c) return n + ' ' + word;
  if (!c.noun) return n + ' ' + word + ' marked Other';
  return n + ' ' + c.noun + ' ' + word;
}

/** Derived repair item: the ticket with id plus {date, year, category, building, unitKey, cost (cents, 0 if none), done}. */
function repairItem(k) {
